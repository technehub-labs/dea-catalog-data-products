id: dea:data-product-eea72795-4307-4096-9dc3-1dc919-daily-rainfa-5q5ab3
type: DataProduct
name: Daily rainfall totals from 1941 to 2022
description: Daily rainfall totals are expressed in millimetres (mm) and are collated
  by year from 1941 to 2022. The daily rainfall total is presented without a decimal
  point. For example, a value of 123 is equivalent to a daily rainfall total of 12.3
  mm. The number of stations available for rainfall gridding analysis varies each
  year, from 436 stations in 2020 to 519 stations in 2014. The average number of stations
  available each year was around 488. While in 2021 there were up to 455 stations.
