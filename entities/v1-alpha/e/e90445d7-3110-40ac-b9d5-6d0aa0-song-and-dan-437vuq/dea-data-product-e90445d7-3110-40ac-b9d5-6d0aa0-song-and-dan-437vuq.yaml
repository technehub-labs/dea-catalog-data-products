name: Song and Dance celebration
description: The Song and Dance Celebration is one of the grandest festivals in the
  Baltic region in terms of scope, authenticity and style. Every five years in the
  beginning of July, the whole city of Riga, the capital of Latvia, becoming a buzzing
  stage for choir singers and folk dancers, folklore musicians, masters of folk crafts
  and amateur theatre troupes, young and old, dressed in folk costumes, living the
  tradition.
