id: dea:data-product-e5pg7-data-centres-y85mpz
type: DataProduct
name: Data Centres Utilisation
description: <dp-prose> <p>This dataset shows the maximum observed utilisations of
  operational data centres identified in UK Power Networks' region.</p> <p>The utilisations
  have been determined using actual demand data from connected sites within UK Power
  Networks licence areas, from 1 January 2023 onwards.</p> <p>Maximum utilisations
  are expressed proportionally, by comparing the maximum half-hourly observed import
  power&nbsp;seen across the site's meter point(s), against the meter's maximum import
  capacity. Units for both measures are apparent power, in kilovolt amperes (kVA).&nbsp;</p>
  <p>To&nbsp;protect the identity of the sites, data points have been anonymised and
  only the site's voltage level information has been provided - and our estimation
  of the data centre type - has been provided.&nbsp;</p> </dp-prose>
