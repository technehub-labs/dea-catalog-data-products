type: DataProduct
name: LEP Environment 2004 Priority Areas for Nature Conservation Saarland
description: Extensive presentation of the priority areas for nature conservation
  within the framework of the State Development Plan for the Environment. Priority
  areas for nature conservation (UN) serve to safeguard the supra-local interests
  of nature conservation and landscape conservation. They are based on the nature
  reserves designated and planned by regulation and the identification of areas of
  federal and national importance in accordance with the species and biotope protection
  programme in Saarland as well as the areas notified and subsequently notified to
  the European Natura 2000 network of protected areas.
