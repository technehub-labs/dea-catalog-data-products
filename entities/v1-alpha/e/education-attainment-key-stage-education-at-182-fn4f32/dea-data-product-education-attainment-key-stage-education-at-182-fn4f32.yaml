type: DataProduct
name: 'Education Attainment: Key Stage 4'
description: 'This data shows Education Attainment at Key Stage 4. Numbers and percentages
  of pupils attaining at Key Stage 4 are shown by gender. Points to be aware of: •
  In 2016-2017, children were assessed under new school accountability standards with
  a new grading system of grades 9 to 1 instead of A* to G. This means data for the
  academic year ending in 2017 is not comparable with previous years'' data. Analysis
  and comparisons between groups of pupils, types of schools and pupil characteristics
  are more likely to provide more meaningful information than comparisons over time.
  • Two new headline standards are shown in this dataset: English and maths strong
  passes at grades 9-5, and the English Baccalaureate with strong passes at grades
  9 to 5 in English and maths. In addition, we have also provided both statistics
  based on standard passes at grade 9 to 4, as these statistics should be comparable
  with historical A*-C measures. More information: see the Secondary Curriculum, key
  stage 3 and key stage 4 (GCSEs) website (link to this included as Resource accompanying
  these datasets). Data is included for Wards, Lower Super Output Areas (LSOA), Districts,
  and Lincolnshire. The data has been aggregated based on pupil postcode and only
  includes those pupils living and educated within Lincolnshire. If you want Lincolnshire
  and District aggregations based on those pupils that are educated within Lincolnshire,
  irrespective of where they live; then please see the Department for Education Statistics
  website and School Performance Tables (links to these included as Resources accompanying
  these datasets). Data is suppressed where appropriate 5 persons and below (this
  may be shown by missing data). That and any unmatched postcodes may mean numbers
  for small areas might not add up exactly to figures shown for larger areas. This
  data is updated annually. Data source: Lincolnshire County Council, Performance
  Services – Schools Performance. For any enquiries about this publication contact
  scho'
