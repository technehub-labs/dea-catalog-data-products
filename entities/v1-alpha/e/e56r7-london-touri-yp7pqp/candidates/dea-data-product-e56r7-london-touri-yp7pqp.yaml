name: London Tourism Forecasts
description: <dp-prose> <p>GLA Economics is providing on an occasional basis medium-term
  forecasts of tourism visitor nights in London for domestic and international tourists.
  The forecasts are on a quarterly basis to 2026 and an annual basis to 2032. The
  estimates tri-angulate data from a number of sources. The methodology note provides
  more information on how this has been done.</p> </dp-prose>
