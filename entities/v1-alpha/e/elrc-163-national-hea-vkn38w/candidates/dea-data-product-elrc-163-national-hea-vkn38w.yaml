name: National Health Fund Dataset
description: 'The dataset is a 274K-token Polish-English parallel resource in XLIFF
  format created on the basis of "Diagnosis-Related Groups in Europe" publication
  of the Polish National Health Fund. This dataset has been created within the framework
  of the European Language Resource Coordination (ELRC) Connecting Europe Facility
  - Automated Translation (CEF.AT) actions SMART 2014/1074 and SMART 2015/1091. For
  further information on the project: http://lr-coordination.eu.'
