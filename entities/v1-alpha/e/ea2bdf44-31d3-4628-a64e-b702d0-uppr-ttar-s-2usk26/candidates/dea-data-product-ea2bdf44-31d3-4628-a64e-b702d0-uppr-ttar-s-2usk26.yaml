type: DataProduct
name: Uppréttar sögulegar loftmyndir frá 1945 -1970 -- Historical image Orthomosaics
  from 1945 -1970
description: 'Röð uppréttra loftmynda úr loftmyndasafni Náttúrufræðistofnunar sem
  unnar voru á árunum 2013 til 2018 hjá Jarðvísindastofnun HÍ, sem partur af tveimur
  verkefnum: 1 - Mælingar á jöklabreytingum úr sögulegum loftmyndum. Þetta verkefni
  var unnið af Joaquín M.C. Belart í M.Sc. og Ph.D. hjá Jarðvísindastofnun. Útvaldar
  loftmyndir frá 1945 til 1994 voru skannaðar hjá Landmælingum Íslands sérstaklega
  fyrir þetta verkefni. Vinnsla þessara loftmynda fór fram með því að nota "Ground
  Control Points" (GCP) sem teknir voru úr lidarmælingum á íslenskum jöklum. Úrvinnsla
  gagna úr Drangajökli fór fram með ERDAS hugbúnaðinum. Nánari upplýsingar um vinnsluna
  er að finna í Magnússon o.fl., 2016 (https://tc.copernicus.org/articles/10/159/2016/tc-10-159-2016.html).
  Úrvinnsla gagna frá öðrum jöklum var unnin með MicMac hugbúnaðinum, einnig með GCP
  teknir af lidar. Nánari upplýsingar um vinnsluna eru fáanlegar í Belart o.fl., 2019
  (https://www.cambridge.org/core/journals/journal-of-glaciology/article/geodetic-mass-balance-of-eyjafjallajokull-ice-cap
  -for-19452014-processing-guidelines-and-relation-to-climate/9B715A9E0413A6345C2B151B1173E71D)
  og Belart o.fl., 2020 (https://www.frontiersin.org/articles/10.31630/feart/full.316390/feart.
  2 - Mælingar á hraunmagni Heklugosanna á 20. öld. Þetta verkefni var unnið af Gro
  B.M. Pedersen sem hluti af verkefni þar sem unnið var að umhverfiskortlagningu og
  vöktun Íslands með fjarkönnun "Environmental Mapping and Monitoring of Iceland by
  Remote Sensing" (EMMIRS, fjármagnað af Rannís) á árunum 2015-2018. Loftmyndirnar
  af Heklu frá 1945 til 1992 voru skannaðar af Landmælingum Íslands. Vinnsla þessara
  mynda var gerð með ERDAS hugbúnaðinum og nánari upplýsingar um vinnsluna er hægt
  að nálgast í Pedersen o.fl., 2018 (https://agupubs.onlinelibrary.wiley.com/doi/full/10.1002/2017GL076887)
  ---------------------------------------------------------------------------------------------------------------
  A series of orthomosaics using the archives of aerial photog'
