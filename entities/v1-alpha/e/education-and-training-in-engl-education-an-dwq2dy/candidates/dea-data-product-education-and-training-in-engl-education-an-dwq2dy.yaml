type: DataProduct
name: 'Education and Training in England: Offenders'' Learning and Skills Service'
description: Offenders' Learning and Skills Service education and training data. The
  data show participation and achievement by equality and diversity, and level as
  well as enrolments and achievements at aim level by sector subject area. The Offenders'
  Learning and Skills Service provide access, according to need, to learning and skills
  for offenders in prisons and supervised in the community to enable them to gain
  the skills and qualifications they need to hold down a job and have a positive role
  in society.
