type: DataProduct
name: EA Pension Fund Investment Holdings
description: 'As part of our commitment to continuous improvement and being open and
  transparent, we publish the Fund’s holdings. We update the data every quarter. For
  operational reasons, we publish this at least 3 months after the end of the quarter.
  Before you access the data, please read the introduction below and specifically
  the conditions to the use of the data. We delegate day-to-day management of the
  Fund’s assets to a number of Fund Managers. They have full discretion to manage
  their portfolios subject to their investment management agreements with us and in
  compliance with the Fund’s policies. We do not seek to direct the managers on individual
  investment decisions. The Funding Strategy takes account of, and informs the development
  of, our investment strategy and our statement of investment principles (SIP). In
  all matters, our fiduciary obligations to Fund members are paramount, and neither
  the Fund’s committees nor the Fund’s officers would take any action which would
  be in conflict with these obligations. Attribution statement: © Environment Agency
  copyright and/or database right 2022. All rights reserved.'
