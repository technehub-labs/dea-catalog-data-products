id: dea:data-product-e44d7250-0b42-4d56-8713-7572a9-ireland-s-sh-ebpy3t
type: DataProduct
name: Ireland's Sheela-na-Gigs
description: This dataset displays locational information for all Ireland’s known
  Sheela-na-Gigs. It provides National Monuments Service descriptions for each where
  available. It maps original and present locations (as of March 2017) for each. It
  was created using publically available National Monuments Service open-data. This
  was augmented with images and information gathered from the museum sector and Sheela-na-Gig
  academics and enthusiasts.
