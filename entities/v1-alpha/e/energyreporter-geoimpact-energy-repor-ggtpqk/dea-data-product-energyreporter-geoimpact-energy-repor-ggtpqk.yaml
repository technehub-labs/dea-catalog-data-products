id: dea:data-product-energyreporter-geoimpact-energy-repor-ggtpqk
type: DataProduct
name: Energy Reporter
description: The [Energy Reporter](https://www.energiereporter.ch) monitors developments
  in the energy transition in the municipalities and cantons of Switzerland. Here
  you can find out the current status in the selected subject areas of electric cars,
  solar power, renewable heating, electricity consumption and renewable electricity
  production for each municipality and canton. This data is published under the Creative
  Commons License [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.en).
  They can be freely used and distributed. In the event of publication, the name __Energie
  Reporter__ must be given as the source and __geoimpact__ and __EnergieSchweiz__
  as contributors. In the case of online content, the link to [Energie Reporter](https://www.energiereporter.ch)
  must also be provided. The current data set __energyreporter_latest.zip__ contains
  the current progress of all municipalities, cantons and Switzerland in CSV format
  (zipped). For more information on the dataset and the data fields it contains, go
  to the resources page. The historicized dataset __energyreporter_historized.zip__
  contains monthly time slices since the existence of Energie Reporter (1 March 2021)
  with the progress of all municipalities and cantons as well as Switzerland in CSV
  format (zipped). For more information on the dataset and the data fields it contains,
  go to the resources page.
