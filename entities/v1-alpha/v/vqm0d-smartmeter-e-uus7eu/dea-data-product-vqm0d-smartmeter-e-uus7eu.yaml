id: dea:data-product-vqm0d-smartmeter-e-uus7eu
type: DataProduct
name: SmartMeter Energy Consumption Data in London Households
description: <dp-prose> <p>Energy consumption readings for a sample of 5,567 London
  Households that took part in the UK Power Networks led Low Carbon London project
  between November 2011 and February 2014.</p> <p>Readings were taken at half hourly
  intervals. The customers in the trial were recruited as a balanced sample representative
  of the Greater London population.</p> <p>The dataset contains energy consumption,
  in kWh (per half hour), unique household identifier, date and time. The CSV file
  is around 10GB when unzipped and contains around 167million rows.</p> <p>Within
  the data set are two groups of customers. The first is a sub-group, of approximately
  1100 customers, who were subjected to Dynamic Time of Use (dToU) energy prices throughout
  the 2013 calendar year period. The tariff prices were given a day ahead via the
  Smart Meter IHD (In Home Display) or text message to mobile phone. Customers were
  issued High (67.20p/kWh), Low (3.99p/kWh) or normal (11.76p/kWh) price signals and
  the times of day these applied. The dates/times and the price signal schedule is
  availaible as part of this dataset. All non-Time of Use customers were on a flat
  rate tariff of 14.228pence/kWh.</p> <p>The signals given were designed to be representative
  of the types of signal that may be used in the future to manage both high renewable
  generation (supply following) operation and also test the potential to use high
  price signals to reduce stress on local distribution grids during periods of stress.</p>
  <p>The remaining sample of approximately 4500 customers energy consumption readings
  were not subject to the dToU tariff.</p> <p>More information can be found on the
  <a href="https://innovation.ukpowernetworks.co.uk/projects/low-carbon-london/">Low
  Carbon London webpage</a></p> </dp-prose>
