id: dea:data-product-victimes-tuees-selon-la-catego-victims-kill-ctmu53
type: DataProduct
name: Victims killed by category of road users 1991 – 2015
description: 'This table gives for the years 1991-2015 the number of pedestrians,
  cyclists, mopeds, motorcyclists, 4-wheel drivers and 4-wheel or 2-wheel passengers
  killed as a result of a road traffic accident and is calculated annually by STATEC.
  The following definitions have been used: A road traffic accident is any unexpected
  and sudden event that occurred to one or more users on a lane normally open to traffic
  and that caused bodily injury provided that a moving vehicle was involved in the
  event. For statistics on bodily injuries only road traffic injuries reported to
  the Grand Ducal Police are taken into account. The data are drawn from the minutes
  of law enforcement officers. The victims killed include those killed instantly or
  who died as a result of the accident within 30 days. For more details: http://www.statistiques.public.lu/fr/méthodologie/méthodes/conditions-sociales/Accidents/accidents/index.html'
