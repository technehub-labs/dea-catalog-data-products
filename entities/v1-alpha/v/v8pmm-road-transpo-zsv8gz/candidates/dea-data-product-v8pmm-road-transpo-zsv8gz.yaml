id: dea:data-product-v8pmm-road-transpo-zsv8gz
type: DataProduct
name: Road Transport Energy Consumption, Borough
description: <dp-prose> <p>Estimates of road transport consumption statistics for
  fuels used in road transport.</p> <p>(1) Personal travel includes buses, diesel
  cars, petrol cars and motorcycles.</p> <p>(2) Freight includes HGV, diesel LGV and
  petrol LGV.</p> <p>The UK total excludes motorcycles in Northern Ireland.</p> <p>There
  were major revisions to this data due to improvements in methodology, for more details
  please see the <a href="https://www.gov.uk/government/statistics/regional-energy-data-guidance-note">General
  Guidance Note</a>.</p> <p>2002-04 are experimental statistics. Later years are National
  Statistics. Therefore data created using differing methodologies should not be directly
  compared.</p> <p>Data for Middle Super Output Areas (MSOA) available.</p> <p>See
  more on <a href="https://www.gov.uk/government/collections/road-transport-consumption-at-regional-and-local-level">Sub-national
  road transport data</a> or <a href="https://www.gov.uk/government/statistical-data-sets/road-transport-energy-consumption-at-regional-and-local-authority-level">Road
  transport energy consumption at regional and local authority level</a>.</p> </dp-prose>
