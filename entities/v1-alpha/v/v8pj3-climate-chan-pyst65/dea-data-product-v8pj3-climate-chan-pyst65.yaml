name: Climate Change Mitigation and Energy Strategy Model Data
description: <dp-prose> <p>This package contains the data behind <a href="https://www.london.gov.uk/what-we-do/environment/environment-publications/mayor%E2%80%99s-climate-change-mitigation-and-energy-annual">Delivering
  London's Energy Future</a>, the Mayor's climate change mitigation and energy strategy,
  which was published in 2011.</p> <p>Over a number of tabs, the spreadsheet shows
  how the Mayor's target to reduce London's CO2 emissions by 60% on 1990 levels by
  2025 can be met by a combination of Government actions and mayoral programmes.</p>
  </dp-prose>
