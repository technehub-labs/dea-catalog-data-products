type: DataProduct
name: 'Violence against Women: An EU-wide survey'
description: The FRA survey on violence against women is based on face-to-face interviews
  with 42,000 women across the EU. The survey was carried out between March and September
  2012 and presents the most comprehensive survey worldwide on women’s experiences
  of violence. The survey asked women about their experiences of physical, sexual
  and psychological violence, including domestic violence, since the age of 15 and
  over the 12 months before the interview. Questions were also asked about incidents
  of stalking, sexual harassment, and the role played by new technologies in women’s
  experiences of abuse. In addition, the survey asked about respondents’ experiences
  of violence in childhood. The dataset of the FRA violence against women survey is
  stored with the UK Data Service, which is a recognised international service that
  is widely used by governmental and non-governmental institutions that produce survey
  data. The dataset is available free of charge after registration with the service
  under a Special Licence in various formats. Please visit the [page of the dataset](http://discover.ukdataservice.ac.uk/catalogue/?sn=7730&type=Data%20catalogue)
  on the UK Data Service website to find a description of the dataset and the accompanying
  documents.
