name: Focus on London - Health
description: <dp-prose> <p><strong>FOCUS</strong>ON<strong>LONDON</strong>2010:<strong>HEALTH</strong>:CHILDREN<strong>AND</strong>YOUNG<strong>PEOPLE</strong></p>
  <p>The health and wellbeing of London&rsquo;s children and young people is fundamental
  to the health of the city. The recent Marmot Review of health inequalities noted
  that &ldquo;What a child experiences during the early years lays down the foundation
  for the whole of their life.&rdquo; The Mayor&rsquo;s Health Inequality Strategy
  for London responds to this by challenging all partners in London to create &ldquo;conditions
  that lead to better early years experiences&rdquo;.</p> <p>This chapter, authored
  by colleagues at the London Health Observatory, provides recent evidence on the
  health experience of children and young people in London. The report includes data
  about the Local Index of Child Wellbeing, infant mortality, breastfeeding, immunisation,
  injury, childhood obesity, physical activity, diet, smoking, alcohol consumption,
  drug use, teenage conceptions and sexual health. It reveals many areas of inequality
  within the city, but also highlights the ways in which London&rsquo;s children are
  doing well.</p> <p><strong>PRESENTATION:</strong></p> <p>This interactive presentation
  about children&rsquo;s health in London looks into some of the factors that may
  have an effect on the high childhood obesity figures in London.</p> <p>Access the
  presentation at <a href="http://prezi.com/pc-e7c1lwz_p/focus-on-london-2010-health-children-and-young-people/">Prezi.com</a></p>
  <p><strong>FACTS:</strong></p> <p>Some interesting facts from the report&hellip;</p>
  <p>● Five boroughs with highest teenage conception rates in 2008:</p> <ul> <li>
  <p>1. Lambeth &ndash; 71.5</p> </li> <li> <p>2. Lewisham &ndash; 68.7</p> </li>
  <li> <p>3. Southwark &ndash; 68.0</p> </li> <li> <p>4. Greenwich &ndash; 66.7</p>
  </li> <li> <p>5. Hackney and City of London &ndash; 61.5</p> </li> <li> <p>...</p>
  </li> <li> <p>31. Richmond upon Thames &ndash; 23
