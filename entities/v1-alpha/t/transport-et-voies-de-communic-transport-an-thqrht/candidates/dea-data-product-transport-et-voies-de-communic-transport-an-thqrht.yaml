id: dea:data-product-transport-et-voies-de-communic-transport-an-thqrht
type: DataProduct
name: Transport and communication routes
description: 'This dataset contains the axes of the communication and transport routes
  of the Grand Duchy of Luxembourg. The data comes from the theme "communication routes"
  of the BD-L-TC (2015), enriched and supplemented by the official data (names of
  localities and streets) from the National Register of Localities and Streets (CACLR)
  and the BD-Adresse. The update is carried out continuously by ACT taking into account
  different sources, including: - information received from the municipal authorities,
  which are responsible for the names of streets and the definition of addresses -
  BD-L-ORTHO (orthophotographs) - BD-MO (official measurement database) - the completeness
  of the data cannot be guaranteed The link to the national register of localities
  and streets is guaranteed by the integration of identifiers as external keys.'
