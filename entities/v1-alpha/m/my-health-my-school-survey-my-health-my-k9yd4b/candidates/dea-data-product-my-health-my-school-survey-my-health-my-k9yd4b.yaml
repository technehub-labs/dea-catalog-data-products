name: My Health My School Survey
description: '<dp-prose> <p><strong><u>Welcome to the My Health, My School (MHMS)
  Survey</u></strong></p> <p>The My Health, My School (MHMS) annual survey is a free,
  online pupil perception survey designed to capture the views and experiences of
  children and young people across Leeds. It provides schools with valuable insight
  into health-related behaviours and wellbeing, supporting evidence-based school improvement.</p>
  <p>The survey is available for pupils in Years 5, 6, 7, 9 and 11 in Leeds schools,
  as well as for pupils attending Specialist Inclusive Learning Centres (SILCs) and
  post-16 settings. In addition, a Physical Education (PE) survey is available for
  pupils in Years 3 and 4. To ensure full engagement of pupils with Special Educational
  Needs and Disabilities, three tailored surveys are provided: SEND PE, SEND, and
  SEND+.</p> <p>The MHMS survey explores ten key themes, which are tailored by age
  group and include All About Me, Healthy Eating, Social, Emotional and Mental Health
  (SEMH), Gambling (introduced in 2024), Physical Activity and Sport, Play (introduced
  in 2024), Physical Education in School, Drugs, Alcohol and Tobacco, Sexual Health
  for Year 9 and above, and My School or College. These themes provide schools with
  instant, actionable data to inform interventions and improve outcomes for pupils.</p>
  <p>In the 2025/26 academic year, the survey achieved another year of strong engagement,
  with 12,705 responses from 129 schools across Leeds and 19,174 responses from 186
  schools nationally. This data helps shape strategies to improve health and wellbeing
  for children and young people.</p> <p><strong>Further information about the survey
  is available at </strong><a target="_blank" rel="noopener noreferrer nofollow" href="http://www.myhealthmyschoolsurvey.org.uk"><strong><u>www.myhealthmyschoolsurvey.org.uk</u></strong></a><strong>
  or by emailing </strong><a target="_blank" rel="noopener noreferrer nofollow" href="mailto:Schoolwellbeing@leeds.gov.uk"><strong><u>Schoolwellb'
