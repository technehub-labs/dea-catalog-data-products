id: dea:data-product-matrice-des-distances-sur-rout-matrix-of-di-b7q6dm
type: DataProduct
name: Matrix of distances on national and CR roads
description: 'Based on data from BD-L-TC 2013 and the list of locations, a distance
  matrix was calculated. It is a flat file that contains about 1''000''000 lines.
  Each row contains: - Name of the place of departure - Name of the locality of destination
  - Distance as the crow flies in km with 1 hectometric decimal place - Distance calculated
  on the network of national roads and paths taken in km with 1 hectometric decimal
  place These data come from the BD-L-TC, which does not contain information on the
  unique meaning or rules of bifurcation or deviation in the case of long-term construction
  sites. It is therefore possible that these distances do not correspond to the mileage
  actually carried out in the field. They should be considered as an indication of
  distance on the State road network (last update: 2013), which can be used, for example,
  as a basis for calculating travel costs. The Administration du cadastre et de la
  topographie declines all responsibility in the event of unsuitable use of this database.
  These data are devoid of public faith.'
