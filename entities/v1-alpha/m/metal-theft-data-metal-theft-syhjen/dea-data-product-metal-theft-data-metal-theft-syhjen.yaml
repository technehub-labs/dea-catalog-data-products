id: dea:data-product-metal-theft-data-metal-theft-syhjen
type: DataProduct
name: Metal theft data
description: This data relates to a report which evaluates the government and law
  enforcement interventions aimed at reducing metal theft. Incidents of metal theft
  rose sharply between 2009 and 2011 in line with a spike in global metal prices.
  In response, a government-funded taskforce launched interventions aimed at the prevention
  of illegal cash sales of stolen metal at scrap-yards. Previous reports demonstrated
  that metal thefts decreased in line with the interventions but not that the interventions
  caused these decreases. Metal prices also fell, which could have been the driving
  factor. This report's analysis controls both for the effect of prices and other
  drivers of theft. It finds that the interventions reduced metal theft to a level
  far lower than would be expected by the drop in prices alone.
