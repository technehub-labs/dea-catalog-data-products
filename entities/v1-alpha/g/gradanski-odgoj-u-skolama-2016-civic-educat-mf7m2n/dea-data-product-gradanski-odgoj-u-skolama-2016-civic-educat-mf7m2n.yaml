name: Civic education in schools
description: Since the school year 2016/2017, the City of Rijeka has been providing
  pupils of higher grades of primary school with the opportunity to attend the courses
  of Civic Education. For this program, the City of Rijeka has also developed a handbook
  for students. Civic education is carried out according to the model of the extremely
  successful programme "My Rijeka", as an extracurricular activity.More on the programme
  Civic education https://www.rijeka.hr/themes-for-citizens/education-and-education/basic-schools/programs-and-projects-in-basic-schools/citizen-education/
