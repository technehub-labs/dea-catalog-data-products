id: dea:data-product-groningen-vlugschrift-werkgele-employment-d-zvu468
type: DataProduct
name: Employment development
description: The leaflets describe the development of employment and the number of
  branches in the municipality of Groningen. The data come from the annual employment
  survey of the Groningen Register of Establishments for Research and Statistics.
  Data is collected from all locations. The data are updated retroactively and are
  therefore not comparable to those described in previous versions.
