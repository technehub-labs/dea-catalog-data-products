type: DataProduct
name: Healthy together in the city
description: 'The development of future health policy starts with the inventory and
  analysis of what is and with critical reflection on what preceded it. We therefore
  ask ourselves the following questions: * How has the health policy we have implemented
  over the past 10 years worked out? * What did it bring? * What is ‘urban health’
  today? * How do we score in the light of the Health Profile 2010?'
