name: Indicators Volunteering (Social environment)
description: '#### Description Utrecht in Figures is the online database of the municipality
  of Utrecht. Here, the Research & Advice department publishes figures about the city
  of Utrecht and the Utrecht districts and neighbourhoods. With Utrecht in Figures,
  we want to show all those interested in Utrecht how things are actually going with
  Utrecht. Utrecht in Figures is divided into themes. Within the theme ''Volunteer
  work (Social living environment)'' you will find information about the following
  1 ''indicators'': % of residents volunteering somewhere #### Number of indicators
  Number of indicators under this theme: 1 #### Source Research & Advice, Municipality
  of Utrecht, Population survey #### Related datasets Other datasets that fall under
  this theme: - <a href="https://open.utrecht.nl/dataset/oauic-indicators-inclusion-and-social-safety-social-living
  environment-">Indicators Inclusion and social security (Social living environment)</a>
  - <a href="https://open.utrecht.nl/dataset/oauic-indicators-social-well-being-social-living-environment-">Indicators
  Social well-being (Social living environment)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-social-participation-social-living
  environment-">Indicators Social participation (Social living environment)</a> -
  <a href="https://open.utrecht.nl/dataset/oauic-indicators-social-contacts-social-living
  environment-">Indicators Social contacts (Social living environment)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-social-coherence-social-living
  environment-">Indicators Social cohesion (Social living environment)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-home-and-school-social-living
  environment-">Indicators Home and school (Social living environment)</a> #### All
  Utrecht In Figures datasets View <a href="https://open.utrecht.nl/search/query/-/filters/tag%3Autrecht%20in%20digits%3Btype%3Adataset/page/1">here
  all Utrecht In Figures datasets on this website</a>.'
