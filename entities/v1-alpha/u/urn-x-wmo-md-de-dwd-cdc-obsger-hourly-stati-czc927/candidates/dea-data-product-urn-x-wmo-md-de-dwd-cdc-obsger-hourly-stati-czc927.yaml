id: dea:data-product-urn-x-wmo-md-de-dwd-cdc-obsger-hourly-stati-czc927
type: DataProduct
name: Hourly station measurements of the weather phenomena for Germany
description: These data come from the stations of the DWD and legally as well as qualitatively
  equal partner networks. Extensive station metadata (station relocations, instrument
  changes, change of reference time, changes in the algorithms) are included in the
  download. The dataset is divided into a versioned part with a completed quality
  check, in the directory ./historical/. And a continuously updated part, for which
  the quality check has not yet been completed, in the ./recent/ directory. The ./timeseries
  _overview/ folder contains information about long time series.
