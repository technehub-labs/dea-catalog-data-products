name: Indicators Primary education (Education & skills)
description: '#### Description Utrecht in Figures is the online database of the municipality
  of Utrecht. Here, the Research & Advice department publishes figures about the city
  of Utrecht and the Utrecht districts and neighbourhoods. With Utrecht in Figures,
  we want to show all those interested in Utrecht how things are actually going with
  Utrecht. Utrecht in Figures is divided into themes. Within the theme ''Primary education
  (Education & skills)'' you will find information about the following 6 ''indicators'':
  -% like to go to school, children 10-12 years - % reading proficiency reference
  levels -% Calculate reference levels -% language proficiency reference levels -
  number of primary schools by denomination - number of pupils by type of education
  #### Number of indicators Number of indicators under this theme: 6 #### Source Education
  Implementation Service; Youth monitor Utrecht #### Related datasets Other datasets
  that fall under this theme: - <a href="https://open.utrecht.nl/dataset/oauic-indicators-vocational-and-scientific-education-education-skills-">Indicators
  Vocational and scientific education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-educational skills">Indicators Education & skills</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-skills-education-skills-">Indicators
  Skills (Education & Skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-pre-school education-and-childcare-education-skills-">Indicators Pre-school
  education and childcare (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-continuing-education-education-skills-">Indicators
  Secondary education (Education & skills)</a> #### All Utrecht In Figures datasets
  View <a href="https://open.utrecht.nl/search/query/-/filters/tag%3Autrecht%20in%20digits%3Btype%3Adataset/page/1">here
  all Utrecht In Figures datasets on this website</a>.'
