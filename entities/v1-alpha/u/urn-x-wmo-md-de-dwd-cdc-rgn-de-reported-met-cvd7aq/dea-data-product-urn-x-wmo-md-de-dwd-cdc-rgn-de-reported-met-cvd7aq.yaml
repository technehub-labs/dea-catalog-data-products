id: dea:data-product-urn-x-wmo-md-de-dwd-cdc-rgn-de-reported-met-cvd7aq
type: DataProduct
name: Reported methane (CH4) emissions from the agriculture sector in kt/year
description: The size and spatial variability of reported methane emissions from the
  agriculture sector are presented for the federal states and the rural districts
  of Germany. The figure given is the sum of all emissions in the agriculture sector
  for the whole year. Agriculture is defined as the sum of the GNFR (Gridded Nomenclature
  For Reporting) sectors (Agricultural _Livestock, Agricultural _Other, Off _Road).
  Future improvements can be expected through future developments and refinements
  of the methods.
