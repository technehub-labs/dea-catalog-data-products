id: dea:data-product-urn-x-wmo-md-de-dwd-cdc-obsger-hourly-stati-319-gks2bd
type: DataProduct
name: Hourly station observations of air and dew point temperature for Germany
description: These data originate from the stations of the DWD and legally and qualitatively
  equivalent partner networks. Extensive station metadata (station relocations, instrument
  changes, change of reference time, changes in algorithms) are included in the download.
  The dataset is divided into a versioned part with a completed quality check, in
  the directory ./historical/. And a continuously updating part, for which the quality
  check is not yet completed, in the directory ./recent/.
