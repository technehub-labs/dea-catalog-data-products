id: dea:data-product-urn-x-wmo-md-de-dwd-cdc-obsger-hourly-stati-321-zmkmrx
type: DataProduct
name: Hourly station observations of cloudiness for Germany
description: These data originate from the stations of the DWD and legally as well
  as qualitatively equal partner network stations. Extensive station metadata, such
  as station relocations, instrument changes, reference time changes, algorithm changes
  or operator information are included. The dataset is divided into a versioned part
  with completed quality check, in the directory ./historical/. And a part for which
  the quality check has not yet been completed, in the directory ./recent/. The folder
  ./timeseries_overview/ contains information about long time series.
