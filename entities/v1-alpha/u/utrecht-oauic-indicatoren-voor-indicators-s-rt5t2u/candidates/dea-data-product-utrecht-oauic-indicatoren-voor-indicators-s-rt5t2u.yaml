name: Indicators Secondary education (Education & skills)
description: '#### Description Utrecht in Figures is the online database of the municipality
  of Utrecht. Here, the Research & Advice department publishes figures about the city
  of Utrecht and the Utrecht districts and neighbourhoods. With Utrecht in Figures,
  we want to show all those interested in Utrecht how things are actually going with
  Utrecht. Utrecht in Figures is divided into themes. Under the theme ''Further education
  (Education & skills)'' you will find information about the following 8 ''indicators'':
  - % of exam candidates by type of education -% graduates by type of education %
  of pupils in Utrecht schools living in Utrecht -% of Utrecht students attending
  school in Utrecht -% like it at school, young people class 2 and 4 - number of pupils
  by residential location and district of educational institution Number of schools
  by denomination - average final grades for Dutch and mathematics by type of education
  #### Number of indicators Number of indicators under this theme: 8 #### Source Youth
  Health Monitor; Education Implementation Service #### Related datasets Other datasets
  that fall under this theme: - <a href="https://open.utrecht.nl/dataset/oauic-indicators-vocational-and-scientific-education-education-skills-">Indicators
  Vocational and scientific education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-educational skills">Indicators Education & skills</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-primary-education-education-skills-">Indicators
  Primary education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-skills-education-skills-">Indicators
  Skills (Education & Skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-pre-school education-and-childcare-education-skills-">Indicators Pre-school
  education and childcare (Education & skills)</a> #### All Utrecht In Figures datasets
  View <a href="https://open.utrecht.nl/search/query/-/filters/tag%3Autrecht%20in%20dig'
