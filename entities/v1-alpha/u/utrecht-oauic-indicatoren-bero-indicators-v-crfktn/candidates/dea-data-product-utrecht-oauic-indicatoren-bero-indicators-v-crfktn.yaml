name: Indicators Vocational and scientific education (Education & skills)
description: '#### Description Utrecht in Figures is the online database of the municipality
  of Utrecht. Here, the Research & Advice department publishes figures about the city
  of Utrecht and the Utrecht districts and neighbourhoods. With Utrecht in Figures,
  we want to show all those interested in Utrecht how things are actually going with
  Utrecht. Utrecht in Figures is divided into themes. Within the theme ''Professional
  and scientific education (Education & skills)'' you will find information about
  the following 8 ''indicators'': -% of young people aged 17 to 22 with a starting
  qualification or school enrolment -% early school leavers - number of HBO and WO
  graduates by sector - number of enrolled university of applied sciences and university
  students by sector - number of mbo, hbo and wo students - number of Utrecht MBO
  graduates by sector - number of Utrecht MBO students by sector - report figure Utrecht
  MBO settings #### Number of indicators Number of indicators under this theme: 8
  #### Source CBS; Municipality of Utrecht, Education Department; JOB; Education Implementation
  Service #### Related datasets Other datasets that fall under this theme: - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-educational skills">Indicators Education & skills</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-primary-education-education-skills-">Indicators
  Primary education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-skills-education-skills-">Indicators
  Skills (Education & Skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-pre-school education-and-childcare-education-skills-">Indicators Pre-school
  education and childcare (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-continuing-education-education-skills-">Indicators
  Secondary education (Education & skills)</a> #### All Utrecht In Figures datasets
  View <a href="https://open.utrecht.nl/search/query/-/filters/tag%3Autrecht%20'
