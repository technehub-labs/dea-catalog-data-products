id: dea:data-product-development-low-risk-area-development-6sac9e
type: DataProduct
name: Development Low Risk Area
description: The Development Low Risk Area is the part of the coal mining reporting
  area which contains no recorded coal mining legacy risks to the surface. New development
  within this defined area is subject to general Standing Advice from the Coal Authority.
  The development low risk areas are used by Planning Authorities to determine that
  a planning application is subject to general Standing Advice from the Coal Authority.
