type: DataProduct
name: 'Health young people Flevoland: You and your health research (tm school year
  2018/2019)'
description: 'Data on the health of young people at neighbourhood- , district- and
  municipality level in Flevoland based on the annual preventive health surveys among
  secondary school students of grades 1 and 3 of VMBO and grades 2 and 4 of Havo VWO
  (project You and your health). The data is collected during the school year and
  updated once a year. Area: Almere, Dronten, Lelystad Noordoostpolder, Urk and Zeewolde.'
