type: DataProduct
name: 'Replication Data for: Serious Game "A shuttle for everyone"'
description: 'The CATAPULT Serious Game is named “A shuttle for everyone” and supports
  collaboration and storytelling. The Serious Game allows identifying future needs
  of senior citizens, children, and people with physical impairments, anticipating
  barriers, and finding ideas for solutions when automated shuttles are implemented
  in a specific context. In the CATAPULT project, “A shuttle for everyone” is a tool
  to: -Collect data on needs, wishes as well as challenges regarding automated mobility
  services; -Co-creatively develop new inclusive automated mobility solutions, taking
  into account the spatial context as well as the needs and requirements of potential
  end users by bringing them together with relevant practitioners and, finally -Raise
  awareness of accessibility and inclusivity in the mobility system amongst the people
  playing. In this research data repository, you will find three files, each one corresponding
  to each version of the game. 1) Version for older adults and people with impairments
  2) Version for children 3) Version for the general public. THE INFORMATION CONTAINING
  THE ELEMENTS OF THE GAMES AND THE INSTRUCTIONS WILL BE FOUND IN THE FILES NAMED
  "INSTRUCTIONS". THERE IS ONE FILE PER EACH TYPE OF GAME.'
