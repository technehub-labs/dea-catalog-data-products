id: dea:data-product-doi-10-24417-msfd2017ref2d-msdf-2017-cy-jyesap
type: DataProduct
name: MSDF 2017 cycle. Windmills impact on hydrodynamics. Reference 2D fields
description: This dataset is part of the MSFD D7 2017 cycle. It aims at assessing
  the impact of the windmills on the hydrodynamical conditions and hydrodynamical
  climate in their neighbourhood. The impact is measured by comparing a domain with
  and without the presence of windmills. This particular dataset gathers the 2D fields
  of the reference (no windmills) simulation.
