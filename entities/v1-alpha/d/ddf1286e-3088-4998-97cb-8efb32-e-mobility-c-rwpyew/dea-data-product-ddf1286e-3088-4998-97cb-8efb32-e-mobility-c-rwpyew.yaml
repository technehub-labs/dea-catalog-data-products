type: DataProduct
name: E-mobility - charging stations
description: The dataset contains information on publicly accessible charging stations
  for electric vehicles in the state of Brandenburg. The systems are differentiated
  according to the type of charging device (normal charging device, fast charging
  device). The data source is the charging station register of the Federal Network
  Agency.
