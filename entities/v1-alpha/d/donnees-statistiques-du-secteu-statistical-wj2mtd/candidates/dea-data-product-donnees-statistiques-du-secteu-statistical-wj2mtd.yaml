id: dea:data-product-donnees-statistiques-du-secteu-statistical-wj2mtd
type: DataProduct
name: Statistical data of the natural gas sector (ILR)
description: This dataset documents developments in the natural gas market (distribution
  and supply) in Luxembourg. It is mainly aimed at national and international statistical
  and economic bodies, as well as professionals in the sector and consumers. The data
  represent a comprehensive resource for the analysis of different aspects of the
  Luxembourg natural gas market. The Institute collects data from network operators
  and gas suppliers and compiles statistics as part of its monitoring mission. The
  dataset covers various topics such as infrastructure, consumption, production, prices,
  customer data, imports and the wholesale market. The information is also accessible
  via an interactive table proposed by the Institute.
