id: dea:data-product-digital-surface-model-standard-digital-surf-5tcwed
type: DataProduct
name: Digital Surface Model (ICAO Standard)
description: 'In the scope of the International Civil Aviation Organization ([ICAO](https://www.skybrary.aero/index.php/International
  _Civil _Aviation _Organisation _(ICAO))) requiring countries and airports to provide
  electronic Terrain and Obstacle Data ([eTOD](https://www.skybrary.aero/index.php/Electronic
  _Terrain _and _Obstacle _Data _(eTOD))), the Air Navigation Administration has been
  tasked by the Government to take the steps necessary to comply with this requirement.
  This Digital Surface Model (DSM) is the result of a first LIDAR survey flight that
  has been done in October 2017 and corresponds to the standards required by ICAO.
  For this reason DSM also uses the international reference systems WGS84 and EGM2008.
  The data itself is split up in 4 different areas, which are specified as follows:
  Area 1: The whole territory of Luxembourg; Area 2: Terminal Control Area (this area
  is larger than the territory of Luxembourg); Area 3: Aerodrome movement area; Area
  4: Category II or III operations (Runway 24). The different areas come with different
  numerical requirements, such as data accuracy and resolution. Follow the links in
  the description or consult metadata for further Information.'
