id: dea:data-product-land-capability-for-agricultur-land-capabil-ahgf7u
type: DataProduct
name: Land Capability for Agriculture, Scotland
description: The Land Capability Classification for Agriculture has as its objective
  the presentation of detailed information on soil, climate and relief in a form which
  will be of value to land use planners, agricultural advisers, farmers and others
  involved in optimising the use of land resources. The classification ranks land
  on the basis of its potential productivity and cropping flexibility determined by
  the extent to which its physical characteristics (soil, climate and relief) impose
  long term restrictions on its agricultural use. THE CLASSES Class 1. Land capable
  of producing a very wide range of crops with high yields Class 2. Land capable of
  producing a wide range of crops with yields less high than Class 1. Class 3. Land
  capable of producing good yields from a moderate range of crops. Class 4. Land capable
  of producing a narrow range of crops. Class 5. Land suited only to improved grassland
  and rough grazing. Class 6. Land capable only of use as rough grazing. Class 7.
  Land of very limited agricultural value. THE DIVISIONS A division is a ranking within
  a class. As the requirements of the crops suited to Classes 1 and 2 are fairly stringent,
  land in these classes has inherently low degrees of internal variability and no
  divisions are present. The requirements of crops grown in the remaining classes
  are less rigorous, consequently land included is more variable in character.
