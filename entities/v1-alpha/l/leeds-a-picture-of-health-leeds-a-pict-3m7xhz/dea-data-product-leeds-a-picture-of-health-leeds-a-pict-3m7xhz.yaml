name: 'Leeds: a picture of health'
description: '<dp-prose> <p>The Leeds Ambitions - Healthy, Growing, Thriving and Resilient
  - set the shared direction for tackling poverty and inequality across the city.
  Leeds: A Picture of Health supports these ambitions by providing a clear evidence
  base on some of the health needs and social determinants shaping people’s lives.</p>
  <p>It is designed for system partners as an introductory resource, providing an
  overall perspective on the health and wellbeing of the Leeds population, compared
  to England, for a multitude of indicators monitored to inform strategy and planning.
  It also shows recent trends (where available) to illustrate the direction of change.</p>
  </dp-prose>'
