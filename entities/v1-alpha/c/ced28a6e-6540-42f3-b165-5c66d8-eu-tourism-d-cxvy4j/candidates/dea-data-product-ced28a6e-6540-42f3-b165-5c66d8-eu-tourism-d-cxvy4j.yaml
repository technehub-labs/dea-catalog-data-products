type: DataProduct
name: EU Tourism dashboard data - 2025 release
description: 'This dataset includes the values for the 35 indicators classified in
  4 categories (green pillar, digital pillar, socio-economic pillar and basics descriptors)
  as published on the EU Tourism Dashboard at the end of 2025. Further details about
  the indicators description, unit of measures and source of data can be found in
  the EU Tourism dashboard: https://tourism-dashboard.ec.europa.eu RESOLUTION: National,
  regional, sub-regional. COMPLETENESS: The data are related the EU-27 countries plus
  IS, NO and CH. POLICY CONTEXT: See https://tourism-dashboard.ec.europa.eu/background-methodology?lng=en#section-2
  METHODOLOGY: See https://tourism-dashboard.ec.europa.eu/background-methodology DATA
  SOURCES: See https://tourism-dashboard.ec.europa.eu/background-methodology?lng=en#section-5
  LEVEL OF AGGREGATION: NUTS0/2/3.'
