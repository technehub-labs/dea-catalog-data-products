id: dea:data-product-cd750144-6556-412e-a880-b61e4d-survey-mobil-jf52kj
type: DataProduct
name: Survey Mobility station Ulm
description: '<p>The dataset contains survey results on the topic &quot;What offer
  would you use and try out here at the upcoming mobility station?&quot; . In the
  survey from 2.7.2021 to 23.7.2021, the Digital Agenda Office wanted to know in advance
  in the funding project Zukunftskommune@bw which of the upcoming offers at the prototype
  of the mobility station on Eselsberg, which was opened on 24.7.2021, is more interesting
  for the citizenry. 184 times the buttons were pressed by two survey posters, which
  were attached to lanterns near the upcoming mobility station.</p><p>At the same
  time there were 2 <a href="https://www.zukunftsstadt-ulm.de/eselsberg/survey posters">survey
  posters with pressure buttons</a>:</p><ul><li> a survey poster (105 responses) <a
  href="https://goo.gl/maps/529WCDkM7xxz4q1B9">on the footpath in the student residence</a><li>
  a survey poster (79 responses) <a href="https://goo.gl/maps/1zKp5aByqhibSzE7">on
  the footpath along the Eselssteige</a><li/<pul>>Diep Press buttons were occupied
  with these 4 answer options:</p><ul><li> eScooter (total: 28)</li><li> eLastenrad
  (total: 40)</li><li> e-car (total: 34)</li><li> bike service station (total: 82)</li></ul><p>The
  survey is anonymous and is carried out by hanging the survey poster so that passers-by
  can vote on different issues at the touch of a button. The data is transmitted every
  minute via LoRaWAN, so that the data record contains the voting time and the voting
  result. Answers are given on a 4 scale. The data is used, among other things, by
  the city administration to make informed, participatory decisions or to query a
  mood picture. Before being made available as open data, values were removed whose
  vote implied a multiple press of a button in less than 60 seconds.</p><p>This project
  was funded by the state of Baden-Württemberg as part of the funding project zukunftskommune@bw.<a
  href="https://zukunftsstadt-ulm.de/eselsberg/mobilitaets-station">More information
  on the project Prototyp Mobilitätsstation am Ese'
