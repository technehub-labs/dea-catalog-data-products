type: DataProduct
name: Partial guideline Footpaths and hiking trails
description: The cantonal footpath and hiking trail network is divided into four different
  networks – a footpath network of the canton of Basel-Stadt, a footpath network of
  the city of Basel, a hiking trail network of the canton of Basel-Stadt and an informative
  plan content, which represent the footpath network of the municipalities of Riehen
  and Bettingen. The networks are divided into existing and planned footpaths and
  hiking trails of their respective level groups.
