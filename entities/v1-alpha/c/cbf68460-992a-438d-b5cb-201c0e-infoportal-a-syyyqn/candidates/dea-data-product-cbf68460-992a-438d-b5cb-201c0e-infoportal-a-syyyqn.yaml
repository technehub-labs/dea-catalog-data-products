id: dea:data-product-cbf68460-992a-438d-b5cb-201c0e-infoportal-a-syyyqn
type: DataProduct
name: Infoportal Accessibility - Health - Entrances
description: 'In the Infoportal Accessibility, facilities with public use are: - barrier-free
  accessibility and accessibility - the equipment with barrier-free toilets and their
  characteristics - the provision of technical aids for persons with disabilities;
  - special offers and services for people with disabilities. For each recorded facility
  there is detailed information, each of which is summarized on its own website. All
  information is available in three languages (DE, CS and EN). The information portal
  has its own website at www.dresden.de. There is an advanced search function for
  users. In addition, data collection is possible for everyone after a one-time registration
  (button <Join> in the information portal). There is a video guide explaining how
  to record data. As a rule, the entities covered by other users themselves are only
  published after an on-site inspection. Most of the facilities included were taken
  up by a service provider within the framework of the INTERREG-funded project "The
  Bohemian Saxon Border Area barrier-free". The project also financed the software
  development, which was implemented by the company IT of the state capital Dresden.'
