type: DataProduct
name: Access Statistics by moers.de for May 2016
description: '__Note:__ Due to an error in the tracking code, accesses were no longer
  counted correctly from mid-May. This explains the sharp reduction in access numbers
  to moers.de compared to the previous months. The zip file contains the following
  CSV files: * Visitors per year_1.csv * Visitors per month - individual period_1.csv
  * Visitors per month_1.csv * Visitors per hour_1.csv * Visitors per day_1.csv *
  Visitors_1.csv * Browser major versions by operating system_1.csv * Browser by operating
  system subversions_1.csv * Browser subversions_1.csv * Entry pages_1.csv * Overview
  of origin_1.csv * Usage per domain_1.csv * Page Impressions per page_1.csv * Search
  word statistics phrases by search engine_1.csv * Search word statistics Phrases_1.csv
  * Search word statistics Words_1.csv'
