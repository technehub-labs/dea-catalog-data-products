name: Pedestrian Footfall DCC
description: Pedestrian footfall counts of people at a number of locations in Dublin
  city. Passersby are counted and logged every hour, 24 hours per day, 7 days per
  week using a network of PYRO-Box people counters located throughout central Dublin.
  Data is provided by Dublin City Council and the NTA.
