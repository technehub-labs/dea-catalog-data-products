id: dea:data-product-c7c80885-8ddd-4691-bc3f-30dbb6-number-of-ge-ree5ud
type: DataProduct
name: Number of generally accessible charging points in the ‘Convenient’ charging
  world for the year 2035
description: The map shows how many generally accessible charging points should be
  available in the selected municipality in 2035 in order to meet the charging demand.
  A charging point is a facility for charging plug-in vehicles (battery electric vehicles
  and plug-in hybrids) at which a single vehicle can be charged at the same time.
  The number of charging points is broken down into various charging options, which
  differ according to the five charging needs of owners of plug-in vehicles (charging
  at home, charging at work, charging in the neighbourhood, charging at the destination,
  fast charging) as well as the type of charging (alternating current AC, direct current
  DC) and charging power (in kilowatts [kW]). The charging points for charging in
  the neighbourhood, charging at the destination and fast charging are referred to
  collectively as generally accessible charging points. The colour of the areas refers
  to the number of generally accessible charging points required per municipality.
  In order to show the range of possible developments, the three charging worlds "Convenient",
  "Planned" and "Flexible" were designed based on common industry assumptions in the
  SFOE study "Understanding charging infrastructure 2050" to show the direction in
  which the charging infrastructure in Switzerland could develop. In the "Convenient"
  charging world, people mainly charge at home and additionally at fast-charging points.
