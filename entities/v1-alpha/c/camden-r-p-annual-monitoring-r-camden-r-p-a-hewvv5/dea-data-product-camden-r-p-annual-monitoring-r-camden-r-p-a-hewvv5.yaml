name: Camden R- P Annual Monitoring Report 2011-12
description: LB Camden Regeneration and Planning Annual Monitoring Report 2011/12
  Monitors and analyses the performance of our planning policies and our progress
  on our planning policy documents. We monitored 40 indicators in 2011/12 to track
  our performance against the Local Development Framework (LDF) Core Strategy and
  Development Policies documents. Where possible we link indicators to existing planning
  policies and targets, although not all indicators are directly related to planning
  activity. Some, such as air quality and recycling indicators, monitor the significant
  effects of activities on which planning has limited influence on which nevertheless
  provide an insight on the state of the borough and its environment.
