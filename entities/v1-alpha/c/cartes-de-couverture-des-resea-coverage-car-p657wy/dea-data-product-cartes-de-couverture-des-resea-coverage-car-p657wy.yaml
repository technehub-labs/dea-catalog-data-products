id: dea:data-product-cartes-de-couverture-des-resea-coverage-car-p657wy
type: DataProduct
name: Coverage cards for electronic communications networks (ILR)
description: '[FR] (website address ilr.lu) The ‘Geographical Survey of Network Deployment’
  (‘RGDR’) is the central place where the coverage data for fixed and mobile public
  networks in Luxembourg are provided. The RGDR is based on Article 26 of the Law
  of 17 December 2021 on electronic networks and communications. All relevant information
  relating to the RGRD is published on the website www.ilr.lu [https://www.ilr.lu/espace-statistiques/releve-geographique/]
  of the Institut Luxembourgeois de Régulation (‘IRL’). You will also find a more
  detailed explanation of the different maps and the data from the operators necessary
  for the publication of the maps. The publication of fixed and mobile coverage maps
  is also part of the ‘National Strategy for Ultra-High-Speed Electronic Communications
  Networks 2021-2025’. Various extracts from the RGDR can be found below in CSV or
  XLSX format; they contain data that is updated at different times. For this reason,
  it cannot be excluded that the individual details of the different files do not
  fully coincide at any given time. The ILR accepts no responsibility for the accuracy
  and completeness of the data thus published. Please also note that due to the way
  data is collected and processed, the information presented on this Open Data platform
  is never 100% up-to-date. On the contrary, the respective tables are usually updated
  with an approximate delay of several days/months. For further information, please
  contact releve-géograhique-réseaux@ilr.lu.'
