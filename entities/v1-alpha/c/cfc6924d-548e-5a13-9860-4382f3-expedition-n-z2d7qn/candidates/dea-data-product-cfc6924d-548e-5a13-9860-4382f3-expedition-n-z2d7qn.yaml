name: 'expedition.nationalpark.2022 - Mallnitz: Agriculture in Transition'
description: expedition.nationalpark.2022 took place from 29 to 31 May 2022 in the
  national park community of Mallnitz. The three-day trial took place as part of the
  long-term cooperation between the National Park Hohe Tauern Carinthia and the University
  of Applied Sciences Carinthia. The theme of the expedition was devoted to the change
  in agriculture and the associated changes in various areas of daily life, the landscape,
  regional development and the protected area. These are visible and discussed during
  visits to 10 local farms directly or indirectly related to agriculture. The expedition
  team consisted of three scientists from Carinthia University of Applied Sciences
  and three local actors from the national park region and was accompanied by a national
  park ranger and a research assistant. By combining local knowledge and scientific
  impulses, new perspectives on the national park have been developed.
