id: dea:data-product-coal-authority-abandoned-mines-coal-authori-fv9ze7
type: DataProduct
name: Coal Authority - Abandoned Mines View Service (WMS)
description: 'This Web Mapping Service (WMS) contains a collection of information
  extracted from the National Coal Mining Database. This data represents a snapshot
  in time taken from the National Coal Mining Database and has been derived from current
  information available to the Coal Authority at that time. The data is supplied free
  of charge under the terms of the Open Government Licence (http://www.nationalarchives.gov.uk/doc/open-government-licence/)
  subject to the following overriding re-use condition: re-use is not permitted for
  any activity that is part of the Coal Authority''s public task responsibilities.'
