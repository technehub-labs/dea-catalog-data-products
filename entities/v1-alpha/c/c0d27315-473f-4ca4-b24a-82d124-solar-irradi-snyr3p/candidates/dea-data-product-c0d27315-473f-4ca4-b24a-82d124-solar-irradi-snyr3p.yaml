id: dea:data-product-c0d27315-473f-4ca4-b24a-82d124-solar-irradi-snyr3p
type: DataProduct
name: Solar irradiation on a horizontal surface
description: 'The irradiation maps show the solar radiation on a south-facing surface
  for four different inclinations: Horizontal, 30°, 75° and 90°. The data is based
  on Switzerland-wide modelling with a horizontal grid width of 50m. It is based on
  measurement data from the period 2000-2020 and the influence of the horizon was
  derived from a 10 m resolution elevation model of Switzerland and neighbouring countries.
  In addition to the global radiation, the expected photovoltaic production per kW
  of installed capacity is also shown for the respective irradiation levels. The data
  can serve as an initial estimate of potential PV production. However, depending
  on local conditions and system design, the value may be higher or lower. For example,
  any additional yields resulting from the use of bifacial modules were not taken
  into account. Under "Additional information", the monthly values of global radiation
  (per m2) and expected photovoltaic production (per kW of installed capacity) can
  be queried for each grid point. Further information on the modelling can be found
  in the report under the link "Data reference".'
