id: dea:data-product-chiffres-cles-de-ladem-1-adem-key-fig-uyabqa
type: DataProduct
name: ADEM key figures
description: The detailed data underlying the monthly ADEM key figures. This dataset
  provides information on jobseekers registered with the Employment Development Agency
  (ADEM) and on vacancies that employers report to ADEM. - Detailed profiles of resident
  jobseekers available - Openings and closures of jobseekers' files - Beneficiaries
  of employment measures - Non-resident job seekers - Jobseekers compensated - Long
  series on positions reported each month and vacancies at the end of each month,
  from June 2006. - Detailed series of posts declared each month and vacancies at
  the end of each month, from January 2014. - Resident jobseekers available by detailed
  age group - Jobseekers by occupation ([ROME](http://rome.adem.public.lu/index _base.html))
  - Resident jobseekers available by nationality - The place of residence of available
  resident jobseekers - Available resident jobseekers under 30 years of age
