type: DataProduct
name: Limited Traffic Zones (ZTL)
description: Area elements that identify on the territory of the Municipality of Genoa
  the boundaries of the areas subject to traffic restrictions as established by the
  relative ordinances.Limited Traffic Zones (ZTL), defined pursuant to Articles 3,
  6 and 7 of the Highway Code, and whose specific regulation is defined in a Regulations
  approved by the Municipal Council that identifies the possibility of access to the
  ZTL, both in terms of people (residents and non-residents) and vehicles.
