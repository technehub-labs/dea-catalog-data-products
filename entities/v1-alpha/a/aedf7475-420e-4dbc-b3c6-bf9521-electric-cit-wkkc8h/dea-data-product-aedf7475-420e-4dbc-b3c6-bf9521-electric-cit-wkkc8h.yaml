id: dea:data-product-aedf7475-420e-4dbc-b3c6-bf9521-electric-cit-wkkc8h
type: DataProduct
name: Electric City Rüsselsheim - Mobility behavior, acceptance of electric cars and
  charging station configuration
description: 'The data are part of the project "Electric City Rüsselsheim", which
  was funded by the Federal Ministry for Economic Affairs and Climate Protection (BMWK)
  as part of the "Immediate Clean Air Programme 2017-2020" (funding code: 01MZ18008B).From
  January to December 2020, RheinMain University of Applied Sciences conducted computer-based
  personal interviews (CAPI) with citizens from Rüsselsheim am Main and the surrounding
  area (n=466 households surveyed). The following topics were covered in the approximately
  60-minute interview and are available in corresponding (individual) data sets (see
  documentation):- **Information on the household surveyed** (Socioeconomics, traffic
  situation)- **Information on all persons living in the household** (Sociodemography,
  mobility behaviour)- **Detailed information on all mobility tools available in the
  household** - Passenger cars - Motorcycles - Subscriptions for public transport
  (ÖV)- **Social psychological constructs:** Attitudes to and perception of electric
  cars, as well as environmental awareness- **Stated Adaptation Experiment:** Adaptation
  of mobility tools in response to hypothetical price regulations on fuel, electricity,
  public transport and purchase premiums for an e-car-Stated Preferences Experiment:**
  Preferences for charging station configuration'
