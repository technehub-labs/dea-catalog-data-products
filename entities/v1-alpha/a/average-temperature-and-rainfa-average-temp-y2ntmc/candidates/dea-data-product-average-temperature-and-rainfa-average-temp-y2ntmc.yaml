name: Average temperature and total rainfall in England and Wales
description: 'Average temperature and total rainfall in England and Wales : 1845 to
  2012. Annual and seasonal outflow and rainfall estimates for the United Kingdom
  and its component countries since 1961. Rainfall figures are available from the
  National River Flow Archive - monthly hydrological updates. The Environment Agency
  also publish monthly water situation reports for England. Discontinued - superceded
  by http://www.ceh.ac.uk/data/nrfa/ & https://www.gov.uk/government/collections/water-situation-reports-for-england'
