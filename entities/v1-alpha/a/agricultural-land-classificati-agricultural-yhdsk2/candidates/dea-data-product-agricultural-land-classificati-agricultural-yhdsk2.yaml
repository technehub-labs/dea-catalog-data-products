name: Agricultural Land Classification detailed Post 1988 survey ALCR13394
description: 'Survey name: Teynham South (Swale LP Site DD) Post 1988 Agricultural
  Land Classification (ALC) site survey data – scanned original paper maps and survey
  reports for individual sites surveyed in detail between 1989 and 1999 by the Ministry
  of Agriculture Fisheries and Food. Where Grade 3 is mapped this includes the subdivision
  of Grade 3 into subgrades 3a and 3b. Surveys use the current grading methodology
  as described in "Agricultural Land Classification of England and Wales," a link
  for which is provided with the data. Individual sites have been mapped at varying
  scales and level of detail from 1:5,000 to 1:50,000 (typically 1:10,000). Unedited
  sample point soils data and soil pit descriptions are also available for some surveys.
  Attribution statement: © Natural England copyright. Contains Ordnance Survey data
  © Crown copyright and database right [year]. Attribution statement: © Natural England
  copyright. Contains Ordnance Survey data © Crown copyright and database right [year].'
