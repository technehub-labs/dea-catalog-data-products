id: dea:data-product-a2c56538-f6c6-40f3-bfb6-d6084c-covid-19-hps-gxefew
type: DataProduct
name: COVID-19 - HPSC County Statistics Latest Point
description: 'This dataset contains COVID-19 Daily Statistics for Ireland by County
  as reported by the Health Protection Surveillance Centre. This data includes confirmed
  cases (PCR) only and does not include positive antigen results uploaded to the HSE
  portal. Data refers to period from 27 February 2020 to midnight 13 November 2023.
  Deaths: From 16th May 2022 to November 2023, reporting of Notified Deaths changed
  from daily to weekly. Data on deaths is based on the date on which a death was notified
  on CIDR, not the date on which the death occurred. Data on deaths by date of death
  is available on the HPSC Respiratory Virus Notification Hub https://respiratoryvirus.hpsc.ie/.'
