id: dea:data-product-ad5a7685-2eba-49c1-a831-de6e07-discovery-se-mtkbhq
type: DataProduct
name: Discovery service (CSW) of the catalog of the Public Geographic Information
  Platform Nord-Pas de Calais
description: This discovery service makes it possible to query the catalogue of geographical
  data and web services of the Public Geographic Information Platform Nord-Pas de
  Calais referenced on the portal [PPIGE] (http://www.ppige-npdc.fr/portal/), via
  the CSW 2.0.2. This harvesting point makes it possible to discover the metadata
  of the geographical data disseminated by the PPIGE concerned by the European INSPIRE
  directive or of public interest.
