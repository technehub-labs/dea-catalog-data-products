id: dea:data-product-aee0525c-62af-497a-8ee4-3af06e-public-trans-35gaqz
type: DataProduct
name: Public transport quality classes in the German counties and municipalities 2025
description: Public transport in Germany is part of public services and a prerequisite
  for getting to school or work, doing shopping, visiting doctors, visiting the theatre,
  meeting friends and relatives. A good public transport offer helps to establish
  equal opportunities for all population groups and to approximate the living conditions
  in the city and country. This analysis provides a Germany-wide overview of the quality
  of public transport. At the level of the districts and municipalities, it analyses
  how many people have access to public transport of a defined quality class (A-F).
  For the present evaluation, the transport planning company Plan4Better has analysed
  the timetable data for the year 2025 on behalf of Greenpeace.
