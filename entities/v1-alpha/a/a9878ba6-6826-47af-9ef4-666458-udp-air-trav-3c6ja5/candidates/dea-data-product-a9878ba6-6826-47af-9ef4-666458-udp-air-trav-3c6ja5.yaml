id: dea:data-product-a9878ba6-6826-47af-9ef4-666458-udp-air-trav-3c6ja5
type: DataProduct
name: UDP - Air travel emission intensity
description: 'This indicator is an estimate of the average amount of CO2 emitted per
  air passenger per reporting country. It is calculated by dividing the amount of
  CO2 emitted by all passenger flights by the number of passengers within a year.
  The emission quantities and the number of air passengers are associated with the
  airport of departing flights. Therefore, the indicator takes into account, for every
  airport, both residents travelling to a destination and tourists returning home.
  Lower values indicate lower emissions per air passenger. Higher country values are
  usually associated with more long-haul flights. The indicator is part of the environmental
  impacts pillar of the EU Tourism Dashboard. UNIT OF MEASURE: Kg of CO2 per passenger.
  RESOLUTION: NUTS0. COMPLETENESS: 100%. METHODOLOGY: The indicator is obtained dividing
  the departing aircraft CO2 emissions by the departing passengers. CO2 emissions
  from pure cargo flights are excluded (thanks to Eurocontrol calculations). DATA
  SOURCES: Departing aircraft CO2 emissions [Eurocontrol], Departing passengers (avia_paoc)
  [ESTAT].'
