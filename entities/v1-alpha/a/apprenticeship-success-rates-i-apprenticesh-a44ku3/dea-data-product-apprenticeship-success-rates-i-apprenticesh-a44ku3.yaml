id: dea:data-product-apprenticeship-success-rates-i-apprenticesh-a44ku3
type: DataProduct
name: Apprenticeship Success Rates in England 2010/11
description: Apprenticeship Success Rates for institutions in England for the academic
  year 2010/11. The data shows success rates, retention rate and achievement rates
  by type of provision and characteristics of the learners. It also shows success
  rates for each individual organisation. These datasets are also known as Apprenticeship
  National Success Rate Tables or Apprenticeship NSRTs.
