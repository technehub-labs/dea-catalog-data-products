id: dea:data-product-a1e28820-056f-4371-9bb3-8c17b8-sustainable-p56e3v
type: DataProduct
name: Sustainable potential of non-woody biomass resources for bioenergy in Switzerland
  at the municipality level
description: 'Biomass is a renewable resource for energy which can be transformed
  into several forms of energy: heat, electricity, biogas or liquid fuels. Non-woody
  types of biomass were investigated using methodically comparable approaches: manure,
  agricultural crop by-products, the organic part of household garbage, green waste,
  the organic residues from industrial waste and sewage sludge. Within the implementation
  of the energy strategy 2050 the Swiss government foresees a massive increase in
  the share of renewable energy. The Swiss Competence Center for Energy Research (SCCER)
  Biosweet (Biomass for Swiss Energy Future) seeks solutions to the technical, social
  and political challenges posed by the Energy Transition with regard to biomass.
  The Swiss Federal Institute for Forest, Snow and Landscape Research WSL quantified
  and localised the potential of important biomass resources in Switzerland, particularly
  with regard to their sustainable availability. The results are useful as a basis
  for identifying promising biomass-use pathways and the best sites for their implementation.
  Data (https://www.envidat.ch/dataset/swiss-biomass-potentials) and a detailed report
  are available online (https://www.dora.lib4ri.ch/wsl/islandora/object/wsl%3A13277/datastream/PDF/Thees-2017-Biomassepotenziale_der_Schweiz_f%C3%BCr_die-%28published_version%29.pdf).
  This map shows the sustainable potential of non-woody biomass for bioenergy (maximum
  amount of nationally produced non-woody biomass that could be used, after deducting
  any ecological, economic, legal and political constraints) in Switzerland at the
  municipality level in primary energy (maximum amount of energy available in a resource
  without conversion) in terajoules.'
