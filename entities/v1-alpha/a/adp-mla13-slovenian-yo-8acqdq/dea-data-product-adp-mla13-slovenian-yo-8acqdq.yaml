name: Slovenian Youth 2013
description: 'The main purpose of the Slovenian Youth 2013 survey was to obtain a
  comprehensive picture of the life of Slovenian youth. (between 16 and 27 years of
  age). Similar to the 2010 survey, the 2013 Youth Study is a conceptual and methodological
  follow-up the tradition of researching young people in Slovenia, with some more
  detailed finishings. They were used as a basis for developing a methodological approach.
  already carried out studies of young people in Germany (Hurrelmann et al., 2002,
  2006) and approaches and concepts emerging in previous research on young people
  Slovenia since 1985. Youth 2013 study and numerous publications based on it offer
  insights into life, attitudes and behaviour not only Slovenian youth, but also young
  people from two other Western Balkan countries: Croatia (IDIZ-FES Croatian 2012
  Youth Study) and Kosovo (IDRA-FES Kosovo 2012 Youth Study). In addition, our survey
  also used German data (Shell 2010 German Youth Study) for comparison purposes. The
  comparative nature of the Youth 2013 survey offers valuable findings in the field
  of youth studies and thus seeks to partially fill the research gap in the post-communist
  countries. Among the main problem areas addressed were: demographic change and intergenerational
  cooperation; education and training, employment and entrepreneurship, housing and
  living conditions, lifestyles, health and well-being, media use, political participation
  and views, youth mobility and globalisation and others.'
