type: DataProduct
name: 'Experience Geology: Geosites'
description: “Erlebnis Geologie” (“Experience geology”) aims to raise public awareness
  about the importance of geology. One of the ways it achieves this aim is through
  the internet platform (www.erlebnis-geologie.ch), where anyone hosting an event
  with a geological theme can advertise it (trips, geoscientific guided tours for
  the public, educational geological trails, talks, etc.). Bringing geoscientific
  activities together on one platform boosts communication and increases visibility.
  No reservation is necessary to visit Geosites.
