id: dea:data-product-oai-andmed-eesti-ee-50ccfc90-c-oe0453-life-e5evnq
type: DataProduct
name: 'OE0453: Life expectancy by sex, age group and nationality'
description: 'The dataset shows life expectancy at birth and years left to live by
  sex and age group (including 0, 1-4, 5-9, 10-14, 15-19, 20-24, 25-29, 30-34 to 85
  and older) and ethnicity (Estonians, non-Estonians). The purpose of collecting life
  expectancy data is to provide a standard population health indicator for monitoring
  trends over time, assessing differences between population groups and regions, and
  informing health policy and prevention planning. Data source: Statistics Estonia'
