type: DataProduct
name: 'OE045: Life expectancy by sex and age'
description: 'The dataset shows life expectancy at birth and the number of years left
  to live by sex and age (0-100) in a given year. The purpose of collecting life expectancy
  data is to provide a standard population health indicator for monitoring trends
  over time, assessing differences between population groups and regions, and informing
  health policy and prevention planning. Data source: Statistics Estonia'
