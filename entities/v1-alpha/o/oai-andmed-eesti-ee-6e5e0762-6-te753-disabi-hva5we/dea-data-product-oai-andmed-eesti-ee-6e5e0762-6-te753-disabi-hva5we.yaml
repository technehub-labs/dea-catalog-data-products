name: 'TE753: Disability free life expectancy by sex, age and county'
description: 'The dataset shows the number of years of healthy life expectancy by
  county (15 counties), age (0, 65-69), sex and year. The purpose of collecting these
  data is to provide a standard population health indicator for monitoring trends
