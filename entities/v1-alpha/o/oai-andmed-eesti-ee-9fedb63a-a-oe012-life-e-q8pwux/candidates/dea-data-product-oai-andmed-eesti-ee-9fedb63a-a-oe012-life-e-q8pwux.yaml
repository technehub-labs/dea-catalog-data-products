name: 'OE012: Life expectancy at birth by sex'
description: 'The dataset shows life expectancy (in years) by sex and birth year.
  The purpose of collecting life expectancy data is to provide a standard population
  health indicator for monitoring trends over time, assessing differences between
  population groups and regions, and informing health policy and prevention planning.
  Data source: Statistics Estonia'
