id: dea:data-product-oai-andmed-eesti-ee-1d390352-d-fire-hazard-p4ve7a
type: DataProduct
name: Fire hazard (FWI) dataset
description: The purpose of the preparation and transmission of the fire hazard map
  is to enable the Synoptics of the Environment Agency, the Rescue Agency, the municipalities
  and other decision-makers and the population to assess the danger of possible landscape
  and forest fires by region. Accordingly, preventive measures can be introduced and
  fires can be monitored in real time. The forest fire hazard index is continuously
  calculated and displayed, although higher fire hazard indices occur from the complete
  loss of snow cover to the arrival of autumn rainfall and wet weather. The fire hazard
  is calculated using the Canadian FWI (Fire Weather Index) method used by the European
  Forest Fire Information System EFFIS (European Forest Fire Information System).
