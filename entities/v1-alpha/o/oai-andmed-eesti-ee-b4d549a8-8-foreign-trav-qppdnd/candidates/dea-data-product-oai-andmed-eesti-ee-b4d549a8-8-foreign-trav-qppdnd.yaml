id: dea:data-product-oai-andmed-eesti-ee-b4d549a8-8-foreign-trav-qppdnd
type: DataProduct
name: Foreign travel statistics
description: Foreign travel statistics give an overview of the movement of natural
  persons travelling abroad across the Estonian border. A foreign trip is a trip of
  a resident of one country to another country, the trip lasts no longer than one
  year and the main purpose of the trip is not a paid activity or long-term studies
  in the country of destination. The data have been found using statistical models
  with input from the anonymous mobile positioning method data on the movement of
  passengers across the Estonian border.
