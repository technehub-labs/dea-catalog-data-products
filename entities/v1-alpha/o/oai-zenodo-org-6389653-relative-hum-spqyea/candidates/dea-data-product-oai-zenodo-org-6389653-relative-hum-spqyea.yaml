id: dea:data-product-oai-zenodo-org-6389653-relative-hum-spqyea
type: DataProduct
name: Relative Humidity from Copernicus Essential Climate Variables for July months
  from 1980 to 2018
description: This dataset can be used if you have issues with the Essential Climate
  Variables Galaxy Tool for the Training "Getting your hands-on climate data" in the
  section "Essential Climate Variables". You can then upload this dataset in your
  Galaxy history and skip the 1st step (Copernicus Essential Climate Variables) and
  directly start with 2. map plot gridded (lat/lon) netCDF data.
