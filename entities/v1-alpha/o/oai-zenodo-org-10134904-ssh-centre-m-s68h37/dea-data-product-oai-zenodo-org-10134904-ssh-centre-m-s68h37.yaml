name: 'SSH CENTRE - Mini-reports : Focus groups on "Adaptation to Climate Change:
  support at least 150 European regions and communities to become climate resilient
  by 2030"'
description: 'SSH CENTRE (Social Sciences and Humanities for Climate, Energy aNd Transport
  Research Excellence) is a Horizon Europe project, engaging directly with stakeholders
  across research, policy, and business (including citizens) to strengthen social
  innovation, SSH-STEM collaboration, transdisciplinary policy advice, inclusive engagement,
  and SSH communities across Europe, accelerating the EU''s transition to carbon neutrality.
  SSH CENTRE is based in a range of activities related to Open Science, inclusivity
  and diversity – especially with regards Southern and Eastern Europe and different
  career stages – including: development of novel SSH-STEM collaborations to facilitate
  the delivery of the EU Green Deal; SSH knowledge brokerage to support regions in
  transition; and the effective design of strategies for citizen engagement in EU
  R&I activities. Outputs include action-led agendas and building stakeholder synergies
  through regular Policy Insight events. This is captured in a high-profile virtual
  SSH CENTRE generating and sharing best practice for SSH policy advice, overcoming
  fragmentation to accelerate the EU''s journey to a sustainable future. The aim of
  the focus groups was to gather citizen''s perspectives, their hopes, concerns and
  ideas related to the Horizon Mission of Adaptation to Climate Change: support at
  least 150 European regions and communities to become climate resilient by 2030.
  The focus group discussion topics while remaining close to the Mission, avoid specific
  technical references to allow citizens to contribute based on their differing levels
  of understanding. As part of the SSH CENTRE project, in total, four focus group
  series will be conducted relating to Adaptation to Climate Change; Restore our Ocean
  and Waters by 2030; 100 Climate-Neutral and Smart Cities by 2030; A Soil Deal for
  Europe. Notes were taken during each focus groups and turned into mini-reports.
  These mini-reports sum up the essence of the discussion: the participants'' main
  ideas and som'
