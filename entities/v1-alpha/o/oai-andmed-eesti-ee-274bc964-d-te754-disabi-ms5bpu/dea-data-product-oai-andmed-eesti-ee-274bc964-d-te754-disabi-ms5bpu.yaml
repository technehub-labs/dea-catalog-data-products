type: DataProduct
name: 'TE754: Disability free life expectancy by sex, age and educational level'
description: 'The dataset shows the number of disability free life expectancy by education
  (first level education or lower, second level education, third level education),
  age (0, 65-69), sex and year. The purpose of collecting these data is to provide
  a standard population health indicator for monitoring trends over time and comparing
  population groups and regions. Data source: Statistics Estonia'
