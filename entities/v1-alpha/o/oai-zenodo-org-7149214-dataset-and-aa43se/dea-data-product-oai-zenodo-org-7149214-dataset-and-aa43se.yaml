type: DataProduct
name: Dataset and codes for 'Climatic control on seasonal variations of glacier surface
  velocity'
description: 'This repository contains the codes and processed data used to retrieve
  10-day changes in glacier surface velocity over the Western Pamir. The supp_CODES.zip
  contains all details and codes to use COSI-CORR (http://www.tectonics.caltech.edu/slip_history/spot_coseis/)
  to process a large batch of satellite images. The images can be downloaded directly
  via https://earthexplorer.usgs.gov/ or https://scihub.copernicus.eu. Please read
  the Methods and Data section of the associated manuscript for details. The Matrix_velocities.zip
  contains, for each of the 48 investigated glaciers, the DEM, X, Y (NANNI_2022_supp_glacier_centreline_DEM_XY_1px_30m_1.txt)
  as well as a matrix of n*m with m the distance along flow and n the number of time
  step over which the velocity is calculated (NANNI_2022_supp_glacier_centreline_vel_matrix_1px_30m_1.txt),
  ans the associated figure that show the multi year velocity changes together with
  the one year average and the along centreline profiles. An example is shown in the
  two figures for glacier 48 in the main repository. The NANNI_2022_supp_glacier_characteristics
  file contains the glacier characteristics (48*8), as shown in the associated figures.
  The NANNI_2022_supp_pickedpoints_migration_AUTUMN/SPRING contains the automatically
  picked points for the onset of the acceleration in Spring and Autmun for each glacier.
  The headers contains the information, and the files contains is shown in the associated
  figure. the temperature profiles used to calculate the Iso 0C are in NANNI_2022_supp_temp_perday_fedchenko_2400m
  The position of each 48 glacier is shown in the associated figure. You can also
  find the processed velocity fields (velocity magnitude) under the different path
  an row: p151r33.zip and p152r33.zip for Landsat8, T42SYJ.zip and T43SBD.zip for
  Sentinel 2. In these folder you will a find a .tif file names similar to: Working_cosicorr_windows_FCorr_16days_p152r33_159_175_AB_1101110_Filtered_correlations_p152r33_filtered_abs.tif
  The name of th'
