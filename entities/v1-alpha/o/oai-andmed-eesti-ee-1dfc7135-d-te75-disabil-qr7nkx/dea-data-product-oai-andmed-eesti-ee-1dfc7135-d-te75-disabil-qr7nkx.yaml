type: DataProduct
name: 'TE75: Disability free life expectancy by sex and age group'
description: 'The dataset shows the number of years of healthy life expectancy by
  age group (including 0, 1-4, 5-9, 10-14, 15-19, 20-24, 25-29, 30-34, 35-39 to 85
  and older), sex and year. The purpose of collecting these data is to provide a standard
  population health indicator for monitoring trends over time and comparing population
  groups and regions. Data source: Statistics Estonia'
