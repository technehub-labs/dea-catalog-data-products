type: DataProduct
name: National Access Point (NAP) Sweden
description: Traffic-related metadata platform to comply with the EU ITS Directive.
  Under this Directive and the accompanying Swedish Ordinance, the Swedish Transport
  Administration is obliged to provide a National Access Point for Data (NAP). The
  Swedish Transport Administration's access point is called Trafficdata.se. The platform
  contains both the Swedish Transport Administration's and other authorities' and
  private actors' metadata for relevant data sets.
