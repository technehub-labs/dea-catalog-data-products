id: dea:data-product-business-demography-business-dem-9wucm3
type: DataProduct
name: Business Demography
description: 'Business demography data counts numbers of active businesses with turnover
  or employment in a reporting year. It also indicates numbers of new businesses (business
  births) and numbers of businesses terminated (business deaths) during the reporting
  year. Numbers and percentages of businesses that were newly created during years
  leading up to the latest reporting year, and which were still surviving, are also
  shown. When using the data, comparative business birth or death rates may be constructed
  adhoc if needed, by dividing the number of births or deaths by the number of active
  businesses. Please note that due to being required early in the reporting cycle,
  numbers of business deaths are provisional and may be subject to later revision.
  For more information about the dataset and its methodology, see the source link.
  Source: Office for National Statistics (ONS)'
