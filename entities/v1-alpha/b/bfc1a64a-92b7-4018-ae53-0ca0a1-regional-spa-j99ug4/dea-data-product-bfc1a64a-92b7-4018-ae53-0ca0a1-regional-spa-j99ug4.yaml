name: Regional spatial planning programme for the greater Braunschweig area 2008 -
  Agriculture - reserved area Agriculture (due to special functions of agriculture)
description: 'This dataset contains the reserved areas of agriculture (due to special
  functions of agriculture) according to the drawing of the regional spatial planning
  programme for the greater Braunschweig area in the version of 2008. The statutes
  on the establishment of the Regional Spatial Planning Programme for the Greater
  Braunschweig Area 2008 were adopted by the Association Assembly of the Greater Braunschweig
  Area Association on 20 December 2007. Pursuant to Section 8(6) of the Lower Saxony
  Act on Spatial Planning and Regional Planning (NROG), as amended on 7 June 2007
  (Nds. GVBl. 223), the Lower Saxony Ministry of Food, Agriculture, Consumer Protection
  and Regional Development - Government Representation Braunschweig - as the highest
  regional planning authority, has adopted the Regional Spatial Planning Programme
  2008 for the greater Braunschweig area by decree of 30 April 2008 - ref.: RV BS
  1.4-20303/ZGB2008 approved. The Regional Spatial Planning Programme 2008 for the
  greater Braunschweig area will enter into force on 1 June 2008. The Regional Spatial
  Planning Programme 2008 defines the intended spatial and structural development
  of the greater Braunschweig area. The district-free cities of Braunschweig, Salzgitter
  and Wolfsburg as well as the districts of Gifhorn, Goslar, Helmstedt, Peine and
  Wolfenbüttel belong to the association area of the greater Braunschweig area.'
