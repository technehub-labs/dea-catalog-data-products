name: 'Better Health for London: One Year On'
description: '<dp-prose> <p>This data outlines the latest data measuring the 10 key
  aspirations for London''s Health as part of the overarching goal to make London
  the world''s healthiest major global city. This page contains the initial baseline
  data published in 2014 in the report "<a target="_blank" rel="noopener noreferrer
  nofollow" href="https://www.london.gov.uk/business/better-health-london-next-steps">Better
  Health for London: Next Steps</a>", and updates these with more recent data and/or
  breaks these down by London Borough where these data are available.</p> <p>Better
  Health for London: Next Steps has been developed with London Councils, the GLA,
  London CCGs and the London regional teams of Public Health England and NHS England.</p>
  <p><a target="_blank" rel="noopener noreferrer nofollow" href="https://www.youtube.com/watch?v=TdLU7bEbTHA">Watch
  the Video relating to the report</a></p> </dp-prose>'
