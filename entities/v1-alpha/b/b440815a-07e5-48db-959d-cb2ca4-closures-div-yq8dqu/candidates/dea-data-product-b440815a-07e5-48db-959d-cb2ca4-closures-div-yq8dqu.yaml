id: dea:data-product-b440815a-07e5-48db-959d-cb2ca4-closures-div-yq8dqu
type: DataProduct
name: Closures / Diversions Hiking trails and "Hiking in Switzerland"
description: 'The dataset contains trail closures and detours on the hiking trail
  network and the routes of "Hiking in Switzerland" of Switzerland and the Principality
  of Liechtenstein, which have been announced to the Swiss Hiking Federation and their
  Cantonal Hiking Associations. It complements the "Hiking trails" geodata (swissTLM3D
  Hiking trails) and the "Hiking in Switzerland" geodata (Non-motorised transport
  – Wanderland Schweiz), and is managed by the Federal Roads Office FEDRO, the Federal
  Office of Topography swisstopo, the Swiss Hiking Federation, SwitzerlandMobility
  and the cantons. No liability is accepted for the accuracy, completeness or up-to-dateness
  of the route and trail data, and any liability for the use of this data is excluded.
  Link to the disclaimer: https://www.schweizer-wanderwege.ch/de/hinweis-zur-unvollstaendigkeit-der-daten/note-on-the-comprehensiveness-of-the-data'
