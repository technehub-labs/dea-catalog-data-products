id: dea:data-product-bd038d32-cec5-4899-9817-c507c9-climate-anal-c9rqke
type: DataProduct
name: Climate analysis map night overheating
description: 'The climate analysis map night overheating shows the heat island effect,
  the cold air volume flow density and the cold air guideways. The heat island effect
  represents the predominant overheating in the settlement area relative to the surrounding
  area (unit: °C). The cold air volume density indicates the amount of cold air flowing
  through a 1 m wide strip per second. This determines on the one hand the wind speed
  and on the other hand the vertical width of the flow (unit: m3). Cold air pipelines
  show cold air flows that are able to supply settlement areas with cold air. This
  means that cold air-carrying open spaces are connected to settlement areas by the
  cold air guideways, resulting in cold air exposure areas in the settlement area
  (unit: directional arrows).'
