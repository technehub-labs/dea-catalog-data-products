id: dea:data-product-birth-estimates1-birth-estima-24v3mt
type: DataProduct
name: Birth estimates
description: '<dp-prose> <p>Time series of official live birth estimates for local
  authority districts and selected higher geographies in England and Wales from 1991-92
  onward. Data are collated from the following sources:</p> <ol> <li> <p><a href="https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/datasets/populationestimatesforukenglandandwalesscotlandandnorthernireland">ONS
  mid-year population estimates components of change</a> - local authority births
  for mid-year periods from 2001-2 onward</p> </li> <li> <p><a href="https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/adhocs/009628birthsanddeathsbylowersuperoutputarealsoaenglandandwales1991to1992to2016to2017">Births
  and deaths by Lower Super Output Area (LSOA), England and Wales, 1991 to 1992 to
  2016 to 2017</a> - ad hoc release of births by (2011) LSOA for mid-year periods
  from 1991-92 to 2016-17</p> </li> <li> <p><a href="https://www.nomisweb.co.uk/query/construct/summary.asp?mode=construct&amp;version=0&amp;dataset=206">Live
  births in England and Wales for small geographic areas</a> - births by (2011) LSOA
  for calendar year period from 2013 onward.</p> </li> </ol> <p>While calendar year
  births data for local authorities is available for local earlier periods from the
  <a href="https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/livebirths/datasets/birthsummarytables">ONS
  website</a>, this data has not yet been included here due to the complications caused
  by:</p> <ol> <li> <p>the lack of geography codes accompanying the data for the years
  of interest</p> </li> <li> <p>the decision to combine data for Hackney and City
  of London, and Cornwall and the Isles of Scilly</p> </li> <li> <p>inconsistent formatting
  of the published tables</p> </li> </ol> <p>A respository of the code used to collate
  these data is available on GitHub at: <a href="https://github.com/Greater-London-Authority/collate-birth-data">https://github.com/Greater-'
