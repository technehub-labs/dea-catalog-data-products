type: DataProduct
name: Museum Standards Programme for Ireland
description: The Heritage Council’s main commitment to collections care comes through
  its support of the Museum Standards Programme for Ireland (MSPI). This important
  initiative, with participants from a wide range of Irish collecting institutions,
  sets out to raise standards of care across Irish museums and galleries. This programme
  sets out to improve all aspects of Ireland’s museum practice. This dataset provides
  information on participants in this programme.
