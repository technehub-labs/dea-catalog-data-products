id: dea:data-product-bbcb14b0-0f12-47ad-890e-113d6e-udp-progress-t6dbne
type: DataProduct
name: UDP - Progress of tourism recovery
description: 'This descriptor measures the degree of fall and recovery of tourism
  demand after the breakout of the COVID-19 pandemic. It is calculated as the proportion
  of nights spent in a given year in relation to the equivalent period in 2019 (baseline).
  A higher value is equivalent to a higher level of tourism demand recovery and may
  be an indication of the resilience of the tourism destination. UNIT OF MEASURE:
  %. RESOLUTION: NUTS0, NUTS2. COMPLETENESS: 100%. METHODOLOGY: It is calculated as
  the proportion of nights spent in a given year (or part of a year) in relation to
  the equivalent period in 2019 (baseline). DATA SOURCES: ESTAT (tour_occ_nin2).'
