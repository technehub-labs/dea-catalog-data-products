id: dea:data-product-be7ec19e-0e03-49ea-bff7-5fc020-climate-chan-8nfa6t
type: DataProduct
name: Climate Change Regional Indicators of Change and Extremes for Europe
description: 'Indicators of climate change and extremes from regional models coming
  from 3 sources: PRUDENCE project of the Danish Meteorological Institute, consortial
  simulation of the Climate Limited-area Modelling (CLM) Community, 12 runs of bias-corrected
  data from the ENSEMBLES project. Datasets refer to Temperature, Precipitation, Precipitation
  intensity, Relative Humidity, Aridity Index, HUMIDEX, Heat wave plus statistical
  indicators such as Min, Max, Percentiles and Standard deviation.'
