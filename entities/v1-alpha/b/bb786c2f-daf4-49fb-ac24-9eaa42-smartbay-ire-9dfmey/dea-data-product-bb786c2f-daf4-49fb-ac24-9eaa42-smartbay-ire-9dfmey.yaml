id: dea:data-product-bb786c2f-daf4-49fb-ac24-9eaa42-smartbay-ire-9dfmey
type: DataProduct
name: SmartBay Ireland Galway Bay Buoy Wave
description: 'This data comprises wave data collected from the SmartBay buoy moored
  in Galway Bay. The TRIAXYS Directional Wave Sensor collects wave data and returns
  the following parameters: No Zero Crossings (Number) HAvg (Average Wave Height)
  (Meters) Tz (Mean Spectral Period) (Seconds) HMax (Max Wave Height) (Meters) HSig
  (Significant Wave Height) (Meters) TSig (Significant Period) (Seconds) H10 (Meters)
  T10 (Seconds) TAvg (Mean Wave Period) (Seconds) TP (Peak Period) (Seconds) TP5 (Seconds)
  HMO (Meters) Mean Direction (Degrees) Mean Spread (Degrees) The TRIAXYS Directional
  Wave Sensor is comprised of three accelerometers and three rate sensors that ultimately
  measure the total displacement along the three orthogonal axes of the floating platform.
  In addition, this sensor is equipped with a gimballed fluxgate compass to measure
  true magnetic direction.'
