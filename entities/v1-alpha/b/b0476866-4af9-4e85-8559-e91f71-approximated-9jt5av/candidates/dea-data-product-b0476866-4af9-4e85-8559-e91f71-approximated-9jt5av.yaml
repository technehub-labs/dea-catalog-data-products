id: dea:data-product-b0476866-4af9-4e85-8559-e91f71-approximated-9jt5av
type: DataProduct
name: Approximated estimates for the share of gross final consumption of renewable
  energy sources, 2023
description: The EU formally adopted an update of the Renewable Energy Directive (EU)
  2018/2001 in October 2023 that, among other measures, increases the binding 2030
  target from 32% to 42.5%, with the aim of achieving 45%. Since early access to the
  most recent information on the growth of RES is relevant for all stakeholders, the
  EEA and its European Topic Centre for Climate Change Mitigation and Energy (ETC/CME)
  produce each year a set of early estimates concerning the RES shares achieved by
  the countries and the EU as a whole in the previous year. The current data set concerns
  the EEA 2023 RES share proxies. The cut-off date for most data sources incorporated
  in the calculation of the approximated RES shares is 31 August of the publication
  year.
