id: dea:data-product-bd-l-tc-version-2008-1-bd-l-tc-2008-dfxr3y
type: DataProduct
name: BD-L-TC (2008 version)
description: 'It is a topo-cartographic database covering the entire territory of
  the Grand Duchy of Luxembourg. Data from the BD-L-TC (2008 version) are structured
  into 7 themes: - road communication lanes - railways and energy transport - hydrography
  - Miscellaneous buildings and equipment - vegetation - orography - altimetry Each
  theme is subdivided into several classes of objects of punctual, linear and surface
  type corresponding to a layer. Some classes of objects are characterised by one
  or more attributes, for example: nature, classification, toponym etc. The data of
  the BD-L-TC are carried out by photogrammetric restitution, followed by a completely
  carried out in the field. The topographic database is available in Shapefile format.
  Date of completion: 2008 (based on 2006 overview) Datum-Projection: LUREF / EPSG2169'
