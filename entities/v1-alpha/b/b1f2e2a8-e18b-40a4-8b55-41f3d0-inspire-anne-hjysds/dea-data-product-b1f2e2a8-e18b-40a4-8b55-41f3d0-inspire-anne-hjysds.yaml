type: DataProduct
name: INSPIRE - Annex II Theme Land Cover - Land Parcel Identification System (LPIS)
  - Ecological Focus Areas (EFA) - Forest edges
description: '6-meter strips in the LPIS reference parcels along forest edges. The
  forest edges layer is one of the Ecological Focus Areas (EFA) layers with serves
  to attribute forest edges to land parcels declared in the geospatial aid application
  GSAA. These areas are taken into account in the framework of the Greening scheme
  [Article 46 of Regulation (EU) No 1307/2013] and Agri-Environment-Climate-Measures
  (AECM) [Article 28 of Regulation (EU) No 1305/2013]. Ecological Focus Areas (EFA)
  are areas designated to bring about benefits for the environment, improve biodiversity
  and maintain attractive landscapes. EFAs may include landscape features, buffer
  strips, catch crops, fallow land, areas with nitrogen fixing crops etc. The forest
  edges layer is part of the Land Parcel Identification System (LPIS). LPIS is a key
  component of the IACS. It is an IT system based on ortho imagery (aerial or satellite
  photographs) which records all agricultural parcels in the Member States. It serves
  two main purposes: to clearly locate all eligible agricultural land contained within
  reference parcels and to calculate their maximum eligible area (MEA). The LPIS is
  used for cross checking during the administrative control procedures and as a basis
  for on the spot checks by the paying agency. Disclaimer : The original source data
  represented forest edges as line geometries.To comply with INSPIRE specifications,
  the line geometries have been converted into polygon geometries. Forest edges were
  therefore represented as polygons generated from a 6 m inward buffer that is strictly
  constrained within FLIK parcel boundaries. If a forest edge does not intersect any
  FLIK parcel, it is disregarded and excluded from the output dataset.'
