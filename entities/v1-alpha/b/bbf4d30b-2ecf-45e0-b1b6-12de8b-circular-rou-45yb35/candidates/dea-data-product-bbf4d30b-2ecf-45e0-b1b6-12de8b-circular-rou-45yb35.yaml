name: Circular route Winterthur
description: The dataset Rundweg Winterthur contains the geodata of the approximately
  70 kilometre long circular route along the city boundary of Winterthur. It includes
  the hiking trail stages, complementary cycle path and obstacle-free sections as
  well as points of interest and important waypoints along the route.
