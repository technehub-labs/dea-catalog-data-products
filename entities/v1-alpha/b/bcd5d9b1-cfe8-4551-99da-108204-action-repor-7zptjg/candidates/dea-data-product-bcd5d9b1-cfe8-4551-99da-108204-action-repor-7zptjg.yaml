type: DataProduct
name: Action report for a socially and climate-friendly mobility transition.
description: In the report on measures for a socially and climate-friendly mobility
  transition on behalf of the Federal Ministry for Climate Protection, the Environment,
  Energy, Mobility, Innovation and Technology (BMK), the Federal Environment Agency
  examined 13 possible individual measures to reduce greenhouse gas emissions from
  the transport sector. In addition to the savings potential, the measures were subjected
  to a comprehensive acceptance analysis, in the context of which survey participants
  were to put together their preferred package of measures, among other things. Selected
  measures were also examined with regard to their macroeconomic effects, e.g. on
  value added and employment in Austria. The action report serves as a technical basis
  for national decision-making processes for the greening of the transport sector
  from an economic and social science point of view.
