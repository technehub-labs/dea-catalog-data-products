type: DataProduct
name: Involuntary part-time employment analysis for quarter four in 2008, 2013, 2014
description: 'An analysis of part-time workers who would like to be in full-time employment.
  Their part-time employment is involuntary based on views recorded in the Labour
  Force Survey. These individuals in part-time jobs are either seeking more hours,
  looking for an additional job or looking for a replacement role. The UK Labour Force
  Survey covers Great Britain and Northern Ireland. This analysis is a small ad-hoc
  piece produced by BIS analysts. It is one of many occasional statistical publications
  generated by the department. Further publications can be located by following this
  link: https://www.gov.uk/government/collections/bis-occasional-statistics'
