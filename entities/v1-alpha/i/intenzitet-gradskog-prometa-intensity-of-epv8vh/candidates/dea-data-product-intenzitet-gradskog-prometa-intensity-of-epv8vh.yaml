type: DataProduct
name: Intensity of urban traffic
description: As part of the SUMBooST project, the City of Rijeka together with the
  Faculty of Transport and Traffic Sciences and Ericsson Nikola Tesla launched a project
  to improve urban traffic. The aim is to identify potential urban mobility measures
  that would encourage a shift to sustainable forms of transport between problematic
  transport zones, such as rail, public transport of buses, cable cars, classic or
  electric bicycles. These are the first results of analyses, and they show car, public
  city and total traffic by zones and by hours. https://www.rijeka.hr/gradska-uprava/eu-projekti/završeni-projekti/sumboost/
