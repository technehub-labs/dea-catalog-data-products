type: DataProduct
name: Education Inferior Public of the city of Matera A.S. 2015-2016
description: The dataset contains the number of pupils of the Public Infant, Primary
  and Lower Middle Schools grouped by classes and school complexes with their addresses
  and geographical coordinates. It is also necessary to specify that the data of the
  Secondary School of First Degree "Nicola Festa" of Via Lanera n.59 also includes
  three classes for a total of 61 students (one first, a second and a third) who for
  logistical reasons are located at the plexus of Via Francesco D'Alessio (commonly
  known as the school of Via Antonio Cappelluti). Example on [__Map__](http://www.arcgis.com/home/webmap/viewer.html?webmap=9599898ef62847d5adddda749cc06320)
