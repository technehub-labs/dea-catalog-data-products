type: DataProduct
name: Survey on Educational-Training Transition and Labor Market Insertion (ETEFIL_ESO_2019).
  Students who successfully completed compulsory secondary education (ESO) in 2013-14.
  Restricted access rights.
description: Confidential dataset for scientific purposes from the Survey on Educational-Training
  Transition and Labor Market Insertion (ETEFIL_ESO_2019) regarding students who successfully
  completed compulsory secondary education (ESO) in 2013-14. The survey aims to provide
  information on the subsequent educational path of individuals who have completed
  secondary education and vocational training, as well as various aspects of their
  labour market insertion process—namely, the transition from education and training
  to the labour market.
