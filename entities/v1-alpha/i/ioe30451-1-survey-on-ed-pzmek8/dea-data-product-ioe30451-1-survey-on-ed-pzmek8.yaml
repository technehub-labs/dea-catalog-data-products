type: DataProduct
name: Survey on Educational-Training Transition and Labor Market Insertion (ETEFIL_AESO_2019).
  Students who left compulsory secondary education (ESO) in 2013-14. Restricted access
  rights.
description: Confidential dataset for scientific purposes from the Survey on Educational-Training
  Transition and Labor Market Insertion (ETEFIL_AESO_2019) regarding students who
  left compulsory secondary education (ESO) in 2013-14. The survey aims to provide
  information on the subsequent educational or training path of these individuals,
  as well as various aspects of their labor market insertion process—namely, the transition
  from early school leaving or compulsory education to the labor market.
