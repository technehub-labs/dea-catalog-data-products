id: dea:data-product-ioe30451-3-survey-on-ed-qmppnn
type: DataProduct
name: Survey on Educational-Training Transition and Labor Market Insertion (ETEFIL_GM_2019).
  Intermediate Vocational Training graduates in 2013-14. Restricted access rights.
description: Confidential dataset for scientific purposes from the Survey on Educational-Training
  Transition and Labor Market Insertion (ETEFIL_GM_2019) regarding Intermediate Vocational
  Training graduates in 2013-14. The survey aims to provide information on the subsequent
  educational path of individuals who have completed these vocational training studies,
  as well as various aspects of their labor market insertion process—namely, the transition
  from intermediate technical training to the labor market.
