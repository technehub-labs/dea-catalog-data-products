type: DataProduct
name: 'Special Eurobarometer 322: Europeans''attitudes towards climate change'
description: 'This report presents the results of a survey on the attitudes of Europeans''
  towards climate change which was carried out in late August and September 2009.
  This survey mapped the opinion of Europeans on a range of climate change related
  topics, and in particular covers: covers 31 countries or territories: The 27 EU
  Member States, the three candidate countries (Croatia, the Former Yugoslav Republic
  of Macedonia and Turkey) and the Turkish Cypriot Community in the area not controlled
  by the government of the Republic of Cyprus. It was commissioned by the Directorate-
  General Communication of the European Commission and was carried out by TNS Opinion
  & Social, a consortium formed by TNS and EOS Gallup Europe. ♦ Respondents’ perceptions
  of climate change in relation to other world problems. ♦ Respondents’ perceptions
  of the seriousness of climate change. ♦ Respondents’ perceptions about the actions
  of local, national governments as well as the EU in combating climate change ♦ Respondents''
  attitudes towards alternative fuels and CO² emissions. ♦ Whether respondents feel
  that climate change is stoppable or has been exaggerated, and what impact it has
  on the European economy. ♦ Whether respondents have taken personal action to fight
  climate change, and what those actions are. ♦ Perceived relative importance of the
  economy and the environment ♦ Europeans’ willingness to pay more for greener energy
  #####The results by volumes are distributed as follows: * Volume A: Countries *
  Volume AA: Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends
  of groups of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends
  of EU/ socio-demographics * Volume C: Country/socio-demographics ---- Researchers
  may also contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
