id: dea:data-product-statutory-plant-health-notices-statutory-pl-mzc37t
type: DataProduct
name: Statutory Plant Health Notices - Scotland
description: 'This layer shows the distribution of Statutory Plant Health Notices
  (SPHN) issued in Scotland by Scottish Forestry. A Statutory Plant Health Notice
  (SPHN) is a legal Notice requiring landowners to take certain steps to prevent the
  establishment or spread of a controlled plant pest. Each SPHN states what the landowner
  must do, where they must do it, and within what time frame. Find out more about
  SPHNs on our webpage ''Legislation for tree health'', linked below. The layer includes
  SPHNs issued for any regulated pest or disease. At present, in Scotland, the majority
  of SPHNs are issued to limit the spread of the regulated non-quarantine pest Phytophthora
  ramorum. Our approach to managing the disease, including our Action Plan, is described
  on our website ''Ramorum disease'', linked below. Each SPHN is displayed as a polygon
  defining the furthest extent to which any SPHN condition applies. Note that some
  conditions may apply to a smaller target area within that boundary. Dataset Attributes:
  SPHN Reference: A unique reference number given to each SPHN SPHN Status: Currently
  recorded SPHN status. Issued: Conservancy have issued the SPHN meaning it is active.
  Withdrawn: an SPHN was issued but then withdrawn and no conditions now apply, for
  example in response to legislative change. Closed: the SPHN is no longer active.
  Pest or Disease: Species of tree pest or disease the SPHN was issued to control.
  Primary Host Species: Primary host species found infected by the pest or disease
  within the SPHN. Primary Host Area (ha): Area (in hectares) of the primary host
  species included within the SPHN. Year Issued: Year the SPHN was issued in. Conservancy:
  Scottish Forestry Conservancy that issued the SPHN. FLS Land: SPHN is located on
  land managed by Forestry and Land Scotland. P. ramorum Policy Zone: This field only
  applies to SPHNs issued under our current Action Plan for Phytophthora ramorum.
  There are two policy Zones for Priority Action or Risk Reduction. Zones were introduced
  in 2'
