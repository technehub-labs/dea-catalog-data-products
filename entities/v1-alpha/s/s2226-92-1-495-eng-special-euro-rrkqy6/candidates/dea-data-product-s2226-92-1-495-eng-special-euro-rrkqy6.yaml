name: 'Special Eurobarometer 495: Mobility and transport'
description: 'The Directorate-General for Mobility and Transport conducted a survey
  in the European Union Member States between 11 and 29 September 2019 to explore
  a range of factors relating to mobility, including daily and longer-distance travel
  amongst Europeans. #####The results by volumes are distributed as follows: * Volume
  A: Countries * Volume AA: Groups of countries * Volume A'' (AP): Trends * Volume
  AA'' (AAP): Trends of groups of countries * Volume B: EU/socio-demographics * Volume
  B'' (BP) : Trends of EU/ socio-demographics * Volume C: Country/socio-demographics
  ---- Researchers may also contact GESIS - Leibniz Institute for the Social Sciences:
  [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
