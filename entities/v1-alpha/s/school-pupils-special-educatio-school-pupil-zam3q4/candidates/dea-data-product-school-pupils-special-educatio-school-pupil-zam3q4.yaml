id: dea:data-product-school-pupils-special-educatio-school-pupil-zam3q4
type: DataProduct
name: School Pupils with Special Educational Needs (SEN)
description: 'This dataset shows numbers and percentages of pupils on roll in Lincolnshire
  schools who have Special Educational Needs (SEN). Indicators are included to show
  whether the outcome is in the form of Support (SEN-K) or an Education, Health and
  Care Plan (SEN-E). The dataset covers current and main pupils on the roll of schools
  in Lincolnshire, and includes Gender breakouts. Pupils are allocated to geographical
  areas (such as Wards and NHS Clinical Commissioning Groups) based on home address.
  Figures shown in the data as ‘Out of County’ represent pupils not resident within
  the Lincolnshire administrative boundary. Those are included in the Lincolnshire
  total. Data is suppressed where appropriate 5 persons and below (which may be shown
  as zero or by missing data). That and any unmatched postcodes may mean numbers for
  small areas might not add up exactly to figures shown for larger areas. Data is
  from the Schools Census and shows a snapshot in January and is updated annually.
  Data source: Lincolnshire County Council Children''s Services. For any enquiries
  about this publication contact: schoolcensus@lincolnshire.gov.uk'
