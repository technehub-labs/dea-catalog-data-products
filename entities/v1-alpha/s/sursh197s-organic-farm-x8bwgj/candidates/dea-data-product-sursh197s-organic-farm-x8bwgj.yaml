name: Organic farming, Slovenia, annually
description: This collection automatically captures metadata sourced from the GOVERNMENT
  OF THE REPUBLIC OF SLOVENIA STATISTICAL OFFICE OF THE REPUBLIC OF SLOVENIA and corresponds
  to the source collection entitled "Organic farming, Slovenia, annually". The actual
  data is available in PC-Axis (.px) format. Among the additional links, you can access
  the page of the source portal for insight and selection of data, and there is also
  the PX-Win program, which can be downloaded for free. Both allow you to select data
  for display, change the printout format and store it in different formats, as well
  as view and print tables of unlimited size and some basic statistical analyses and
  graphical representations.
