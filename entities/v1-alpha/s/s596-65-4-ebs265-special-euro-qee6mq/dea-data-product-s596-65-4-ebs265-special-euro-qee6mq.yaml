type: DataProduct
name: 'Special Eurobarometer 265: Medical and health research'
description: 'The Directorate General for Research commissioned the Eurobarometer
  special study on medical and health research. The study was carried out between
  7 June and 12 July 2006 among 24,796 people in the 25 European Union Member States
  as well as in the acceding countries (Bulgaria and Romania). In Turkey and Croatia,
  the study was carried out between 17 November and 19 December among 2,005 respondents
  that same year. The study’s aims were in particular: - to measure the level of awareness
  among European citizens of European collaborative research projects on biological
  and medical issues and their awareness of European Union co-funding. Furthermore
  the study sought to put this information in the more general context of citizens´
  interest in science and technology and biological and medical research, also taking
  into account personal and socio-economic factors; - to identify factors which raise
  awareness of European collaborative research projects on biological and medical
  issues and of European co-funding, - to generally contribute to improving the strategy
  of promoting those research projects which are funded by the European Union. Furthermore,
  in the last part of this study we analyse three different groups of citizens: -
  those aware of European biological and medical research projects and the fact that
  they are co-funded by the EU, -those not aware of the projects but who are interested
  in the field of science and medical research, - those not aware of the projects
  and who also have no interest in the field of science and medical research. #####The
  results by volumes are distributed as follows: * Volume A: Countries * Volume AA:
  Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups
  of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/
  socio-demographics * Volume C: Country/socio-demographics ---- Researchers may also
  contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](h'
