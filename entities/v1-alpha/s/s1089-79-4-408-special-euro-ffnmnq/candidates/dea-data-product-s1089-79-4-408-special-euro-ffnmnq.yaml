id: dea:data-product-s1089-79-4-408-special-euro-ffnmnq
type: DataProduct
name: 'Special Eurobarometer 408: Social Climate'
description: 'The Special Eurobarometer on social climate monitors perceptions of
  the economic situation of households, of the national economy and social protection.
  It covers 15 areas, e.g. personal financial situation, affordability of housing,
  health care provision, the way national governments address inequalities and poverty
  and the perceived changes to the cost of living. This is the 5th wave following
  the 1st conducted in 2009 (Special EB 315), the 2nd in 2010 (Special EB 349), the
  3rd in 2011 (Special EB 370) and the 4th in 2012 (Special EB 391). The EU27 social
  climate index went down slightly in 2013 to reach the lowest figure since 2009,
  masking substantial differences between Member States. #####The results by volumes
  are distributed as follows: * Volume A: Countries * Volume AA: Groups of countries
  * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of countries * Volume
  B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics *
  Volume C: Country/socio-demographics ---- Researchers may also contact GESIS - Leibniz
  Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
