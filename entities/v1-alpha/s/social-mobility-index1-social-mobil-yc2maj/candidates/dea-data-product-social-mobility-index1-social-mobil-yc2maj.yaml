id: dea:data-product-social-mobility-index1-social-mobil-yc2maj
type: DataProduct
name: Social mobility index
description: '<p>The social mobility index of England sets out the differences between
  where children grow up and the chances they have of doing well in adult life.</p>
  <p>More details available at: <a href="https://www.gov.uk/government/publications/social-mobility-index">https://www.gov.uk/government/publications/social-mobility-index</a></p>
  <p>The Social Mobility Index compares the chances that a child from a disadvantaged
  background will do well at school and get a good job across each of the 324 local
  authority district areas of England. It examines a range of measures of the educational
  outcomes achieved by young people from disadvantaged backgrounds and the local job
  and housing markets to shed light on which are the best and worst places in England
  in terms of the opportunities young people from poorer backgrounds have to succeed.</p>
  <p>Please take a look at our interactive atlas spine chart, where you can discover
  how all the English districts, unitaries and boroughs ranked, as well as the data
  scores behind the ranks. <a href="http://atlas.cambridgeshire.gov.uk/SocialMobilityIndex/atlas.html">http://atlas.cambridgeshire.gov.uk/SocialMobilityIndex/atlas.html</a></p>'
