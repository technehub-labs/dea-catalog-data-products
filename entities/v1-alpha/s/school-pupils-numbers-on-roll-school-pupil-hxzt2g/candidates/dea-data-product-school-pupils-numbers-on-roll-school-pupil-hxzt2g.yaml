id: dea:data-product-school-pupils-numbers-on-roll-school-pupil-hxzt2g
type: DataProduct
name: School Pupils Numbers on Roll, and Free School Meals
description: 'This dataset shows: • Pupil Numbers on Roll (NOR) in Lincolnshire schools.
  NOR is the total number of pupils on school rolls. • Pupils receiving Free School
  Meals, numbers and percentages. The dataset covers current and main pupils on the
  roll of schools in Lincolnshire, and includes Gender breakouts. Pupils are allocated
  to geographical areas (Wards and NHS Clinical Commissioning Groups) based on home
  address. Figures shown in the data as ‘Out of County’ represent pupils not resident
  within the Lincolnshire administrative boundary. Those are included in the Lincolnshire
  total. Data is suppressed where appropriate 5 persons and below (which may be shown
  as zero or by missing data). That and any unmatched postcodes may mean numbers for
  small areas might not add up exactly to figures shown for larger areas. Data is
  from the Schools Census and shows a snapshot in January. It is updated annually.
  Data source: Lincolnshire County Council Childrens Services. For any enquiries about
  this publication contact: schoolcensus@lincolnshire.gov.uk'
