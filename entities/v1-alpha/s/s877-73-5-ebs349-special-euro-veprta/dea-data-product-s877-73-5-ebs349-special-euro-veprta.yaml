id: dea:data-product-s877-73-5-ebs349-special-euro-veprta
type: DataProduct
name: 'Special Eurobarometer 349: Social climate'
description: 'This report presents the results of a Eurobarometer survey on social
  climate, collecting views of some 1,000 people in each country. This survey not
  only measures how Europeans perceive the current recession and its social impact,
  but also reveals interesting differences between countries which seem to reflect
  the strengths and weaknesses of national policies and institutions. The first wave
  of this special Eurobarometer was conducted one year ago, eight months after the
  start of the financial and economic crisis. 1. The first group concerns the personal
  situation of the respondents including their satisfaction with life in general,
  with the area where they live, with their personal job situation and with the financial
  situation of their households. 2. The second set covers the general situation of
  the country and includes the cost of living, the affordability of energy and of
  housing, the quality of public administration, and the general employment and economic
  situation. 3. The third set focuses on social protection and social inclusion in
  the country and contains questions on health care provision, pensions, unemployment
  benefits, the way inequalities and poverty are addressed and relations between people
  from different cultural or religious backgrounds. #####The results by volumes are
  distributed as follows: * Volume A: Countries * Volume AA: Groups of countries *
  Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of countries * Volume
  B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics *
  Volume C: Country/socio-demographics ---- Researchers may also contact GESIS - Leibniz
  Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
