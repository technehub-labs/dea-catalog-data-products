id: dea:data-product-s2184-467-eng-flash-euroba-pybayy
type: DataProduct
name: 'Flash Eurobarometer 467: The use of the collaborative economy'
description: 'Further to our commitment in the June 2016 Communication on the collaborative
  economy, we have carried out a second Flash Eurobarometer to identify citizens''
  perceptions, attitudes and practices in relation to the collaborative economy. The
  survey provides an overview of the citizens'' awareness and frequency of use of
  collaborative platforms (both as users and services providers), as well their assessment
  of the advantages and disadvantages of using such platforms. Moreover, the survey
  also explores the reasons for which some citizens do not use collaborative platforms,
  and includes an analysis of the impact of collaborative platforms on the users''
  behaviour with respect to purchasing services via traditional channels. #####The
  results by volumes are distributed as follows: * Volume A: Countries * Volume AA:
  Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups
  of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/
  socio-demographics * Volume C: Country/socio-demographics ---- Researchers may also
  contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
