type: DataProduct
name: 'Special Eurobarometer 315: Social climate'
description: 'This report explores Europe’s social climate from three perspectives:
  personal situation; general situation; and social protection and inclusion. This
  report explores Europe’s social climate from three perspectives. These are: 1. The
  respondents’ view of their personal situation. The focus lies here on citizens’
  life satisfaction and other general indicators of the quality of their personal
  everyday situation. 2. The perception of the general situation. Of main concern
  here are respondents’ views on the more general building blocks of the social conditions
  of European countries, including factors such as employment, housing and perceptions
  of the economic situation. 3. Finally, Europeans’ feelings toward social protection
  and inclusion are explored. The central factors here are Europeans’ opinions on
  policies in the areas of pensions and unemployment as well as inequalities and cultural
  diversity. #####The results by volumes are distributed as follows: * Volume A: Countries
  * Volume AA: Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP):
  Trends of groups of countries * Volume B: EU/socio-demographics * Volume B'' (BP)
  : Trends of EU/ socio-demographics * Volume C: Country/socio-demographics ---- Researchers
  may also contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
