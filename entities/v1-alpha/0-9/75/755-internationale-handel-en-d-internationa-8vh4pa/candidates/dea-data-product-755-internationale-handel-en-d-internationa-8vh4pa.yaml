id: dea:data-product-755-internationale-handel-en-d-internationa-8vh4pa
type: DataProduct
name: International trade and transit; value, weight, goods, mode of transport
description: 'This table provides insight into the international flows of goods from,
  to and through the Netherlands. The table shows, for import, export, re-export and
  transit flows and warehousing, the value and gross weight of the goods transported
  by goods group, mode of transport, type of cargo (whether or not transported in
  containers), group of countries of origin or destination and group of countries
  of loading or unloading. This table is co-financed by the Ministry of Infrastructure
  and Water Management. Data available from: 2007 Status of figures: The figures in
  this table are provisional. Changes as of 9 February 2026: The provisional figures
  for 2024 have been added and the figures for 2022 and 2023 have been updated. When
  will there be new figures? The new provisional figures generally become available
  one year after the end of the reporting year. The figures on international flows
  of goods can be adjusted on the basis of the availability of new or updated source
  material. As a result, the figures are provisional for a longer period of time.'
