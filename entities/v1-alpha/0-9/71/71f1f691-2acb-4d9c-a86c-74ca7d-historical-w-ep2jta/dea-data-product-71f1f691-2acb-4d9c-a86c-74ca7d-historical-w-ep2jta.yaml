type: DataProduct
name: Historical weather data
description: '<p>This data set contains historical weather data of the station of
  the DWD (station number: 02712) in the Silvanerweg 6 in Konstanz over a longer period
  of time.</p> <p>On July 25, 2017, an amendment to the German Weather Service Act
  ("DWD Act") entered into force. The DWD is legally mandated to provide its weather
  and climate information largely free of charge. Currently, many geodata such as
  model predictions, radar data, current measurement and observation data as well
  as a large number of climate data are available on the Open Data Server <a href="https://opendata.dwd.de/"><strong>https://opendata.dwd.de</strong>
  </a>. The climate data is provided at <strong><a href="https://opendata.dwd.de/climate_environment/">https://opendata.dwd.de/climate_environment/CDC</a></strong>.</p>
  <p>The freely accessible data may be re-used without restrictions in accordance
  with the "Ordinance establishing the Terms of Use for the Provision of Federal Geodata
  (GeoNutzV)" with a source note (<a href="https://gdz.bkg.bund.de">https://gdz.bkg.bund.de</a>).
  With regard to the design of the source notes, the German Weather Service (DWD)
  (according to § 7 DWD-Gesetz, § 3 GeoNutzV) calls for the following information
  to be observed:</p> <ul> <li>The obligation to include included source notes applies
  to the unchanged use of spatial data and other services of the DWD. Source notes
  must also be included when extracts are made or the data format is changed. An image
  of the DWD logo is sufficient as a source note in the sense of the GeoNutzV.</li>
  <li>In the event of further changes, modifications, new designs or other modifications,
  the DWD expects at least one mention of the DWD in central source directories or
  in the imprint.</li> <li>Changes according to GeoNutzV can be e.g.: "Data base:
  German weather service, raster data reproduced visually", "Data base: German weather
  service, individual values averaged" or "Data base: German weather service, own
  elements added".</li> </ul> <p>In the'
