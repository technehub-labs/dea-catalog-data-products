id: dea:data-product-8fd3d140-c771-4b0c-a8e3-219c1b-tracking-eu-gny433
type: DataProduct
name: Tracking EU Citizens’ Concerns using Google Search Data
description: '‘Tracking EU Citizens’ Concerns using Google Search Data’ offered weekly
  updates from May to September 2020 on EU citizens’ interests on three main fields
  related to the pandemic crisis: Health, Economy and Social isolation. The aim is
  to make Google trends data accessible and useful for policy-makers to better understand
  EU citizens’ concerns.'
