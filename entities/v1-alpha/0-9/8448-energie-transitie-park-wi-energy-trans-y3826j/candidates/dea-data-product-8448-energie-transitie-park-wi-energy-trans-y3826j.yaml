id: dea:data-product-8448-energie-transitie-park-wi-energy-trans-y3826j
type: DataProduct
name: Energy Transition Park wind energy (OGV, 2010) (history)
description: The Environmental Vision adopted by the Provincial Council on 2 June
  2010 states that large-scale energy systems must be concentrated at designated locations,
  for example at the Bargermeer business parks in Emmen, Europark in Coevorden and
  near Essent Milieu in Wijster. Opportunities to link energy producers and consumers
  are seen in these areas. The sites mentioned are therefore designated as Energy
  Transition Parks (ETP) (Map 8 - Energy Infrastructure). Based on a selection of
  business parks from IBIS 2009, this file shows the ETPs Coevorden, Wijster and Emmen.
