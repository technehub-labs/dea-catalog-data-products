id: dea:data-product-5939e652-5e68-4a33-9ddb-0264d5-passports-of-rud84m
type: DataProduct
name: Passports of budget programs of the Department of Agro-Industrial Development
  of Ivano-Frankivsk Regional State Administration
description: The set contains passports of budget programs of the Department of Agro-Industrial
  Development of Ivano-Frankivsk Regional State Administration under KPKVKMB 2417110
  "Implementation of programs in the field of agriculture", KPKVKMB 2417150 "Implementation
  of programs in the field of forestry and hunting", KPKVKMB 2411110 "Personnel training
  by vocational and other educational institutions", KPKVKMB 2418831 "Providing long-term
  loans to individual housing developers in the countryside", KPKVKMB 2411091 "Personnel
  training by vocational (vocational and technical) education institutions and other
  educational institutions at the expense of the local budget". Passports are approved
  by the order of programs of the department of agro-industrial development of the
  regional state administration. Each passport corresponds to the resource "Results
  of the budget program" (indicator). When changes are made to – passports, the data
  set is updated.
