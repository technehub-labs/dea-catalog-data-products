id: dea:data-product-5247-kosten-van-ziekten-naar-k-cost-of-dise-bdmkt3
type: DataProduct
name: Cost of diseases; by characteristics of person, illness and care 2003-2011
description: 'The figures in this table come from the Cost of Diseases study (KVZ)
  of the National Institute for Public Health and the Environment (RIVM), carried
  out in collaboration with the Central Bureau of Statistics (CBS). This table was
  created for the Public Health Care.info website of the RIVM and contains data on
  healthcare costs in the Netherlands broken down by use of care (diagnosis of disease,
  age, gender) and by supply of care (sector, care function and form of financing).
  This table has been discontinued. The most recent KVZ figures have been published
  in three new tables. These contain the results of the KVZ 2015 study. See the links
  to these tables in paragraph 4. Data available from: 2003 Status of figures: Final
  Changes as of 29-10-2019: None, this table has been discontinued. When will there
  be new figures? No longer applicable.'
