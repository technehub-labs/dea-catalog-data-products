id: dea:data-product-5233-kosten-van-ziekten-2015-the-cost-of-kzbwpk
type: DataProduct
name: The Cost of Diseases 2015
description: 'The figures in this table come from the Cost of Diseases study 2015
  (KVZ) of the National Institute for Public Health and the Environment (RIVM), carried
  out in collaboration with the Central Bureau of Statistics (CBS). This table was
  created for the RIVM website Gezondheidenzorg.info and contains data on healthcare
  expenditure in the Netherlands broken down by dimensions of care use (diagnosis,
  age, gender) and care provision (sector, care function and form of financing) for
  the year 2015. The Cost of Diseases figures are available in three separate tables.
  Due to the size, the figures for 2015 and 2017 are published in two separate tables.
  The third table shows the trend data for the years 2003, 2005, 2007, 2011, 2013,
  2015 and 2017. Due to major changes in the diagnosis format and in the presentation
  of financing and care function, only the ICD10 main groups are included in this
  trend table in the diagnosis dimension and the dimensions of financing form and
  care function are missing. Data available from: 2015 Status of figures: Definitive.
  Changes as of 29-10-2019: Update with figures from the final Cost of Diseases 2015
  study. When will there be new figures? Every two years. The Cost of Diseases study
  itself comes out every four years, but for each intermediate two-year period, an
  estimated allocation based on demographic extrapolation takes place. Figures for
  a reference year shall become available two years after the end of that reference
  year. The next update will cover the year 2019 and will be published in 2021.'
