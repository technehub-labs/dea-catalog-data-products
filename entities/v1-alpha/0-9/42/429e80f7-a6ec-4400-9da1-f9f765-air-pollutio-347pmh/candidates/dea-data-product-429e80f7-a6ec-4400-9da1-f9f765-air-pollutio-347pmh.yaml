description: 'Exceedances of the attention threshold of pollutants. \ ***Hourly threshold
  values***: for Sulphur dioxide (SO2) 350 micrograms/cube metre, for Sulphur dioxide
  (SO2) 350 micrograms/cube metre, for Ozone (O3) 180 micrograms/cube metre.\ ***
  Threshold values on 8-hour average***: for carbon monoxide (CO) 10 milligrams/cube
  metre, for ozone (O3) 120 micrograms/cube metre.\ ***Daily threshold values***:
  for sulphur dioxide (SO2) 125 micrograms/cube metre, for fine particulate matter
  (PM10) 50 micrograms/cube metre'
