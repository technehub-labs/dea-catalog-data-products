id: dea:data-product-4252-health-expenditure-functi-health-expen-x64z76
type: DataProduct
name: Health expenditure; functions, financing for internat.comparisons,1998-2022
description: 'This table contains information on expenditure and financing in current
  prices on the health care used by residents in the Netherlands in one year. All
  activities within the area of health care are included, whether they are performed
  within or outside the health care sector. These figures are based on the definition
  of the System of Health Accounts as used by EUROSTAT, the OECD and the WHO. The
  figures are derived from the Dutch statistics on health and social care, which cover
  a broader range of activities (including e.g. child day care, welfare, and social
  services). Exports are also included. In this table it can be found in the financing
  item Rest of the world; exports. This table also shows how the total figure in accordance
  with the System of Health Accounts is calculated from the total figure health and
  social care: Total figure on health and social care -/- health-related activities
  -/- other goods and services -/- exports = Total current expenditure on health Data
  available from 1998 to 2022 Status of the figures: The figures for 2022 are provisional;
  the figures for 2020-2021 are revised provisional; the figures for the other years
  are final. The figures for 2020-2022 will not be made final, as this table has been
  discontinued. Changes as of 14 July 2023: - The figures for 2022 have been added,
  the figures for 2019-2021 have been updated. The table has been discontinued. When
  will new figures be published? Not, this table has been discontinued and will be
  replaced by new tables, see section 3.'
