id: dea:data-product-42198-akkerbouwgewassen-voorlo-arable-crops-murmn8
type: DataProduct
name: Arable crops; Preliminary and final harvest estimate
description: 'This table shows the area cultivated and harvested, the yield per hectare
  and the total yield in a harvest year, per arable crop. Both the results of the
  preliminary harvest estimate and the results of the final harvest estimate are presented
  in this table, as well as the percentage difference. In order to arrive at the yield
  figure, a provisional harvest estimate is first made. This estimate of the yield
  takes place in the months of August to October from an inventory of cultivation
  consultancy Delphy. The final harvest estimate figures, based on a survey of a sample
  of arable crop holdings, will be published at the end of January. This table shows
  the differences between the estimated provisional yields and the final yields. The
  yields per hectare are rounded to 100 kilograms, the total yields to 1000 kilograms.
  Data available from: 2010. Status of figures The figures of the 2026 provisional
  harvest estimate are no longer adjusted in this table. Changes as of 30 October
  2026: To the table, the provisional figures for 2026 for the area cultivated, the
  gross yield per hectare and the total gross yield for all crops (excluding cereals)
  have been added. When will there be new figures? The provisional harvest estimates
  for cereals shall be published at the end of September and for all other crops at
  the end of October of the relevant harvest year. The provisional estimates are no
  longer adjusted in this table after publication. The figures for the final harvest
  estimate shall be published at the end of January of the year following the harvest.'
