id: dea:data-product-54d4dbfdc751df1ed9467389-priority-sch-kea426
type: DataProduct
name: Priority School Education Network
description: 'The objective of the priority education policy is to correct the impact
  of social and economic inequalities on school success by strengthening pedagogical
  and educational action in schools and establishments in territories facing the greatest
  social difficulties. The Orientation and Programming Law for the Refoundation of
  the School of the Republic defined its objective: reduce the gap in educational
  achievement between pupils in priority education and other pupils in France to less
  than 10%. The reform of the priority education policy is under way. The renovated
  national site for priority education accompanies this refoundation. This file presents
  schools'' priority education networks'
