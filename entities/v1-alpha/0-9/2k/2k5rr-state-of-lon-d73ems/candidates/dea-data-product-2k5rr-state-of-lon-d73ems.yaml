name: State of London
description: '<dp-prose> <p>The <a href="https://apps.london.gov.uk/state-of-london/"><strong>State
  of London report</strong> </a>brings together over 100 datasets about life in the
  capital &ndash; covering its economy, environment, housing market, and social outcomes
  such as health and education, among many other topics.</p> <p>Published annually
  by the GLA&rsquo;s City Intelligence Unit, the report&rsquo;s ten chapters provide
  an array of charts and data, organised around the outcomes the Mayor of London wants
  to achieve for the city. Together, these indicators provide a shared evidence base
  to inform discussion, scrutiny and decision-making about London&rsquo;s future.</p>
  <p>The report is best viewed online: <a href="https://apps.london.gov.uk/state-of-london/">https://apps.london.gov.uk/state-of-london/</a></p>
  <p>Previous editions of the report are available to download in PDF format below.</p>
  <p>We welcome feedback on the report via email to: <a href="mailto:intelligence@london.gov.uk">intelligence@london.gov.uk</a>.</p>
  </dp-prose>'
