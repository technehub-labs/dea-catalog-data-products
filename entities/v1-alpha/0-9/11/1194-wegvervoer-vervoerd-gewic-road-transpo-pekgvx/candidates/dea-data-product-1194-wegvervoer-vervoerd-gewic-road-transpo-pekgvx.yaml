id: dea:data-product-1194-wegvervoer-vervoerd-gewic-road-transpo-pekgvx
type: DataProduct
name: Road transport; transported weight by EU road hauliers; 2005-2019
description: 'This table contains data on the cargo weight carried by road hauliers
  from the European Union. The table shows the total cargo carried for each EU Member
  State, both domestic and international. As of February 2020, the United Kingdom
  is no longer part of the EU. This table is therefore discontinued and replaced by
  the new table: Road transport; weight transported by road hauliers from the European
  Union. For the link to the relevant table, see paragraph 3. Data available from:
  2005 to 2019 Status of figures: The figures in this table are final. Changes as
  of 9 February 2022: Data for 2017, 2018 and 2019 are now final. When will there
  be new figures? Not, the table is stopped.'
