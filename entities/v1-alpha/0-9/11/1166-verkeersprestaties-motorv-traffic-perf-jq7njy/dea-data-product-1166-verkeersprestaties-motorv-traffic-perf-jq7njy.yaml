id: dea:data-product-1166-verkeersprestaties-motorv-traffic-perf-jq7njy
type: DataProduct
name: Traffic performance of motor vehicles; kilometres, territory 1990-2020
description: 'This table provides figures on the traffic performance (vehicle-kilometres)
  of passenger cars, vans, lorries, semi-trailer tractors, special vehicles and buses.
  Vehicle kilometres of Dutch vehicles are broken down into Dutch vehicles on Dutch
  territory and Dutch vehicles on foreign territory. In addition, there are figures
  of the total distance travelled on Dutch territory. A distinction was made between
  kilometres travelled by Dutch and foreign vehicles. As of the 2016 reporting year,
  the bus-kilometres will no longer be broken down by country and by country. The
  vehicle population for which kilometres are estimated is based on the statistics
  on the motor vehicle fleet. The population of the figures in this table is based
  on the old selection method of the motor vehicle fleet. The difference between the
  old and the new selection method is described in a method report, see Section 4.
  The range of kilometres estimated on the basis of the old vehicle population runs
  until reporting year 2020. The series based on the new population is available as
  of reporting year 2018. The way in which the kilometers are estimated has not changed,
  only the population. In the figures for the reporting year 2020, the smoothing effect
  of the method was corrected by means of a correction factor. This effect smooths
  out the annual variation in the figures. This gives a distorted picture of periods
  in which mobility suddenly changes drastically, as in 2020 as a result of the coronavirus
  crisis. Data available from: 1990 to 2020 Status of figures: The figures up to 2018
  are final and the figures for 2019 and 2020 have a provisional status. Changes as
  of 10 November 2022: None, this table has been discontinued. This table is followed
  by the table Traffic performance of motor vehicles; kilometres, type of vehicle,
  territory. See paragraph 3. When will there be new figures? No longer applicable.'
