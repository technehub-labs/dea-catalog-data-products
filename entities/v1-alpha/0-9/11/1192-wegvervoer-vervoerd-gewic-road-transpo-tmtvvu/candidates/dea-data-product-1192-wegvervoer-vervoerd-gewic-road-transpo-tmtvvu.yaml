id: dea:data-product-1192-wegvervoer-vervoerd-gewic-road-transpo-tmtvvu
type: DataProduct
name: Road transport; transported weight by distance class
description: 'This table provides data on the cargo weight carried by Dutch commercial
  vehicles with a maximum permissible weight (loading capacity plus unladen weight)
  of more than 3.5 tonnes. The figures shall be broken down by distance over which
  the goods have been transported. In addition, a distinction is made between professional
  and private transport. Data available from: Annual figures available from 2005.
  Status of figures: The figures up to 2022 are final, the 2023 and 2024 figures are
  further provisional and the 2025 figures have a provisional status. Changes as of
  29 June 2026: The provisional figures for the reporting year 2025 have been added
  and the figures for 2024 have been updated. When will there be new figures? New
  figures will become available 5 months after the end of the reporting year.'
