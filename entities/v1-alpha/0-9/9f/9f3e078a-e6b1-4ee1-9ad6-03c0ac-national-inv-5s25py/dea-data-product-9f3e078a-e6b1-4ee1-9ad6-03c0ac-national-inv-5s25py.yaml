id: dea:data-product-9f3e078a-e6b1-4ee1-9ad6-03c0ac-national-inv-5s25py
type: DataProduct
name: National Inventory of Architectural Heritage (NIAH) National Thatch Census
description: 'The National Thatch Census was undertaken by the National Inventory
  of Architectural Heritage (NIAH) between November 2022 and May 2023 to identify
  surviving thatched structures in the Republic of Ireland. This rapid field survey
  aimed to establish a baseline record to support heritage management, conservation
  policy and future research. For each structure identified, the survey recorded its
  geographic location using coordinate data and county. Buildings were photographed
  externally to provide a visual record of their condition and appearance at the time
  of survey. The building type was also recorded. Data Contents Reg no : Unique structure
  identifier/reference number; Type: Building typology; County: The county in the
  Republic of Ireland the record is located in; ITM_E: Easting (X) Irish Transverse
  Mercator (ITM)coordinates; ITM_N: Northing (Y) Irish Transverse Mercator (ITM)coordinates;
  Image_Link: Photographic record where available /Associated image URL Data Collection
  Method Field survey undertaken by NIAH staff and contractors, involving site visits,
  location verification, photograph and classification of building type. Reference
  Number Convention In some cases, a structure’s registration number is followed by
  a letter suffix (b, c, d). These suffixes indicate a secondary structure associated
  with the principal thatched building, such as an outbuilding, store, shed or other
  ancillary structure recorded during the survey. For example, in County Donegal,
  DG01002 identifies a thatched house, while DG01002b identifies an associated thatched
  outbuilding recorded at the same location. Similarly, CL02009 is recorded as a house,
  while CL02009b and CL02009c are associated outbuildings.'
