description: <dp-prose> <p>The Climate Change Mitigation and Energy Annual Report
  2009-2012 data provides levels of CO2 emissions reductions achieved through direct
  Mayoral programmes, including RE:NEW, RE:FIT, and the Decentralised Energy Programme.
  It is produced by the Greater London Authority and this forms the first set of data.
  It is intended that data is produced annually.</p> </dp-prose>
