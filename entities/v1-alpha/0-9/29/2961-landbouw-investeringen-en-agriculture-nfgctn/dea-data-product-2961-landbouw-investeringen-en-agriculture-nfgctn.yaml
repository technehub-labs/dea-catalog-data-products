name: Agriculture; Investments and Stocks, No, 1995-2016
description: 'This table contains data from the agricultural accounts. Figures refer
  to gross investment and changes in inventories. Data available from 1995 to 2016
  Status of figures: The years 1995-2015 are final. The most recent reporting year
  2016 has the status provisional. As this table has been discontinued, the data will
  no longer be made definitive. Changes as of 12 October 2018 None, this table has
  been discontinued. The Central Bureau of Statistics recently carried out a revision
  of the national accounts. New statistical sources and estimation methods are used.
  This table of data for revision has been replaced by table Agriculture; investments
  and stocks, national accounts. For additional information see Section 3. When will
  there be new figures? No longer applicable.'
