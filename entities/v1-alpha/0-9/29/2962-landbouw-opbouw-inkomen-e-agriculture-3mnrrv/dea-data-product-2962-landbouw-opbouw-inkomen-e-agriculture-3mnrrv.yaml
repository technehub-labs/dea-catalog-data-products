type: DataProduct
name: Agriculture; Income accrual and labour volume, No, 1995-2017
description: 'This table contains data from the agricultural accounts. Figures refer
  to output, intermediate consumption, value added, labour volume and agricultural
  income. Data available from 1995 to 2017 Status of figures: The years 1995-2014
  are final. Data from the years 2015, 2016 and 2017 have the status provisional.
  As this table has been discontinued, the data will no longer be made definitive.
  Changes as of 12 October 2018 None, this table has been discontinued. The Central
  Bureau of Statistics recently carried out a revision of the national accounts. New
  statistical sources and estimation methods are used. This table of data for revision
  has been replaced by table Agriculture; accrual of income and labour volume, national
  accounts. For additional information see Section 3. When will there be new figures?
  No longer applicable.'
