type: DataProduct
name: London's Economy Today
description: <dp-prose> <p>The most up-to-date information on London&apos;s economy,
  published by email every month. Each issue includes an overview of current economic
  conditions, the latest indicators and a supplement on a significant issue facing
  London.</p> <p>Additional data from the latest edition of London&rsquo;s Economy
  Today can be found here on the Datastore.</p> <p><a href="https://www.london.gov.uk/what-we-do/research-and-analysis/join-our-mailing-list-research-and-analysis">Sign
  up</a> to receive London&apos;s Economy Today every month.</p> <h2>HOUSING INDICATORS</h2>
  <p><strong>The Land Registry house price index (Quarterly since 1968).</strong>
  <a href="https://www.gov.uk/government/collections/uk-house-price-index-reports">Land
  Registry data External link</a></p> <p></p> <h2>LABOUR MARKET INDICATORS</h2> <p><strong>The
  unemployment rate. (Monthly since Q2 1992)</strong> The unemployment rate measures
  the proportion of the economically active population (those in work plus those seeking
  and available to work) who were unemployed. Seasonally Adjusted.</p> <p></p> <h2>TRANSPORT
  INDICATORS</h2> <p><strong>London Underground Journeys (Monthly since 2006)</strong>
  including moving average and annual rate of growth</p> <p><strong>Bus Journeys (Monthly
  since 2006)</strong> including moving average and annual rate of growth</p> </dp-prose>
