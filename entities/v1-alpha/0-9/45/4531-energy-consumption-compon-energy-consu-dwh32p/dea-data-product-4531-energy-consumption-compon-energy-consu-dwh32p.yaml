id: dea:data-product-4531-energy-consumption-compon-energy-consu-dwh32p
type: DataProduct
name: Energy consumption; components, branch, 2011-2016
description: 'This table shows the consumption of energy of companies broken down
  by industry based on the Standard Industrial Classification (SIC 2008). Consumption
  of energy can be calculated in two ways. First from a consumption perspective. Consumption
  is final energy consumption plus non-energy use plus net energy transformation.
  The latter is the amount of energy lost during the transformation of energy commodities.
  Second from a supply perspective. Energy consumption is indigenous production plus
  supply minus delivery of energy plus stock change. The result of these two calculation
  perspectives is the same. The table also shows energy transformation input (the
  amount of energy used to produce other energy commodities) and energy transformation
  output (the amount of energy transformed from another energy commodity). Data available
  from: 2011. Status of the figures: Figures up to 2014 are definite. Figures of 2015
  and 2016 are revised provisional. Changes as of 23 March 2018: None, this table
  has been discontinued. The successor of this table is ''Energy balance sheet; Supply
  and consumption, sector. See section 3. Changes as of 27 December 2017 Figures for
  2015 and 2016 have been adjusted. Figures for 2011 up to and including 2014 have
  been revised. See section 4 for explanations. When will new figures be published?
  Not applicable.'
