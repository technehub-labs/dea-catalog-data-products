id: dea:data-product-4521-renewable-energy-final-us-renewable-en-jfapnp
type: DataProduct
name: Renewable energy; final use and permitted use of fossil energy, 1990-2013
description: 'Renewable energy is energy from wind, hydro power, the sun, the earth,
  biomass and heat from outdoor air and just milked milk. This table suggests the
  use of renewable energy in two ways: 1. Gross final consumption 2. Avoided use of
  fossil primary energy In addition, the table presents the emissions of carbon dioxide
  by the use of renewable energy. Figures are broken down into energy source/technique
  and into application (electricity, heat and transport). Data available from 1990
  until 2013 Status of the figures: This table contains definite figures, based on
  the national Protocol Monitoring Renewable Energy (2010, AgentschapNL). Changes
  as of 29 June 2015: None, this table has been stopped, because the method is changed.
  The successor of this table is "Renewable energy; final use and probably use of
  fossil energy". See section 3. When will new figures be published? Not applicable.'
