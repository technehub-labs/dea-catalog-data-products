name: The Economics of London's Housing Market
description: <dp-prose> <p>Through reading this publication you will:</p> <p>&bull;
  gain an understanding of how house prices are set in economics terms, how they are
  measured, and why the cost of housing matters for London&rsquo;s economy and its
  residents</p> <p>&bull; see whether incomes and earnings in London have kept pace
  with the costs of home ownership in London, and see how affordability may be affected
  by future changes in interest rates</p> <p>&bull; find out about the drivers of
  demand for residential property in London, and how the supply of homes has responded
  to changing conditions</p> </dp-prose>
