id: dea:data-product-4519-renewable-electricity-dom-renewable-el-jpptuh
type: DataProduct
name: Renewable electricity; domestic production, imports and exports, 1990-2013
description: 'This table contains figures on the domestic production of renewable
  electricity, as well as imports and exports of certificates for renewable electricity.
  A distinction is made between gross and net production and normalised and not normalised
  production. The data is broken down by energy source and technology. There are four
  main headings: hydro power, wind energy, solar photovoltaics and biomass. Data available
  from: 1990 to 2001 justified and from 2002 to 2013 also quarterly. Changes as of
  12 June 2014: None, this table has been stopped. When will new figures be published?
  No longer applicable.'
