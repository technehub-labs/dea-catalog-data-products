type: DataProduct
name: Marseille_Biodiversity_Inventory of butterflies in parks
description: The City of Marseille makes available the biodiversity data of its territory
  including this **Inventory of butterflies in the public parks of the City of Marseille.**
  The resources in this dataset come from a study by the Population Environment Development
  Laboratory (LPED, [http://www.lped.fr/](http://www.lped.fr/)) carried out by Marie-Hélène
  Lizée in 2009. For optimal reuse of these inventory data, they have been enriched
  with the TaxRef taxonomic repository proposed and maintained by the National Museum
  of Natural History. Each species is associated with a TaxRef identifier (cd_name)
  and a species presentation (species URL) from the [National Inventory of Natural
  Heritage] (https://inpn.mnhn.fr/).
