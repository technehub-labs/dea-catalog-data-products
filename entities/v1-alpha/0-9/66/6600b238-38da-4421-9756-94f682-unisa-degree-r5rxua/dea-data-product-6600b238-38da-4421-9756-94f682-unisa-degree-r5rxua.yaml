type: DataProduct
name: UNISA Degree programs ay 2023-2024
description: This dataset contains information on active degree programs at the University
  of Salerno for the academic year 2023-2024. It includes details on the number of
  enrolled students, categorized by gender and age, along with information on each
  program, the affiliated department, EQF (European Qualifications Framework), ISCED
  (International Standard Classification of Education), and geographic coordinates.
