type: DataProduct
name: Nature management plan 2026 - Search area Climate
description: 'Climate search area: identifies areas for action to combat climate change
  or mitigate the effects of climate change. Think of CO2 storage through wood stands,
  rewetting against peat oxidation and capturing peaks in precipitation in heavy showers.
  In these search areas, agricultural collectives with subsidy from the province can
  make management agreements with farmers. Delimited search areas within which subsidies
  for the management of landscape elements can be applied for. This file is the final
  version for the year 2026.'
