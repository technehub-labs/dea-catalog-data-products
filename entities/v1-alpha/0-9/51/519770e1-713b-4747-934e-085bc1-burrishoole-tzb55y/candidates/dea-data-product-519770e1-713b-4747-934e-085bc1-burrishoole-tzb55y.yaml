id: dea:data-product-519770e1-713b-4747-934e-085bc1-burrishoole-tzb55y
type: DataProduct
name: Burrishoole Catchment Rainfall
description: Rainfall sensors are currently deployed around the Burrishoole catchment
  to ensure maximum spatial coverage of rainfall variation. Data measured are mm of
  rain. Data coverage is for Furnace Newport Co. Mayo. Rainfall data collected since
  1996. Rainfall data has been collected via tipping buckets which are used for the
  observations and measurements of rainfall. Data collected supports Met Eireann climate
  and meteorology analysis of rain over time periods. Data collected by the Marine
  Institute Newport Facility team in association with Met Eireann, Irelands meteorological
  service. Data has been collected regularly (e.g. daily) and is 100% complete for
  the period since the rainfall gauges deployed.
