id: dea:data-product-065ce56c-a4b5-499a-93bb-d0abd4-esbo-stads-i-jm367b
type: DataProduct
name: Esbo stads inköpsfakturor
description: 'The data includes the City of Espoo''s purchases of services, materials,
  supplies and goods, as well as rents and other expenses paid since 2012. The data
  includes the purchase invoice information of the City of Espoo''s profit units,
  cost centres, commercial enterprises and funds. The data has been extracted from
  the city''s accounting system at the invoice row level and the data has been supplemented
  with, for example, the name data of the organisation and account groups. The dataset
  contains the following column data: city (standard data), profit centre and cost
  centre named, booking date, invoice number, account group, account number, account
  name, supplier''s name, supplier''s business ID, invoice total in euros and order
  number, if any. Amounts are usually shown net of VAT. The data does not include
  purchases from private individuals or business names, grants paid to private individuals,
  etc. data covered by personal data protection. Information has been classified to
  facilitate the use of the material. The accounts are classified by account group
  as follows: purchases of services; materials, supplies and articles; rents; other
  expenses; capitalised expenditure and purchases of fixed assets. The classifications
  can be used to view purchases from the data, for example, by supplier and at the
  account level. The profit unit column contains the city''s profit unit information
  or task area information for investments in the base city (for example, 911 General
  Administration and 941 Traffic Routes). The 2016 dataset has been prepared in accordance
  with the [national instructions for opening purchase invoices](https://www.avoindata.fi/data/fi/dataset/invoice
  opening instructions for municipalities). Additional information: eOstolaskut@espoo.fi'
