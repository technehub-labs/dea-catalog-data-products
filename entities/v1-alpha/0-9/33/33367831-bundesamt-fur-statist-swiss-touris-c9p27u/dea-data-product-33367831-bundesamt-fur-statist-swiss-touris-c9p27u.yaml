id: dea:data-product-33367831-bundesamt-fur-statist-swiss-touris-c9p27u
type: DataProduct
name: Swiss tourism statistics 2023
description: This publication presents findings from the FSO's Swiss tourism statistics
  for 2023. The first section focuses on tourist accommodation, combining data from
  both the hotel and supplementary accommodation sectors. The second section concerns
  the survey on the travel behaviour of the Swiss population in 2023. The third section
  provides information on the economic impact of tourism in Switzerland the basis
  of tourism satellite account indicators. The fourth section of the publication presents
  a series of economic indicators that help to place the tourism statistics within
  the broader economic landscape.
