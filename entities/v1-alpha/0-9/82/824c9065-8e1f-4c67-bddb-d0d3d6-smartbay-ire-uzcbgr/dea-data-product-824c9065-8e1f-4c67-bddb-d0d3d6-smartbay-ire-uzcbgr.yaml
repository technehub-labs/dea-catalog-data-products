id: dea:data-product-824c9065-8e1f-4c67-bddb-d0d3d6-smartbay-ire-uzcbgr
type: DataProduct
name: SmartBay Ireland Galway Bay Buoy Weather
description: 'This data comprises weather data collected from the SmartBay buoy moored
  in Galway Bay. The Airmar Weather Station used to collect this data collects wind,
  temperature and pressure data and returns the following parameters: Latitude and
  Longitude Air Temperature (Degrees Celcius) Barometric Pressure (Bar) Barometric
  Pressure (Inches) Wind Direction (Degrees Magnetic) Wind Direction (Degrees True)
  Wind Speed (Knots) Wind Speed (Meters/Sec) The PB200 WeatherStation Instrument informs
  you of instantaneous changes in the weather. Wind Speed and Direction are measured
  using four ultrasonic transducers; no moving parts make it durable and reliable.The
  internal, WAAS GPS engine and three-axis solid-state compass provide both Apparent
  and True Wind Speed and Direction without the need to tack on additional sensors.
  Also, the WAAS GPS generates navigation data as well as magnetic variation and is
  suitable as your primary GPS source. The internal temperature and barometric pressure
  sensors help predict changing weather patterns.'
