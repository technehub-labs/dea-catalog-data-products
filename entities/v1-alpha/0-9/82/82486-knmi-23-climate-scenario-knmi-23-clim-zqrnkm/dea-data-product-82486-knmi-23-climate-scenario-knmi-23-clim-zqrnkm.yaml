id: dea:data-product-82486-knmi-23-climate-scenario-knmi-23-clim-zqrnkm
type: DataProduct
name: KNMI’23 climate scenario data for official data portal
description: The KNMI'23 climate scenarios are based on 240 years (8 ensembles of
  30 years each) of RACMO (Regional Atmospheric Climate Model) v2.3 data for every
  horizon/scenario. The data in this set is a user-friendly version of the RACMO putput
  that was used to calculate the scenario tables. ‘User-friendly’ means that the data
  is mapped to a regular lat/lon grid, and that the time coordinate indicates to the
  nominal period it is used for. Version 1.0 (https://dataplatform.knmi.nl/dataset/knmi23-user-friendly-racmo-1-0)
  of the dataset only includes values within the Dutch borders, the current version
  (2.0) also includes values outside the borders. In addition, this version also includes
  a mask to mask the points outside the Netherlands. This user-friendly dataset is
  also provided to the public via the data portal. Version 3.0 (https://dataplatform.knmi.nl/dataset/knmi23-user-friendly-racmo-3-0)
  has four extra, not biased-corrected, variables.
