id: dea:data-product-43304-ict-gebruik-bij-zzp-ers-ict-use-by-f-hbs943
type: DataProduct
name: ICT use by freelancers; industry and company size, 2023
description: 'This table provides figures on the use of information and communication
  technology (ICT) by companies with one or more employees. The data can be broken
  down by company size. The reporting period covers the year 2023. However, a number
  of topics relate to the year 2022. In such cases, this shall be stated in the explanatory
  memorandum to the subject in question. Data available for 2023. Status of figures:
  The figures in this table are further provisional. Changes as of 12 December 2025:
  Insufficiently reliable figures are represented by a point. The status of the 2023
  figures has been adjusted to further provisional. Changes as of 13 December 2024:
  An error had erroneously occurred in the reporting year 2023. This error occurs
  only in the combination of size classes of large companies, small companies and
  self-employed persons. This version of this table contains the corrected figures.
  Changes as of 12 December 2024: Despite the care taken in compiling the figures
  on ICT use by self-employed persons, it has unfortunately been found that the figures
  published for the reporting period 2023 are not correct due to a technical error.
  The figures were used in the publication Cybersecuritymonitor. This version of this
  table contains the corrected figures. Changes as of 7 June 2024: Despite the care
  taken in compiling the figures for the ICT statistics, it has unfortunately been
  found that the figures published for the reporting period 2023 are not correct due
  to a technical error. The figures for specifically small businesses (2 to 10 persons
  employed) in the financial sector have been substantially adjusted. For the breakdowns
  that these small companies in the financial sector contain, this also has a limited
  effect. The macro figures have been adjusted to a very limited extent by this correction.
  When will there be new figures? Figures for 2024 will be available in December 2024.
  These figures will be published in a new table.'
