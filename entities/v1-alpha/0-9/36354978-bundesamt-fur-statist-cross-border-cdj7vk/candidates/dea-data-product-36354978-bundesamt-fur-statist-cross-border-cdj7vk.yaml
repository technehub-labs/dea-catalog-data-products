id: dea:data-product-36354978-bundesamt-fur-statist-cross-border-cdj7vk
type: DataProduct
name: 'Cross-border city statistics: Demography (Agglomerations 2020)'
description: This dataset presents annual data for a selection of variables of cross-border
  city statistics concerning the demographics according to the version 2020 of the
  agglomerations (permanent resident population, youth quotient, age quotient, median
  age, population density, population shares of the Swiss and foreign populations),
  from 2020 onwards.
