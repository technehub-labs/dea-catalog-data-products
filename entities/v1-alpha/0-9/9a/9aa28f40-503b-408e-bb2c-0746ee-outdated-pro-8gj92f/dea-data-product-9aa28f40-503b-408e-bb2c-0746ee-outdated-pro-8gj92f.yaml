id: dea:data-product-9aa28f40-503b-408e-bb2c-0746ee-outdated-pro-8gj92f
type: DataProduct
name: OUTDATED!- Projected fresh water use from the European energy sector on NUTS2
  level by 2050 following EU Energy Reference Scenario 2016
description: NEW DATASET IS AVAILABLE IN THE WEFE COLLECTION CONTAINING SIX DIFFERENT
  ENERGY SCENARIOS. - PLEASE CHECK THE DATASET "Projected freshwater needs of the
  energy sector in the European Union and the UK" The dataset contains projections
  of fresh water withdrawal and consumption from the European energy sector on NUTS2
  level by 2050 following EU Energy Reference Scenario 2016. The energy sector in
  this scope includes energy production (production of coal, oil and gas) and energy
  transformation in oil refineries and power plants (nuclear, solid fuels, oil, gas,
  biomass and geothermal). The information in provided on NUTS 2 level following the
  NUTS2 2013 definition. The dataset is explained in more detail in the report "Projected
  fresh water use from the European energy sector".
