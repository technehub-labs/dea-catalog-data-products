id: dea:data-product-94f9a8f1-6b5a-46eb-b652-0f211a-priority-pub-dxq333
type: DataProduct
name: Priority public transport network
description: The priority network takes into account routes with a particularly dense
  public transport offer and high passenger demand. It covers all routes on which,
  on a working day, more than six journeys per hour and direction are planned for
  at least one hour, or six journeys per hour and direction for at least twelve hours.
  On the lines of the priority public transport network, the interests of surface
  public transport shall be taken into account with particular priority. In addition,
  the routes served by night traffic between 10 p.m. and 6 p.m. are shown. In addition,
  the routes that will be added to the priority network or night network in the future
  are shown with the year of the planned implementation. Furthermore, new construction
  lines in the process of being implemented are shown.
