type: DataProduct
name: The organisation of the public transport lines of the Val d’Essonne
description: The creation, organisation and management of public transport lines is
  the responsibility of Île-de-France Mobilités (IDFM) in Ile-de-France. Nevertheless,
  in order to preserve the quality of the service provided to users, the Community
  of Communes du Val d’Essonne participates in the financing of many regular bus and
  school transport routes (Circuits Special Schools or Regular School-related Lines)
  that marries the territory.
