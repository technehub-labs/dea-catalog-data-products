id: dea:data-product-83642-high-resolution-maps-of-high-resolut-g23jj2
type: DataProduct
name: High-resolution maps of ground-based observations for the Netherlands
description: This data set provides high-resolution maps of surface weather in the
  Netherlands based on ground-based observations. An innovative interpolation is used
  which statistically blends weather observations from the KNMI network, citizen weather
  observations from the wow.knmi.nl network and static information like land cover
  type and distance to the coast. This statistical blend results in weather maps which
  have higher spatial detail and higher local accuracy than maps based only on our
  official network, but the historical perspective of the maps is shorter. The dataset
  provides a best estimate and a quantified uncertainty estimate of the local weather.
  Currently, this service is provided for air temperature, 10 m wind speed and relative
  humidity. The dataset should be regarded as a Beta release.
