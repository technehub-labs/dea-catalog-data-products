type: DataProduct
name: Maritime Collections
description: The aim of this survey was to obtain a general overview of the maritime-related
  collections in Ireland, to ascertain the location, ownership, condition, overall
  theme, and nature of the contents of each collection. It is neither an inventory
  nor a full evaluation of the collections, and is in no way intended to criticize
  either the collections or their custodians.
