name: Energy balance; energy companies and industry, 2000 - 2003
description: 'This table provides figures on energy supply, conversion and consumption.
  Energy is released by, for example, the combustion of natural gas, oil, coal and
  biofuels. Energy can also be obtained from electricity or heat or extracted from
  nature, for example wind power or solar energy. In energy statistics, all these
  sources from which energy can be used are called ''energy carriers''. The supply
  of energy is formed by the extraction of energy, supply and delivery and the change
  in stock. Of the energy conversion, the table gives both figures on the use of energy
  carriers for conversion (the amount of energy used to make other energy carriers),
  and on the production of energy after conversion (the amount of energy made from
  other energy carriers), as well as on the balance of deployment and production.
  This balance of energy conversion can be interpreted as the loss of energy during
  the conversion. The energy balance then shows the final consumption of energy, which
  is the final consumption of energy. This consists of final energy consumption and
  non-energy use. Final energy consumption is the energy used by energy customers
  for energy purposes. Non-energy use is the use of an energy carrier to create a
  product that is not an energy carrier. Data available: From: 2000 1st quarter Status
  of figures: All figures up to and including the reporting period 2003 3rd quarter
  are final. Amendment as of 6 May 2004 None, this table has been discontinued. For
  more information, see Section 3. When will there be new figures: No longer applicable.'
