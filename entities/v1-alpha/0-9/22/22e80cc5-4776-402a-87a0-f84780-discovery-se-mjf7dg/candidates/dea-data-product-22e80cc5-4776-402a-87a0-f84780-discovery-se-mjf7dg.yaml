id: dea:data-product-22e80cc5-4776-402a-87a0-f84780-discovery-se-mjf7dg
type: DataProduct
name: Discovery service (CSW) of the catalogue of the Communauté de communes du Mont
  des Avaloirs on "geomayenne.fr"
description: This discovery service allows to query the catalog of geographical data
  and web services of the Community of communes of Mont des Avaloirs referenced in
  the platform "geomayenne.fr", via the protocol CSW 2.0.2. This harvesting point
  makes it possible to discover the description sheets (metadata) of the geographical
  data disseminated by the Community of communes of Mont des Avaloirs which are concerned
  by the European directive INSPIRE or which are of public interest.
