id: dea:data-product-122fecdc-5ea3-4bf6-b125-24cf2d-climate-stat-y7tbck
type: DataProduct
name: Climate stations - Homogeneous data series
description: The Swiss National Basic Climatological Network (Swiss NBCN) connects
  the major ground-based stations within the MeteoSwiss monitoring network. It consists
  of 29 climate monitoring stations and 46 precipitation stations. Homogeneous series
  of climate measurements reflect an unbiased picture of the climatic development
  and represent the basis for research on climate change. The data set contains homogeneous
  series for each station on temperature, precipitation, wind, pressure, humidity,
  sunshine duration, and radiation in daily ('d'), monthly ('m') and yearly ('y')
  resolutions. There are updated data sets from the current year up to yesterday ('recent')
  and since the beginning of the measurement ('historical'). If you require monthly
  or yearly values, we strongly recommend that you download the corresponding resolution.resolution.
