type: DataProduct
name: LULUCF key figures 2025
description: This dataset contains the key figures (carbon stock values, enrichment
  values, N2O and CH4 emission factors, etc.) needed to calculate emissions in the
  context of the European LULUCF Regulation with regard to the reporting of greenhouse
  gas storage and emissions related to land use changes.
