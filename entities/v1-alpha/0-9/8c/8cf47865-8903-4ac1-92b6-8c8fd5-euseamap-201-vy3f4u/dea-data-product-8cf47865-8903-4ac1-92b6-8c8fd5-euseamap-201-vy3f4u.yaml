id: dea:data-product-8cf47865-8903-4ac1-92b6-8c8fd5-euseamap-201-vy3f4u
type: DataProduct
name: EUSeaMap (2019) Broad-Scale Predictive Habitat Map - Confidence in classification
  of energy levels
description: Confidence in the classification of energy level in the EUSeaMap (2019)
  broad-scale predictive habitat map. Values are on a range from 1 (Low confidence)
  to 3 (High confidence). Energy level is one of the layers of information used to
  categorise physical habitat types in EUSeaMap; these layers of information are collectively
  known as 'habitat descriptors'. Confidence in the classification of an energy level
  at any location is driven by both the confidence in the values of the input variables,
  and the confidence in the classification based on proximity to, and uncertainty
  in, the boundary between classes (i.e. areas closer to a boundary between two classes
  will have lower confidence). Layers are also available showing confidence in the
  values of the input variables used to model energy levels (kinetic energy at the
  seabed and wave exposure). Detailed information on the modelling process for the
  2016 is found in the EMODnet Seabed Habitats technical report and its appendices
  (Populus et al, 2017, link in Resources). We are working on an updated report for
  the 2019 version. Created by the EMODnet Seabed Habitats project consortium.
