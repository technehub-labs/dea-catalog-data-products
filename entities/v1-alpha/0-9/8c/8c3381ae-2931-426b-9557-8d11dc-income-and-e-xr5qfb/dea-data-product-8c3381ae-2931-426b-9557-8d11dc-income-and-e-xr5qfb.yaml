type: DataProduct
name: Income and expenditure of the city of Kauniainen
description: Income and expenditure of the City of Kauniainen according to the financial
  statements and the budgets since 2012. The City of Kauniainen does not have any
  municipal enterprises or cost centres separated in accounting. When examining the
  data, it is good to take into account the organisational change that took place
  in the city in 2013, when the section of early childhood education was moved from
  social and health services to education and cultural services. The official financial
  statements for 2012 were prepared in such a way that early childhood education was
  reported as part of social and health services. Other things to note are the location
  of the food and cleaning service in the general administration of the city and the
  city’s property unit under community services, which takes care of the internal
  rental and maintenance of the city’s premises.
