description: '<p>This dataset contains data on the Konstanz bus transport network,
  the mobility offer of Stadtwerke Konstanz. Further information and news on bus traffic
  can be found <a href="https://www.stadtwerke-konstanz.de/tag/bus/">here</a> (Source:
  Stadtwerke Konstanz GmbH).</p> <p>Timetable data by districts in Baden-Württemberg
  are available <a href="https://www.nvbw.de/open-data/timetable data/timetable data-to-landkreisen">here</a>,
  also for the district of Konstanz.</p> <h3 id="data source-">data source:</h3> <p><a
  href="https://offenedaten-konstanz.de/dataset/busverkehr">Open data Konstanz</a>
  under CC-BY 4.0 </p>'
