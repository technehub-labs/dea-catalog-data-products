type: DataProduct
name: Measurement values air temperature 2 m, Instantaneous Value
description: Current measurement values of Temperature 2 m, 10 min [°C]. Data is updated
  every 10 minutes. The data set contains all weather stations of the SwissMetNet,
  the automatic monitoring network of MeteoSwiss, which comprises 160 automatic monitoring
  stations. These stations deliver a multitude of current data on the weather and
  climate in Switzerland every ten minutes.
