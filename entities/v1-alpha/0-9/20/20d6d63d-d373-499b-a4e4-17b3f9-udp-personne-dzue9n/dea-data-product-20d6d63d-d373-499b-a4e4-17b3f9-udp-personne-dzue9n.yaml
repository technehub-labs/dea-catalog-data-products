id: dea:data-product-20d6d63d-d373-499b-a4e4-17b3f9-udp-personne-dzue9n
type: DataProduct
name: UDP - Personnel training on digital skills
description: 'This indicator measures the share of tourism ecosystem enterprises providing
  ICT training to their personnel. It is based on data collected by the National Statistical
  Institutes through questionnaires to enterprises with 10 or more employees and self-employed
  persons (NACE sectors 55, 56, 79). The indicator is part of the digital pillar of
  the EU Tourism Dashboard. UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: FI
  missing. POLICY CONTEXT: It provides an indication of the level of investment of
  enterprises in integrating and upgrading their digital competencies. Higher values
  indicate higher shares of digital training. METHODOLOGY: The indicator is a weighted
  sum, calculated as follows: (percentage_ESTAT10_I55_56 * weightI55_56) + (percentage_ESTAT10_N79
  * weightN79). Weight is the share of number of enterprises in the specific NOGA
  sector (I55+I56 or N79), over the total number of enterprises in NOGA sectors I55,I56,N79.
  Percentage is the NOGA specific share of enterprises providing personnel training
  on digital skills. UNCERTAINTY AND LIMITATIONS: Limited NACE breakdown. Not including
  micro enterprises (<10 employees). DATA SOURCES: isoc_ske_ittn2 (10_I55_56, 10_N79)
  [ESTAT]; sbs_na_sca_r2 [ESTAT].'
