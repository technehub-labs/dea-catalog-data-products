id: dea:data-product-637c9225bad9521cdab12ba2-fisheries-co-qg3ms8
type: DataProduct
name: Fisheries control statistics
description: 'In order to protect fisheries resources, marine biodiversity and fishing-related
  economic activity in the long term, the State Startup [MonitorFish & MonitorEnv](https://beta.gouv.fr/startups/monitorfish.html)
  is developing tools to improve the targeting and monitoring of fisheries and marine
  environment controls. With regard to fisheries, the State Startup has defined indicators
  to assess its impact, including: * the **infringement rate** on the checks carried
  out: the more checks are carried out on these relevant targets, the higher the share
  of checks involving an infringement must be * the share of checks carried out on
  a high-risk fleet segment**: [European Regulation 2018/1986](https://eur-lex.europa.eu/legal-content/FR/TXT/?uri=CELEX%3A32018D1986\&qid=1668767130195)
  sets a target of 60% controls on certain fisheries to be carried out on a "high"
  or "very high" risk fleet segment according to the risk analysis carried out according
  to the [EFCA methodology](https://www.efca.europa.eu/en/content/guidelines-risk-assessment-methodology-fisheries-compliance).
  This objective reflects a desire for efficiency in the use of State resources, by
  focusing the use of means of control on fleet segments with real issues of resource
  protection. The State Startup publishes for this purpose: * the **definition of
  EFCA fleet segments** by which France is concerned * of **fisheries control statistics**
  For the file of **control statistics**, the columns of the file are as follows:
  * **control\_year**: year of inspection * **control\_type**: type of control. Possible
  values: * Check on Landing * Control at sea * Air traffic control * **facade**:
  Maritime facade of the control (see map below). For the metropolitan facades (SA,
  NAMO, MEMN, MED), the areas have been extended beyond the boundaries of the French
  EEZ. Possible values: * NAMO: North Atlantic-West Channel * SA: South Atlantic *
  MEMN: Manche-Est-Mer-du-Nord * MED: Mediterranean * Martinique * Guyana * Guadeloupe
  * South I'
