id: dea:data-product-19a3d556-20eb-44a2-88aa-5266a0-aspects-rela-nupnmy
type: DataProduct
name: Aspects related to the use of ground-mounted photovoltaic installations
description: 'Aspects related to use as set out in the document "Freistehende Photovoltaikanlagen:
  Methodische Grundlage des Bundes" (Ground-mounted photovoltaic installations: methodological
  basis of the Confederation; published in german and french) are taken into account,
  particularly concerning radiation, topography, soil type and accessibility. For
  other important aspects such as connection to the electricity grid or natural hazards,
  the appropriate geodata was not available at the national level when the maps were
  produced (2025). The content of the map therefore represents an initial estimate
  by the federal services involved. For the spatial planning designation of suitable
  areas in accordance with Article 10 of the Energy Act, further usage interests not
  shown on this map must be taken into account..'
