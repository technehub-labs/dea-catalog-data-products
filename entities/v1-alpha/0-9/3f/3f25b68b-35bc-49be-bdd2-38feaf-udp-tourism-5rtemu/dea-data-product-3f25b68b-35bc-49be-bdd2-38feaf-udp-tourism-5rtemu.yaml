id: dea:data-product-3f25b68b-35bc-49be-bdd2-38feaf-udp-tourism-5rtemu
type: DataProduct
name: UDP - Tourism seasonality
description: 'This indicator measures the temporal concentration of tourism activity
  throughout the year, potentially revealing unbalanced pressure and economic activity,
  as well as vulnerability to demand shocks. As such, a high seasonality is potentially
  detrimental for socio-economic resilience of tourism. This indicator is obtained
  by calculating the coefficient of variation (standard deviation divided by average)
  of nights spent at tourist accommodation establishments by month. Low indicator
  values are preferred, as they represent low seasonality. This indicator is part
  of the socio-economic pillar of the EU Tourism Dashboard. UNIT OF MEASURE: Coefficient
  of variation. RESOLUTION: NUTS0, NUTS2. COMPLETENESS: 100%. METHODOLOGY: Coefficient
  of variation of monthly nights spent.. DATA SOURCES: Nights spent at tourist accommodation
  establishments - monthly data (tour_occ_nim) [ESTAT].'
