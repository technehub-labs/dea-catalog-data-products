id: dea:data-product-4171-electricity-and-heat-prod-electricity-eabdgu
type: DataProduct
name: Electricity and heat; production and input by energy commodity, 1998-2024
description: 'This table shows the production of electricity in the Netherlands from
  the various possible energy commodities. Electricity is mainly produced from the
  transformation of fossil fuels, biomass, nuclear energy and renewable energy. Figures
  broken down by energy commodity are given on the production of electricity and the
  released useful used heat, such as used for heating of buildings or greenhouses.
  Central and decentral production of electricity and heat is distinguished. The coordinated
  production of electricity and heat is generated by plants that deliver to the national
  high voltage grid of electricity transmission operator TenneT. Decentrally produced
  electricity and heat is not produced separately, such as by installations located
  in companies for which the production of electricity and heat is not the primary
  purpose. It also includes wind energy, solar energy and hydro power. Data available:
  From 1998 onwards Status of the figures: Figures up to 2023 are definite figures
  and figures for 2024 are revised provisional. Changes as of 19 June 2026: None,
  this table has been discontinued. The successor of this table is ''Electricity and
  heat; production, input, and capacity by energy commodity. See section 3. Changes
  as of 18 November 2025: Figures of 2023 and 2024 are updated. For 2022, the figure
  for the production of solar photovoltaic was revised. It was modified by 0.01% (2000
  MWh). When will new figures be published? Not applicable.'
