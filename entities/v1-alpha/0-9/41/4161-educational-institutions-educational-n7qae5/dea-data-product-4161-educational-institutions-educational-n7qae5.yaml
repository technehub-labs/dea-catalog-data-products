id: dea:data-product-4161-educational-institutions-educational-n7qae5
type: DataProduct
name: Educational institutions; Finances 1998-2018
description: 'This table contains information on the finances of government-funded
  institutions in primary, secondary and tertiary education. Primary education, primary
  special education (SBO) and primary special needs education (SO). Secondary education
  secondary general education, secondary vocational education (MBO) and adult education.
  Tertiary education encompasses higher professional education (HBO) and university
  education (WO). All educational institutions are funded by the Ministry of Education,
  Culture and Science as of 2018. Educational institutions that provided agricultural
  education were funded by the Ministry of Economic Affairs until 2018. Educational
  institutions are legally obligated to submit their financial statements before the
  1st of July to the Education Executive Agency (DUO) of the Ministry of Education,
  Culture and Science. The data from the financial statements is processed by DUO
  and certified to Statistics Netherlands. Financial information regarding primary
  educational institutions is available from 2006 onwards, as a result of the introduction
  of lump sum funding in the same year, which legally obligated these institutions
  to provide their financial information to the Ministry of Education, Culture and
  Science. The finances for the educational institutions in the secondary and tertiary
  education are available since 1998. Financial information related to special-needs
  educational institutions is available separately and concerns the educational institutions
  with school boards independently overseeing special-needs education in both primary
  and secondary education. Please note that the educational institutions of Caribbean
  Netherlands are included in the table from 2010 onwards, due to the islands of Caribbean
  Netherlands becoming part of the Netherlands as of October 2010. Data available
  from 1998 to 2018. Status of the figures: The figures for the period 1998-2017 are
  definite. The figures for 2018 are provisional. Because this table is discontinued'
