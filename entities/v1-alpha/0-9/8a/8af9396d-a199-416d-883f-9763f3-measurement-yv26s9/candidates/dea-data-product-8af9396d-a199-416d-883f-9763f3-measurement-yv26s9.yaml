name: Measurement values air pressure reduced with standard atmosphere (QNH), 10 min
  mean
description: Current measurement values of Pressure reduced QNH, 10 min [hPa]. Data
  is updated every 10 minutes. The data set contains all weather stations of the SwissMetNet,
  the automatic monitoring network of MeteoSwiss, which comprises 160 automatic monitoring
  stations. These stations deliver a multitude of current data on the weather and
  climate in Switzerland every ten minutes.
