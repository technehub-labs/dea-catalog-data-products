name: PDM 2024 - Conditioning Plant - National Agricultural Reserve
description: '# 2aamendment to the 1st revision of the Municipal Master Plan The Municipal
  Master Plan of Águeda (PDM of Águeda) had its first version published in 1995 and
  during its validity was subject to corrections, amendments and a revision. To date,
  it is worth mentioning, as the most significant, the 1st Review of the MIP of Águeda
  (Notice No. 3341/2012, published in DR No. 44, 2nd series, 1 March), which repealed
  the MIP of 1995, and the 2nd Amendment to the 1st Review of the MIP of Águeda (Notice
  No. 3841/2024, published in DR No. 35, 2nd series, of 19 February). The elements
  of the PDM of Águeda are available in [Plano Diretor Municipal de Águeda - CM Águeda]
  (https://www.cm-agueda.pt/viver/urbanismo-ordenamento-do-territorio-e-politicas-de-habitação/planos-municipais-de-ordenamento-territorio/plano-diretor-municipal-de-agueda)
  The plants that make up the PDM of Águeda are as follows: Conditioning Plant – General
  Conditions; Conditioning Plant – Forest Fire Hazard; Conditioning Plant – Forest
  Fire Protection Network; Conditioning Plant – National Agricultural Reserve; Conditioning
  Plant – National Ecological Reserve; Spatial Planning Plan – Spatial Planning; Planning
  Plan – National Ecological Structure; Planning Plan – Heritage; Planning Plan –
  Flood and Flood Risk; Spatial Planning Plan – Clearance Areas; Planning Plan – Sensitive
  and Mixed Areas. The spatial data of the PDM of Águeda provided by the municipality
  do not exempt the consultation of the elements of the plan in the format published
  in the Diário da República. The scale of use of spatial data is 1/10 000 (plan publication
  scale).'
