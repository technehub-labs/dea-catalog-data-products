type: DataProduct
name: Health, disorders, limitations; personal characteristics, 2010-2013
description: 'This table provides data about the health, chronic disorders and functional
  limitations of the Dutch population. It repeats the following aspects: - perceived
  state of health - chronic disorders - generic health indicator - mental health and
  mental complaints - infectious diseases - feelings of discomfort - functional limitations
  The data are based on the Health Interview Survey conducted by Statistics Netherlands.
  They can be broken down by a number of personal characteristics. The Health Interview
  Survey is a continuous survey. Its population fed of Dutch residents of all ages
  in private households. Data available from 2010 inclusively 2013 Status of the figures:
  Figures in this table are final. Changes as of 24 July 2015: None, this table is
  stopped. When will new figures be published? Not applicable.'
