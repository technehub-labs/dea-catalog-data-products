name: Labour force; main figures by sex and other characteristics 1996-2014
description: 'This table reproduces yearly and quarterly figures on the main aspects
  of the labour force broken down by sex and other personal characteristics. Data
  available from 1996 to 2014 Status of the figures: The figures in this table are
  final. Changes as of 13 February 2015: None, this table was stopped. When will new
  figures be published? This table is stopped. The update of 13 February 2015 was
  the last update of this table. On 26 February 2015 new revised tables about the
  labour force have been published. The revision of the labour force statistics comprised
  of two parts. The definitions will be adjusted to the international standard definitions
  and data collection is improved by using web interviewing. For more information
  about this revision, see the link to the press release in paragraph 3.'
