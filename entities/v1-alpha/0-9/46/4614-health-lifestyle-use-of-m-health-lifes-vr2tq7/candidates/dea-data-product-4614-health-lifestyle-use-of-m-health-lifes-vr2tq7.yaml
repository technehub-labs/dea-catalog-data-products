name: Health, lifestyle, use of medical facilities; 2000-2009
description: 'This table provides data about the health, lifestyle and medical and
  use of medical care of the Dutch population. The data are based on the Health Interview
  Survey conducted by Statistics Netherlands. The Health Interview Survey is a continuous
  survey. Its population fed of Dutch residents of all ages in private households.
  Data available from 2000 till 2009. Changes as of 8 June 2018: The table has been
  stopped on 8th of June 2018. Status of the figures: The figures in this table are
  definitive. When will new figures be published? Not applicable.'
