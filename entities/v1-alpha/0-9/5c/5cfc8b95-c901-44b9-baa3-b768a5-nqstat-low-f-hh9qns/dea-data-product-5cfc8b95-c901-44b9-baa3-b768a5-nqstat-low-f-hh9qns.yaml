id: dea:data-product-5cfc8b95-c901-44b9-baa3-b768a5-nqstat-low-f-hh9qns
type: DataProduct
name: NQStat low-flow statistics
description: A wide variety of parameters may be used to describe low-flow events.
  The FOEN Hydrology Division's low-flow statistics are based on the recommendations
  of the German Association for Water, Wastewater and Waste (DWA, formerly DVWK, 1982/1992).
  They include the annual values for the lowest mean discharge over a given number
  of days x (NMxQ). The parameter NMxQ is of interest in relation to planned withdrawals
  or releases. The data are updated annually.
