id: dea:data-product-3c27671e-8bec-47c7-b702-e66b29-city-of-vant-4vx4jw
type: DataProduct
name: City of Vantaa revenue and expenditure
description: The data includes the income and expenditure of the City of Vantaa according
  to the financial statements and the utilisation plans of the budgets for the years
  in question. The dataset includes the utilisation plan and implementation data of
  the city itself and its municipal enterprises and funds. The All- tab shows how
  the units (column B) are connected to the unit groups (column D), sectors (column
  F), divisions (column H) and companies (column J). In addition, this tab shows the
  links of the accounts (column L) to different account groups (column M). The data
  can be viewed down to the unit and account level. From 2020 onwards, the data only
  contains the data tab (All).
