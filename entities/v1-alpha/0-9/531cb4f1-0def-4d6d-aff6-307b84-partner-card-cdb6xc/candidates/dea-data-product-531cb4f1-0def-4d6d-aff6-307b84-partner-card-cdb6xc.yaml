type: DataProduct
name: Partner card of the UmweltPartnerschaft Hamburg
description: 'The dataset contains the master data of the active partners of the UmweltPartnerschaft
  Hamburg. The UmweltPartnerschaft (Environmental Partnership) is the institution
  for the promotion of voluntary corporate environmental protection in Hamburg. Active
  partners of the network voluntarily contribute more to environmental and climate
  protection than required by law. Together with the sponsors of our initiative, we
  support the companies in the implementation of new measures in terms of environmental
  protection. The partner card of the UmweltPartnerschaft Hamburg (web portal) is
  intended to strengthen the networking of the active environmental partners and to
  present the active environmental partners to the citizens of Hamburg. For each active
  environmental partner, the following is shown georeferenced: - Name of the company
  - Address (street, house number, postcode, city) - Industry/industry In addition,
  a filter function with the following sortings is offered in the web portal: - district
  - Economic field - Sector of activity'
