id: dea:data-product-13078-mobiliteit-van-werknemer-mobility-of-p6cd4v
type: DataProduct
name: Mobility of workers; Characteristics of mobility, 4th kw. 2016-3rd Q. 2018
description: 'This table provides figures on the shares of different forms of inflows
  and outflows. The shares are a percentage of the total mobility of workers in the
  care and welfare sector without University Medical Centers (UMC). The reference
  date for the figures is the last day of each quarter. The figures are divided into
  different branches in the care and welfare sector. The figures can be broken down
  by region (part of the country, province, RegioPlus labour market region). Employees
  are counted as the number of unique individuals within an industry who accrue pension
  at the Pension Fund for Care and Welfare (PFZW). The figures in this table come
  from PFZW. UMCs do not participate in this pension fund. Data on these institutions
  is currently missing, so the totals for the care and welfare sector in this table
  are currently missing. This table was developed within the framework of the Labour
  Market, Care and Welfare (AZW) research programme. For more trends and developments
  in the field of the labour market in care and welfare, see www.AZWinfo.nl (see paragraph
  3). Data available from: Q4 2016 to Q3 2018. Status of figures: The figures for
  the two most recent quarters in the table are very preliminary. All other figures
  are provisional. As this table has been discontinued, the data are no longer made
  definitive. Changes as of 22 July 2019: This table has been discontinued. When will
  there be new figures? No longer applicable. This table has been followed by the
  new tables (see paragraph 3).'
