id: dea:data-product-9083b72a-c58b-49f1-a35c-1bebea-official-sch-3pdgey
type: DataProduct
name: Official school statistics of general education schools in Greifswald by school,
  type of school and grade (from the 2024/2025 school year)
description: '**official school statistics** show the number of pupils as of the 2024/2025
  school year the general education schools in public and independent sponsorship
  in the area of the University and Hanseatic City of Greifswald. The data shall be
  provided for the following dimensions: - School year and reference date - School
  (service number, school name, address) - type of school, form of organisation and
  legal status - Educational level (primary, lower secondary, upper secondary, vocational)
  - Level type (teaching by individual years or cross-class teaching) - Year level
  **Update cycle:** - The data is updated annually. **Missing values:** - In the case
  of inter-class teaching (level type = ‘aggregate’), no individual grades are shown.
  **General notes:** - The official school statistics are published on behalf of the
  Ministry of Education and Children''s Day Support Mecklenburg-Vorpommern by the
  Mecklenburg-Western Pomerania Statistical Office on the basis of the Mecklenburg-Western
  Pomerania School Statistics Ordinance (SchulStatVO M-V). - The data will be provided
  by the University and Hanseatic City of Greifswald for publication in the Open Data
  Portal Prepared and maintained. - The service number serves as a unique identifier
  of a school in the official school statistics Mecklenburg-Western Pomerania. - School
  names can be adjusted or corrected over time. The service number allows for a clear
  Assignment of a school over several school years. - A school can be included several
  times in the dataset due to different types of school, educational levels and grades.
  This enables a differentiated evaluation of the number of students by level of education
  and grade.'
