type: DataProduct
name: 1960 Local elections- election statistics
description: 'This document sets out the following statistics from the 1960 local
  elections: i) The number of local electors, valid poll and percentage turnout for
  elections in the County and County Borough Corporations elections. ii) The number
  of electors, valid poll and percentage turnout for elections in the Boroughs and
  Urban District Council elections. iii) The number of electors, valid poll and percentage
  poll for elections in the Town Commissioners elections.'
