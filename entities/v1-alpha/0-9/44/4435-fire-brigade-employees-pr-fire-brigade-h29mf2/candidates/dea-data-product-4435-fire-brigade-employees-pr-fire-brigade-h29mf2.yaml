id: dea:data-product-4435-fire-brigade-employees-pr-fire-brigade-h29mf2
type: DataProduct
name: Fire brigade employees; professional and voluntary, ranks, region 2000-2019
description: 'This table includes information on the number of employees of municipal
  and regional fire brigades and security regions on 1 January of the reference year.
  Operational staff are broken down by professional and voluntary status. Since 2005,
  non-operational fire brigade employees are also included. Operational staff is broken
  down by rank and non-operational staff by education level. The figures refer to
  the situation on 1 January of a particular year. Data are available for the Netherlands
  as a whole and for each security region. Since 1 January 2011, figures may vary
  from previous years due to introduction of a new ranking system and a revised questionnaire.
  Since that date, the questionnaire can be completed consistently with the new ranking
  system as published in ‘Decree on Personnel Safety Regions’ (for details see: Bulletin
  of Acts and Decrees 2010, No 253)’. The “Leidraad Conversion Rangen van de Nederlandse
  Vereniging voor Brandweerzorg en Rampenbestrijding (NVBR)” is used for the translation
  from function to rank and from the old to the new ranking system. Since 2012, higher
  and mid-level ranks are included in one category. This decision was made because
  a reliable break-down by region cannot be made. Since 1 January 2011, the definitions
  of professional, voluntary and non-operational staff are also adjusted. The security
  regions Limburg Noord and Brabant-Zuidoost could not deliver data of 2019 before
  the closing date of the survey.They agreed that the figures for 2018 are also valid
  for 2019. The security regions of Kennemerland and Haaglanden have declared that
  for 2019 they have reported data with a higher quality than before. They agreed
  that the figures for 2019 are retroactively also valid for 2018. Data available
  from: 2000. Status of the figures: Figures for the period 2000-2018 are definitive
  and figures for the year 2019 are provisional. Changes effective from 25 February
  2021: None, this table has been discontinued. When will new figures be publish'
