id: dea:data-product-4417-population-and-population-population-a-vguvvw
type: DataProduct
name: Population and population dynamics by month; 1995-2018
description: 'This table includes information on the size of the Dutch population,
  as well as births, deaths, international migration, persons who moved within or
  between municipalities, marriages, registered partnerships, marriage dissolutions
  and requests for asylum, per month, quarter and year. Since January 2010, a new
  production system has become operational to process municipal population data. As
  from 2010 onwards, with the introduction of the new system the following changes
  were implemented: Provisional figures on live births by rank number and marital
  status of the mother will no longer be available. Definite figures will be added
  to the table on an annual basis; - Marriages will include registered partnerships;
  - Data on registered partnerships will be discontinued; Married persons will include
  persons who have signed partnership contracts. An additional preceding marital status
  (married) has been added; Marriage dissolutions will be presented including registered
  partnership dissolutions; - Divorced persons will be presented including legally
  completed partnerships; Data on persons who have moved house within the Netherlands
  will no longer be broken down by place in the household. Data available from January
  1995 till Ocotber 2018. Status of the figures: - All figures on Asylum requests
  are final. All figures of 1995 up to and including 2017 are final. Figures for the
  1st of January 2018 are final, the other figures on the population of 2018 are provisional.
  The updating of asylum applications in this table has been discontinued with effect
  from 2012. Changes effective from 14 January 2019: None, the table has been discontinued.
  When will new figures be published? Not applicable. This table will be followed
  up by ''Population dynamics; month and year'' see paragraph 3.'
