type: DataProduct
name: Blue Agenda Wet Damage Agriculture Current
description: This file contains the current average groundwater levels over the period
  2 012 to 2019. These are the phreatic groundwater levels (model layer 1). The reference
  situation is the situation in 2050 including autonomous development such as climate
  change according to the KNMI WH scenario. The impact assessment of the situation
  in 2050 (WH scenario) is the current situation as a reference.
