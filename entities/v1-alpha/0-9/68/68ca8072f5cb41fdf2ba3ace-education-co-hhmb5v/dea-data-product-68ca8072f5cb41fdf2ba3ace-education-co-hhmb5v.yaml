name: Education - colleges of the department of Haute-savoie - 2025
description: Education - colleges of the department of Haute-Savoie - 2025 colleges-74
  The colleges of the department of Haute-Savoie and their sectors. Public colleges
  give priority to students living in their recruiting sector. This sector is determined
  by the student’s place of residence. It is therefore neither the primary school
  attended nor the place of professional practice of the parents that determines the
  sector college.
