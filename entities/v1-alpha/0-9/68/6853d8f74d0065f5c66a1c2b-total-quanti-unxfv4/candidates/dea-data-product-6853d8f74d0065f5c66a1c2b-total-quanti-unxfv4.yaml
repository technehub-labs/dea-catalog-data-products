id: dea:data-product-6853d8f74d0065f5c66a1c2b-total-quanti-unxfv4
type: DataProduct
name: Total quantity of plant protection product purchased in France
description: The Ecophyto 2030 strategy is the national strategy to reduce dependency
  and risk associated with the use of plant protection products; the widespread use
  of these products has increased productivity but has negative consequences for human
  health and the environment as a whole (fauna, flora, aquatic environments and water
  resources). The indicator represents the quantities of phytosanitary substances
  purchased in France in the year, in tonnes. The data relate to purchases and sales
  of plant protection products, from the National Sales Bank (BNV-D) fed by distributors
  of plant protection products. They concern the quantities of active substances contained
  in plant protection products and do not take into account adjuvants. The quantities
  of active substances purchased do not necessarily reflect the place, quantity applied
  or period of application of the treatments.
