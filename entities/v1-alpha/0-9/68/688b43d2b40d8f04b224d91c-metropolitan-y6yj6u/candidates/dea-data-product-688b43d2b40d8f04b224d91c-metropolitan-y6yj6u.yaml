name: Metropolitan Plan for Adaptation to Climate Change
description: The Metropolitan Plan for Adaptation to Climate Change (PMAAC) aims to
  integrate adaptation to climate change in inter-municipal and municipal planning,
  and to create a culture of cooperation across the various sectors and socio-economic
  actors of the region, capable of strengthening territorial resilience throughout
  the territory. The metropolitan vision that underpinned the plan's construction
  is the reduction of AML's vulnerability to climate change. The region as a whole
  should promote adaptation as a tool to build a more sustainable territory, capable
  of ensuring a more equitable and territorially fairer development model that affirms
  its capacity for innovation and its global attractiveness.
