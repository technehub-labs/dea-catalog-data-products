type: DataProduct
name: ERA5 Land precipitation daily sum
description: 'Overview: era5.copernicus: precipitation daily sums from 2000 to 2020
  resampled with CHELSA to 1 km resolution Traceability (lineage): The data sources
  used to generate this dataset are ERA5-Land hourly data from 1950 to present (Copernicus
  Climate Data Store) and CHELSA monthly climatologies. Scientific methodology: The
  methodology used for downscaling follows established procedures as used by e.g.
  Worldclim and CHELSA. Usability: The substantial improvement of the spatial resolution
  together with the high temporal resolution of one day further improve the usability
  of the original ERA5 Land time series product which is useful for all kind of land
  surface applications such as flood or drought forecasting. The temporal and spatial
  resolution of this dataset, the period covered in time, as well as the fixed grid
  used for the data distribution at any period enables decisions makers, businesses
  and individuals to access and use more accurate information on land states. Uncertainty
  quantification: The ERA5-Land dataset, as any other simulation, provides estimates
  which have some degree of uncertainty. Numerical models can only provide a more
  or less accurate representation of the real physical processes governing different
  components of the Earth System. In general, the uncertainty of model estimates grows
  as we go back in time, because the number of observations available to create a
  good quality atmospheric forcing is lower. ERA5-land parameter fields can currently
  be used in combination with the uncertainty of the equivalent ERA5 fields. Data
  validation approaches: Validation of the ERA5 Land ddataset against multiple in-situ
  datasets is presented in the reference paper (Muñoz-Sabater et al., 2021). Completeness:
  The dataset covers the entire Geo-harmonizer region as defined by the landmask raster
  dataset. However, some small islands might be missing if there are no data in the
  original ERA5 Land dataset. Consistency: ERA5-Land is a reanalysis dataset providing
  a con'
