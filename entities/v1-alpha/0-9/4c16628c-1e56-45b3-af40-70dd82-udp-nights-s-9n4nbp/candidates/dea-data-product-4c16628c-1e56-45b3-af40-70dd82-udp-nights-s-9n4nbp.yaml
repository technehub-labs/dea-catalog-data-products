id: dea:data-product-4c16628c-1e56-45b3-af40-70dd82-udp-nights-s-9n4nbp
type: DataProduct
name: UDP - Nights spent
description: 'This descriptor measures the total number of nights spent at tourist
  accommodation establishments in a destination (country or region) in a given year,
  from both domestic and foreign tourists. It provides an account of the absolute
  dimension of a tourism destination from the demand perspective. Higher values indicate
  higher tourism demand. This descriptor is provided in the EU Tourism Dashboard as
  complementary information to characterize tourism demand. UNIT OF MEASURE: Nights.
  RESOLUTION: NUTS0, NUTS2, NUTS3. COMPLETENESS: 100%. DATA SOURCES: tour_occ_nin,
  tour_occ_nin2 [ESTAT].'
