description: 'This table contains data on the employment offered, the cost and revenue
  structure, operating and financial result for a large number of sectors and branches
  according to the Statistics Netherlands'' Standard Business Classification 2008
  (SBI 2008). Data available from: 2009. Status of figures: All figures in the table
  are final. Changes as of 24 April 2026: Figures for 2024 have been added. When will
  there be new figures? The results will be available approximately 15 months after
  the end of the reporting year. Results for reporting year 2025 will be published
  in March/April 2027.'
