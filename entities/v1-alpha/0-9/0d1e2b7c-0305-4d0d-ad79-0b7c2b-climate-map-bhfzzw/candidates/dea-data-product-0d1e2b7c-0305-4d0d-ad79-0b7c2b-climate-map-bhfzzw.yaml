id: dea:data-product-0d1e2b7c-0305-4d0d-ad79-0b7c2b-climate-map-bhfzzw
type: DataProduct
name: Climate map night
description: 'The climate map night represents the nightly overheating on settlement
  and traffic areas ("efficacy areas") as well as the importance of green and open
  spaces ("compensation areas") for the nocturnal city climate. Classification: The
  classification of nighttime overheating is based on the temperature difference between
  the settlement area and the adjacent open spaces at the same altitude. The classification
  of the green and open spaces is based on their importance for cold air processes
  and the proximity to thermally polluted areas in the settlement area.'
