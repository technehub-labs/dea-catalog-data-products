name: Low and very low emission vehicles in the Transport en Commun Lyonnais network
description: 'Pursuant to the II of Article D. 224-15-13 of the Environmental Code,
  the data relating to vehicle fleet renewals and the proportion of low and very low
  emission vehicles in these renewals, are defined and made available in accordance
  with the rules defined in the benchmark annexed to the Decree of 29 December 2020.
  These data are based on the following national scheme: https://schema.data.gouv.fr/etalab/schema-vehicules-faibles-emissions-renouvellement-parc/0.1.0/'
