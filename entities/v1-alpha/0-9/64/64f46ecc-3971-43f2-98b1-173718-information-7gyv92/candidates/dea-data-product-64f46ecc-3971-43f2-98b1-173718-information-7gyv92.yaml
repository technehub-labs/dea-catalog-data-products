id: dea:data-product-64f46ecc-3971-43f2-98b1-173718-information-7gyv92
type: DataProduct
name: Information about transport by long-distance buses in Greece
description: This dataset provides information concerning the transport by long distance
  buses in Greece operated by KTEL Bus Companies. The information includes routes/lines
  and timetables, passenger classes and fare products (common and special) transport
  by long-distance buses in Greece. It also includes contact details of bus stations
  in the capital cities of each NUTS 3 Region in Greece. Το παρόν σύνολο δεδομένων
  παρέχει πληροφορίες σχετικές με τις δυνατότητες μεταφοράς με λεωφορεία μεγάλων αποστάσεων
  στην Ελλάδα μέσω των δρομολογίων που παρέχονται από τα ΚΤΕΛ της χώρας. Οι πληροφορίες
  περιλαμβάνουν δρομολόγια και πρόγραμμα δρομολογίων, θέσεις επιβατών και προϊόντα
  ναύλων (ειδικοί, κανονικοί). Επιπλέον, περιλαμβάνει τα στοιχεία επικοινωνίας των
  σταθμών των ΚΤΕΛ στις πρωτεύουσες των Νομών.
