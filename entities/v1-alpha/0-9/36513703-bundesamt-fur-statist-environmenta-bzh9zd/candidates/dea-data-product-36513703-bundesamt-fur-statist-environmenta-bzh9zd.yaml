type: DataProduct
name: Environmentally related taxes accounts by economic player
description: This table presents the annual figures on environmentally related taxes
  revenues by tax category (energy, transport, pollution), by economic player (primary,
  secondary and tertiary sectors, households, non-residents) and compared to various
  economic data (gross value added, gross domestic product, total revenue from taxes
  and social contributions), since 1990.
