name: INSPIRE - Annex II Theme Land Cover - Land Parcel Identification System (LPIS)
  - Ecological Focus Areas (EFA) - Landscape features
description: 'Landscape features on the reference parcels (LPIS). The landscape features
  layer is one of the Ecological Focus Areas (EFA) layers with serves to attribute
  landscape features to land parcels declared in the geospatial aid application GSAA.
  These areas are taken into account in the framework of the Greening scheme [Article
  46 of Regulation (EU) No 1307/2013] and Agri-Environment-Climate-Measures (AECM)
  [Article 28 of Regulation (EU) No 1305/2013]. Ecological Focus Areas (EFA) are areas
  designated to bring about benefits for the environment, improve biodiversity and
  maintain attractive landscapes. EFAs may include landscape features, buffer strips,
  catch crops, fallow land, areas with nitrogen fixing crops etc. The landscape features
  layer is part of the Land Parcel Identification System (LPIS). LPIS is a key component
  of the IACS. It is an IT system based on ortho imagery (aerial or satellite photographs)
  which records all agricultural parcels in the Member States. It serves two main
  purposes: to clearly locate all eligible agricultural land contained within reference
  parcels and to calculate their maximum eligible area (MEA). The LPIS is used for
  cross checking during the administrative control procedures and as a basis for on
  the spot checks by the paying agency. Disclaimer : The original source data represented
  forest edges as line geometries. To comply with INSPIRE specifications, the line
  geometries have been converted into polygon geometries. A 5 m buffer (2.5 m on each
  side of the original line) has been applied to convert them into polygon geometries.'
