id: dea:data-product-939fd61e76baa7a6b4d58d53ea128f-fgedkx
type: DataProduct
name: Στατιστικά Δεδομένα Κεντρικού Τομέα Περιφέρειας Αττικής
description: 'Καταγραφή συγκεντρωτικών εξαμηνιαίων και ετησίων στατιστικών στοιχείων
  Διεύθυνσης Υγειονομικού Ελέγχου και Περιβαλλοντικής Υγιεινής ΠΕ Κεντρικού Τομέα
  Αθηνών Περιλαμβάνει : Στατιστικά από υγειονομικούς ελέγχους που διενεργήθηκαν σε
  καταστήματα υγειονομικού ενδιαφέροντος σχετικών με τρόφιμα συνολικές δράσεις του
  γραφείου Απολυμαντηρίου το πρόγραμμα καταπολέμησης των κουνουπιών Δειγματοληψίες
  νερού ανθρώπινης κατανάλωσης και τροφίμων για μικροβιολογική και χημική εξέταση
  Δειγματοληψίες θαλάσσιου ύδατος ακτών κολύμβησης κ.λ.π Υγειονομικοί έλεγχοι Σχολικών
  εγκαταστάσεων'
