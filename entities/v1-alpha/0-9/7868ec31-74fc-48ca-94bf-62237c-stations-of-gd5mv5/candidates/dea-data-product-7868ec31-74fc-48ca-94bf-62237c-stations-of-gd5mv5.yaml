name: Stations of the Swiss National Basic Climatological Network
description: The Swiss National Basic Climatological Network (Swiss NBCN) connects
  the major ground-based stations within the MeteoSwiss monitoring network. It consists
  of 29 climate monitoring stations and 46 precipitation stations. The measurement
  series available in digital form for temperature, precipitation and hours of sunshine
  date back, in some cases, to the mid-nineteenth century.
