name: Non-motorised transport - Wanderland Schweiz
description: “Wanderland Schweiz” from SchweizMobil comprises the national, regional
  and local hiking and mountain walking routes and barrier-free trails in Switzerland
  and Liechtenstein. This data set is published in accordance with the Geoinformation
  Ordinance as part of the geo data set “Walking and hiking networks”. It is compiled
  in conjunction with the Federal Roads Office, FEDRO, the Swiss hiking routes, SchweizMobil
  and the cantons.
