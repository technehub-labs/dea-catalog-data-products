name: Atlas of the Environment
description: The National Atlas of the Environment, created in 1972, within the then
  newly created National Environment Commission (CNA) and which had as its main objective,
  the production of cartography for the general public, students, teachers and researchers
  from different scientific areas, was in the course of time undergoing functional
  changes. At the end of the 1980s, the digitization and vectorization of an important
  part of this estate, gave rise to the Digital Atlas of the Environment, once again,
  a pioneering and innovative step (even at European level) which constituted, for
  a long time, the basis of the National Geographic Information System (SNIG).
