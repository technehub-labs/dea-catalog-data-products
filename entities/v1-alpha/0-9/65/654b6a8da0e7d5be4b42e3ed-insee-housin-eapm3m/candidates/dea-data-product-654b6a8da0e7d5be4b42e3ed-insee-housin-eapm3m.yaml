type: DataProduct
name: INSEE- Housing, individuals, activity, school and occupational mobility, residential
  migration in 2019 – Zone E
description: 'The database “Housings, Individuals, Activity, School and Work Mobility,
  Residential Migration in 2019 Census of Population – Detail File” contains detailed
  data from the Census of Population in France in 2019. It is intended for professional
  users for in-depth analysis and behavior modelling. The data is anonymised to protect
  privacy, and it is presented in the production geography as of January 1, 2021.
  This database brings together the New Aquitaine regions (region 75) and Occitanie
  (region 76); Zone E: Regions Auvergne-Rhônes-Alpes (region 84), Provence-Alpes-Côte
  d’Azur (region 93), Corsica (region 94), Guadeloupe (region 01), Martinique (region
  02), French Guiana (region 03) and Réunion (region 04).'
