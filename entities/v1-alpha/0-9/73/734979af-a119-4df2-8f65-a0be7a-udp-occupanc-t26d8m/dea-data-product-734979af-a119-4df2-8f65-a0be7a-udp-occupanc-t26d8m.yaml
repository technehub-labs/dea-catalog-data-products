type: DataProduct
name: UDP - Occupancy rate
description: 'The occupancy rate is the percentage of time within a year that available
  bed-places within a tourist destination (country of region) are occupied with tourists.
  It provides an indication of balance between capacity and demand. Low values may
  signal over capacity or the potential to attract more demand. This descriptor is
  provided in the EU Tourism Dashboard as complementary information to characterize
  tourism supply and demand. UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS:
  100%. METHODOLOGY: Net occupancy rate of bedrooms. DATA SOURCES: tour_cap_nuts2
  [ESTAT].'
