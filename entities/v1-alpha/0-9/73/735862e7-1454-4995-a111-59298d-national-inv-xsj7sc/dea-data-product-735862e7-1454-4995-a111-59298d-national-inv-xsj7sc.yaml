name: National Inventory of Architectural Heritage
description: Point feature data represents National Inventory of Architectural Heritage
  within pilot study area. The National Inventory of Architectural Heritage (NIAH)
  is a state initiative under the administration of the Department of the Environment,
  Heritage and Local Government and established on a statutory basis under the provisions
  of the Architectural Heritage (National Inventory) and Historic Monuments (Miscellaneous
  Provisions) Act 1999. The purpose of the NIAH is to identify, record, and evaluate
  the post-1700 architectural heritage of Ireland, uniformly and consistently as an
  aid in the protection and conservation of the built heritage. NIAH surveys provide
  the basis for the recommendations of the Minister for the Environment, Heritage
  and Local Government to the planning authorities for the inclusion of particular
  structures in their Record of Protected Structures (RPS). The published surveys
  are a source of information on the selected structures for relevant planning authorities.
  They are also a research and educational resource. It is hoped that the work of
  the NIAH will increase public awareness and appreciation of Ireland's architectural
  heritage. BACKGROUND 1. Granada Convention The Council of Europe, in Article 2 of
  the 1985 Convention for the Protection of the Architectural Heritage of Europe (Granada
  Convention), states that 'for the purpose of precise identification of the monuments,
  groups of structures and sites to be protected, each member State will undertake
  to maintain inventories of that architectural heritage.' The Granada Convention
  emphasises the importance of inventories in underpinning conservation policies.
  The NIAH was established in 1990 to fulfill Ireland's obligations under the Granada
  Convention, through the establishment and maintenance of a central record, documenting
  and evaluating the architectural heritage of Ireland. Article 1 of the Granada Convention
  establishes the parameters of this work by defining 'architectural heritage' unde
