type: DataProduct
name: Annual Energy Balances
description: The annual residential energy consumption statistic is an annual statistical
  operation whose objective is to provide complete and reliable information on consumption
  in the residential sector in Spain by uses. To this end, the different energy sources
  (electricity, petroleum-derived products, coal, natural gas, renewable sources and
  waste, heat pumps) and the main uses (space heating, space cooling, water heating,
  cooking, lighting and electrical appliances; and other final uses) are analyzed.
