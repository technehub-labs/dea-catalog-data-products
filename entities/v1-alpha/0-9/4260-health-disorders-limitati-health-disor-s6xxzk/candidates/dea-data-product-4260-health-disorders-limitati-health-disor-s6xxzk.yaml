type: DataProduct
name: Health, disorders, limitations; sex and age, 2010-2013
description: 'This table provides data about the health, chronic disorders and functional
  limitations of the Dutch population. It repeats the following aspects: - perceived
  state of health - chronic disorders - generic health indicator - mental health and
  mental complaints - infectious diseases - feelings of discomfort - functional limitations
  The data are based on the Health Interview Survey conducted by Statistics Netherlands.
  They can be broken down by sex and age. The Health Interview Survey is a continuous
  survey. Its population fed of Dutch residents of all ages in private households.
  Data available from 2010 till 2013. Status of the figures: The figures in this table
  are definitive. Changes as of 15 February 2019 None, the table has been discontinued.
  When will new figures be published? Not applicable. The table is stopped.'
