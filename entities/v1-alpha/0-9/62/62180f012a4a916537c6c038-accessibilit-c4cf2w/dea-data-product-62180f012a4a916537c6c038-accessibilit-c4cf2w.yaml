type: DataProduct
name: Accessibility alert for the public transport network in Lyon
description: From rolling stock renewal to the accessibility of stops, from passenger
  information to the implementation of specific services, SYTRAL Mobilités, in conjunction
  with its partners, has made the accessibility of its public transport networks a
  priority. Accessibility alerts identify elevators and escalators currently unavailable
  in metro and tram stations equipped with the Transport en Commun Lyonnais (TCL)
  network.
