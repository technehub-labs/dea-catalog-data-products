name: Business; labour and financial data, by sector, 2000-2005
description: 'This table contains data on the number of companies, persons employed
  and employees, operating income, operating income and expenses, financial result,
  provision balance and extraordinary result of a large number of SBI industries and
  branches. The numbers of companies are companies that on January 1 of the They were
  ''economically active''. These are companies where one or more More people work
  15 hours or more per week. This means that companies where less work was done are
  not included in the investigation. All other results in the table refer to all holdings
  were economically active during the year under review. The data are taken from more
  detailed industry-specific tables (see paragraph 3) and make it possible to inter-branch
  compare. These are the following industries and branches. 0141 Hoveniers and agricultural
  services; 10 - 14 Mining and quarrying; 15 - 37 Industry (except 3663.1); 3663.1
  Social work provision; 40 Production and distribution of electricity, natural gas,
  steam and hot water water; 41 Water extraction and distribution; 45 Construction;
  50 Trade in and repair of motor vehicles and motorcycles; service stations; 51 Wholesale
  trade and commercial intermediation; 52 Retail trade and repair for the benefit
  of individuals; 55 Hospitality; 60 - 64 Transport, storage and communication; 71
  Rental of transport equipment, machinery and equipment without service personnel
  and other movable property; 72 Computer service and information technology agencies
  and the like; 73 Research and development; 74 Other business services; 90 Environmental
  services; 93 Other services. For a statement by the SBI see Section 2. Data available
  for the years 2000 to 2005. Frequency: discontinued Status of figures: All figures
  in the table are final. Changes as of 15 October 2008: For the 2005 reporting year,
  the figures for the SBI are 36631 social Work revision corrected. The main reason
  for this is the provide new information on a limited number of companies. This table
