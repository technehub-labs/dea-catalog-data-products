id: dea:data-product-33004b66-bcea-4fe6-8bfa-f25bf6-v-rmef-rlust-fa4uze
type: DataProduct
name: Värmeförlusten i Helsingfors byggnader
description: 'The material describes the heat loss from the roofs of Helsinki. Thermal
  radiation detected on the roofs of buildings is presented in 30 cm pixels. The roofs
  of Helsinki were photographed using a thermographic camera in March 2015. Thermal
  radiation depends on the shape and structure of the roof as well as the temperature
  of the room below, so it is not a direct indication of the quality of the roof insulation.
  The material includes an [interpretation key](https://avoidatastr.blob.core.windows.net/opendata/OpenData/9_Maps/Maps_thermal
  radiation/interpretation_avain.JPG) that can be used to determine what the colour
  of your roof means in terms of insulation quality, based on the properties of your
  roof. The data was completed in the Decumanus project and was produced by Eurosense,
  a Belgian geographic information services company participating in the project.
  **The material can be previewed and downloaded from HSY''s map service:** - [Heat
  loss of buildings in Helsinki](https://kartta.hsy.fi/?zoomLevel=4&coord=25497952.5_6677018.5&mapLayers=108+100+raster&showMarker=true)
  **Coordinate systems:** - ETRS-GK25 (EPSG:3879). Maintenance coordinate system.
  The data can also be projected to other coordinates. Other possible coordinates
  can be found in the GetCapabilities document of the interface service. **API address:**
  - WMS interface: [https://kartta.hsy.fi/geoserver/wms](https://kartta.hsy.fi/geoserver/wms?request=getCapabilities)
  **Layers:** - climate_ja_energy:thermo_full_mosaic_helsinki'
