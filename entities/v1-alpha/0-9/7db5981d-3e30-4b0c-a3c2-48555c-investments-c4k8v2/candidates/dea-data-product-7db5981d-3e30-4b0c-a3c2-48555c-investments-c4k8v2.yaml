id: dea:data-product-7db5981d-3e30-4b0c-a3c2-48555c-investments-c4k8v2
type: DataProduct
name: Investments of the City of Vantaa
description: The data includes the financial statements and work programmes for the
  investments of the City of Vantaa. The dataset includes the investments of the city
  and its municipal enterprises and funds by project group. Investments can be monitored
  down to the unit and order level. Orders are first to units and then to sub-project
  groups and main project groups. From 2021 onwards, the Financial statement and the
  budget will be in their own columns.
