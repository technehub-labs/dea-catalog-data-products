id: dea:data-product-1810-bedrijfsleven-arbeid-en-f-business-lab-s8kfs7
type: DataProduct
name: Business; labour and finance, by sector, time series 1987-2008
description: 'This table contains time series on number of companies, employment,
  operating income and expenses, and results of a number of industries and branches.
  These series describe changes in key business indicators over the years. To compile
  the series, data was collected from various sources. Over time, for various reasons,
  breaks have arisen in the published figures, which means that not all of them are
  comparable. To make the figures comparable, "repairs" have been carried out (see
  paragraph 4). The data are taken from more detailed sector-specific tables (see
  paragraph 3) and make it possible to compare the sectors. These are the following
  sectors and branches: Motor and automotive industry (SBI 50, 501, 50102, 50104,
  502, 503, 504 and 505), Wholesale and retail trade (SBI 51 and 5210a), Horeca (SBI
  55, 551, 552, 553, 554 and 555), Transport (SBI 60 to 64), and Business services
  (SBI 72, 7412, 742 and 744). For the statement of the Standard Business Classification
  (SBI), see Section 3. Data available from 1987 to 2008 Status of figures: All figures
  in the table are final. Changes as of 29 June 2018: None, the table has been stopped.
  When will there be new figures? No longer applicable.'
