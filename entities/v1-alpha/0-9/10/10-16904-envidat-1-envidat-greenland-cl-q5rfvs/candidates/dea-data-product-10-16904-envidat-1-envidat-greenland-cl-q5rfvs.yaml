name: Greenland Climate Network (GC-Net) Data
description: 'In Memory of Dr. Konrad (Koni) Steffen -br /- -br /- Update October
  2022: The GC-Net is kindly continued by the Geological Survey of Denmark and Greenland
  (GEUS). Starting October 3, 2022, the access to the latest versions of the "ready
  to use" L1 data has been migrated to GEUS. Future data versions will be available
  at: [https://doi.org/10.22008/FK2/VVXGUT](https://doi.org/10.22008/FK2/VVXGUT) Background
  Starting with a single station in 1991, the Greenland Climate Network (commonly
  known as GC-Net) is a set of Automatic Weather Stations (AWS) set up and managed
  by the late Prof. Dr. Konrad (Koni) Steffen, and spanning the Greenland Ice Sheet
  (GrIS). This first station was "Swiss Camp" or the "ETH-CU" camp (GC-Net station
  01) which was used as a field science and education site by Koni for years. The
  GC-Net was expanded with multiple NASA, NOAA, and NSF grants throughout the years,
  and then supported by WSL in the later years. These data (see "C-file" below) were
  previously hosted by the Cooperative Institute for Research in Environmental Sciences
  (CIRES) in Boulder, Colorado. Overview Provided in this dataset are the 16 longest
  running stations in the network, which are spread over a significant area of the
  GrIS and the majority of the unique climatic zones. From the South Dome high point
  in the South, to the Western Jakobshavn ablation region in the west, to the Petermann
  glacier in the North across east of the Northeast Greenland Ice Stream to the east,
  GC-Net is the longest running climatological record of Greenland. The standard GC-Net
  station consists of: * Air temperature measurements at 2 heights above the surface
  * Temperature and humidity measurements at 2 heights above the surface * Wind speed
  and direction measured at 2 heights above the surface * Sonic distance sounder measurements
  for 2 snow height and distance of instruments to surface * Incoming shortwave radiation
  measurement * Reflected shortwave radiation measurement * Net broadband radiation
