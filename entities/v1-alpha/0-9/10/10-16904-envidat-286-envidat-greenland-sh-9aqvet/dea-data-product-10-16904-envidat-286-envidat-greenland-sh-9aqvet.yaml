id: dea:data-product-10-16904-envidat-286-envidat-greenland-sh-9aqvet
type: DataProduct
name: Greenland shrubs and microclimate
description: Study Aim We collected these data to alternatively train and validate
  high resolution (~ 90 m) Species Distribution Models (SDMs) and Species Abundance
  Models (SAMs) for _Betula nana_ L. (dwarf birch, Betulaceae) and _Salix glauca_
  L. (grey willow, Salicaceae) in Southwest Greenland to assess how well such models
  can predict local-scale patterns. Data Description Individual (presence-absence,
  abundance, maximum vegetative height) and community (species composition, maximum
  canopy height) shrub data for two fjords near Nuuk, Southwest Greenland. Also provided
  are corresponding downscaled climate data as well as calculated topographic and
  terrain wetness indicator variables. Nuup Kangerlua (Godthåbsfjord) _Betula nana_
  and _Salix glauca_ presence-absence, abundance, community species richness Kangerluarsunnguaq
  (Kobbefjord) Shrub presence-absence, abundance, maximum vegetative height, community
  composition, maximum shrub canopy height Methods Field survey in Nuup Kangerlua
  We conducted a stratified systematic plant survey along the length of Nuup Kangerlua
  (NK) fjord in Soutwesth Greenland (Fig. 1 in Chardon et al. 2022; following Nabe-Nielsen
  et al., 2017). At five distinct sites, we sampled along elevational gradients to
  collect data on presences, absences, abundance, and species composition of all woody
  species using a 0.7 x 0.7 m pin-point frame (Fig. 1e in Chardon et al. 2022). For
  model training, we converted these pin-point data to percent cover estimates based
  on the number of pins dropped (n = 25 per plot) and averaged them across the 119
  spatio-climatic grids (see next section) corresponding to the plot locations (for
  details see Appendix S2 in Chardon et al. 2022). Field survey in Kangerluarsunnguaq
  We conducted a random stratified plant survey in Kangerluarsunnguaq (K) fjord in
  Southwest Greenland. We used a preliminary Species Abundance Model trained with
