id: dea:data-product-5a1735b9-4ffc-450e-b034-ecfcaf-proportion-o-rz67nz
type: DataProduct
name: Proportion of areas worth examining from the federal government's perspective
  for ground-mounted photovoltaic installations of national importance
description: '"This dataset represents the proportion of areas worth examinig according
  to the Confederation. It provides an initial indication of where areas worth examinig
  are located in Switzerland – areas identified on the basis of the method used in
  the document ""Freistehende Photovoltaikanlagen: Methodische Grundlage des Bundes""
  (Ground-mounted photovoltaic installations: methodological basis of the Confederation;
  published in german and french). This dataset is designed for a scale of 1:100,000
  or smaller. For more detailed information and the representation of specific areas,
  please consult the dataset ""Areas worth examining"". The two datasets go hand in
  hand and provide different information from a national and regional perspective."'
