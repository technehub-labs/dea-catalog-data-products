id: dea:data-product-82683-milieueffectrapportage-m-environmenta-qau7x9
type: DataProduct
name: Environmental Impact Assessment (EIA) Energy Transition 2022 Geese Rest Areas
description: Dataset for the Environmental Impact Assessment (EIA) Energy Transition
  2022 adopted by the Provincial Executive on 4 October 2022. This is a plan-m.e.r.
  belonging to the Environmental Policy Review module Energy Transition that was adopted
  by Provinciale Staten on 14 December 2022. The aim of this EIA is to make the environmental
  effects of the integration of future development of wind and solar energy within
  the search areas from the Regional Energy Strategy (RES) 1.0 transparent so that
  they can be weighed when determining the Energy Transition module design policy.
  Contains the data for carrying out the environmental impact assessment on the criterion
  of geese resting areas.
