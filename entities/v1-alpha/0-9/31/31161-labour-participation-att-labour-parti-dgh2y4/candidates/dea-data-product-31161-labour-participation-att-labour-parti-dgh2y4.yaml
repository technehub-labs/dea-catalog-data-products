id: dea:data-product-31161-labour-participation-att-labour-parti-dgh2y4
type: DataProduct
name: Labour participation; attachment to the labour market
description: 'This table contains quarterly and yearly figures on labour participation
  in the Netherlands. The population of 15 to 74 years of age (excluding the institutionalized
  population) is divided into the employed labour force, the unemployed labour force
  and those not in the labour force. The employed labour force is subdivided on the
  basis of the professional status, and the average working hours. A division by sex,
  age and level of education is available. Data available from: 2013 Status of the
  figures: The figures in this table are final. Changes as of August 27, 2026: The
  figures for the 2nd quarter of 2026 have been added. Changes as of August 23, 2022:
  None, this is a new table. This table has been compiled on the basis of the Labor
  Force Survey (LFS). Due to changes in the research design and the questionnaire
  of the LFS, the figures for 2021 are not automatically comparable with the figures
  up to and including 2020. The key figures in this table have therefore been made
  consistent with the (non-seasonally adjusted) figures in the table Labour participation,
  key figures seasonally adjusted (see section 4), in which the outcomes for the period
  2013-2020 have been recalculated to align with the outcomes from 2021. When further
  detailing the outcomes according to job and personal characteristics, there may
  possibly be differences from 2020 to 2021 as a result of the new method. When will
  new figures be released? New figures will be published in October 2026.'
