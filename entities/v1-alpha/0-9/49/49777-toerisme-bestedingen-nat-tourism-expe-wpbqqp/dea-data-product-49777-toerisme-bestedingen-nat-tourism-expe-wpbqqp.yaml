id: dea:data-product-49777-toerisme-bestedingen-nat-tourism-expe-wpbqqp
type: DataProduct
name: Tourism; expenditure, national accounts
description: 'This table contains figures on the tourist expenditure of residents
  and non-residents in Dutch companies, but also figures on what residents spend abroad.
  Tourism is not an industry in itself, but covers a large number of products and
  services provided to tourists from different industries. The figures are consistent
  with the conceptual framework of the National Accounts (NA) and can be compared
  with pre-existing macroeconomic indicators such as total value added in basic prices
  and employment in the Netherlands. The tourism accounts thus provide an integrated
  macroeconomic overview of the significance of tourism for the economy. Data available
  from 2010. Status of figures: Data from 2010 to 2024 are final. 2025 data are provisional.
  Changes as of 25 September 2026: In the previous version, the provisional figures
  for 2023 were erroneously published instead of final figures. This version includes
  the correct final figures for 2023. Furthermore, 2025 dates have been added to this
  table. When will there be new figures? Preliminary figures shall be published 8
  months after the end of the reporting year. After 20 months, the final figures will
  be published.'
