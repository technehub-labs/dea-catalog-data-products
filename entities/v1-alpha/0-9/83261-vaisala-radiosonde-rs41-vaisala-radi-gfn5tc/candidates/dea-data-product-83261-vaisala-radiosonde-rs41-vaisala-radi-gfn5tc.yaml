type: DataProduct
name: Vaisala Radio Probe RS41
description: A balloon is released from the ground and rises to 10-30km to measure
  temperature, pressure, humidity and wind data. Vaisala MW41 sounding software is
  a radiosounding data processing, analysis, archival and relaying software for DigiCORA
  Sounding System MW41. The software consisting of the user interface running on a
  web browser and the sounding processing software running as services on a PC computer.
  DigiCORA Sounding System MW41 compressed of a PC computer, which is connected to
  a sounding processing subsystem via a network adapter. Sounding Processing Subsystem
  SPS311 contains the processor units for PTU (Pressure, Temperature and Humidity)
  and wind finding, and appropriate connections to the required antennas.
