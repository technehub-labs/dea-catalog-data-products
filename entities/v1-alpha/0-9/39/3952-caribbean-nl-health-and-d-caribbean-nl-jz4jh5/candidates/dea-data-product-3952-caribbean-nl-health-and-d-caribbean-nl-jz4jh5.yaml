type: DataProduct
name: 'Caribbean NL: health and disorders; personal characteristics'
description: 'This table provides data about perceived health and chronic disorders
  of the population of the Caribbean Netherlands aged 15 years and older. It repeats
  the following aspects: - perceived state of health - chronic disorders These aspects
  are shown for the Caribbean Netherlands, and also for the islands Bonaire, St Eustatius
  and Saba separately. Also breakdowns by sex, age and level of education are presented.
  The research is a sample survey. This means that the figures shown are estimates
  for which reliability margins apply. These margins are also included in the table.
  The Omnibus survey was carried out for the first time on Bonaire, Saba and St. Eustatius
  in 2013 during the month of June and the first week of July. For the second time
  the Omnibus survey was carried out on Bonaire during the months of October and November
  2017, and on Saba and St. Eustatius in the period January to March 2018. In 2021,
  the survey was conducted from October to December. Data available from: 2013 Status
  of the data: The figures for the most recent period are provisional. Changes as
  of December 15th 2022 The underlying coding of region used in this table has been
  adjusted. It''s now in line with the standard encoding defined by CBS. The structure
  and data of the table have not been adjusted. Figures for 2021 have been added.
  From 2021 onwards, the table has been expanded with the topics chikungunya and zika
  virus. When will new data be published? New data will be published every four years.'
