id: dea:data-product-29a8fefc-3a8a-4efe-a43e-41d932-digital-tech-ze3b4x
type: DataProduct
name: Digital technologies in agriculture.
description: Digitisation in agriculture is often associated with reduced input costs
  and more environmentally friendly agricultural production. However, an assessment
  of the actual environmental compatibility and the environmental performance of the
  use of technology is often lacking. This study presents a concept and criteria for
  assessing the environmental impact of the use of digital technologies in agriculture.
  The developed environmental assessment concept describes possibilities for qualitative
  and quantitative evaluation of environmental effects using indicators. It is generally
  valid, can also be applied to future technology developments and also takes into
  account indirect effects.
