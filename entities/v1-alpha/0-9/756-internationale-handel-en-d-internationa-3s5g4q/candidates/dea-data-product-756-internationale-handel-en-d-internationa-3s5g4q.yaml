type: DataProduct
name: International trade and transit; mode of transport, 2007-2017
description: 'This table provides insight into the international flows of goods from,
  to and through the Netherlands. The table shows, for import, export and transit
  flows, the value and gross weight of goods transported per NSTR goods chapter, mode
  of transport and continent of loading or unloading. This publication was co-financed
  by the Ministry of Infrastructure and Water Management. Data available from 2007
  to 2017 Status of figures: The data in this table are provisional. As this table
  has been discontinued, the data will no longer be made definitive. Changes as of
  21 February 2020 None, this table has been discontinued. When will there be new
  figures? No longer applicable.'
