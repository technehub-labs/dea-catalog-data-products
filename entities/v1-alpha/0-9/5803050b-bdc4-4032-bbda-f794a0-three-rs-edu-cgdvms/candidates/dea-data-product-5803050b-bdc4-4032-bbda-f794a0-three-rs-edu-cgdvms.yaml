id: dea:data-product-5803050b-bdc4-4032-bbda-f794a0-three-rs-edu-cgdvms
type: DataProduct
name: Three Rs Education and Training Learning Scenarios
description: This dataset is a publicly accessible collection of learning scenarios
  which have been created by education professionals for use by educators who wish
  to teach topics under the umbrella of the Three Rs and alternative methods. The
  collection covers university and secondary levels and contains 12 learning scenarios.
  A learning scenario is a teacher support tool which enables the delivery of a lesson
  on a certain topic. The learning scenarios available here can form a basis or inspiration
  for a lecture or provide a ready-to-use plan for a secondary school lesson or series
  of lessons.
