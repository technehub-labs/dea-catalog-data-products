  Data in accordance with Article I.4.4 of the Annex to Decision 2018-0864 of the
  French Electronic Communications and Post Regulatory Authority dated 3 July 2018
  proposing to the Minister responsible for electronic communications the terms and
  conditions for granting authorisations for the use of frequencies in the 900Mhz,
  1800 Mhz and 2.1 Ghz bands in metropolitan France to establish and operate an open
  and public mobile radio network Article I.4.4 Obligations for Frequency Laureates
  in the 1800 Mhz Band: [...] “priority roads” are defined as motorways, main roads
  connecting, within each department, the head of department (prefecture) to the district
  chiefs (sub-prefectures) and sections of roads on which on average at least five
  thousand vehicles per day run on an annual average, as they exist on 1 January 2018.
  [...]'
