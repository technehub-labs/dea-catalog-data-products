name: REA 1999 - State of the Environment Report 1999
description: Although the SSA-1999 does not cover, for reasons of the government's
  organization in force until the year in which the report most of the data, detailed
  and systematized information relating to the territory, there are necessarily fields
  in which this reality is reflected (e.g. soils and marine, coastal and freshwater
  environments, as well as those corresponding to the environmental performance of
  the various sectors of economic activity). In addition, and similarly As is the
  case in most European countries, we have tried to adopt a sustainability throughout
  the analysis carried out, which is also why it was decided to start the report with
  a chapter on the characterisation of the socio-economic development of the country,
  frame all the rest of the description, as well as analyze how different sectors
  of the Economic activity is integrating environmental concerns.
