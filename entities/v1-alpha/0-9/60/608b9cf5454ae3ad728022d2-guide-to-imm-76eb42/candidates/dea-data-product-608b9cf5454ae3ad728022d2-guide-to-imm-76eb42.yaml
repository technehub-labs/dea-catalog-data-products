id: dea:data-product-608b9cf5454ae3ad728022d2-guide-to-imm-76eb42
type: DataProduct
name: Guide to Imminent Threat Assessment and Environmental Damage – Environmental
  Liability
description: The aim of this document is to provide all interested parties (operators,
  competent entities and the general public) with information on the application of
  the environmental liability regime (Regime RA), seeking to clarify some concepts,
  identify the criteria for its coverage, develop technical aspects inherent to its
  application, as well as highlight the obligations of the operators covered.
