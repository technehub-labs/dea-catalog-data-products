type: DataProduct
name: SOS Education Association
description: Created in 2001, SOS Education presents itself as ‘an activist association
  […] working independently to ensure that the school transmits to every child fundamental
  knowledge and a taste for excellence’. It states that it is "fully transparent about
  its funding" and "funded exclusively by the generosity of its members". At the end
  of its audit and within the limits of its investigations and the information available,
  the Court declares that the association’s expenditure for the financial years 2013
  to 2018 was not in line with the objectives pursued by the public call for generosity.
