name: Accessible Beach / Healthy Beach Program 2011 in the Alentejo region
description: The beach project accessible/beach for all was born from an initiative
  of the National Coordinating Commission for the European Year of People with Disabilities
  and aims not only to encourage the application of Decree-Law No. º 163/06 of 8 August
  on Portuguese beaches, but above all to create the necessary conditions so that
  citizens with limited mobility can access the beach sands and, where possible, also
  water, using specific equipment.
