id: dea:data-product-036bcefe-6dc1-45a8-a47c-a2adff-udp-contribu-4h77jz
type: DataProduct
name: UDP - Contribution of tourism to total employment
description: 'This indicator is an estimate of the total contribution of the tourism
  activity to employment in a country or region. It represents the net overall effect
  of tourist arrivals at accommodation establishments along the value chain (direct,
  indirect, induced and catalytic effects in related activities) and the whole tourism
  ecosystem. It is based on a statistical relationship between tourism demand and
  employment, estimated using regression analysis. Higher values indicate a higher
  contribution of tourism to the country or regional employment. Ideal values are
  likely not too high as it could mean overexposure to the tourism activity fluctuations.
  This indicator is part of the socio-economic pillar of the EU Tourism Dashboard.
  UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: 100%. METHODOLOGY: Statistical
  model.'
