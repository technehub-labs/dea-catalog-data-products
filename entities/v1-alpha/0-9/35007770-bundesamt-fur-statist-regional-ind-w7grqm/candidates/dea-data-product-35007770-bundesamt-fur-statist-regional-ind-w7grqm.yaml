id: dea:data-product-35007770-bundesamt-fur-statist-regional-ind-w7grqm
type: DataProduct
name: Regional indicators of the Tourism Satellite Accounts by canton and product
description: This dataset presents the yearly data on tourism expenditure, tourism-related
  employment and tourism-connected gross value added (Tourism Satellite Accounts)
  by canton and product, since 2016. The data for 2020 and 2021 are characterised
  by the COVID-19 pandemic. The activity of companies operating in sectors related
  to tourism was often subject to major fluctuations. Especially in cantons with only
  a small number of companies, the fluctuations of a few companies can have a major
  impact on the growth rate. Users should therefore consider this aspect when analysing
  the results in these years. 2016 Corrected figures for tourism expenditure and tourism
  gross value added.
