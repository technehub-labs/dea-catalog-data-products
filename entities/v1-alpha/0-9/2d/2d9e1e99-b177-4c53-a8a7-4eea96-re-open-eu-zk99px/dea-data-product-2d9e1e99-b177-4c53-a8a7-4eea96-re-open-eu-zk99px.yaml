id: dea:data-product-2d9e1e99-b177-4c53-a8a7-4eea96-re-open-eu-zk99px
type: DataProduct
name: Re-open EU
description: 'This resource consists of 25 endpoints of the Re-open EU app: 24 endpoints
  provide - in the 24 languages of the EU - information on COVID-19 measures and travel
  restrictions in 31 European countries. Another endpoint provides epidemiological
  data. The Re-open EU app is a tool which provides an overview of the health situation
  in European countries, based on data from the European Centre for Disease Prevention
  and Control (ECDC). The information is updated frequently. It enables you to follow
  the evolution of the coronavirus situation in your country and beyond. Re-open EU
  also provides information on the various restrictions in place, including on quarantine
  and testing requirements for travelers and mobile coronavirus contact tracing and
  warning apps. This should help you plan your travel in Europe, while staying safe
  and healthy. The European Union is making major efforts to overcome this pandemic,
  to protect citizens and their livelihoods. The last modified date refers to the
  last refinement of the data structure while the data itself are updated frequently
  (almost on a daily basis).'
