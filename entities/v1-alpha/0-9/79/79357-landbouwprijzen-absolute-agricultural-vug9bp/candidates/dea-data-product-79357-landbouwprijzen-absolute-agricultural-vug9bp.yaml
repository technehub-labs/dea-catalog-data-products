id: dea:data-product-79357-landbouwprijzen-absolute-agricultural-vug9bp
type: DataProduct
name: Agricultural prices; absolute input prices
description: 'This table provides figures on the average purchase prices of agricultural
  input products. The products are classified according to the Eurostat agricultural
  price nomenclature. Agricultural price statistics have been a European regulation
  since 2025 (IMPLEMENTING REGULATION (EU) 2023/1579). Since then, CBS has been responsible
  for the quality of the statistics. These are therefore published on CBS Statline
  since 2025. Data from previous years can be found on the Eurostat website (<a href=''https://ec.europa.eu/eurostat/data/database''>Database
  - Eurostat</a>). This data has not been checked by Statistics Netherlands for statistical
  quality. Data available from: 2025 Status of figures: The figures shall first be
  published as provisional and may be revised up to 1.5 years after the end of the
  reporting year. When will there be new figures? New figures shall be published no
  later than 6 months after the end of the reporting year. Changes as of 5 June 2026:
  None, this is a new table'
