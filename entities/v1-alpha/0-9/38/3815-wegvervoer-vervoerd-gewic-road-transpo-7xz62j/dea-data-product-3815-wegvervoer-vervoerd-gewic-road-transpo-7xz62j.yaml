id: dea:data-product-3815-wegvervoer-vervoerd-gewic-road-transpo-7xz62j
type: DataProduct
name: Road transport; transported weight by distance class, 2005-2012
description: 'This table provides data on the weight carried by Dutch commercial vehicles
  with a maximum permissible weight (loading capacity plus unladen weight) of more
  than 3.5 tonnes. The figures shall be broken down by distance over which the goods
  have been transported. In addition, a distinction is made between professional and
  private transport. Data available from 2005 to 2012. Status of figures: Data up
  to 2010 are final and figures for 2011 and 2012 are provisional. As this table has
  been discontinued, the data are no longer made definitive. Changes as of 21 May
  2015 None, this table has been discontinued. As of 2013, the sample design of the
  freight road transport statistics has been substantially modified. In addition,
  a simplified questionnaire was introduced in 2013. This has caused a trend break
  in the time series of the transported weight. When will there be new figures? No
  longer applicable. Is there a successor? This table is followed by Road Transport;
  transported weight to distance class. See paragraph 3.'
