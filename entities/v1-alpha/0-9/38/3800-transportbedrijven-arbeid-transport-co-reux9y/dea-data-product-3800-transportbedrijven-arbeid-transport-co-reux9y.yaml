description: 'This table contains data on the employment offered, the cost and revenue
  structure, operating and financial results for a large number of sectors and branches
  according to the Statistics Netherlands'' Standard Business Classification 2008
  (SBI 2008). Data available from: 2009 to 2013. Status of figures: All figures in
  the table are final. Changes as of 26 April 2016: None, this table has been discontinued.
  When will there be new figures? Figures from 2014 onwards will be published in the
  table "Business; labour and financial data, by sector, SBI 2008". See paragraph
  3.'
