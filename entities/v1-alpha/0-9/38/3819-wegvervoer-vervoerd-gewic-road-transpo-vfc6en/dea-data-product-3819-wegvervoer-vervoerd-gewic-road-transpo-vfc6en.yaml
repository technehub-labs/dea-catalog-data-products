id: dea:data-product-3819-wegvervoer-vervoerd-gewic-road-transpo-vfc6en
type: DataProduct
name: Road transport; transported weight road hauliers from European Union, 2005-2012
description: 'This table provides insight into the transport flows of freight road
  transport by freight vehicles from the European Union. The table shows both domestic
  and international transport for each EU Member State. The transport flows are expressed
  in terms of transported weight. Data available from 2005 to 2012. Status of figures:
  Data up to 2010 are final and figures for 2011 and 2012 are provisional. As this
  table has been discontinued, the data are no longer made definitive. Changes as
  of 21 May 2015 None, this table has been discontinued. As of 2013, the sample design
  of the freight road transport statistics has been substantially modified. In addition,
  a simplified questionnaire was introduced in 2013. This has caused a trend break
  in the time series of the transported weight. When will there be new figures? No
  longer applicable. Is there a successor? This table is followed by Road Transport;
  weight transported by road hauliers from the European Union. See paragraph 3.'
