name: Locations and availability of shared mobility services in real time
description: 'Shared mobility is the shared use of means of transport such as cars,
  taxis, bikes, scooters, etc. These are then no longer considered private property,
  but shared property that can be accessed as required. Mobility is thus seen as a
  service (Mobility as a Service, MaaS). Shared Mobility is a needs-based, economical
  and energy-saving means of transport. Shared mobility services run by various providers
  are already widespread in Switzerland. Customers can quickly and easily book a vehicle
  via an app or booking platform. By cleverly combining different means of transport,
  door-to-door solutions can be found. Mobility becomes digitalised and sustainable.
  This dataset shows the location and availability of shared mobility services in
  real time. Further information on downloading the data and about affiliated shared
  mobility providers can be found at: www.sharedmobility.ch/info'
