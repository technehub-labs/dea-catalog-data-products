id: dea:data-product-84ae6ac1-ca53-4c8c-9ece-cb915d-discovery-se-4vavgd
type: DataProduct
name: Discovery service (CSW) of the catalogue of the Community of communes of the
  Pays de Loiron on "geomayenne.fr"
description: This discovery service allows to query the catalog of geographical data
  and web services of the Community of communes of the Pays de Loiron referenced in
  the platform "geomayenne.fr", via the protocol CSW 2.0.2. This harvesting point
  makes it possible to discover the description sheets (metadata) of the geographical
  data disseminated by the Community of communes of the Pays de Loiron which are concerned
  by the European INSPIRE directive or which are of public interest.
