id: dea:data-product-36209824-bundesamt-fur-statist-total-agricu-8r7awg
type: DataProduct
name: Total agricultural accounts (EAA) by sector of the agricultural sector and account
  items
description: This dataset presents the annual agricultural accounts by sector of the
  agricultural sector (agriculture, agriculture excluding horticulture horticulture),
  valuation method (value according to Eurostat standard, taxes on goods, subsidies
  on goods, value at basic prices and at producer prices) and account items, from
  1985 onwards.
