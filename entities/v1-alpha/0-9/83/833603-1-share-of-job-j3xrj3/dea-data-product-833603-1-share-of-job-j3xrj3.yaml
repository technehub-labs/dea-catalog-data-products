id: dea:data-product-833603-1-share-of-job-j3xrj3
type: DataProduct
name: Share of jobs in agriculture, forestry and fisheries among all salaried jobs
description: 'The indicator relates the number of employees working in industry (NACE
  rev.2 Sections B, C, D and E) to the total number of employed jobs, as at 30 June
  and 31 December. This indicator illustrates the “industrial” character of the entity.
  Breaks in series: - on 1 January 2011: Exit from the statistics of inactive employees
  following the change in the declaration of public sector employees (Capelo reform).
  - on 1 January 2012: Exit from the statistics of inactive employees following the
  change in the declaration of public sector employees (Capelo reform): follow-up
  and end. - on 1 January 2014: adjustment of the breakdown by commune of work following
  the exhaustive identification of the units of establishment See also: - Other indicators
  relating to paid employment are available in the ''Labour market'' theme. - The
  10 main sectors of activity (grouping A10) in the "[\2](\1)" on the nomenclature
  of national accounts, p.16.'
