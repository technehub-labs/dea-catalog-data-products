name: Share of agriculture and fisheries among the self-employed
description: 'The indicator reports the number of self-employed persons (including
  carers) practising a liberal profession (doctors, lawyers, etc.) in total self-employed
  persons, as at 31 December. See also: - Other indicators relating to self-employment
  are available under the theme ''Labour market'' and focus instead on the characteristics
  of the worker. - The professions are detailed in the nomenclature of professions
  used by INASTI, which can be consulted on their "[\2](\1)".'
