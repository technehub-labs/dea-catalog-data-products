id: dea:data-product-80774e31-aa60-492b-8900-fd0917-indicator-at-et4zwx
type: DataProduct
name: 'Indicator atlas: Population - mobility rate'
description: '(also known as total mobility or migration volume) Sum of movers (main
  residence) of the corresponding category and movers (main residence) of the corresponding
  category per 1 000 main residents (mean main resident population in the calendar
  year) of the corresponding category. Both extra-urban (beyond the city limits of
  Munich) as well as inner-city residents and those who have moved away (= those who
  have moved within the urban area, also within the spatial unit) are taken into account.
  **Please note the data descriptions: [Information on the indicator atlas](https://opendata.muenchen.de/pages/indicator
  atlas).**'
