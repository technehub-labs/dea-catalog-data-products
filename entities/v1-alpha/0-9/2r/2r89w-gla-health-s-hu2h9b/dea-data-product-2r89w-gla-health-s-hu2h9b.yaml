name: GLA Health Survey Infographics
description: <dp-prose> <p>Over 660 <a href="http://talklondon.london.gov.uk/">Talk
  London</a> users took part in the GLA&apos;s online health survey during March 2014.
  This explored people&rsquo;s experiences of health services, views on health policies
  and health behaviours. An identical telephone poll with 1000 Londoners also ran
  between 14 and 16 March. The results will be used by the Mayor&rsquo;s Health Team
  and the London Health Commission to inform their recommendations on improving health
  in London. The infographics summarise the key findings.</p> <p>-</p> <p></p> <p>-</p>
