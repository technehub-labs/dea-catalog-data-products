id: dea:data-product-25309cc4-dc59-4a7c-9ad1-9e764a-potential-in-k7m6nc
type: DataProduct
name: Potential intercropping areas before summering
description: The surfaces are part of the field blocks of the nitrate backdrop. Within
  those areas, Paragraph 13a(2)(7) of the DüV provides that an intermediate crop is
  to be grown in autumn on agricultural land on which the long-term average annual
  precipitation is >= 550 mm and may not be broken down before 15 January if the subsequent
  crop is sown or planted after 1 February and fertilisers with a significant nitrogen
  content are to be applied before or for that crop. Areas on which the pre-cultivation
  took place after 1 October are exempted from this requirement. The designation of
  this site is linked to the nitrate site and is given only for the affected field
  blocks. The spatial data of the reference parcels concerned will be calculated annually
  on 1 February.
