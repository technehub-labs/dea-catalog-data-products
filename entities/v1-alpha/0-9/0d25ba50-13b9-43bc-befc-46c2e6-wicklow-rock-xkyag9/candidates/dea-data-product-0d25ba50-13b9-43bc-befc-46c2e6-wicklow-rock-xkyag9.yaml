id: dea:data-product-0d25ba50-13b9-43bc-befc-46c2e6-wicklow-rock-xkyag9
type: DataProduct
name: Wicklow Rock Art Project
description: 'The Wicklow Rock Art Project (W.R.A.P.) was established by the School
  of Archaeology, University College Dublin, in May 2012 as a pilot scheme to explore
  the potential of photogrammetry in rock art recording. 17 known rock art sites were
  recorded using this technique, which involves taking a series of overlapping images
  of a rock art panel to create a 3D model. These computer models enable the creation
  of perspectives not possible in the field, and allow for repeated virtual contact
  with the rock art, while also monitoring deterioration to the actual panel. W.R.A.P.
  aims to create a rock art record which can be used as a research resource, a conservation
  tool, but also to encourage public engagement by presenting this record in a visually
  engaging and accessible manner. By creating an environment of public engagement
  and interaction, the project hopes to increase general awareness of rock art in
  Wicklow, which should result in an increase in identification of new rock art sites.
  Perhaps more importantly, it aims to increase a sense of identification with rock
  art sites and help to foster a sense of guardianship of this hidden art. This dataset
  does not record all Rock Art sites in County Wicklow - for a more comprehensive
  list visit: http://webgis.archaeology.ie/historicenvironment/'
