name: Zwettl-NÖ Climate Neutrality Action Plan
description: At the meeting of the municipal council of 24 September 2024, the municipal
  council of the municipality of Zwettl-NÖ was informed about the participation in
  the Zwettl Climate Neutrality Roadmap project in accordance with § 38(4) of the
  Lower Austrian Municipal Code 1973. The aim of the mission is to develop strategies
  and measures or a "climate-neutrality roadmap" to be climate-neutral in the community-owned
  areas of electricity, heat and mobility by 2040. This action plan was adopted at
  the meeting of the municipal council of the municipality of Zwettl-NÖ on 4 November.
