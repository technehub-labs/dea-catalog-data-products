id: dea:data-product-703f8702-646f-46c6-b0ca-d3ba43-udp-tourism-rh4h5q
type: DataProduct
name: UDP - Tourism energy intensity
description: 'Tourism energy intensity is defined as the amount of energy used in
  tourism-related economic activities per Million Euro of Gross Value Added (GVA)
  in the tourism sector, indicating the average energy efficiency of the tourism ecosystem.
  Lower values are desirable, as they indicate a higher energy efficiency. The indicator
  is part of the environmental impacts pillar of the EU Tourism Dashboard. UNIT OF
  MEASURE: TJ per Million EUR in current prices. RESOLUTION: NUTS0. COMPLETENESS:
  100%. METHODOLOGY: The indicator is obtained by dividing the amount of energy used
  in tourism-related economic by the Gross Value Added (GVA) in the tourism sector.
  DATA SOURCES: Energy supply and use by NACE Rev. 2 activity (env_ac_pefasu) [ESTAT],
  National accounts aggregates by industry (up to NACE A*64) (nama_10_A64) [ESTAT].'
