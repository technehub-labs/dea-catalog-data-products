name: XPlanung dataset BPL "SO Tourism+Agriculture Europe Farm"
description: 'The development plan (BPL) contains the legally binding stipulations
  for the urban development order. In principle, the development plan must be developed
  from the land use plan. The available data is the development plan ‘SO Tourismus+Agriculture
  Europa-Farm’ of the municipality of Meißenheim from XPlanung 5.0. Description: Mostly
  superimposed by GE thresher, priority use SO.'
