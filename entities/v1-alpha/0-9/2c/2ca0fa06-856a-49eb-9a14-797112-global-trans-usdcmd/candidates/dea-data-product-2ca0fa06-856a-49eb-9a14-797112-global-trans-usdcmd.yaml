id: dea:data-product-2ca0fa06-856a-49eb-9a14-797112-global-trans-usdcmd
type: DataProduct
name: Global Transnational Mobility Dataset
description: Estimates of country-to-country cross-border human mobility ("trips")
  on the basis of global statistics on tourism and air passenger traffic. The two
  sources are adjusted and merged, resulting into a set of data that covers more than
  15 billion estimated trips over the years 2011 to 2016. The work was jointly carried
  out by the European Commission Knowledge Centre on Migration and Demography (KCMD)
  and the European University Institute (EUI) Migration Policy Centre (MPC) as part
  of the Global Mobilities Project (GMP).
