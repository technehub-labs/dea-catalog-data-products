id: dea:data-product-2yo3y-data-centre-esann5
type: DataProduct
name: Data Centre Profiles
description: <dp-prose> <p>This dataset shows the half-hourly load profiles of identified
  data centres within UK Power Networks' licence areas.</p> <p>The loads have been
  determined using actual demand data from connected sites within UK Power Networks'
  licence areas, from 1 January 2023 onwards.</p> <p>Loads are expressed proportionally,
  by comparing the half-hourly observed import power seen across the site's meter
  point(s), against the meter's maximum import capacity. Units for both measures are
  apparent power, in kilovolt amperes (kVA).</p> <p>To protect the identity of the
  sites, data points have been anonymised and only the site's voltage level information
  - and our estimation of the data centre type - has been provided.</p> </dp-prose>
