name: WFD River, Canal, and SWT Water Bodies Cycle 4 Classification 2025 (Full Resolution)
description: 'This is a polyline dataset showing Water Framework Directive (WFD) River,
  Canal, and Surface Water Transfer Water Bodies. River centrelines represent the
  official river water body definition for the WFD. This dataset provides attribution
  on the 2025 classification results, as well as other relevant information and data
  about each river, canal, and surface water transfer water body. See the Environment
  Agency''s Water Hub for more information (link below). Attribution statement: ©
  Environment Agency copyright and/or database right 2026. All rights reserved. Contains
  OS data © Crown copyright and database right 2026.'
