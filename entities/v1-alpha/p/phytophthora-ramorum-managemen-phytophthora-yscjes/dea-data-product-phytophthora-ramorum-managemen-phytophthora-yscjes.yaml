id: dea:data-product-phytophthora-ramorum-managemen-phytophthora-yscjes
type: DataProduct
name: Phytophthora ramorum Management Zone
description: 'An area in south-west Scotland at the heart of a major surge of P. ramorum
  on larch in 2013 was designated as a Management Zone by the Plant Health (Forestry)
  (Phytophthora ramorum Management Zone) Order 2014. Within this zone the disease
  was too advanced to stop its spread within the area, so efforts have been focused
  on tackling new outbreaks in Scotland outside the Management Zone. This dataset
  shows the boundary of the Management Zone, as defined in Schedule 2 of the Order.
  The Order makes special arrangements for the movement of larch within an area known
  as the Management Zone. Scottish Forestry will no longer issue Statutory Plant Health
  Notices within the Management Zone and statutory controls on the movement of all
  roundwood, larch timber and associated, potentially infectious, products will be
  applied to such material only if it leaves this area. View the Order at: https://www.legislation.gov.uk/ssi/2014/122/made'
