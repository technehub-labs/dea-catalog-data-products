name: Public Health England Regions (July 2015)
description: '<p>Data identifying the location of Public Health England Regions. For
  more information, please see the <a href="http://geoportal.statistics.gov.uk/datasets/096d5bc1c4744dc28f8df9a775dfe618_2">ONS
  Geoportal</a><br /> website.</p> <p>Boundaries for these geographies have been generalised
  (to 20 metres) and clipped. You can find further information on these formats in
  the downloadable <a href="https://www.arcgis.com/sharing/rest/content/items/13e58e58db52423b91a3eb99c67a8c40/data">Boundary
  Guidance document</a> on the Open Geography portal.</p> <p>When using boundary data,
  <strong>please acknowledge the copyright and the source of the data</strong> by
  including the following attribution statements:</p> <p><em>Contains National Statistics
  data © Crown copyright and database right (2016)</em></p> <p><em>Contains OS data
  © Crown copyright and database right (2016)</em></p> <p>For more details about licencing
  go to: <a href="https://www.ons.gov.uk/methodology/geography/licences">https://www.ons.gov.uk/methodology/geography/licences</a></p>
  <p><em>All data is correct as of download date: 21/11/2016</em></p>'
