id: dea:data-product-peatland-condition-and-change-peatland-con-jkcppp
type: DataProduct
name: Peatland condition and change detection from InSAR-derived surface motion time
  series (RR1356)
description: The data is derived from Sentinel-1 radar data and the point data spacing
  is related to the spatial resolution of the imagery, ~20 m. The condition data displays
  one of 3 peatland condition classes (Good, Stiff, Degrading) based on the surface
  motion time series of the peatland. The change data shows where the peatland is
  undergoing positive or negative change based on the long-term trend in peatland
  surface motion. The main use of the data is to assess the impacts of peatland restoration,
  but it can also be used to assess impacts of development or to assist in the identification
  and prioritisation of potential peatland restoration areas.
