id: dea:data-product-https-www-immolytics-be-dcat-a-distribution-gfvcbv
type: DataProduct
name: Distribution of EPC energy classes by Belgian municipality
description: 'Share of homes in each of the seven energy classes, A to G, in percent.
  One row per municipality, keyed by NIS code. Wallonia (262 municipalities): breakdown
  specific to each municipality, from registered EPC certificates (ODWB, SPW Énergie).
  Brussels: not included, as Brussels Environment publishes only three figures for
  the whole Region (share A or B, share E or better, share G) and no A to G breakdown.
  Flanders: not included, as no breakdown by municipality is published as open data.'
