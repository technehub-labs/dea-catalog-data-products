id: dea:data-product-https-analisi-transparenciacat-environmenta-tu2fg8
type: DataProduct
name: 'Environmental control networks: consultation of water and the environment'
description: L'aplicació de xarxes de control del medi permet consultar i descarregar
  informació fenomenològica (dades de qualitat i quantitat de l'aigua) de les diferents
  xarxes de control de l'Agència Catalana de l'Aigua. Les dades recuperades a partir
  de l'aplicació es troben subjectes a revisió per part de l'Agència. Les dades es
  poden exportar en format PDF, XLS i XML.
