id: dea:data-product-https-datos-gob-es-catalogo-l0-tourism-agen-j89gdm
type: DataProduct
name: 'Tourism: agenda of activities'
description: Agenda of tourist activities of the demarcation of Barcelona, in which
  filters can be applied by region, cities and towns, typology of activity and start
  and end date. Includes images, location, labels and category of each activity. The
  Diputación de Barcelona, through the brand "Barcelona és molt més", promotes the
  social and economic development of the municipalities of the province of Barcelona
  through the tourism sector, monitoring to maintain a harmonious balance between
  this development and its sociocultural and environmental environments in which it
  develops.
