id: dea:data-product-https-stuns-entryscape-net-sto-measurments-x23aqf
type: DataProduct
name: Measurments of 15 min energy consumption at Tiunda shool
description: Measurement data for energy use at Tiunda school in Uppsala. The measurement
  takes place on incoming lines in the school's switchgear. The school has about 1200
  students and a central kitchen which produces about 2500 portions of food a day
  and also provides other schools and preschools and nursing homes with food. The
  service to the school is at 1250 A (amperes).
