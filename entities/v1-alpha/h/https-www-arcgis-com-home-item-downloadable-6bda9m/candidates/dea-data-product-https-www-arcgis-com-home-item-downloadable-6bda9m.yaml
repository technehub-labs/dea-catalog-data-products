type: DataProduct
name: Downloadable files on Site CD76 19nov20
description: 'This document provides a list of downloadable files on the website of
  the Department of Seine-Maritime (‘https://www.seinemaritime.fr/’) as well as links
  to them. The files are presented by file type (.pdf,.xls,.word), file size (in bytes),
  title and category (Administration, Sport, Youth, Social, Disability, Childhood,
  etc.) Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/43b4d1c9e1de4fd89e256eacecfb0820/data)
  Additional resources The Seine-Maritime Department offers other, more specialised
  websites: *· Cultural sites and places belonging to the Department: — ‘http://www.abbayedejumieges.fr/fr/home/’
  (Jumièges Abbey) — ‘http://www.abbayesaintgeorges.fr/fr/home/’ (Saint-Georges Abbey
  of Boscherville, in St Martin de Boscherville) — ‘http://www.chateaudemartainville.fr/fr/home/’
  (Martainville Castle, Museum of Traditions and Norman Arts) — ‘http://www.museevictorhugo.fr/fr/home/’
  (Museum Victor Hugo, in Villequier) — <http://www.parcdecleres.net/fr/home/> (Parc
  de Clères) — ‘http://www.theatrelillebonne.fr/fr/home/’ (Roman Theatre of Lillebonne)
  *· Departmental archives sites — <http://www.archivesdepartementales76.net/> (main
  site of departmental archives). This site, very rich, allows in particular to access
  the scanned collections of the archives ( — ‘http://www.archexpo.fr/’ (Portal “Traversing
  the Channel”, dedicated to the Franco-English exhibition of the same name) *· Road
  information website — <http://www.inforoute76.fr/> (which offers interactive mapping
  of departmental accidents, road works and hazards, the operation of the Seine bins,
  departmental carpooling areas, etc. It is possible to subscribe to RSS feeds containing
  this information) *· Departmental media library website — ‘https://mdsm.seinemaritime.fr/mdsm76/accueil-portal.aspx?_lg=fr-FR’
  (Public reading portal, which offers interactive mapping of public libraries in
  Seine-Maritime, but also information for public reading professionals, etc.) *·
  Departme'
