id: dea:data-product-https-data-toulouse-metropole-public-trans-d9apeg
type: DataProduct
name: Public transport in Toulouse between 1863 and 1957-Terminus
description: 'Traces of the different modes of public transport (terminus) common
  to Toulouse between 1863 and 1957. From the time of the Omnibuses from 1863 to 1882,
  the electrification of the grid and until the peak of the electricity grid in 1934.
  The dataset contains 5 plots and 5 tables containing the points of the stations.
  The data are extracted from Urban-hist, the mapping application that presents the
  history and evolution of the city of Toulouse, available online at the following
  address: www.urban-hist.toulouse.fr In connection with the data, the image album
  "how was the tram before?" published on the Flickr image bank, available online
  at the following address: https://www.flickr.com/photos/toulousefr/sets/721576387301256/with/11402806476/
  In addition, thematic content (1 file.odt) extracted from the Archives Municipales
  de Toulouse website, available online at the following address: www.archives.mairie-toulouse.fr/index.php?id=448'
