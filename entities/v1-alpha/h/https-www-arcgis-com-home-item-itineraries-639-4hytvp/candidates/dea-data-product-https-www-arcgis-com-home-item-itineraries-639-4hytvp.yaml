name: Itineraries Equestrian PDESI CD76 June2023
description: 'Equestrian routes registered in the Plan Départemental des Espaces,
  Sites et Itinéraires (PDESI) relating to Nature Sports (see glossary in metadata)
  of Seine-Maritime in June 2023. At that date, 19 equestrian itineraries were registered
  with the PDESI of Seine-Maritime. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/8015452fa3aa4027b2a0028434c57e55/data)
  Additional resources * Site of the National Resource Centre for Nature Sports: <https://www.sportsdenature.gouv.fr//publications/mobilisable-to-perennialize-access-places-of-practice/pdesi>
  This website of the Ministry of Sports offers information on the Departmental Plans
  of Spaces, Sites and Routes (PDESI) and the Departmental Commissions of Spaces,
  Sites and Routes (CDESI). * Site seinemaritime.fr: <https://www.seinemaritime.fr/guide-des-aides/my
  life-framework/aides-aux-communes/guide-des-aides/sport-1/les-loisirs-sportifs-de-nature.html>
  The website of the Seine-Maritime Department offers a page dedicated to aids for
  nature sports recreation registered with the PDESI. * Suricate site: <https://sentinelles.sportsdenature.fr/>
  This site makes it possible to report a problem (marking, security, conflicts of
  use, environment) on a space, site or route, accompanied by its geolocation and
  a photo. * Site seine-maritime-tourism: <https://www.seine-maritime-tourisme.com/en/je-choisis/une-balade/index.php>
  You will find on this site of Seine-Maritime Attractivity, individual sheets and
  GPS tracks of hiking routes registered with the PDESI.'
