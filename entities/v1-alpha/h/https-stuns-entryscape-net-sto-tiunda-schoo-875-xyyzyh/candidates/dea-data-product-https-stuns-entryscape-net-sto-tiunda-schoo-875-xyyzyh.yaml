id: dea:data-product-https-stuns-entryscape-net-sto-tiunda-schoo-875-xyyzyh
type: DataProduct
name: Tiunda school Uppsala - energy measurement - 60 minutes summary
description: Measurement data for energy use at Tiunda school in Uppsala, 60 minutes
  average. The measurement takes place on incoming lines in the school's switchgear.
  The school has about 1200 students and a central kitchen which produces about 2500
  portions of food a day and also provides other schools and preschools and nursing
  homes with food. The service to the school is at 1250 A (amperes).
