type: DataProduct
name: Administrative educational aid – Educational aid at home in Loire-Atlantique
  by municipality
description: 'Number of beneficiaries of home-based educational assistance per municipality
  since 2008. * * * * Home Educational Assistance aims at the well-being and development
  of the child, through the recognition and enhancement of parental skills. It is
  aimed at any family facing difficulties in the upbringing of its children. Statistical
  confidentiality shall be applied: not all information between 1 and 4 included is
  disseminated. They correspond to uninformed cells.'
