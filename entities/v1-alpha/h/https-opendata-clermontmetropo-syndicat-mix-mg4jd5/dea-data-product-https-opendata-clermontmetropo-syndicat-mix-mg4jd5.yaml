id: dea:data-product-https-opendata-clermontmetropo-syndicat-mix-mg4jd5
type: DataProduct
name: Syndicat Mixte des Transports en Commun de l'agglomération Clermontoise (SMTC-AC)
  - T2C Network - GTFS & GTFS-RT
description: 'Descriptive data of the transport offer (lines, stops, timetables) of
  the public transport network implemented by T2C. The data made available shall consist
  of all elements from the network time guide, including school lines. Geographical
  description: perimeter of urban transport in the agglomeration of Clermont and the
  municipalities of Mur-sur-Allier and Pérignat-ès-Allier. Technical description:
  theoretical data are published in [GTFS] (https://developers.google.com/transit/gtfs)
  and trip updates in [GTFS-RT] (https://developers.google.com/transit/gtfs-realtime/guides/trip-updates?hl=en).
  Exclusions: the data provided relate to regular and specific services (school lines)
  and off-line Zonal On-Demand Transport.'
