id: dea:data-product-https-zenodo-org-record-824679-high-frequen-t3tfmn
type: DataProduct
name: High-frequency mental health surveillance
description: Within the framework of the Mental Health Surveillance (MHS) at the Robert
  Koch Institute (RKI), time series consisting of three-month moving estimators and
  smoothing curves are calculated for a selection of indicators of mental health in
  adults based on survey data. As a result, developments in the mental health of the
  adult population in Germany are to be observed with as little delay as possible
  and, in particular, negative developments are to be detected at an early stage.
  This high-frequency surveillance was originally developed against the background
  of new information needs on the development of the mental health of the population
  in the COVID-19 pandemic.</p>
