id: dea:data-product-https-opendata-clermontmetropo-air-health-n-yyqy7s
type: DataProduct
name: Air Health NO2 Index
description: Municipal indicator to make the link between air quality and health impacts.
  Indicator calculated over 3 years from modeled fine scale annual average nitrogen
  dioxide (NO2) data. Nitrogen dioxide (NO2) is emitted during combustion phenomena,
  mainly by combining nitrogen and oxygen from the air. The main sources are vehicles
  and combustion plants.
