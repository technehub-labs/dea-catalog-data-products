name: API - Lista podmiotów z aktualną akredytacją Ministra Zdrowia
description: <p>Interfejs API portalu "Centrum Monitorowania Jakości w Ochronie Zdrowia
  w Krakowie (CMJ)" umożliwia dostęp do danych dotyczących wszystkich podmiotów działalności
  leczniczej osiadających akredytację Ministra Zdrowia.</p> <p>Dane udostępniane są
  w formacie JSON i są aktualne na dana chwię czasu polskiego.</p> <p>Użytkownik ponownie
  wykorzystujący informacje sektora publicznego udostępniane na portalu CMJ zobowiązany
  jest w sposób czytelny i wyraźny wskazać źródło pozyskania informacji.</p>
