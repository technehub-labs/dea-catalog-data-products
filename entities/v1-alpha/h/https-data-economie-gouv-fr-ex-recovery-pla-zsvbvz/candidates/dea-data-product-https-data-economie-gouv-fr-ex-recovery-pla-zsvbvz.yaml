id: dea:data-product-https-data-economie-gouv-fr-ex-recovery-pla-zsvbvz
type: DataProduct
name: Recovery plan, projects selected for the energy renovation of State buildings
description: 'The recovery plan announced by the government on 3 September 2020 includes
  an extensive programme for the energy renovation of public buildings (of the state
  and its operators). These investments will make it possible both to support the
  construction sector by generating at local level multiple construction sites benefiting
  the entire fabric of construction companies, and to reduce the energy footprint
  of public buildings by proposing a rapid and significant action on energy consumption.
  This dataset allows you to list and visualize selected projects at regional, departmental
  and municipal level. For details: * The initial page on the EID website: <https://immobilier-etat.gouv.fr/les-grands-dossiers/france-relance-projects-renovation-energetique-batiments-publics/liste-projects-retained>
  * The scoreboard: <http://cartographie-plan-de-relance.portail-die.fr/batiments/>'
