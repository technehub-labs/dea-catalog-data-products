name: Envir ONF Bugey — Large wood terrier surface
description: Gravel surface of large woods in m² per hectare (m²/ha) [link to description
  pdf](https://carto.ain.fr/webapps/externe/doc/ONF_notice_modeles_LiDAR_v2.pdf) 1
  — Modeling principles The present models are constructed from the detection of the
  apex identified on the digital height model from the LiDAR covers. Only heights
  greater than 13 meters associated with bowls of more than 5 square meters are preserved.
  Treatment shall be carried out excluding the ‘unwooded’ type of the IFN stand mapping
  v.2. Each apex is classified as hardwood or soft based on the slopes of its hoop
  and its reflectance measured in SPOT 6 images. The diameters at 1.30 m and the increments
  are estimated by the characteristics of the bowl associated with the apex. At the
  pixel scale of 26.5 m on the side, the earth surfaces predicted for each tree are
  summed by species and categories of diameters. The results obtained are corrected
  according to linear models. Models applied to apex and pixels are calibrated using
  the forest observatory plots. They are validated on a new set of 240 plots of 15
  meters radius measured in 2015 and independent of the calibration set. 2 — Validity
  of modeled parameters Generally, the validity of modeled parameters is not known
  for rare and atypical stands at the Ain Mountain scale. These stands are, for example,
  the plantations of larchs, the pine groves, the young leafy young leafy thinned...
  The validity in stands of black pine forests or sylvestres has not been verified.
  All data are for a pre-counting diameter of 17.5 cm to 1.30 m (unless otherwise
  stated). 3 — Precautions for the realisation of calculations based on the data of
  the rasters For basal area, production, stem density, stand types, zero values shall
  be used in the absence of data. These cases correspond either to stands less than
  13 metres high (a priori composed of trees with a diameter of less than 17.5 centimeters),
  or to a type of non-wooded IFN stand. For stand types, the zero value is a non-pre-acc
