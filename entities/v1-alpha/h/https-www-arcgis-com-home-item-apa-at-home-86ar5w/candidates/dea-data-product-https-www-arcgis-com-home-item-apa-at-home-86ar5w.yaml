name: APA at home Depenses et Beneficiaires by GIR by EPCI76 2023
description: 'The data proposed here correspond to the number of beneficiaries and
  aid expenditure of the Personalised Home Autonomy Allowance (APAD), paid for the
  year 2023, by GIR (iso-resource group, which is a scale to assess the dependency
  of the person) and by intercommunality (EPCI) of the municipality of the emergency
  home. The proposed visualization illustrates APAD expenditures by GIR by EP ̈CI.
  IRMs shall correspond to the following degrees of loss of autonomy: **Gir: Iso-resources
  group** | **Degrees of dependency** ---|--- **Gir 1** | A person confined to bed
  or chair, whose mental functions are severely impaired and who requires an indispensable
  and continuous presence of intervenors **Gir 2** | · A person confined to bed or
  chair, whose mental functions are not totally impaired and whose condition requires
  care for most activities of everyday life Person whose mental functions are impaired,
  who is able to move, but who requires constant monitoring **Gir 3** | Person who
  has retained all or part of his mental autonomy, partially his locomotor autonomy,
  but who needs daily and several times a day help with body care **Gir 4** | Either
  someone who does not take care of his transfers alone but who, once lifted, can
  move inside his housing, but who needs help for the toilet and dressing · Either
  someone who does not have locomotor problems, but who needs help with body care
  and meals APAD is an allowance for people aged 60 and over with loss of autonomy
  (see also glossary in metadata). There are no income conditions to benefit from
  it but the amount allocated depends on the level of income. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/5f1a4e1aaee04576875a22d2b7cb9b4c/data)
  Additional resources * Data DREES website: <https://www.data.drees.sante.gouv.fr/>
  DREES (Directorate for Research, Studies, Evaluation and Statistics) is a directorate
  of the central administration of the Ministries of Health and Social Affairs. Its
