type: DataProduct
name: Dance Higher Education students by center ownership
description: This section presents statistical information referring to the enrolled
  student body from the Statistics on Non-university Education carried out by the
  Sub-Directorate General of Statistics and Studies of the Ministry in cooperation
  with the statistical services of the Departments of Education of the Autonomous
  Communities. Information is provided annually on the different characteristics of
  the student body enrolled in all non-university General Regime, Special Regime and
  Adult Education courses.
