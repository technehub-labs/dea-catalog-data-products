id: dea:data-product-https-www-arcgis-com-home-item-itineraries-9phsv9
type: DataProduct
name: Itineraries Velo PDESI CD76 June2023
description: 'Cycling routes registered or currently registered in the Departmental
  Plan of Spaces, Sites and Itineraries relating to Nature Sports (PDESI, _see glossary
  in metadata_) in June 2023. In 2023, 30 bike routes were registered or are currently
  registered with the PDESI, compared to 21 bike or mountain bike routes registered
  with PDESI in 2019. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/e841ba4169e54a3b911374e07a9b16c7/data)
  Additional resources * Site of the National Resource Centre Sports de Nature: <HTTPS://WWW.SPORTSDENATURE.GOUV.FR//PUBLICATIONS/OUTILS-MOBILISABLES-POUR-PERENNISER-ACCES-LIEUX-DE-PRATIQUE/PDESI>
  This website of the Ministry of Sports offers information relating to the Departmental
  Plans of Spaces, Sites and Routes (PDESI) and the Departmental Commissions of Spaces,
  Sites and Routes (CDESI). * Site seinemaritime.fr: <HTTPS://WWW.SEINEMARITIME.FR/GUIDE-DES-AIDES/MON-CADRE-DE-VIE/AIDES-AUX-COMMUNES/GUIDE-DES-AIDES/SPORT-1/LES-LOISIRS-SPORTIFS-DE-NATURE.HTML>
  The website of the Department of Seine-Maritime offers a page dedicated to aids
  for sports leisure of nature registered with the PDESI. * Suricate site: <HTTPS://SENTINELLES.SPORTSDENATURE.FR/>
  This site allows to report a problem (marking, security, conflicts of use, environment)
  on a space, site or route, accompanied by its geolocation and a photo. * Seine-maritime-tourism
  site: <HTTPS://WWW.SEINE-MARITIME-TOURISME.COM/FR/JE-CHOISIS/UNE-BALADE/INDEX.PHP>
  You will find on this site of Seine-Maritime Attractivité, individual sheets and
  GPS tracks of hiking routes registered with the PDESI.'
