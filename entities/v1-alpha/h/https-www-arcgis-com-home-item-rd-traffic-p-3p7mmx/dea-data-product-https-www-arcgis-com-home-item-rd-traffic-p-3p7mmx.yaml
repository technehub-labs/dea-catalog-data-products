id: dea:data-product-https-www-arcgis-com-home-item-rd-traffic-p-3p7mmx
type: DataProduct
name: RD traffic PL
description: Heavy-duty traffic. Daily average on both routes. The field 'year' gives
  the year of counting and the field '**average**' gives the number of vehicles as
  an annualised daily average. The field ‘**section’** is the unique time-spanning
  identifier of the reference route portion that links to the counting point table
  that references the counting history. If on a section there is no PL counting then
  the annee and mean fields take the numeric value 0.
