description: 'Plan Local d''Urbanisme Bioclimatique de Paris - **Sites for the protection
  of social and solidarity economy activities** Version of the PLU voted by the Paris
  Council on 20 November 2024. Full documentation: See "Site for the protection of
  social and solidarity economy activities.pdf" attached. Data available for information
  and without regulatory value. To access the official PLU, consult the [Portal of
  Urban Planning Rules](https://regles-urbanisme.paris.fr/) of Paris. For other PLU
  data available on Opendata, see [this page](https://opendata.paris.fr/explore/?sort=modified&refine.keyword=PLU).
  PLU documents and data can also be downloaded from the [Géoporttail National de
  l''Urbanisme] (https://www.geoportail-urbanisme.gouv.fr/).'
