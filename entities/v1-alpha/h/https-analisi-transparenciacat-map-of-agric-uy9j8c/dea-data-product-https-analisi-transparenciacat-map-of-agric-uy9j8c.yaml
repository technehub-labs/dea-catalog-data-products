id: dea:data-product-https-analisi-transparenciacat-map-of-agric-uy9j8c
type: DataProduct
name: Map of agricultural farms in Catalonia
description: El mapa d'explotacions és una capa gràfica oberta a la ciutadania que
  geolocalitza les explotacions agrícoles de Catalunya a partir de les dades declarades
  a la declaració agrària unificada (DUN) i en mostra les seves característiques principals
  de forma pseudonimitzada. El mapa d'explotacions conté les dades, tant la informació
  gràfica com alfanumèrica, a partir de l'any 2019. La informació gràfica comprèn
  la delimitació geogràfica referenciada de cada explotació amb sistema de referència
  cartogràfic ETRS89.
