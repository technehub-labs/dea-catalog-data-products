id: dea:data-product-https-www-arcgis-com-home-item-pmi76-childc-s2qhs4
type: DataProduct
name: PMI76 Childcare 2018a2023 dec2024
description: 'This file presents the data relating to the reception of children in
  Seine-Maritime, by Territorial Unit of Social Action (UTAS) and by year, from 2018
  to 2023. It should be noted that activity in 2020 and, to a lesser extent, 2021
  was impacted by successive COVID lockdowns. In addition, the 2022 data collection
  was impacted by the IT attack on the Department in October 2022 (hence many "undetermined"
  (ND) mentions). Data on childcare include the number of family assistants, the number
  of maternal assistants, the number of nursing homes (MAM), including new ones created
  in the year, the number of childcare facilities, including new ones created in the
  year, and the capacity of each of these categories according to their approvals.
  Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/0951c8db3e1644a59c01c01885d440e6/data)
  Additional resources * Website of the Ministry of Solidarity and Health: <https://solidarites-sante.gouv.fr/prevention-en-sante/sante-des-populations/children/article/screening-and-prevention-à-l-enfant>
  This page of the Ministry’s official website offers numerous documents, downloadable
  in pdf format, relating to screening and prevention in children. * Professional
  website vaccination info service: [https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale](https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale)
  This website of the national public health agency dedicated to vaccination professionals
  offers data on vaccination coverage in France, by age, region, department, etc.,
  downloadable in pdf format. * World Health Organisation website: [https://apps.who.int/immunization
  _monitoring/globalsummary/timeseries/tswucoveragebcg.html](https://apps.who.int/immunization
  _monitoring/globalsummary/timeseries/tswucoveragebcg.html) The WHO website offers
  data (search with the keyword "vaccine"'
