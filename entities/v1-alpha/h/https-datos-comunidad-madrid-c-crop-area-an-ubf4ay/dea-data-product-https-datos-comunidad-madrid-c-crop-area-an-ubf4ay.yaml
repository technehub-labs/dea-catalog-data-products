type: DataProduct
name: Crop area and harvesting of organic farming
description: 'Organic livestock: It is a sustainable livestock production system,
  whose fundamental objective is to produce food of differentiated quality for the
  population, obtained from animals that enjoy a high degree of welfare, that make
  rational use of the natural resources of the countryside, that contribute to improving
  the natural fertility of the soil, and in whose feeding and management no genetically
  modified organisms or synthetic chemicals or others that may pose a real or potential
  risk to the health of the consumer are used.'
