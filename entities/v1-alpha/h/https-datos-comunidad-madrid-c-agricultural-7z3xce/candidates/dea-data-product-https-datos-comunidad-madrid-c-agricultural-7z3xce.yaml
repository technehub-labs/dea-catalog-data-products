id: dea:data-product-https-datos-comunidad-madrid-c-agricultural-7z3xce
type: DataProduct
name: Agricultural census (1989, 1999, 2009). Utilised agricultural area (UAA) of
  agricultural holdings by holding regime. Municipalities
description: 'The agricultural holding shall: It can be defined as an agricultural
  unit (set of land and/or livestock), under a single management, located in a given
  geographical location and using the same means of production. UAA: Set of the area
  of tilled land and land for permanent pasture. Carved land includes arable crops,
  fallow land, family gardens and land used for woody crops. Tres Cantos was disaggregated
  from Colmenar Viejo in March 1991.'
