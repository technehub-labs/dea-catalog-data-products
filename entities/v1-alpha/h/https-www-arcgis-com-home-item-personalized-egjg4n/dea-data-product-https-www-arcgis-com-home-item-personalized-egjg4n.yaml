id: dea:data-product-https-www-arcgis-com-home-item-personalized-egjg4n
type: DataProduct
name: Personalized Social Support Measure 2 Cantons76 2017a2023 20240729
description: 'This dataset presents the number of annual beneficiaries of a MASP1
  (personalised social support and budget management assistance with the collection
  and management of social benefits on behalf of the beneficiary) by canton of Seine-Maritime,
  per year, from 2017 to 2023. The visualization shows the number of beneficiaries
  per year and per canton. Data covered by statistical confidentiality (less than
  5 beneficiaries in the canton in the year concerned) are indicated by the entry
  "S". Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/21c0cb06ccc24d72a9fc58240b2b17/data)
  Additional resources * **Site Service-public.fr**: [https://www.service-public.fr/individuiers/vosdroits/F1336](https://www.service-public.fr/individuiers/vosdroits/F1336)
  The "Service public" website is the official website of the French administration,
  the single portal for administrative information and access to online services,
  developed in partnership with national and local administrations. It offers a page
  dedicated to MASPs. * **Data DREES website**: <https://data.drees.solidarites-sante.gouv.fr/explore/dataset/bases-de-donnees-brutes-de-l-enquete-aide-sociale-volet-measure-d-accompagnement-/information/>
  DREES (Directorate for Research, Studies, Evaluation and Statistics) is a directorate
  of the central administration of health and social ministries. Its open data site
  offers data on Personalised Social Support Measures, by department, in 2011 and
  2022, downloadable in xlsx format.'
