id: dea:data-product-https-www-arcgis-com-home-item-perimeter-of-ggmg4n
type: DataProduct
name: Perimeter of Social Territory
description: Attention new flow URL carto.ain.fr becomes geodata.ain.fr Scope of jurisdiction
  of the territories of the DGAS. They come in replacement of the old perimeters of
  the Houses of Solidarity (MDS) to count from December 2, 2019. The eastern part
  of the department given its mountainous geography is subdivided into 3 with a functioning
  of the Departmental Centers of Solidarity (CDS) in binomial. * Bresse Revermont
  -> Townhouse in Bourg-en-Bresse * Val de Saône Dombes -> Townhouse in Chatillon-sur-Chalaronne
  * Plaine de l'Ain Côtière -> Maison de Territoire in Ambérieu-en-Bugey * East ->
  Direction to Nantua No public reception in Territorial Houses.
