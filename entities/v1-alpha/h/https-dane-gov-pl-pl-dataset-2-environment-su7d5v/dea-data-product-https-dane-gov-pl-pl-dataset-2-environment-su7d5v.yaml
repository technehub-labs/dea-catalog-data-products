id: dea:data-product-https-dane-gov-pl-pl-dataset-2-environment-su7d5v
type: DataProduct
name: Environment
description: <p>In a synthetic way there is presented full range of statistical surveys
  results, subsystems functioning within the framework of state environmental monitoring
  and administrative sources characterizing the condition, threat and environmental
  protection in 2023 using previous years perspective as a background.</p> <p>Data
  refers to natural conditions and individual environmental components, waste, radiation
  and noise issues, activities for the protection and control of the environment.</p>
