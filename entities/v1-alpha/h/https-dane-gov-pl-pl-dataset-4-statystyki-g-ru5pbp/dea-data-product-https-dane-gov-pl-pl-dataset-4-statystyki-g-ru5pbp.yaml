description: <p>Dane zostały opracowane na podstawie informacji zawartych w narzędziu
  służącym do analizy ruchu na stronie internetowej <a href="http://www.gov.pl/" target="_blank"
  title="http://www.gov.pl/">http://www.gov.pl</a>. Raport zawiera dane w rozbiciu
  miesięcznym.</p> <p> </p> <p><strong>Liczba niepowtarzających się użytkowników</strong></p>
  <p>Użytkownik odwiedzający kilka różnych stron z witryny <a href="http://www.gov.pl/"
  target="_blank" title="http://www.gov.pl/">http://www.gov.pl</a> na tym samym urządzeniu
  zostanie policzony jednokrotnie.</p> <p><strong>Odwiedziny</strong></p> <p>Wejście
  na kilka różnych stron na witrynie <a href="http://www.gov.pl/" target="_blank"
  title="http://www.gov.pl/">http://www.gov.pl</a>, zostanie uznane za jedne odwiedziny.</p>
  <p><strong>Liczba odsłon</strong></p> <p>Każde wejście na strony na witrynie <a
  href="http://www.gov.pl/" target="_blank" title="http://www.gov.pl/">http://www.gov.pl</a>
  zostanie policzone oddzielnie.</p> <p><strong>Unikalne odsłony</strong></p> <p>Kilkukrotne
  wejście na tę samą stronę na witrynie <a href="http://www.gov.pl/" target="_blank"
  title="http://www.gov.pl/">http://www.gov.pl</a>, zostanie uznane jako unikalna
  odsłona.</p> <p><strong>Pobrania</strong></p> <p>Liczba pobranych plików z witryny
  <a href="http://www.gov.pl/" target="_blank" title="http://www.gov.pl/">http://www.gov.pl</a>.</p>
  <p><strong>Średni czas pobytu na stronie (w sekundach)</strong></p> <p>Średni czas
  pobytu na witrynie <a href="http://www.gov.pl/" target="_blank" title="http://www.gov.pl/">http://www.gov.pl</a>.</p>
