id: dea:data-product-https-www-arbetsformedlingen-s-yrkesbaromet-uegfpz
type: DataProduct
name: Yrkesbarometer
description: The dataset shows current assessments of job opportunities and the recruitment
  situation in various professions, both at county level and nationally. In addition
  to a current picture, a forecast is also given of how the demand for labor in each
  profession is expected to develop over a five-year period. The occupational barometer
  is updated twice a year, every spring and autumn..
