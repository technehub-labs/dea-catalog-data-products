type: DataProduct
name: EARLY DISPERSION OF THE GREEN TRADE (without URBAN RUGOSITY)
description: The maximum dispersal area calculated without taking into account urban
  roughness. MOS classifications with 81 positions classified in 5 roughness classes
  according to the environment (global green frame, wood TV, open TV). This nomenclature
  is used to calculate the dispersion areas for the components of the green grid.
