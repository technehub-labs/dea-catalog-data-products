id: dea:data-product-https-www-arcgis-com-home-item-supplementar-3vjp8m
type: DataProduct
name: Supplementary budgets since 2018
description: 'The supplementary budget is voted annually in plenary (<https://www.normandie.fr/assemblee-pleniere>)
  by the Regional Council (102 councillors from the 5 Norman departments - Calvados,
  Eure, Manche, Orne, Seine-Maritime). It is a specific amending decision that allows
  the resumption of the results of the previous financial year when the original budget
  was voted without a resumption of results. Each supplementary budget takes the form
  of an XML feed that aggregates the supplementary budget data from our software package.
  Each budget is monitored by the Prefecture to ensure compliance with the rules applicable
  to the preparation, adoption and implementation of community budgets. For more information
  on how to read a budget flow: https://www.collectivites-locales.gouv.fr/finances-locales/savoir-lire-un-flux-budgetaire
  The data is updated as the water runs.'
