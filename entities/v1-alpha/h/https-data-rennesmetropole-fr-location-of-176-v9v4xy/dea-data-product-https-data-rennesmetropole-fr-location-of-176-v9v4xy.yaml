type: DataProduct
name: Location of Natural Environments of Ecological Interest (MNIE) in the country
  of Rennes in 2016
description: 'The inventory of Natural Environments of Ecological Interest (MNIE)
  was launched under the impetus of the elected representatives of the District of
  Rennes since the 1990s. This voluntary approach of elected officials to improve
  the consideration of biodiversity at the level of their territory has made it possible
  to significantly enrich the knowledge and distribution of the natural environments
  of the territory. The elected representatives of the SCoT decided to extend this
  inventory to the whole territory of the Pays de Rennes. The SCoT has established
  strict protection of these environments. Since its approval in December 2007, they
  have become regulatoryly inconstructible.A single document “Atlas des MNIE du Pays
  de Rennes” locates all the sites identified in the territory of the Pays de Rennes.
  The SCoT Joint Union is now the structure that drives the MNIE file. This atlas
  refers, among other things: \- Large natural ensembles (GEN), spaces without regulatory
  scope; \- Natural environments of ecological interest (MNIE), areas strictly protected
  by the SCOT, which gives them a regulatory scope. This layer localises the Natural
  Environments of Ecological Interest (MNIE). The acronym MNIE is referred to as “Natural
  Ecological Interest”. These are sites consisting of one or more natural habitats
  and of significant interest in fauna and/or flora. A MNIE is smaller than a GEN,
  in which it is very often included. Note, however, that some MNIEs can be isolated
  in a trivialised space outside a GEN. These MNIEs are spaces strictly protected
  by the ScoT, which gives them a regulatory scope.'
