id: dea:data-product-http-pxweb-etjanst-domstol-se-filed-incomi-g23sas
type: DataProduct
name: Filed (incoming), determined and pending cases and matters at Land and environment
  courts and at the Land and Environment Court of Appeal
description: Number of cases and matters at the five Land and environment courts and
  at the Land and Environment Court of Appeal. The cases and matters are divided in
  case categories. Pending cases and matters are ongoing (open) cases or matters at
  a specific date. On May 2, 2011, Land and environment courts were established at
  five of the country's district courts and the Land and Environment Court of Appeal
  was established as a part of Svea Court of Appeal. Previously, there were special
  property courts and environment courts at certain district courts.
