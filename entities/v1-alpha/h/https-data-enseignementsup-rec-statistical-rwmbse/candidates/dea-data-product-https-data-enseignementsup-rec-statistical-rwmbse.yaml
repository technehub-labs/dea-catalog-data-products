id: dea:data-product-https-data-enseignementsup-rec-statistical-rwmbse
type: DataProduct
name: Statistical Operations and Management Control Programme for Higher Education
  and Research
description: This dataset lists the annual programmes for the collection of statistical
  information and management control planned by the central administration directorates
  of the Ministry in charge of National Education, Higher Education and Research.
  It consists of statistical surveys and evaluations of the acquis carried out by
  the Sub-Directorate for Information Systems and Statistical Studies (DGESIP-DGRI
  A-2, known as SDSIES) and the Directorate for Evaluation, Foresight and Performance
  (Depp), as well as management control operations carried out by the directorates
  in the context of their missions. It also includes the entire statistical system
  for observing research and development (R&D), which is aimed at public and private
  operators, both at national and territorial level. It shall indicate the purpose,
  scope and timing of each operation, the nature, the date of availability and the
  arrangements for disseminating the results. It distinguishes the reassembly of computerized
  files from collections by means of questionnaires. Each operation is characterized
  by the reference Lolf program(s). The statistical and management operations of the
  central administration directorates constitute knowledge tools for steering and
  managing the education system, higher education and research. Their results are
  generally reserved for internal use within the administration. Some results, however,
  are disseminated on the website of the Ministry of Higher Education and Research
  or feed into reports and studies.
