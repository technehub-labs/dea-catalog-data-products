name: Map of Health Areas of Castile and Leon
description: Layer of Health Areas of Castilla y León.Cartographic representation
  of the Health Areas in which the health system of Primary Care of Castilla y León
  is organized, whose regulation is established by Decree 108/1991 and subsequent
  modifications.Map elaborated from the integration of the municipal areas in accordance
  with the organization and existing distribution of the health resources on the territory
  of the Community.Result 11 Health Areas (two areas in León and Valladolid and one
  per province in the rest).
