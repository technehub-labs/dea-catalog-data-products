id: dea:data-product-https-www-arcgis-com-home-item-demarcation-2aturx
type: DataProduct
name: Demarcation line
description: On 11 November 1942, following the Allied landings in North Africa on
  8 November (Operation Torch), the free zone was invaded by the Germans and Italians.
  Therefore, the free zone is called the "south zone" and the occupied zone is called
  the "north zone". This data was based on the description of the line as described
  in the armistice documents of 22 June 1940, as well as various period cards such
  as the Michelin cards at 1/200 000.
