id: dea:data-product-https-dane-gov-pl-pl-dataset-2-liczba-wiadc-67-sau2n7
type: DataProduct
name: Liczba świadczeń udzielonych w danym roku z zaraportowanym danym kodem rozpoznania
  głównego świadczenia wg klasyfikacji ICD-10 (do poziomu 5 znaków).
description: <p style="margin-left:0cm; margin-right:0cm">Udostępnione dane dotyczą
  liczby świadczeń udzielonych w danym roku z danym kodem rozpoznania głównego wg
  Międzynarodowej Statystycznej Klasyfikacji Chorób i Problemów Zdrowotnych ICD-10
  (do poziomu 5 znaków). Analizując dane, należy mieć na uwadze, że dane gromadzone
  w NFZ nie mają stricte epidemiologicznego charakteru, ale służą przede wszystkim
  celom rozliczeniowym. Wnioskowanie o procesach epidemiologicznych wymaga przeprowadzania
  na tych danych celowanych analiz. Danymi źródłowymi do zestawienia są dane przekazywane
  przez świadczeniodawców do Narodowego Funduszu Zdrowia z wykorzystaniem komunikatu
  SWIAD (<a href="http://www.nfz.gov.pl/dla-swiadczeniodawcy/sprawozdawczosc-elektroniczna/lista-typow-komunikatow-xml/komunikat-swiad/"
  style="color:#0563c1; text-decoration:underline">www.nfz.gov.pl/dla-swiadczeniodawcy/sprawozdawczosc-elektroniczna/lista-typow-komunikatow-xml/komunikat-swiad/</a>
  ). W zestawieniu nie są uwzględnione rozpoznania, o których mowa w <strong> </strong><em>Ustawie
  z dnia 5 grudnia 2008 r. o zapobieganiu oraz zwalczaniu zakażeń i chorób zakaźnych
  u ludzi. </em>Usunięto również zidentyfikowane oczywiste błędy sprawozdawcze.</p>
