name: Certified organic farming area
description: 'Organic or organic farming: The production of agri-food products without
  the use of synthetic chemicals and whose production methods comply with current
  regulations is understood.The agricultural holding: It can be defined as an agricultural
  unit (set of land and/or livestock), under a single management, located in a given
  geographical location and using the same means of production. Set of the area of
  tilled land and land for permanent pasture. Carved land includes arable crops, fallow
  land, family gardens and land used for woody crops.'
