id: dea:data-product-https-data-loire-atlantique-fr-judicial-edu-217-zmfzw7
type: DataProduct
name: Judicial Educational Aids – Intensive Family Educational Action in Loire-Atlantique
  by EPCI
description: 'Number of children in child welfare for whom an educational action measure
  in a family environment (AEIMF) has been issued, by inter-community since 2009.
  * * * * The intensive educational action in the family environment, which is an
  enhanced open-environment educational action (AEMO), is pronounced by the children’s
  judge and aims to entrust to a qualified person or a service the mission of providing
  assistance and advice to the family, in order to overcome its difficulties while
  keeping the minor in his current environment. It is aimed at any family facing difficulties
  in the upbringing of its children. Statistical confidentiality shall be applied:
  not all information between 1 and 4 included is disseminated. They correspond to
  uninformed cells.'
