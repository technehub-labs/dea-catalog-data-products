type: DataProduct
name: Statistics Personnel Official 2023
description: Statistics that are part of the Military Statistical Yearbook in compliance
  with the regulations of the Defense Statistical Plan (PLANESTADEF), are gathered
  in a single publication, where all the tables of each monographic statistic are
  collected. Provides information on administrative situations, categories of public
  employment, scales and military jobs; distributions by province, gender, etc. The
  quality of the information contained in this work is based both on the processes
  of purification and correction to which the data were submitted, when the corresponding
  statistics were elaborated, and on the accuracy with which these disaggregated data
  were provided by the bodies depositing the information, this accuracy being a fundamental
  premise that defines, in general, the quality of any statistical information. The
  collaboration of the agencies that have provided the data, essential for the publication
  of this work, is appreciated. Likewise, the Statistics Unit of the Central Organ
  of the Ministry of Defense is open to all kinds of suggestions that contribute to
  improving and completing the published information.
