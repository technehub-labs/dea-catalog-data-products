type: DataProduct
name: 'Statistical yearbook 2023-2025: Chapter "Labour market and economy"'
description: 'The Statistical Yearbook of the Hanseatic City of Lübeck offers comprehensive
  insights in population, economy, environment and finance with tables, graphs and
  Maps at district level. More at <https://www.luebeck.de/yearbook>. As a supplement
  to the PDF publication, the Statistical Yearbook is published here. Provided in
  Excel format as open data. Overview of the content of the chapter "Labour market
  and economy": - Sign explanations / abbreviations - Key messages National accounts:
  - Employment trends 2000-2022 by economic sector - Gross value added 2000 - 2022
  n. Economic sectors in each Prices in Mill. € - Development of the gross domestic
  product 2000 - 2022 in current prices in Mill. € - Evolution of gross wages and
  salaries per employee:in (domestic) 2000 - 2022 in € - Development of primary income
  of households 2000 - 2022 in Mill. € - Evolution of household disposable income
  per capita 2000 - 2022 in € - Development of the purchasing power of households
  and per person 2019/21/24 in € n. Municipalities/Districts Employees subject to
  social security contributions: - Development of employees subject to social security
  contributions at the place of work 2010 - 2024 - Development of the SvB and marginally
  paid employees at the place of work 2010 - 2024 - Development of the SvB and marginally
  paid employees at the place of residence 2000 - 2024 - Employees subject to social
  security contributions at their place of residence on 30 June 2024 by district -
  Development of SvB at residence 2010 - 2024 by age group - Development of commuters
  to Lübeck 2010 - 2024 - Development of commuters from Lübeck 2010 - 2024 - Development
  of the commuter balance for Lübeck 2005 - 2024 Labour market: - Development of unemployment
  and unemployment rates in regional comparison 1950 - 2024 - Development of the unemployed
  in the Hanseatic city of Lübeck 2010 - 2025 - Unemployed on 30/06/2025 by district
  - Development of the unemployed according to SGB III (ALG I) 2010 - 2025 - Developmen'
