id: dea:data-product-https-data-gov-lt-datasets-339-lithuanian-n-btbmkz
type: DataProduct
name: Lithuanian National Atlas (Volume III)
description: Volume III of the National Atlas of Lithuania reflects political, economic,
  social, cultural and historical changes that occurred at the turn of the 20th-21st
  centuries. The Atlas consists of six large chapters that illustrate the development
  of the administrative division at the end of the 20th century — the beginning of
  the 21st century; dynamics of population, its national composition, professed religions
  and prevailing political attitudes; social situation of the national population
  and its development in recent decades; economic situation of the country, development
  of its agriculture and forestry; excavation of mineral resources and developed industries;
  the national transport system, transport of cargo and passengers, forms and volumes
  of communications services.
