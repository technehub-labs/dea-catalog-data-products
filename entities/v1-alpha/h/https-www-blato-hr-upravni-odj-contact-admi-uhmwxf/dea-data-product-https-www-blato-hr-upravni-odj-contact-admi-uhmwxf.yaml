name: Contact - Administrative Departments of the Municipality of Blato
description: 'The administrative bodies of the Municipality of Blato are established
  for the performance of tasks falling within the self-governing scope of the Municipality
  of Blato as a unit of local self-government and state administration tasks that
  have been transferred to the Municipality of Blato. The administrative bodies shall
  be composed of the following administrative departments: MANAGEMENT SECTION FOR
  GENERAL AFFAIRS, GENERAL ASSESSMENT MANAGEMENT AND SOCIAL ACTIONS MANAGEMENT DEPARTMENT
  FOR BUDGET, FINANCIAL, ECONOMIC AND PREPARATORY OF EU FUNDS PROJECTS MANAGEMENT
  SECTION FOR COMMUNICAL ACTIONS, INFRASTRUCTURE, ENVIRONMENTAL PROTECTION AND ECONOMIC
  PROTECTION'
