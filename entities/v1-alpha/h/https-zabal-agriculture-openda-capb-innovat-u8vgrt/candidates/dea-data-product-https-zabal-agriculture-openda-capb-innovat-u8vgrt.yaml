type: DataProduct
name: CAPB – Innovation Agriculture Award 2018 to 2021
description: 'The Community of agglomeration Basque Country supports farmers in the
  implementation of innovative projects for the territory CAPB \- Innovation agriculture
  award 2018-2019-2020 The Basque Country Agglomeration Community wishes to make income
  improvement a fundamental challenge for Basque agriculture and fishing. It also
  wants to help and support agriculture in the Basque Country to meet current ecological
  and environmental challenges, while meeting the challenge of a sustainable economic
  model. To achieve these objectives, the Community of Aglomeration has a strong desire
  to support innovation and experimentation on these issues and the emergence of reproducible
  projects throughout the territory. In addition to the other schemes put in place,
  three Calls for Projects on the agricultural and agri-food sector were launched
  in 2018 and renewed in 2019 and 2020. PAAs: Innovative and experimental farms since
  2018 New sector since 2018 New products since 2018 New modes of commercialisation
  in short circuit and proximity since 2020'
