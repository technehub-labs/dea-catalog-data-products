id: dea:data-product-https-data-gov-lt-datasets-179-data-from-th-hm3cye
type: DataProduct
name: Data from the state monitoring of the Curonian Lagoon and the Baltic Sea
description: The collection contains data from national environmental monitoring of
  the Curonian Lagoon and the Baltic Sea. The dataset consists of measurements and
  analyses of hydrological, hydrochemical, biological and specific pollutants (in
  water, bottom sediments, biota) at monitoring sites in the Baltic Sea and the Curonian
  Lagoon.
