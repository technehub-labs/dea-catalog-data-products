name: Rescue actions in the natural environment by Catalan Firefighters
description: Detall de les actuacions ateses pel cos de Bombers de la Generalitat
  de Catalunya en salvaments al medi natural (recerca i rescat en medi fluvial -rius,
  barrancs, llacs-, recerca i rescat en medi marítim, recerca de persones perdudes,
  rescat de muntanya, rescat en coves i pous), per regió d’emergències, comarca i
  municipi. Dades disponibles a partir de l’any 2010.
