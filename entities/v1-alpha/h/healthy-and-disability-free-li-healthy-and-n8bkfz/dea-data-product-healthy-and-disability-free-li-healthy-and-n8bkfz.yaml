type: DataProduct
name: Healthy and Disability-Free Life Expectancy
description: '<dp-prose> <p>This dataset contains healthy life expectancy and disability-free
  life expectancy by gender, from birth and age 65.</p> <p>Health life expectancy
  is defined as the average number of years a person aged ''x'' would live in good/fairly
  good health if he or she experiences the particular area''s age-specific mortality
  and health rates throughout their life.</p> <p>Disability-free life expectancy is
  defined as the average number of years a person aged ''x'' would live disability-free
  (no limiting long-term illness) if he or she experienced the particular area''s
  age-specific mortality and health rates throughout their life.</p> <p>The estimates
  are calculated by combining age and sex specific mortality rates, with age and sex
  specific rates on general health and limiting long-term illness.</p> <p>For more
  information see the ONS website: <a href="https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/healthandlifeexpectancies">https://www.ons.gov.uk/peoplepopulationandcommunity/healthandsocialcare/healthandlifeexpectancies</a></p>
  </dp-prose>'
