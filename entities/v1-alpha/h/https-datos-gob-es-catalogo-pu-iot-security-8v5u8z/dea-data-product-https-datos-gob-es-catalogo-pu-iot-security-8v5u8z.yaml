name: IoT security - network traffic under normal conditions - Netatmo Healthy Home
  Coach
description: 'Dataset created under the Connecting Europe Facility of the European
  Union programme, VARIOT project TENtec n. 28263632. Developed by the Intelligent
  Systems for Industrial Systems group supported by the Department of Education, Language
  policy and Culture of the Basque Government. This dataset comprises Netatmo Healthy
  Home Coach Iot device network traffic and different features under normal operation
  mode. - Device description: You want to provide the healthiest home possible for
  your family. Netatmo’s Smart Indoor Air Quality Monitor Healthy Home Coach shows
  you how. Whether it’s the best noise level for sound sleeping or the right humidity
  levels for a child with asthma, the Monitor measures what matters with its sensors,
  highlights potential problems, and tells you how to fix them. - Infection type:
  None'
