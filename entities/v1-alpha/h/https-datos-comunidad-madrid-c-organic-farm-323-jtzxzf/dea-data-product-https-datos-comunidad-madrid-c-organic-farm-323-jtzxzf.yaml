description: 'Organic, organic or organic farming: It is a system for cultivating
  an autonomous agricultural holding based on the optimal use of natural resources,
  without using synthetic chemicals, or genetically modified organisms (GMOs), neither
  for fertilizer nor to combat pests, thus achieving organic food while preserving
  the fertility of the land and respecting the environment.The number of operators
  has been counted once for each of the economic activities.'
