type: DataProduct
name: Roads in Agglomeration CD76 2026 20260825
description: Table of roads located in agglomerations of the departmental road network
  of Seine-Maritime on 13 August 2026, including the name of the agglomeration and
  the municipality concerned by each road segment. As is apparent on the map, the
  roads located in the Rouen Normandie Metropolis fall within this community and are
  therefore not part of the departmental road network. **Metadata** [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/30cd19107ff84704b9ba672bc71c1a06/data)
  **Additional resources** * **Site of the Seine-Maritime Department:**[ https://www.seinemaritime.fr/app/uploads/2026/01/Schema-Directeur-des-mobilites-2025-Departement-de-la-Seine-Maritime.pdf](https://www.seinemaritime.fr/app/uploads/2026/01/Schema-Directeur-des-mobilites-2025-Department-de-la-Seine-Maritime.pdf)
  The website of the Department offers for download in pdf format the master plan
  of the departmental road network of the Seine Maritime.
