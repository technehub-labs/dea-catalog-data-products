id: dea:data-product-https-data-gov-lt-datasets-206-forest-condi-ssr2hg
type: DataProduct
name: Forest condition survey data
description: The forest condition survey data, prepared according to the data of the
  project &quot;Experimental Ecosystem Volume and Forest Condition Account&quot;,
  at the level of municipalities. The data is linked to the second stage of the experimental
  ecosystem statistics project - the basic data set of forest indicators according
  to the groups and classes of indicators of the state of ecosystems. The indicators
  are calculated and presented according to the relevant spatial units at the beginning
  of the period, around 2000. (denoted by the letter &#39;x&#39;) and at the end -
  2021.
