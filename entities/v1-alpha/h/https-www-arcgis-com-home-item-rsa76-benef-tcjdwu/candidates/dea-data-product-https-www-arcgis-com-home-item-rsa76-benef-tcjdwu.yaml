name: RSA76 Benef by age canton 2023 20240729
description: 'Beneficiaries of the Active Solidarity Income (RSA) in open and payable
  law and subject to rights and duties as at 31/12/2023 by age group, by canton, in
  Seine-Maritime (general scheme). Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/de720164710f4c78b767cac1b167a28c/data)
  Additional resources * **Website of the Seine-Maritime Department**: <o:p></o:p>[https://www.seinemaritime.fr/guide/mon-quotidien/insertion-emploi/ariane-76-mon-guide-insertion-et-emploi/le-rsa/](https://www.seinemaritime.fr/guide/mon-quotidien/insertion-emploi/ariane-76-mon-guide-insertion-et-emploi/le-rsa/)
  The official website of the Seine-Maritime department dedicates a page of advice
  to applicants and beneficiaries of the RSA: "the RSA: an allowance, an accompaniment".
  This page provides links to downloadable pdf guides, online services and simulators
  * **Data.caf.fr website**: <o:p></o:p>[https://data.caf.fr/explore/?disjunctive.keyword&sort=explore.download_count&q=RSA](https://data.caf.fr/explore/?disjunctive.keyword&sort=explore.download_count&q=RSA)
  The CAF open data site offers a page relating to RSA data at national, departmental,
  inter-municipal and communal levels. This data can be downloaded in csv format.
  * **Site service-public.fr**: <o:p></o:p>[https://www.service-public.fr/individuals/yourrights/N19775](https://www.service-public.fr/individuals/yourrights/N19775)
  The official website of the French administration offers a page dedicated to Active
  Solidarity Income (ASR), including, in addition to general information on the conditions
  of access to the ASR, downloadable forms, simulators and related teleservices. *
  **Data DREES website**: <https://www.data.drees.sante.gouv.fr/> DREES (Directorate
  for Research, Studies, Evaluation and Statistics) is a directorate of the central
  administration of health and social ministries. Its open data site offers various
  datasets, in particular on the themes ‘Guidance and support for RSA beneficiarie'
