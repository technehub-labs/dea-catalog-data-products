type: DataProduct
name: Transport zoning ZT84 of the EDM2018 and ESM2014
description: Transport zones (TZs) constitute the basic spatial unit for the analysis
  and aggregation of information. The zoning of the EDM 2018 and ESM 2014, is constituted
  by 84 transport zones for the scope of the Community of Madrid. The ZT84 has a scale
  of territorial division at the level of districts and municipalities, except in
  crown C in which aggregations of several municipalities are given.rrFor technical
  reasons, the date of last update of the data is not automatically refreshed, but
  is specified in the destination web address.
