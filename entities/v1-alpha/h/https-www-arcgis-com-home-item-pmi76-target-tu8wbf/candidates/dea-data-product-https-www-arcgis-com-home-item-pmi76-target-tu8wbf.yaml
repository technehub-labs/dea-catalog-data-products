id: dea:data-product-https-www-arcgis-com-home-item-pmi76-target-tu8wbf
type: DataProduct
name: PMI76 Target public vaccinations 2018a2023 dec2024
description: 'This file presents vaccinations on people belonging to the target audiences
  (people facing social fragilities, people in homes, Travellers, ...) carried out
  by the Maternal and Infant Protection (PMI) of the Departmental Council of Seine-Maritime,
  by Territorial Unit of Social Action (UTAS) and by year, from 2018 to 2023. It should
  be noted that activity in 2020 and, to a lesser extent, 2021 was impacted by successive
  COVID lockdowns. In addition, the 2022 data collection was impacted by the IT attack
  on the Department in October 2022 (hence many "undetermined" (ND) mentions). The
  vaccinations of the target audiences include the vaccination sessions on the target
  audiences, the number of people vaccinated under the target audiences, the vaccination
  acts on people under the target audiences. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/0951c8db3e1644a59c01c01885d440e6/data)
  Additional resources * Website of the Ministry of Solidarity and Health: <https://solidarites-sante.gouv.fr/prevention-en-sante/sante-des-populations/children/article/screening-and-prevention-à-l-enfant>
  This page of the Ministry’s official website offers numerous documents, downloadable
  in pdf format, relating to screening and prevention in children. * Professional
  website vaccination info service: [https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale](https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale)
  This website of the national public health agency dedicated to vaccination professionals
  offers data on vaccination coverage in France, by age, region, department, etc.,
  downloadable in pdf format. * World Health Organisation website: [https://apps.who.int/immunization
  _monitoring/globalsummary/timeseries/tswucoveragebcg.html](https://apps.who.int/immunization
  _monitoring/globalsummary/timeseries/tswucoveragebcg.html) T'
