id: dea:data-product-https-stuns-entryscape-net-sto-dansm-staren-kxpgab
type: DataProduct
name: Dansmästaren Uppsala - open innovation environment for EV charging and infrastructure
description: Power and energy data from the parking garage Dansmästaren in Uppsala.
  60 charging points - 400+ parking spots. Energy storage and solar power with an
  Energy Management System under implementation in a co-creation with Uppsala University
  STUNS and Uppsala Parking together with Uppsala University creates a place where
  testing and development can take place in a real environment.
