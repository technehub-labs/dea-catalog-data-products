type: DataProduct
name: Map of ground numbers
description: A soil number map is a spatial record containing a basic assessment of
  soil properties given in numerical terms. In determining the basic assessment of
  soil properties, the geological basis, the stage of development and the texture
  from the data of the soil map of Slovenia shall be taken into account.
