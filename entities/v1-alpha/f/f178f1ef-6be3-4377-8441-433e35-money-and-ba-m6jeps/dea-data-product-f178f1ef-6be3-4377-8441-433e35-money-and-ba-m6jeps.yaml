id: dea:data-product-f178f1ef-6be3-4377-8441-433e35-money-and-ba-m6jeps
type: DataProduct
name: Money and Banking Statistics
description: The Money and Banking Statistics contain data on the liabilities and
  assets of within-the-State offices of credit institutions. These data are further
  broken down by institutional sector, residency of counterparties, and by the type
  and maturity of the main asset (loans, holdings of securities) and liability instruments
  (deposits, securities issued) of interest. Detailed statistics are available on
  developments in Irish mortgage, consumer and deposit markets.
