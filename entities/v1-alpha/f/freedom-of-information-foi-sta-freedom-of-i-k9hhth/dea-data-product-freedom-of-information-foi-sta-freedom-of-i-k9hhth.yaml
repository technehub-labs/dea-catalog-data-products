name: Freedom of Information (FOI) Statistics - Environment Agency
description: 'Annual statistics of the Environment Agency''s Freedom of Information
  (FOI) requests. This dataset will be updated annually with data from 2021/2022;
  2022/2023; 2023/2024. Yearly (1st April - 31st March) Data shows: Total requests
  received Total requests closed Total requests closed within statutory timescale
  Total requests closed outside statutory timescale Total closed requests where information
  was granted in full Total closed requests where information was withheld in full
  Total closed requests where information was partially provided Total internal reviews
  received Attribution statement: © Environment Agency copyright and/or database right
  2024. All rights reserved.'
