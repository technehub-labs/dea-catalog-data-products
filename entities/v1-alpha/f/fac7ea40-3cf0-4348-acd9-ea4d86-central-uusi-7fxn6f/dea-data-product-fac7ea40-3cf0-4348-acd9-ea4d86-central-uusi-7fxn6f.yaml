name: Central Uusimaa Environment Centre's air quality measurement points
description: The data includes air quality measurement points located in the area
  of the contracting municipalities of the Central Uusimaa Environment Centre (Järvenpää,
  Kerava, Mäntsälä, Nurmijärvi and Tuusula). The data is produced by measuring the
  coordinates of the points in the terrain. The material will be updated if necessary.
