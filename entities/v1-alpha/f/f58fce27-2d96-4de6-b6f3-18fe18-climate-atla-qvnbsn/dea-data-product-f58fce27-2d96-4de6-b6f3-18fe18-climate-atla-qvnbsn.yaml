id: dea:data-product-f58fce27-2d96-4de6-b6f3-18fe18-climate-atla-qvnbsn
type: DataProduct
name: 'Climate Atlas NRW - Biodiversity and Nature Conservation: Late frosts'
description: 'Service consisting of layers of the average number of late frets per
  year. Late frosts are days that have a temperature < 0 °C within the actual general
  growing season and occur before 01.06. This corresponds to the occurrence of frost
  days within the actual general growing season. The data are available as observational
  data after the 30-year climate normal periods in the observation period 1961-2020
  as well as future projections for 2031-2060 and 2071-2100. The climate projections
  of the future are structured according to the climate scenarios RCP2.6, RCP4.5 and
  RCP8.5. Absolute values and relative values with a delta change value compared to
  selected reference climatic normal periods are shown. Relative changes in the past
  are compared with the climate normal period 1991-2020. Projected relative changes
  with the reference period 1971-2000. The strength of the possible climate signal
  is divided according to the 15th, 50th and 85th scenarios. percentile. Data source:
  German Weather Service (DWD); Sources of climate projection data: Brienen et al.
  (2020), Krähenmann (2019).'
