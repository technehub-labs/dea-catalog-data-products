type: DataProduct
name: Climate Analysis Map Tag PET
description: 'The Tag PET climate analysis map shows the physiologically equivalent
  temperature (PET). As a heat index, PET combines the effects of air temperature,
  humidity, wind speed and solar radiation on the energy balance of the human body.
  It can be understood as a perceived temperature (unit: °C).'
