id: dea:data-product-fgs-tree-health-options-fgs-tree-hea-m6ecuk
type: DataProduct
name: FGS Tree Health - Options
description: 'Scotland’s woodlands and forests are a vital national resource and play
  an important role in rural development and sustainable land use. As well as helping
  to reduce the impacts of climate change and providing timber for industry, our forests
  enhance and protect the environment and provide opportunities for public enjoyment.
  The Forestry Grant Scheme (FGS) will support: - the creation of new woodlands, contributing
  towards the Scottish Government target of over 10,000 hectares of new woodlands
  per year - the sustainable management of existing woodlands TREE HEALTH - OPTION
  ==================== This option provides support to prevent the spread of Phytophthora
  ramorum (P. ramorum). This option helps with the restoration of forests affected
  by P. ramorum by supporting the work to remove affected trees and carry out subsequent
  replanting.'
