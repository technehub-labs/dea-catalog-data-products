name: Vantaa sustainable development indicators
description: 'The file contains the indicators of Vantaa''s Voluntary Local Review
  (VLR). The indicators are based on the Sustainable Development Goals (SDGs) of the
  UN 2030 Agenda. The indicators in the file include dimensions of ecological, economic,
  social and cultural sustainability. The Vantaa Sustainability Report is available
  on the website: https://www.vantaa.fi/fi/kaupunki-ja-päätöksenteko/vastuullisuus/kestavan-kehityksen-raportti'
