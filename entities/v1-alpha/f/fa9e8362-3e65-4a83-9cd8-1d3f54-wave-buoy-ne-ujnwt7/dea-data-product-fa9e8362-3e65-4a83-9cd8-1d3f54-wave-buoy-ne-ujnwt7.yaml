id: dea:data-product-fa9e8362-3e65-4a83-9cd8-1d3f54-wave-buoy-ne-ujnwt7
type: DataProduct
name: Wave Buoy Network
description: Waverider buoys have collected observations and measurements on wave
  characteristics including wave height and period statistics. Waverider buoys are
  located in the Galway Bay 1/4 Scale Test Site and the Full Scale Atlantic Marine
  Energy Test Site (AMETS) located off the Erris Peninsula near Belullet. Waveriders
  first deployed in 2006 with main deployments from 2008 onwards. Waveriders have
  collected data on waves using latest instrumentation technologies to reflect the
  real conditions experienced. Waveriders have been managed by the Marine Institute
  (Ireland) in partnership with the Sustainable Energy Authority of Ireland. Dataset
  complete for functional periods of observations. Any incomplete periods reflect
  instrumentation offline due to adverse weather conditions and or maintenance
