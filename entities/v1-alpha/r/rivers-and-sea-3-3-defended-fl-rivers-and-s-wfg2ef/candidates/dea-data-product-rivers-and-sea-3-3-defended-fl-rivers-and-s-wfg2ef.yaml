id: dea:data-product-rivers-and-sea-3-3-defended-fl-rivers-and-s-wfg2ef
type: DataProduct
name: Rivers and Sea 3.3% defended flood risk extents - climate change
description: 'This dataset shows the extent of land at risk of flooding to a defined
  annual exceedance probability (AEP) or chance of flooding each year, taking into
  account the possible effects of climate change as detailed below. This dataset represents
  the following scenario: ● Defended: 3.3% AEP (1 in 30) Rivers/Sea The defended products
  take into account the presence of flood defences and assume that they operate in
  the way they were intended (or designed) to function. This does not include any
  asset failure (or removal) scenarios. Climate change scenarios have been produced
  to indicate the possible impacts of climate change on future risk. The climate change
  allowances are based on the latest UK Climate Projections (UKCP18) from the Met
  Office, using the Representative Concentration Pathway (RCP) 8.5. The specific climate
  change scenarios shown are as follows: ● the ‘Central’ allowance for the 2080s epoch
  (2070-2125) for risk of flooding from rivers ● the ‘Upper End’ allowance for risk
  of flooding from the sea, accounting for cumulative sea level rise to 2125. For
  climate change scenarios, it is assumed that existing flood defences continue to
  function in the same way as present day. No allowance is made for any future changes
  to flood defence design or operation. These datasets are designed to only give an
  indication of flood risk to an area of land and are not suitable for showing whether
  an individual property is at risk of flooding. This is because we cannot know all
  the details about each property. Information on flood depth, speed or volume of
  flow is not included. Users of these datasets should always check they are suitable
  for the intended use. Attribution statement: © Environment Agency copyright and/or
  database right 2025. All rights reserved.'
