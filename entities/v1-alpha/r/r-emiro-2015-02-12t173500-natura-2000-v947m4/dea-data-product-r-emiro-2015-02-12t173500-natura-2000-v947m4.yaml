id: dea:data-product-r-emiro-2015-02-12t173500-natura-2000-v947m4
type: DataProduct
name: Natura 2000 network - SCI and SPA habitats
description: 'Cartography for polygons: lines and points of habitats of Community
  interest (Annex I of Directive 92 143/EEC) within the Natura2000 Network Sites (SCIs
  and SPAs) of the Emilia-Romagna Region.The mapping of habitats, intended as a collection
  in a specific database of information on the recognition and location of natural
  environments, assumes the latter as the fundamental territorial units capable of
  containing and representing the extraordinary mosaic of biological diversity. The
  cartographic restitution that is obtained constitutes a first specific-thematic
  analysis within the perimeters of SCI and SPA, a sort of zoning within the Natura
  2000 Network aimed at summarizing a complex and multifunctional information content.
  The final objective is a cognitive framework, as accurate and complete as possible,
  of the distribution of habitats and the constant and updated monitoring of evolutionary
  changes. It is understood that the Charter, by its nature of organized collection
  of all georeferenced information relating to habitats, is intended to illustrate
  and not to certify and has all the limits of an activity in continuous evolution
  and a simplified representation of reality. It is not a rule, but rather a valid,
  but not exhaustive, reference to the date of update. As such it will be of help
  to all those who want to deepen the territorial analysis, but it cannot replace
  the other cognitive activities aimed at planning and evaluating the impact of plans,
  projects and interventions on the areas of the Nature Network, whose realization
  provides, on a case-by-case basis, different scales of study of the phenomena.'
