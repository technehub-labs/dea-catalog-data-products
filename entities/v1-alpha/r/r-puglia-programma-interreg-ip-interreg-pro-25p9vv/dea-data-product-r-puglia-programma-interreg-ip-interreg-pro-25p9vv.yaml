type: DataProduct
name: INTERREG PROGRAMME IPA SA ITALIA-ALBANIA-MONTENEGRO 2021-2027. SA SKILLS PROJECT
description: The dataset aims to give an account of the outputs of the strategic project
  ‘High LEVEL and market-respondent Competences for a Blue and Digitalized Smart and
  skilled South Adriatic – SA SKILLS’, of which the Puglia Region – Department of
  Labour Policies, Education and Training is a project partner, jointly with the University
  of Montenegro – Institute of Marine Biology (LEAD PARTNER), the Molise Region –
  Service for the Competitiveness of Production Systems, the State Agency for Strategic
  Programming and Aid – Albania, the Ministry of Economic Development and Tourism
  of Montenegro and the Ministry of Agriculture and Rural Development of Albania.
