name: Natura 2000 network - SCIs and regional SPAs
description: 'Sites of the "Natura 2000 Network" in Emilia-Romagna: Sites of Community
  Importance (SCIs), Special Areas of Conservation (SACs) and Special Protection Areas
  (SPAs). Their boundaries coincide with the boundaries sent by the Emilia-Romagna
  Region to the Ministry of the Environment and Protection of the Territory and in
  some cases these perimeters may not yet have been transposed into the corresponding
  official documents of the European Union.'
