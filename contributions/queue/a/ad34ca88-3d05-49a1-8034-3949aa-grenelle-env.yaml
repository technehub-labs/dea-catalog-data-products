name: Grenelle Environment _ limited urbanization rules in Sarthe
description: Grenelles of the environment - urbanization rules limited in Sarthe applicable for municipalities
  less than 15 km from urban units of more than 15 000 hbts (ref 2011) from 1 January 2013. The outline
  of the urban units was established from the cadastral plots built or artificialized forming a continuity
  of urbanization over at least 200m. The urban units whose population exceeds 15,000 inhabitants (ref
  2011) are 4, Le Mans, La Flèche, Sablé sur Sarthe and Alençon. The urban unit of Le Mans exceeds 50,000
  inhabitants, and is the only urban unit where the rules of limited urbanization are applicable before
  2013.
