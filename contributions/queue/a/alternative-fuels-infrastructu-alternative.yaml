name: Alternative fuels infrastructure data
description: 'The Programme Support Action (PSA) on ID issuing and data collection
  for alternative fuels (IDACS) has been set-up by the European Commission to support
  Member States in setting up data collecting for alternative fuels and make the data
  available through the National Access Points and to develop an effective, EU-wide
  coordination mechanism to assign unique identification codes to CPOs and EMSPs.
  The PSA has a duration of three years (2019-2021) and its Consortium consists of
  15 Member States: Austria, Belgium, Czech Republic, Croatia, France, Germany, Greece,
  Hungary, Lithuania, Luxembourg, The Netherlands, Poland, Portugal, Slovenia and
  Spain. The Consortium mandatorily have to collect data related to alternative fuels
  infrastructure, elected electric charging points and hydrogen refueling stations
  (HRS). Other alternative fuels, such as CNG, LNG, LPG and highly-blended biofuels
  are optional.'
