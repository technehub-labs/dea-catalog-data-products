name: Blended learning analyst in higher education, 2019
description: Blended learning, which represents the intertwining of traditional teaching
  in a lecture room with implementation in an online environment, is becoming increasingly
  present in higher education. Learning management systems in which e-learning takes
  place store each student's interaction with the system in log files. At the same
  time, various databases of educational data are kept about the student in electronic
  form, and surveys are also increasingly implemented in the online environment. Analyzing
  and mining educational data collected in various databases in order to understand
  the learning process and extract information that would help in meaningful Decisions
  to improve the educational process, represents a scientific area called learning
  analytics. The aim of the research in the field of educational data was to improve
  Understanding the learning process in blended learning in higher education with
  the aim of identifying factors that have a significant impact on the student's work
  in the online classroom and during the activities Identify those that can be linked
  to final performance. The empirical part presents two common approaches of learning
  analytics performed with freely available software tools. The calculations are based
  on various databases of students of the Faculty of Administration. By mining educational
  data, we explored the predictive performance of various models predicting the final
  performance of the student on the basis of his activity in the online classroom
  and predispositions (learning approach, previous performance).
