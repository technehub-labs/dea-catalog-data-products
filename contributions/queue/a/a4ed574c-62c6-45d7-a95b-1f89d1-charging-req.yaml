name: 'Charging requirements: Home charging availability in the ‘Flexible’ charging world for the year
  2035'
description: The map shows the percentage of plug-in vehicles (battery electric vehicles and plug-in hybrids)
  per selected municipality that will have no charging facilities at home or at work in 2035. The percentage
  of plug-in vehicles that cannot charge at home is also given (expressed as a decimal figure). The availability
  of private home charging points and charging facilities at the workplace depends on various assumptions
  regarding the implementation strategy, some of which are local. In order to show the range of possible
  developments, the three charging worlds "Convenient", "Planned" and "Flexible" were designed based on
  common industry assumptions in the SFOE study "Understanding charging infrastructure 2050" to show the
  direction in which the charging infrastructure in Switzerland could develop. In the "Flexible" charging
  world, many people cannot charge at home; they charge at various locations where their vehicle is parked
  - at work or when shopping.
