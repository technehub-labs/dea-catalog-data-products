name: Quality of living environment in selected Slovenian cities, 2014
description: 'The main purpose of the research was to measure the quality of living environment in selected
  urban areas of selected Slovenian cities. at the beginning of the second decade of the 21st century
  in a subjective way, that is, from the point of view of valuation by the inhabitants there. The quality
  of the living environment has been assessed in a total of 15 neighbourhoods of different morphological
  types in five Slovenian cities: Ljubljana, Maribor, Koper, Jesenice and Grosuplje, illustrating five
  different types of cities in terms of size, socio-economic characteristics, position in the urban system
  and natural-geographical characteristics. The study was conducted in the old town. centers and selected
  areas of mostly single-family houses, older block neighborhoods and modern multi-family houses. On the
  way to the realization of the purpose, we set out the following Objectives: definition of the living
  environment, its spatial levels and main contents, assessment of the quality of individual contents
  of the living environment, assessment of the quality of the living environment as overall, disclosure
  of factors in the assessment of the quality of the living environment, identification of potential migratory
  mobility, identification of the living preferences of the population and evaluation of the importance
  of living environment as one of the contents of the quality of life. The author conducted the analysis
  in selected neighborhoods.'
