name: WEEE Received AATFs UK Summary
description: 'This record is for Approval for Access product AfA313. WEEE Received
  AATFs UK Summary contains data reported by Approved Authorised Treatment Facilities
  (AATFs) about the amount of Obligated WEEE received. The report contains figures
  for: - WEEE received for treatment - WEEE received for reuse - WEEE received and
  then sent to another Authorised Treatment Facility or Approved Authorised Treatment
  Facility And is broken down by; - Category (1 - 13) - Household/non-household The
  report is a UK dataset and contains no information about any specific company. Data
  is reported quarterly. Reports available date back to Q3 2007. Attribution statement:
  © Environment Agency copyright and/or database right 2019. All rights reserved.'
