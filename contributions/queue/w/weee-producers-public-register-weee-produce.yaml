name: WEEE Producers Public Register England
description: 'This record is for Approval for Access product AfA311. This dataset
  contains details of: Waste Electrical and Electronic Equipment (WEEE) producers
  who have registered with the Environment Agency under the Producer Responsibility
  Regulations for Waste Electrical and Electronic Equipment. This includes names and
  addresses only, as shown on our Public Register. Producer ID marks details from
  the public register are not included in this dataset for practical reasons. Approximately
  six thousand Producers are registered. Some entries may be removed for reasons of
  National Security or Commercial Confidentiality. A separate assessment, AfA154 Waste
  Electrical and Electronic Equipment Contacts (Corporate Entities Only) covers: Contact
  details for Producers, Compliance schemes etc. Reprocessors and exporters of WEEE
  – contact details. INFORMATION WARNING Producers who registered with SEPA (Scottish
  Environment Protection Agency) or NIEA (Environment Agency Northern Ireland) are
  not part of this dataset. Data relating to NRW (Natural Resources Wales) registrations
  is currently included in this product, and its inclusion will be kept under review.
  Attribution statement: © Environment Agency copyright and/or database right 2019.
  All rights reserved.'
