name: West of Scotland Pest Free Area
description: The pest free area (PFA) was established in 2005 following the repeal
  of the GB protected zone for Dendroctonus micans by the Plant Health (Forestry)
  (Great Britain) Order. The existing PFA boundary was predicated on extensive surveys,
  including pheromone trapping, in GB since the establishment of protected zones for
  conifer bark beetles according to Commission Directive 92/76/EEC. The PFA defines
  an area in which the absence of findings of three bark beetles found elsewhere in
  GB, Dendroctonus micans, Ips cembrae and Ips sexdentatus, can be demonstrated. It
  is also possible to confirm the absence of the GB priority pests Ips duplicatus,
  Ips typographus and Ips amitinus in this area. All these species are listed on the
  UK Plant Health Risk Register. Crucially, the absence of these bark beetles, and
  the routine inspection of felled timber in the PFA, has enabled the export of conifer
  roundwood to the island of Ireland, where Protected Zone (PZ) status for Dendroctonus
  micans, Ips cembrae and Ips sexdentatus is maintained. Additional restrictions on
  export of spruce timber are currently in place for part of the PFA due to the proximity
  of D. micans findings outside the boundary. The area covered by these restrictions
  can be seen in the West of Scotland Pest Free Area Buffer Zone dataset. Further
  information, including details documents, can be found at https://www.forestry.gov.scot/sustainable-forestry/tree-health/tree-pests-and-diseases
