name: West of Scotland Pest Free Area Buffer Zone
description: The West of Scotland conifer bark beetle Pest Free Area (PFA) exists to allow trade of conifer
  logs to Northern Ireland and the Republic of Ireland, which are currently free from and have Pest Free
  Zone (PZ) status for the bark beetles Dendroctonus micans, Ips cembrae and Ips sexdentatus. These three
  non-native bark beetles are all established in Great Britain (GB). As the bark beetles continue to spread,
  Scottish Forestry is imposing a 35km radius buffer zone around any finding of an outbreak of D. micans,
  within which no further phytosanitary certificates will be issued for the movement of spruce roundwood
  to the island of Ireland. There will also be restrictions on any port in the buffer zone. This dataset
  shows that part of the PFA which is within this buffer zone. The buffer zone boundary follows recognisable
  geographic features on the ground, such as roads and rivers. This results in an uneven boundary with
  parts being further than 35km from the finding, but will never be less than 35km away. If there are
  further findings of D. micans within 35km of the PFA, the buffer zone will be extended accordingly.
  Once the buffer zone has been established for 12 months there will be a presumption to expand the buffer
  by a further 10 km. The final decision to make this change will be agreed between Scottish Forestry
  and the relevant authorities on the island of Ireland. Find more information at https://www.forestry.gov.scot/publications/1546-pfa-action-plan
