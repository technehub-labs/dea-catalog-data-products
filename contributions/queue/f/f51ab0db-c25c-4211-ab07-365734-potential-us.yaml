name: Potential use of lakes and rivers for heat extraction and heat discharge
description: Lakes and rivers provide a great yet largely untapped source of thermal
  energy. In Switzerland, this renewable source of energy source could be used for
  heating (heat extraction) and cooling (heat discharge), since many cities are located
  close to lakes and rivers and the technology is well established. The potential
  of Switzerland’s largest lakes and rivers for heat extraction and heat discharge
  was estimated using simple assumptions. Water body-specific characteristics were
  only partially taken into account. The potentials are to be understood as a reference
  point, and should therefore not be used as a definitive basis for planning. The
  assessment was carried out by Eawag, the Swiss Federal Institute of Aquatic Science
  and Technology of the ETH Domain, and financed by the Federal Office for the Environment.
  This dataset indicates the potential of Switzerland’s larger lakes and rivers for
  heat extraction and heat discharge.
