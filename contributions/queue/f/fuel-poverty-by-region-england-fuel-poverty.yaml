name: Fuel poverty by region (England)
description: '<dp-prose> <p>Household and fuel poverty numbers at region level come
  from the national fuel poverty statistics, 2022: <a href="https://www.gov.uk/government/statistics/fuel-poverty-detailed-tables-2024-2022-data">https://www.gov.uk/government/statistics/fuel-poverty-detailed-tables-2024-2022-data</a></p>
  <p><strong>Further information</strong></p> <p>Estimated number of households -
  <em>The number of households in the corresponding geographical area (modelled)</em></p>
  <p>Estimated number of households in fuel poverty - <em>The number of households
  in the corresponding geographical area that were in fuel poverty in 2022 (modelled)</em></p>
  <p>Proportion of households fuel poor (%) - <em>The proportion of households in
  the corresponding geographical area that were fuel poor in 2022</em></p> <p>Region
  - <em>Household and fuel poverty numbers at region level come from the national
  fuel poverty statistics, 2022</em></p> <p>LA Code - <em>Local authority 4 digit
  code (consistent with ONS geography)</em></p> <p>LA Name - <em>Name of local authority</em></p>
  <p>LSOA Code - <em>Lower Layer Super Output Area (LSOA) code</em></p> <p>LSOA Name
  - <em>Name of LSOA</em></p> <p>County - <em>County name</em></p> <p>Parliamentary
  Constituency Code - <em>3 digit code for 2011 parliamentary constituencies</em></p>
  <p>Parliamentary Constituency Name - <em>Name of parliamentary constituency</em></p>
  <p><strong>Additional information</strong></p> <p>The Sub-Regional Fuel Poverty
  Report 2024 (2022 data) is available on the DESNZ website at: <a href="https://www.gov.uk/government/statistics/sub-regional-fuel-poverty-2024-2022-data">https://www.gov.uk/government/statistics/sub-regional-fuel-poverty-2024-2022-data</a></p>
  <p>More detailed information on the methodology used to model fuel poverty is available
  on the DESNZ website at: <a href="https://www.gov.uk/government/publications/fuel-poverty-sub-regional-methodology-and-documentation">https://www.gov.uk/government/publications/fuel-pove'
