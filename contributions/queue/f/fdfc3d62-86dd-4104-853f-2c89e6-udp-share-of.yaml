name: UDP - Share of trips by train
description: 'This indicator measures the relative importance of sustainable means
  of transportation within a tourism destination, proxied by the share of trips using
  train as mode of transportation. Higher values indicate a more widespread use of
  train for domestic travel compared to vehicles with a higher environmental impact.
  The indicator is part of the environmental impacts pillar of the EU Tourism Dashboard.
  UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: Missing countries: CY; LU;
  MT; SI. METHODOLOGY: The indicator is obtained dividing the number of trips by train
  by the number of trips done using all means of transport, i.e.: Air, land, railways,
  buses, coahes, motor vehicles, waterway, other. DATA SOURCES: Number of trips by
  mode of transport (tour_dem_tttr) [ESTAT].'
