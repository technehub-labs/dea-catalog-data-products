name: Fuel Poverty
description: 'Households in Fuel Poverty using the government Low Income Low Energy Efficiency (LILEE)
  method. The data shows numbers and percentages of households at County, District, and Lower Super Output
  Area (LSOA) geographies. The dataset is updated annually. Source: Experimental statistics published
  by the Department for Business, Energy and Industrial Strategy (DBEIS). See the source weblink for further
  guidance on the statistics and their uses and limitations. (For example, this data should only be used
  to look for particular areas of high fuel poverty, but not to analyse trends over time. Caution is advised
  regarding data for small areas such as LSOA, and other local data ideally should be used together with
  this data).'
