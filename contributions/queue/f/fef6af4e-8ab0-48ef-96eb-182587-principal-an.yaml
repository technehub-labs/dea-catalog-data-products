name: Principal and Secondary Ports around Ireland and Northern Ireland for Ocean Energy
description: The Irish Ports Offshore Renewable Energy Services (IPORES) report provides an extensive
  and updated summary of information on port infrastructure, facilities and management plans in relation
  to meeting requirements for marine renewable energy developers. In total, consultations and analysis
  are provided on 14 ports on the island. A number of ports in the Republic are identified as having the
  necessary facilities, infrastructure and hinterland that could support the development of the offshore
  renewable energy industry. We have consequently identified 3 ports as being Category A, 5 ports as Category
  B and 3 ports as Category C.
