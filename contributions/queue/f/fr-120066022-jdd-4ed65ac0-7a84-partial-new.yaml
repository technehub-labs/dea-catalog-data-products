name: 'Partial New-Aquitaine: Call for Regional Projects ‘Territories for Positive
  Energy’ (TEPOS) — Communes — Perimeter (surface)'
description: 'This dataset contains the municipalities (surface objects), concerned
  by a regional call for projects ‘Territories for Positive Energy’ (TEPOS) of New
  Aquitaine. PLEASE NOTE: this dataset is not exhaustive on the perimeter of New Aquitaine,
  it concerns the perimeter of the former Poitou-Charentes region. A territory with
  positive energy aims to reduce its energy needs to the maximum, through energy sobriety
  and efficiency, and to cover them with local renewable energies (“100 % renewables
  and more”). The completion of the energy transition represents the first end (constitutive
  role) of the territory with positive energy: it responds to the fundamental challenges
  of climate change, the depletion of fossil resources and the reduction of major
  industrial risks at the territorial level.'
