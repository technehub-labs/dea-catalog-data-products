name: Agricultural suitability for arable farming
description: The report was prepared at the request of the Ministry of Agriculture
  with the aim of examining whether there are any arguments to protect fertile agricultural
  land. Fertile agricultural land has been defined in the report as land suitable
  for agriculture based on physical, chemical and biological properties, involving
  maximum crop yield at minimum environmental stress and minimal use of excipients.
  The maps Agricultural suitability of arable farming and pasture farming have been
  drawn up by determining the reduced yield (yielding depression) in relation to optimal
  soil and hydrological conditions where fertilisers and pesticides are sufficiently
  available, but not irrigation. The yield loss rates for water nuisance and moisture
  deficiency determined. Land with yield loss rates of 0-15 % are agriculturally best
  suited for arable and pasture farming, 15-40 % less suitable for agriculture but
  in use thanks to the many tools (fertilisers, irrigation etc.). > 40 % restricted
  for agriculture. As indicated in the definition, the environmental impact is part
  of soil fertility. In the report, agricultural suitability is combined with environmental
  impact with phosphorus and copper. Reporting shows that part of the Netherlands
  cannot be defined ‘fertile’ due to the current environmental pressure and/or quality.
  NB. The map covers areas already in agricultural use around 1900 (see 5.1) the agricultural
  land in the drained polders after 1900. The areas that were already in use as agricultural
  land in 1900 can be regarded as relatively suitable land and in any case more suitable
  than those which were at the time natural and were later cultivated. In South Holland
  after 1900 no more mining took place after enough. Data for Figure 5.2 from Alterra
  Report 1693 Yield depression in arable crops due to flooding and moisture shortage.
