name: Climate adaptation INKAS (NRW) - Construction and open space type
description: The map layer Climate Adaptation INKAS (INKAS - INformation Portal Climate
  Adaptation in Cities) describes building and open space types in North Rhine-Westphalia.
  A total of 20 land cover and land use types were identified, of which the first
  nine are development types. The land use of the ATKIS base DLM, the official house
  coordinates, the official house surrounds, the 3D building model in LoD1 and the
  Copernicus Imperviousness Layer were included as basic data in the classification
  of the building and open space types. The building types were determined in an automated
  process and building KPIs were derived. The dominant type of building was defined
  in proportion to the surface area in the building block as the type of building.
  Industrial and commercial areas were further subdivided in a separate form according
  to the height of the building and the degree of sealing. The results are available
  at block level according to the ATKIS basic DLM data.
