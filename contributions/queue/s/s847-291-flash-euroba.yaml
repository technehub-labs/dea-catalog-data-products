name: 'Flash Eurobarometer 291: Survey on the attitudes of Europeans towards tourism
  - Wave 2'
description: 'Some 80% of Europeans continue to travel for their holidays according
  to a new Eurobarometer survey on ‘The attitudes of Europeans towards tourism 2010’.
  Only 20% of over 30,000 randomly selected citizens were almost certain that they
  will not travel in 2010, which is significantly below the proportion of non-travellers
  in 2009 (33%). EU citizens increasingly prefer to spend their holidays in traditional
  tourist destinations (57%), while 28% would rather go “off the beaten track” to
  emerging destinations. Tourism is one of Europe''s most important service industries,
  accounting for 5% of Europe''s GDP and 6% of employment #####The results by volumes
  are distributed as follows: * Volume A: Countries * Volume AA: Groups of countries
  * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of countries * Volume
  B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics *
  Volume C: Country/socio-demographics ---- Researchers may also contact GESIS - Leibniz
  Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
