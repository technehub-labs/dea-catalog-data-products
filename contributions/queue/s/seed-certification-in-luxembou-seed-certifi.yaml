name: Seed certification in Luxembourg
description: The EU legislation is based on certification of seed and plant propagating material before
  marketing. It applies to genera and species important for the internal market of food and feed. Certification
  and inspections guarantee the identity, health and quality of seeds and propagating material. Seed production
  and certification in Luxembourg is specifically targeted on cereals, fodder plants, seed potatoes and
  oil and fibre plants. Certification includes field inspection, seed sampling and testing and results
  in an official label. In Luxembourg, the competent authority for certification is ASTA (Ministry of
  Agriculture).
