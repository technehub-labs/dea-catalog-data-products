name: 'Special Eurobarometer 230: Public Opinion in Europe on Financial Services'
description: 'The Directorate-General Health and Consumer Protection wished to once
  again commission a poll on Europeans views on consumers’ ownership and use of financial
  services. Interviews were conducted face-to-face in people’s homes in their national
  language between February 9 and March 20, 2005. For each theme addressed, our analysis2
  looks at the: - European Union as a whole; - Individual countries; - Socio-demographic
  variables; - Other variables which we systematically cross-tabulated with the results
  for each question include: payment for a significant purchase in respondent’s country
  of residence, referred to as "payment for significant purchase" (results for Q5a),
  ownership of bank/credit cards (results for Q9a) as well as trust in advice given
  by financial institutions (results for Q13.3). #####The results by volumes are distributed
  as follows: * Volume A: Countries * Volume AA: Groups of countries * Volume A''
  (AP): Trends * Volume AA'' (AAP): Trends of groups of countries * Volume B: EU/socio-demographics
  * Volume B'' (BP) : Trends of EU/ socio-demographics * Volume C: Country/socio-demographics
  ---- Researchers may also contact GESIS - Leibniz Institute for the Social Sciences:
  [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
