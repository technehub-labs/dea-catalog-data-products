name: 'Special Eurobarometer 372: Social Climate'
description: 'The Special Eurobarometer surveys on the social climate cover 15 areas
  and asks respondents to assess, for each of these areas, the current situation,
  how the situation has evolved over the past five years and how they expect it to
  change over the coming year. Three waves have been conducted: the first wave was
  conducted in 2009 (Special EB 315), the second wave in 2010 (Special EB 349) and
  the third wave in 2011 (Special EB 370) . Even though the impact of the crisis is
  still being felt, overall some improvement has been observed in 2011. #####The results
  by volumes are distributed as follows: * Volume A: Countries * Volume AA: Groups
  of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of
  countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics
  * Volume C: Country/socio-demographics ---- Researchers may also contact GESIS -
  Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
