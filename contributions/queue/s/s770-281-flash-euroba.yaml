name: 'Flash Eurobarometer 281: Europeans and Tourism'
description: 'This Flash Eurobarometer survey (Flash Eurobarometer 281 on the “Survey on the attitudes
  of Europeans towards tourism, Autumn 2009” was conducted at the request of Directorate General Enterprise
  and Industry to collect EU citizens’ views on travel, details of their (planned) holidays and travel
  in 2009 and their expectations regarding holidays in 2010. Special emphasis was put on the financial
  aspect of taking a holiday, as this is becoming a prime concern for both travellers and the tourism
  industry in the midst of the serious economic downturn affecting all EU economies. #####The results
  by volumes are distributed as follows: * Volume A: Countries * Volume AA: Groups of countries * Volume
  A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of countries * Volume B: EU/socio-demographics
  * Volume B'' (BP) : Trends of EU/ socio-demographics * Volume C: Country/socio-demographics ---- Researchers
  may also contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
