name: Regional offices Environment CyL
description: Cartographic of the regional offices (OCAS) of the Autonomous Community of Castile and Leon.
  The regional environmental offices are the administrative units located in the territory of each of
  the forest districts of Castilla y León. They perform functions of public information and management
  of procedures within the scope of their competences. The mapping of the district offices is developed
  as a support tool to facilitate the location of them.
