name: WMS Health Control
description: 'This service contains the location of cooling towers and evaporative
  condensers that are installations that use water and produce aerosols during their
  operation and, therefore, susceptible to become a focus of proliferation and dissemination
  of Legionella bacteria, which makes them subject to compliance with Royal Decree
  487/2022 of 21 June: https://www.boe.es/search/act.php?id=BOE-A-2022-10297 , laying
  down health requirements for the prevention and control of legionellosis. The owners
  of these facilities, prior to the start of operation of the same, have the duty
  to notify them to the Directorate General of Public Health of the Government of
  the Canary Islands, which publishes this layer with the cooling towers and evaporative
  capacitors notified and in operation at 31/12/2023, the update being planned annually.
  Date of data: updated on 26/06/2026.'
