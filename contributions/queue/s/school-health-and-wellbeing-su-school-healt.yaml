description: <dp-prose> <p>Calderdale’s school health and wellbeing survey (previously known as the electronic
  Health Needs Assessment or eHNA) has been running for 13 years for secondary schools and 11 years for
  primary schools, providing a rich and valuable insight into the lives of children and young people in
  Calderdale. This insight allows partners across Calderdale to work together towards our agreed strategic
  outcome that children and young people should have hope and aspiration for the future.</p> <p>Also see
  <a href="https://dataworks.calderdale.gov.uk/dataset/public-health-data-2omk6">Public Health Data</a>
  and <a href="https://dataworks.calderdale.gov.uk/dataset/2ldjx/joint-strategic-needs-assessment"><u>Joint
  Strategic Needs Assessment (JSNA)</u></a><u>.</u></p> </dp-prose>
