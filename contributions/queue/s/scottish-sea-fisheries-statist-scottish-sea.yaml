name: Scottish Sea Fisheries Statistical Districts (2013 onwards)
description: The annual Scottish Sea Fisheries Statistics report is aggregated into
  districts, which reflect the area of responsibility of the local fishery office.
  This dataset shows the approximate extent of each district using the 1:50,000 scale
  OS Meridian 2 mean high water spring coastline. The districts are for illustrative
  purposes only. The districts were updated in the 2013 report to reflect changes
  in responsibility of the Ullapool fishery office and renamed the Pittenweem district
  as Anstruther.
