name: Surface Coal Resource Areas
description: The Surface Coal Resource Areas define the coal resources capable of
  being extracted by surface mining methods, often referred to as ‘opencast’. This
  information is used by Local Planning Authorities as part of the duty to safeguard
  minerals from unnecessary sterilisation. The surface coal resource areas shown have
  been derived from current information available to the Coal Authority and British
  Geological Survey.
