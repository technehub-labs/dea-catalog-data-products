name: Statistical Units - Fishing Statistics - Sea Fisheries Statistics Ports (2013 onwards)
description: The annual Scottish Sea Fisheries Statistics report is aggregated into districts, which reflect
  the area of responsibility of the local fishery office. This dataset shows the approximate location
  (point) of the ports and creeks within each district. The districts are for illustrative purposes only.
  The dataset was updated in 2013 to reflect changes to Ullapool district and renaming Pittenweem district
  as Anstruther.
