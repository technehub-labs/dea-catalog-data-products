name: 'Flash Eurobarometer 334: Attitudes of Europeans towards tourism'
description: 'Tourism remains close to the hearts of Europeans and confirms its role as a powerful driver
  for the economy. The Eurobarometer survey on the attitudes of Europeans towards Tourism provides a detailed
  insight of Europeans tourism preferences in 2011, such as favourite destinations, reasons for travelling,
  booking methods, and anticipates travelling trends for 2012. #####The results by volumes are distributed
  as follows: * Volume A: Countries * Volume AA: Groups of countries * Volume A'' (AP): Trends * Volume
  AA'' (AAP): Trends of groups of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends
  of EU/ socio-demographics * Volume C: Country/socio-demographics ---- Researchers may also contact GESIS
  - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
