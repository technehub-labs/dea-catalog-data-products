name: 'Special Eurobarometer 337: Geographical and labour market mobility'
description: 'This survey follows the themes of the 2005 and 2007 Eurobarometer mobility
  surveys, but has been modified and expanded to cover a range of areas relating to
  cross-border mobility, particularly in relation to working abroad. Topics covered
  include: ♦ Respondent''s opinions about the impact of people moving across regions
  or countries within the EU on individuals, families, the economy, the labour market
  and European integration. ♦ Respondents'' experiences of living, working and/or
  studying abroad ♦ Respondents'' plans to work abroad in future ♦ Positive and negative
  experiences of those who have already worked abroad ♦ Motivations and disincentives
  for working abroad ♦ Perceived issues to be faced when working abroad ♦ Ways respondents
  think they would find work abroad ♦ Respondents'' knowledge of EURES (European Employment
  Services), and the services they would look for in an employment service #####The
  results by volumes are distributed as follows: * Volume A: Countries * Volume AA:
  Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups
  of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/
  socio-demographics * Volume C: Country/socio-demographics ---- Researchers may also
  contact GESIS - Leibniz Institute for the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
