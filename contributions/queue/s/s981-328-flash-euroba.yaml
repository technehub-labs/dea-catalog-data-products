name: 'Flash Eurobarometer  328: Survey on the attitudes of Europeans towards tourism - Wave 3'
description: 'Increasing number of Europeans enjoy their holidays: only 4% said they would not go on holiday
  in 2011, which is a significant improvement compared to 2010 when 20% of Europeans had no plans for
  holidays. These findings of a new Eurobarometer survey on the attitudes of Europeans towards tourism
  confirm other indicators that tourism has fully recovered from economic crisis. EU citizens'' preference
  still inclines towards traditional tourist destinations (58%), while 28% would choose to discover the
  hidden treasures of Europe. #####The results by volumes are distributed as follows: * Volume A: Countries
  * Volume AA: Groups of countries * Volume A'' (AP): Trends * Volume AA'' (AAP): Trends of groups of
  countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics * Volume
  C: Country/socio-demographics ---- Researchers may also contact GESIS - Leibniz Institute for the Social
  Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
