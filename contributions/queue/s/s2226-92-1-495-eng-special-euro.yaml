  Trends of groups of countries * Volume B: EU/socio-demographics * Volume B'' (BP) : Trends of EU/ socio-demographics
  * Volume C: Country/socio-demographics ---- Researchers may also contact GESIS - Leibniz Institute for
  the Social Sciences: [https://www.gesis.org/eurobarometer](https://www.gesis.org/eurobarometer)'
