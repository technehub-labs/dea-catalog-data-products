name: Site de projet-pilote pour la géothermie profonde
description: Indication du site de projet-pilote pour la géothermie profonde. Le projet-pilote se base
  sur la fiche du plan directeur cantonal 5.07.1 "Géothermie profonde". La géothermie est qualifiée de
  « profonde » lorsqu’elle a pour objectif la production de fluides géothermaux suffisamment chauds pour
  être utilisés directement dans des réseaux de chauffage à distance ou pour la production d’électricité.
  Elle se distingue ainsi de la géothermie superficielle nécessitant la combinaison d’une sonde géothermique
  à une pompe à chaleur. Celle-ci est destinée essentiellement à la production d’eau chaude sanitaire
  et de chauffage de bâtiments individuels.
