name: Groundwater heat utilisation potential
description: The thermal energy stored in groundwater can be used for heating purposes. With groundwater
  heat pump systems, the heat can be extracted from the groundwater and transferred to the heating system.
  The potential of groundwater for heating is large and can be estimated. The groundwater heat utilisation
  potential in Switzerland's unconsolidated aquifers was estimated using a heat balance approach. This
  involves determining the usable heat from a simplified heat balance, taking long-term changes into account.
  The groundwater is considered an open system, i.e. heat is exchanged with the atmosphere, hydrosphere
  and geosphere. The calculated heat utilisation potential is regarded as heat that can be used sustainably
  in the medium term. It should be noted that only the potential for heat recovery from groundwater was
  taken into account; any utilisation for cooling purposes or seasonal heat storage was not considered.
  Existing utilisation plants were also not taken into account. The basis for the calculation was provided
  by the cantons and the federal government. The geodata set "Groundwater heat utilisation potential in
  Switzerland's unconsolidated aquifers" shows the maximum sustainable heat that can be extracted from
  groundwater in the medium term.
