name: USV International Mobility INCOMING ay 2023-2024
description: This dataset contains detailed information on incoming Erasmus+ students hosted by Stefan
  cel Mare University from Suceava during the academic year 2023–2024. It includes data on students' home
  universities and countries, gender, study cycle, mobility period, and associated departments within
  USV. Short-term mobilities carried out under Blended Intensive Programmes (BIP), with a duration of
  4–5 days, have been excluded from this dataset. This decision was made to ensure analytical consistency
  and to more accurately reflect international mobilities with significant institutional impact.
