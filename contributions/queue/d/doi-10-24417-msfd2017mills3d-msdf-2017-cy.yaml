name: MSDF 2017 cycle. Windmills impact on hydrodynamics. Windmills 3D fields
description: This dataset is part of the MSFD D7 2017 cycle. It aims at assessing
  the impact of the windmills on the hydrodynamical conditions and hydrodynamical
  climate in their neighbourhood. The impcat is measured by comparing a domain with
  and without the presence of windmills. This particular dataset gathers the 3D fields
  of the windmills simulation.
