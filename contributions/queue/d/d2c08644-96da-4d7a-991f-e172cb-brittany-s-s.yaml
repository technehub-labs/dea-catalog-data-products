name: Brittany’s Spatial Imaging Product for Agriculture
description: Created to allow you to view recent images of your Region at any time,
  the image product for agriculture provides you continuously with Sentinel-2 satellite
  images giving a representation of your territories beyond what the eye would see.
  This artificially coloured image (“false colors”) provides information on the water
  status of the vegetation. Active vegetation with high water content will appear
  in bright green. The drier vegetation will appear with more orange shades. Monitor
  your territories with recent images of a few days or weeks depending on the presence
  of clouds. These images provided by the European Earth Observation Program Copernicus
  are updated daily. This service is technically promoted and monitored by the Teledetection
  Business Centre and the GIS Bretel.
