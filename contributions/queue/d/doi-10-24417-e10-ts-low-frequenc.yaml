name: Low Frequency Waves Energy Timeseries - North Sea - HYPAS UKMO
description: Low frequency waves energy Timeseries - North Sea - HYPAS wave forecasts. The domain is a
  stereograhic projection, the x-axis is parallel to phi_0 = 56.787 deg N. The projection ranges from
  [0.711 W to 4.326W] and [49.904 N to 52.174 N]. The grid has a resolution of 10 km by 10 km. The spectral
  analysis is provided every 30 minutes. The sea surface is forced by the 6-hourly meteo forecasts provided
  by the UKMO
