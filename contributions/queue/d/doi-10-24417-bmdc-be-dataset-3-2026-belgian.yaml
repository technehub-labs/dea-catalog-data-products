name: 2026 Belgian MSP - Energy, cable and pipeline zones
description: 'The Royal Decree of 20 March 2026 establishing the marine spatial plan for the period 2026
  to 2034 in the Belgian marine areas defines 7 energy, cable and pipeline zones: Renewable energy zone:
  Zone 1, Eastern Zone (Art. 12§1), Princess Elisabeth renewable energy zone: Zone 2a, Noordhinder North
  (Art. 12§2.2a°), Princess Elisabeth renewable energy zone: Zone 2b, Noordhinder South (Art. 12§2.2b°),
  Princess Elisabeth renewable energy zone: Zone 2c, Fairybank (Art. 12§2.3°), Modular offshore grid for
  electricity transmission (Art. 12§4), Safeguard zone of the Eastern Zone (Art. 12§5), Pipeline and cable
  corridor (Art. 13§1). It replaces the 2020 Marine Spatial Plan. Please refer to the Belgian official
  gazette ("Moniteur belgeBelgisch Staatsblad") for official reference information.'
