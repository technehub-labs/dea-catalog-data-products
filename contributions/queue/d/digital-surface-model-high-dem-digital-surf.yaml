name: Digital Surface Model (high DEM resolution)
description: 'In the scope of the International Civil Aviation Organization (ICAO)
  requiring countries and airports to provide electronic Terrain and Obstacle Data
  (eTOD), the Air Navigation Administration has been tasked by the Government to take
  the steps necessary to comply with this requirement. This Digital Surface Model
  (DSM) is the result of a first LIDAR survey flight that has been done in October
  2017 and is of a higher resolution than required by ICAO, so for general purpose.
  For this reason this DSM also uses the national reference systems LUREF and NGL.
  The data itself is split up in 4 different areas, which are specified as follows:
  Area 1: The whole territory of Luxembourg; Area 2: Terminal Control Area (this area
  is larger than the territory of Luxembourg); Area 3: Aerodrome movement area; Area
  4: Category II or III operations (Runway 24). The different areas come with different
  numerical requirements, such as data accuracy and resolution. Follow the links in
  the description or consult metadata for further Information.'
