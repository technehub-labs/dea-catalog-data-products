name: December Survey of Agriculture, UK
description: 'The December survey of Agriculture provides information and evidence on the condition of
  the agricultural industry in the UK. Source agency: Environment, Food and Rural Affairs Designation:
  National Statistics Language: English Alternative title: December Survey of Agriculture, UK If you require
  the data in a more accessible format, please contact farming-statistics@defra.gsi.gov.uk Commercial
  holdings are defined as those that exceed at least one of the thresholds detailed below. Thresholds
  for the EU Farm Structure Survey Characteristics Threshold Utilised agricultural area Arable land, kitchen
  gardens, permanent grassland, permanent crops >5 ha Permanent outdoor crops Fruit, berry, citrus and
  olive plantations, vineyards and nurseries >1 ha Outdoor intensive production Hops >0.5 ha Tobacco >0.5
  ha Cotton >0.5 ha Fresh vegetables, melons and strawberries, which are outdoors or under low (not accessible)
  protective cover >0.5 ha Crops under glass or other (accessible) protective cover Fresh vegetables,
  melons and strawberries >0.1 ha Flowers and ornamental plants (excluding nurseries) >0.1 ha Bovine animals
  All >10 Head Pigs All >50 Head Breeding sows >10 Head Sheep All >20 Head Goats All >20 Head Poultry
  All >1,000 Head Hardy nursery stock >1 ha Mushrooms All mushroom holdings to be included >0 Note: The
  UK have also re-included holdings with >5ha temporary let out land or temporarily empty pig or poultry
  sheds. Revisions to the 2009 England June Survey data The 2009 June Survey figures were revised on 16
  September 2010. The 2009 figures were revised for two reasons. Firstly, the new methodology for 2010
  employed thresholds to exclude holdings with very small amounts of activity, so revised 2009 figures
  were required to permit like-for-like comparisons. Secondly, the census prompted a register cleaning
  exercise that removed inactive holdings from the register. Revisions to the 2009 England December Survey
  data The 2009 December Survey figures were revised on 1 Mar'
