description: Sustainable Indicators The Sustainability Indicators Report brings together international,
  national and local indicators to measure the Dublin Regions progress towards environmental, economic
  and social sustainability. Key metrics include 30 headline indicators spread over 10 themes to build
  up an evidence base for Dublin and benchmark internationally. Indicators are generally covering the
  calender year 2011, but may have slightly different timeframes as noted in the Appendix report. Full
  report available here http://www.dublincity.ie/WaterWasteEnvironment/Sustainability/Documents/SIR2012.pdf
  Further information at http://www.creativedublinalliance.ie/projects/'sustainability-report/
