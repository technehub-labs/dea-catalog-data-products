name: Weather stations of the automatic monitoring network
description: SwissMetNet, the automatic monitoring network of MeteoSwiss, comprises
  about 160 automatic monitoring stations. These stations deliver a multitude of current
  data on the weather and climate in Switzerland every ten minutes. The monitoring
  network is supplemented by 140 automatic precipitation stations. Together, these
  300 stations form the basis for the creation of reliable local weather forecasts
  as well as severe weather and flood warnings.
