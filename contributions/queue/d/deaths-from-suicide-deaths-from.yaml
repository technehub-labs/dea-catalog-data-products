name: Deaths from Suicide
description: 'This data shows deaths (of people age 10 and over) from Suicide and Undetermined Injury,
  numbers and rates by gender, as 3-year moving-averages. Suicide is a significant cause of premature
  deaths occurring generally at younger ages than other common causes of premature mortality. It may also
  be seen as an indicator of underlying rates of mental ill-health. Directly Age-Standardised Rates (DASR)
  are shown in the data, where numbers are sufficient, so that death rates can be directly compared between
  areas. The DASR calculation applies Age-specific rates to a Standard (European) population to cancel
  out possible effects on crude rates due to different age structures among populations, thus enabling
  direct comparisons of rates. The figures in this dataset include deaths recorded as suicide (people
  age 10 and over) and undetermined injury (age 15 and over) as those are mostly likely also to have been
  caused by self-harm rather than unverifiable accident, neglect or abuse. The population denominators
  for rates are age 10 and over. Low numbers may result in zero values or missing data. Data source: Office
  for Health Improvement and Disparities (OHID), Public Health Outcomes Framework (PHOF) indicator 41001
  (E10). This data is updated annually.'
