name: Closures / Diversions "Cycling in Switzerland"
description: 'The dataset contains trail closures and detours on the routes of "Cycling in Switzerland"
  of Switzerland and the Principality of Liechtenstein, which have been announced to SwitzerlandMobility.
  It complements the "Cycling in Switzerland" geodata (Non-motorised transport – Veloland Schweiz), and
  is managed by the Federal Roads Office FEDRO, the Federal Office of Topography swisstopo, SwitzerlandMobility
  and the cantons. No liability is accepted for the accuracy, completeness or up-to-dateness of the route
  and trail data, and any liability for the use of this data is excluded. Link to the disclaimer: https://schweizmobil.ch/en/closures-detours'
