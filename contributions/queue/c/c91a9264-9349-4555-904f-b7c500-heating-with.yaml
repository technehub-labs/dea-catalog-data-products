name: 'Heating with renewables: Apartment blocks with more than 6 apartments'
description: A ‘renewable heating' advice service is available to building owners
  who have oil, gas or electric heating and who wish to find out which renewable low-carbon
  heat source is most appropriate to heat their building. An advisor visits the client
  (property owner/property agent/condominium owners) to discuss the building's energy
  requirements, location-specific factors and the owner's wishes. The advisor takes
  these factors into account and gives the owner/ condominium owners a checklist setting
  out recommendations for optimising the current heating system. On the basis of the
  checklist, the client can compare options, get appropriate quotes for a new system
  and set about switching to renewables. This database contains all the trained advisors
  in the ‘renewable heating' programme who meet the quality criteria.
