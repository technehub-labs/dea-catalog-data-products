name: 'INSPIRE: Surface geology – Geological overview map of the German North Sea (GÜK200-DN)'
description: 'The General Geological Map of the Federal Republic of Germany 1:200,000 (GÜK200) provides
  detailed information on the stratigraphy, petrography and genesis of the geological units shown. In
  this revised GÜK200-DN, the onshore surface geology is shown in up to two overlayers. The thin overlying
  soil is not shown. In the marine environment, only the petrography of the recent seabed is shown, which
  fuels the uppermost 20 cm of the seabed. In accordance with the original GÜK200 map sheets, the seabed
  is related to stratigraphically as the recent seabed. According to the Data Specification on Geology
  (D2.8.II.4 _v3.0) the content of the geological map is stored in three INSPIRE-compliant GML files:
  GUEK200 _DN _GeologicUnit _BaseLayer.gml, GUEK200 _DN _GeologicUnit _OverlayLayer1.gml, and GUEK200
  _DN _GeologicUnit _OverlayLayer2.gml contain the geologic units. The GML files together with a Readme.txt
  file are provided in ZIP format (GUEK200_DN-INSPIRE.zip). The Readme.text file (German/English) contains
  detailed information on the GML files content. Data transformation was proceeded by using the INSPIRE
  Solution Pack for FME according to the INSPIRE requirements.'
