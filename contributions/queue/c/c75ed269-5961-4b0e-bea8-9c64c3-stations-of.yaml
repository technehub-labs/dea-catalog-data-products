name: Stations of the national pollen monitoring network
description: MeteoSwiss operates the national pollen monitoring network. This consists of automatic and
  manual monitoring stations which cover Switzerland's most important climatic and vegetation regions.
  Additional monitoring stations are operated in order to monitor levels of ragweed pollen. The measurements
  recorded by the respective pollen traps provide valuable information for those who suffer from allergies.
