name: Roads, Mobility and Transport
description: 'It is the layer that collects information related to mobility and transport
  of whatever nature they are. The layer describes: - modelling by areas that mainly
  collects the geometrical construction characteristics of transport infrastructures;
  - road modelling with traffic current simulation graphs, more aimed at the completion
  of the characteristics of interest Transport of mobility. The following contents
  are therefore grouped in this section of the specification: - Roads and their details,
  including both primary and secondary road infrastructure, within the theme "roads"
  include areas specifically designed for vehicular and/or pedestrian and/or cycle
  traffic. - Rail transport infrastructure and its details, including under this heading
  both railways and metros, tramways, funiculars. - Other transport installations
  and infrastructures and their particulars, including under this heading cableway
  transport (railways, ski-lifts) ecc…), the modes of transport connection on water
  (ferry…), other transport facilities. Description of the DECREE 10 November 2011
  Technical rules for defining the content specifications of geotopographical databases.
  (Official Gazette No 48 of 27 February 2012 - Ordinary Supplement No 37). Corresponds
  to Stratum 01 Road and Mobility of the DM. Contains datasets such as: Vehicle circulation
  area (AC_VEI - 010101), Pedestrian traffic area (AC_PED - 010102), Cycle Circulation
  Area (AC_CIC - 010103), Road area (AR_STR - 010104), Secondary mixed traffic (AR_VMS
  - 010105), Road element (EL_STR - 010107), Road junction (GZ_STR - 010108), Road
  section (TR_STR - 010109), Road intersection (IZ_STR - 010110), Cycle element (EL_CIC
  - 010112), Bike junction (GZ_CIC - 010113), Road network liv.1 (RT_ST1 - 010114),
  Road network liv.2 (RT_ST2 - 010115), Secondary mixed road element (EL_VMS - 010116),
  Secondary mixed road junction (GZ_VMS - 010117), Secondary mixed road network (RT_VMS
  - 010118), Cycle network (RT_CIC - 010119), Iron transport site (SD_FER - '
