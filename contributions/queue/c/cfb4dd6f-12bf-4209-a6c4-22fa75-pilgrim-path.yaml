name: Pilgrim Paths
description: The Pilgrim Paths of Ireland are a collection of ancient religious routes around the country
  which have documented claims to having been used by pilgrims since ancient times. Its objective is the
  development of a network of walking routes along medieval pilgrimage paths. The project aims to raise
  awareness of the different aspects of heritage, built and natural, encountered along the routes, while
  contributing to sustainable tourism and community development in each local area.
