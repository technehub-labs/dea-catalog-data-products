name: Conference on the Future of Europe
description: The Conference on the Future of Europe is an opportunity for European
  citizens to debate on Europe’s challenges and priorities. The European Parliament,
  the Council and the European Commission have committed to listen to Europeans and
  to follow up on the recommendations made. The main hub for the Conference is the
  multilingual digital platform. It is the place for citizens to share ideas and send
  online submissions. They will be collected, analysed, monitored and published throughout
  the Conference on the future of Europe. The dataset contains the raw data from the
  multilingual digital platform.
