name: WMS Chamber of Agriculture NRW, EU funding
description: 'The service represents the database within the framework of EU funding/direct
  payments, which are located within the federal state of North Rhine-Westphalia.
  The data are divided into the following topics: Field blocks, (historical) landscape
  features and sub-plots applied for and found to be eligible, less favoured areas,
  areas at risk of water erosion, areas at risk of wind erosion, permanent grassland,
  environmentally sensitive permanent grassland, exemption from the prohibition of
  upheaval for catch crops in the Rhineland, landscape features, ecological priority
  areas, areas with environmental restrictions in NRW + TopUp, catch crop.'
