name: Camden Local Economic Assessment May 2011
description: The Local Democracy, Economic Development & Construction Act 2009 required
  local authorities to prepare a local economic assessment (LEA). The LEAs purpose
  is to provide local partners with a clear picture of the economic conditions in
  an area and how they affect the wellbeing of residents and businesses. It should
  identify economic linkages between the area and the wider economy, comparative strengths
  and weaknesses and the resulting challenges and opportunities; and constraints to
  growth and employment. The Camden LEA was published in May 2011.
