name: UDP - Enterprises using social media
description: 'This indicator is calculated as the share of tourism ecosystem enterprises
  using two or more social media (having a user profile, an account or a user license).
  It is based on data collected by the National Statistical Institutes through questionnaires
  to enterprises with 10 or more employees and self-employed persons (NACE sectors
  55, 56, 79). The indicator is part of the digital pillar of the EU Tourism Dashboard.
  UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: 100%. POLICY CONTEXT: Higher
  values indicate a higher usage/presence on social media by tourism ecosystem enterprises.
  METHODOLOGY: The indicator is a weighted sum, calculated as follows: (percentage_ESTAT10_I55_56
  * weightI55_56) + (percentage_ESTAT10_N79 * weightN79). Weight is the share of number
  of enterprises in the specific NOGA sector (I55+I56 or N79), over the total number
  of enterprises in NOGA sectors I55,I56,N79. Percentage is the NOGA specific share
  of enterprises using social media. UNCERTAINTY AND LIMITATIONS: Limited NACE breakdown.
  Not including micro enterprises (<10 employees). DATA SOURCES: iisoc_cismt (E_SM1_GE2)
  [ESTAT]; sbs_na_sca_r2 [ESTAT].'
