name: Camden Business Survey Report 2017
description: 'The Camden Business Survey 2017 gathered key business intelligence around
  business confidence, activity and employment, and issues of importance. Previous
  surveys were conducted in 2014 and 2012. The analysis is based on a sample of 400
  responses from businesses, stratified by size and sector. Where significant, findings
  are reported by size, sector, business age and business type. Camden’s growth sectors
  are considered throughout: Science and Tech, Technical, Professional and Business
  Support Services, and Creative and Cultural Industries.'
