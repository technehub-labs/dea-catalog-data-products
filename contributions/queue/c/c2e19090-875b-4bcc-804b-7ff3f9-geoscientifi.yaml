name: Geoscientific Map of Germany 1:2,000,000 - Geology and Traffic
description: 'The series ''Geoscience Map of Germany 1: 2 000 000'' contains easily
  comprehensible maps on various topics. The base map "Geology" shows Germany and
  the adjacent areas in 30 units, differentiated by the formation age. In addition,
  areas with igneous and metamorphic (formed by shaping) rocks are reported. 5 different
  types of lines provide an overview of fracture zones in the subsurface. In addition,
  the expansions of the last ice age are included. A schematic cross section through
  the surface from south to north shows the structure of the older basement and its
  cover by younger rocks. It is available in two versions: one with a simple topography
  and once, for better orientation, with the network of interstate highways. The map
  ''Important deposits'' shows deposits and mines of energy raw materials, metal materials,
  industrial minerals and salts based on a simplified, time-structured geology within
  Germany.'
