name: Statistics on museums
description: The National Board of Antiquities collects and publishes annual statistics
  on the field of museums. Statistics are collected from professionally managed museums
  in Finland. The annual tables contain mainly numerical data produced in the field
  of museum statistics. In some cases, textual information is also included. In these
  cases, the consistency of the material may not have been guaranteed. The data can
  be downloaded in csv and excel formats. You can download the product information
  sheet in PDF format from the section More information.
