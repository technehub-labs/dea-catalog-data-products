name: Basic data — Technical Charter — Road, Mobility and Transport
description: 'The stratum collects information on mobility and transport of whatever
  nature it may be. It describes the modeling for areas that mainly collects the constructive
  geometric characteristics of transport infrastructure. The following contents are
  therefore grouped in this section of the specification: — Roads and their particulars,
  including both the infrastructure constituting the primary and secondary roads,
  within the theme “roads” include areas specifically intended for traffic and/or
  pedestrian traffic and/or for cycles. — Rail transport infrastructure and its particulars,
  including railways, metros, tramways and funiculars. — Other transport facilities
  and related particulars, including cableway transport (works, ski lifts, etc.) under
  this heading.'
