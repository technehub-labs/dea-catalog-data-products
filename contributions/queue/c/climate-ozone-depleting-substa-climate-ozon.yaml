description: Ozone depleting substances (ODS) reporting by values (Article 27) Article
  27 of the ODS Regulation 1005/2009 requires producers, import exporters, feedstock
  users and process agent users of ODS to report on quantities produced, imported
  and exported during the preceding year. destroyed, destruction facilities need to
  report on the quantities of ODS destroyed. The reporting covers controlled substances
  (substances listed in Annex I of the Regulation) and new substances (substances
  listed in Annex II of the Regulation).
