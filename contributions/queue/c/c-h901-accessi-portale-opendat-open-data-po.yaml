name: Open Data Portal Access Statistics
description: The dataset collects the statistics relating to the accesses made on the Open Data portal,
  with specific reference to the individual published datasets. For each dataset there are key information
  such as the total number of views and downloads, as well as other useful information such as the title,
  the dates of creation and last modification, the version etc. This dataset allows to analyze the degree
  of interest and involvement of users with respect to the content available on the portal, favoring evaluations
  on the impact and use of open data by the community.
