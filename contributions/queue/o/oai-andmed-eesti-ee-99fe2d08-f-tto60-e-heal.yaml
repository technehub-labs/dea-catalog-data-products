name: 'TTO60: E-health interfacing and reporting by legal form, type of health care
  provider and owner'
description: 'The dataset contains an overview of independent health care providers
  in Estonia that are interfaced with the national e-health system and have submitted
  data there. Data are presented by legal form, type of health care provider, and
  type of owner in order to describe the extent of interfacing and reporting across
  provider groups. The dataset enables assessment of which provider groups are connected
  to e-health and have submitted data in order to support monitoring of Health Information
  System coverage and data flows. Data source: Calculations are based on Estonian
  National Health Information System; the indicators are calculated and published
  by the National Institute for Health Development'
