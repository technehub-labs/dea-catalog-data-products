name: Key figures about the charging infrastructure for electrical vehicles
description: 'Electric mobility is a key technology for more sustainable mobility
  and is one way of achieving ambitious energy and climate policy goals. Electric
  engines are efficient, and using electricity means that renewable energies can also
  be used. The availability of public charging stations is a critical factor in the
  success of the increasingly widespread use of electric cars, which is why https://www.recharge-my-car.ch
  displays charging station availability for electric vehicles in real time. The charging
  infrastructure for electric vehicles in Switzerland is constantly being developed.
  We use real-time data from https://www.recharge-my-car.ch to regularly evaluate
  the ever-increasing number of charging stations, charging points, and types of plug
  in Switzerland. Since November 2020, this data has been and will continue to be
  collected on a daily basis for the whole of Switzerland and for the individual cantons,
  and then averaged each month. This gives an overview of how the charging infrastructure
  is expanding. Detailed documentation is available for a better understanding of
  the data. Visualization of the key figures: http://www.recharge-my-car.ch/keydata'
