name: '6G-MOBKPI results: Network-layer and radio-related measurements from mobility experiments on the
  6G-SANDBOX Málaga platform'
description: 'This dataset contains the results from the experiments executed on the "6G-MOBKPI: KPI measurement
  in 6G networks under mobility scenarios" project, which has been selected as an innovative experiment
  in the second Open Call of the 6G-SANDBOX project funded by the HORIZON-SNS-JU-2022 (Grant Agreement
  No 101096328). The dataset have been captured through different experiments executed on the Málaga platform,
  provided by the 6G-SANDBOX project. The data has been autonomously captured by our proposed KPI measurement
  tool under programmable mobility scenarios. The results are organized in three main folders according
  to our three network configurations considered: FR1 Micro - FR1 Micro Indoor (Random Shape) FR1 Micro
  - FR1 Micro Indoor (Rectangular Shape) FR1 Micro - FR1 Micro Outdoor (Rectangular Shape) Inside each
  folder, there are three subfolders containing the results for the IPERF TCP, IPERF UDP and PING experiments.
  Inside some of these folders, there are additional subfolders for the different configurations of the
  experiment (e.g., target UDP bitrate, ICMP packet size). Finally, the measurements inside each particular
  experiment subfolder are stored in two comma-separated value (CSV) files: one for the network-layer
  KPIs (e.g., throughput, latency, packet loss) and another for the radio-related metrics (e.g., cell
  ID, RSSI, RSRP, RSRQ). The first file of each CSV file contains the name of the fields stored in that
  file.'
