name: 'TE752: Disability free life expectancy by sex, age and type of settlement /
  settlement region'
description: 'The dataset shows the number of years of healthy life expectancy by
  type of settlement unit (city and town settlement area, rural settlement area, urban
  settlements, rural settlements), age (0, 65-69), sex and year. City and town settlement
  regions - cover settlements where most inhabitants live in regions where population
  density is greater than 200 inhabitants per km² and the population figure in a cluster
  of this density is greater than 5,000. Rural settlement region - covers settlements
  where population density is lower than 200 inhabitants per km² or regions with higher
  population density where the population figure is under 5,000. The purpose of collecting
  these data is to provide a standard population health indicator for monitoring trends
  over time and comparing population groups and regions. Data source: Statistics Estonia'
