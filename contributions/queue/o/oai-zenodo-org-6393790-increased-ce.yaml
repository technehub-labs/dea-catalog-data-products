description: '# Increased Central European forest mortality explained by higher harvest rates driven by
  enhanced productivity ## Author Marieke Scheel, Lund University, Sweden, marieke.scheel@gmail.com ##
  Description Data underlying analysis in: Marieke Scheel, Mats Lindeskog, Benjamin Smith, Susanne Suvanto,
  Thomas A. M. Pugh Increased Central European forest mortality explained by higher harvest rates driven
  by enhanced productivity Scripts underlying analysis: https://github.com/mariekesche/harvest_driven_canopy_mortality
  Folder: harvest_checks - NFI_Germany.txt, National Forest Index data from Germany as difference between
  inventories in 200-2003 and 2011-2013, values are given as fraction, n: number of NFI plots in a grid
  cell, HARVEST_ALL: clear-cut harvest, HARVEST_PARTIAL: thinning harvest, NATDEAD: natural dead (not
  harvested) Folder: manag_climfix (S_man,clim) - cflux_forest_rel.txt, Net Primary Production (NPP) values
  of forests in kg [C]/ m^2 year (column 4) - crownloss.txt, m^2 of crown/m^2 of ground lost per year
  - diam_crownarea.txt, total m^2 of crown/m^2 of ground per year split into DBH classes Folder: manag_co2fix
  (S_man,CO2) - cflux_forest_rel.txt, Net Primary Production (NPP) values of forests in kg [C]/ m^2 year
  (column 4) - crownloss.txt, m^2 of crown/m^2 of ground lost per year - diam_crownarea.txt, total m^2
  of crown/m^2 of ground per year split into DBH classes Folder: manag_ndepfix (S_man,N) - cflux_forest_rel.txt,
  Net Primary Production (NPP) values of forests in kg [C]/ m^2 year (column 4) - crownloss.txt, m^2 of
  crown/m^2 of ground lost per year - diam_crownarea.txt, total m^2 of crown/m^2 of ground per year split
  into DBH classes Folder: manag_nofix (S_man) - cflux_forest_rel.txt, Net Primary Production (NPP) values
  of forests in kg [C]/ m^2 year (column 4) - closs.txt, biomass loss in kg [C]/m^2 year split into DBH
  classes - closs_harv.txt, biomass loss due to harvest in kg [C]/m^2 year split into DBH classes - cpool_forest_rel.txt,
  biomass of fore'
