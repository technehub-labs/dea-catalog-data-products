name: Global Sea Level Budget Assessment by World Climate Research Programme
description: Global mean sea level is an integral of changes occurring in the climate system in response
  to unforced climate variability as well as natural and anthropogenic forcing factors. Its temporal evolution
  allows detecting changes (e.g., acceleration) in one or more components. Study of the sea level budget
  provides constraints on missing or poorly known contributions, such as the unsurveyed deep ocean or
  the still uncertain land water component. In the context of the World Climate Research Programme Grand
  Challenge entitled “Regional Sea Level and Coastal Impacts”, an international effort involving the sea
  level community worldwide has been recently initiated with the objective of assessing the various data
  sets used to estimate components of the sea level budget during the altimetry era (1993 to present).
  These data sets are based on the combination of a broad range of space-based and in situ observations,
  model estimates and algorithms. Evaluating their quality, quantifying uncertainties and identifying
  sources of discrepancies between component estimates is extremely useful for various applications in
  climate research. This effort involves several tens of scientists from about sixty research teams/institutions
  worldwide (www.wcrp-climate.org/grand-challenges/gc-sea-level). The results presented in this paper
  are a synthesis of the first assessment performed during 2017-2018. We present estimates of the altimetry-based
  global mean sea level (average rate of 3.1 +/- 0.3 mm/yr and acceleration of 0.1 mm/yr2 over 1993-present),
  as well as of the different components of the sea level budget. We further examine closure of the sea
  level budget, comparing the observed global mean sea level with the sum of components. Ocean thermal
  expansion, glaciers, Greenland and Antarctica contribute by 42%, 21%, 15% and 8% to the global mean
  sea level over the 1993-present. We also study the sea level budget over 2005-present, using GRACE-based
