name: 'OE0452: Life expectancy by sex, age group and county'
description: 'The dataset shows life expectancy at birth and years left to live by
  sex and age group (19 categories, including 0, 1-4, 5-9, 10-14, 15-19, 20-24, 25-29,
  30-34 to 85 and older) and county (17 sections, including Estonia total, Harju county,
  Tallinn, Hiiu county, Ida-Viru, Jõgeva, Järva to Võru county). The purpose of collecting
  life expectancy data is to provide a standard population health indicator for monitoring
  trends over time, assessing differences between population groups and regions, and
  informing health policy and prevention planning. Data source: Statistics Estonia'
