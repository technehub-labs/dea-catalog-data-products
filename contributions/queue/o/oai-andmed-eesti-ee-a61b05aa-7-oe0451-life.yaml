name: 'OE0451: Life expectancy by sex, age group and type of settlement'
description: 'The dataset shows life expectancy at birth and years left to live by sex and age group (including
  0, 1-4, 5-9, 10-14, 15-19, 20-24, 25-29, 30-34 to 85 and older) and type of settlement unit or area
  (city and town settlement region, rural settlement region, urban settlements, rural settlements). The
  purpose of collecting life expectancy data is to provide a standard population health indicator for
  monitoring trends over time, assessing differences between population groups and regions, and informing
  health policy and prevention planning. Data source: Statistics Estonia'
