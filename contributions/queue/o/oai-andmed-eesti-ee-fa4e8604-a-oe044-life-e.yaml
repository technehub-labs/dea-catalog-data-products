name: 'OE044: Life expectancy by sex and age (1959-1988)'
description: 'The dataset presents the average life expectancy for men and women at
  birth, at age 25, and at age 50 in a given year. The purpose of collecting life
  expectancy data is to provide a standard population health indicator for monitoring
  trends over time, assessing differences between population groups and regions, and
  informing health policy and prevention planning. Data source: Statistics Estonia'
