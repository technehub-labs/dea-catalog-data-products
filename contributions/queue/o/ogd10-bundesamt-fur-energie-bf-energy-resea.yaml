name: Energy research statistics (EFstat)
description: 'The SFOE annually draws up the federal government''s EFstat, which provides
  information on the expenditures of energy research financed by public funds as well
  as a detailed compilation of the cash flows. Both the IEA classification and the
  CH classification are compiled for the information. The information is based on
  the databases of the Federal Government and in addition to the declaration of the
  funding agencies. ### Resources description (see below for download links) This
  dataset affects of different kinds of resources: __DATA - Energy research statistics
  (EFstat) __ Raw data file(s). They contain the complete dataset. Some attributes
  are coded (e.g. the attribute "class" may contain the value "ri1" instead of the
  full name "Other uses"). Exact meaning and translations for those codes are in a
  separate CATALOG resource. __SPARQL - Energy research statistics (EFstat) __ Example
  request on the LINDAS SPARQL endpoint for Linked Data access. __CATALOG - Energy
  research statistics (EFstat) __ Catalog(s) file(s) contain the human-readable translations
  of the coded attributes in the DATA ressources.'
