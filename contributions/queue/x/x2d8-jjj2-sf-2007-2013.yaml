name: SF 2007-2013 Categorisation Planned - 2008 and 2015
description: 'This dataset provides the *planned* EU allocation to categorisation system codes as adopted
  in ERDF, CF and ESF programmes at the end 2008 and the end of 2015. The values at the moment of closure
  of the period 2007-2013 are provided in this dataset: https://cohesiondata.ec.europa.eu/2007-2013/ESIF-2007-2013-categorisation-raw-data-from-closur/qt3c-wiyg
  Each row presents a volume of EU support allocated to a categorisation dimension codes. The programme
  documents only provided planned financial information on three dimensions, namely; - Priority themes
  (actions supported) - Form of Finance (grants, loans, etc.) - Territorial context (urban, rural, etc.)
  The full categorisation information system 2007-2013 was composed of 5 dimension providing information
  on: - Priority themes (activities supported) - Form of Finance - Territorial context - Location (NUTS
  codes) - Economic Dimension Information on the last two dimensions was not provided in the programmes
  but only in the annual reporting. This data is of interest because it allows an analysis of time of
  the planned use of the EU support by 3 different dimensions. I show the detailed changes in thematic
  allocation between 2008 and 2015 allowing to look re-progamming. More background information on the
  categorisation system 2007-2013 is available here: http://ec.europa.eu/regional_policy/en/policy/evaluations/data-for-research/'
