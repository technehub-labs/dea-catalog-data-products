name: Agricultural land renting prices
description: Definition The farm rent is the amount that the tenant pays every year
  to the owner for the use of his land for agricultural purposes. -------- Farm rent
  prices are part of the annual survey on harvest estimates. Up to 2013, this survey
  was carried out by agricultural correspondents. From 2014 on, the survey switched
  to a postal survey conducted directly with farmers. The survey on harvest estimates
  and farm rents relies on a sample of about 1,600 agricultural holdings. This sample
  was drawn to ensure representativeness at regional, provincial and agricultural
  region level. This survey was conducted in January following the reference year.
  Also in 2014, the maximum threshold for detecting outliers in calculating rent prices
  was updated. Metadata Harvest estimate and farm rents in the agriculture.pdf
