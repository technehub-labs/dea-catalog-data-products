name: PSRA - Dublin Residential Property Price Register
description: 'The Residential Property Price Register is produced by the Property
  Services Regulatory Authority (PSRA) pursuant to section 86 of the Property Services
  (Regulation) Act 2011. It includes Date of Sale, Price and Address of all residential
  properties purchased in Ireland since the 1st January 2010, as declared to the Revenue
  Commissioners for stamp duty purposes. It is important to note that the Register
  is not intended as a "Property Price Index". Please also note the data available
  in the resources below only relates to Dublin and is a subset of a much larger register.
  Any queries relating to the data within the resources should be directed to: info@psr.ie'
