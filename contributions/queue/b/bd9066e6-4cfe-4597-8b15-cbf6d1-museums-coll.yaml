name: Museums Collections Archives
description: Museums, Collections and Archives dataset created and managed by the Heritage Council. This
  dataset is a comprehensive record of natural and cultural heritage facilities open to the public across
  the island of Ireland. The dataset was created to provide a comprehensive list of these types of heritage
  facility throughout Ireland, providing a temporal basis for research within this sector. The dataset
  was also created to provide a map that would enable researchers and tourists to search for natural and
  cultural heritage facilities geographically and by category. The dataset includes information on each
  facility's exhibitions, address and contact details.
