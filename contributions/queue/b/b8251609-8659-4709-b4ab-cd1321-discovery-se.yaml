name: Discovery service (CSW) of the catalogue of the Departmental Council of Mayenne
  on "geomayenne.fr"
description: This discovery service allows to query the catalog of geographical data
  and web services of the Departmental Council of Mayenne referenced in the platform
  "geomayenne.fr", via the protocol CSW 2.0.2. This harvesting point makes it possible
  to discover the description sheets (metadata) of the geographical data disseminated
  by the Mayenne Departmental Council which are concerned by the European INSPIRE
  Directive or which are of public interest.
