name: Κέντρα Πρόληψης των Εξαρτήσεων και Προαγωγής της  Ψυχοκοινωνικής  Υγείας
description: Αστικές εταιρείες μη κερδοσκοπικού χαρακτήρα, τις οποίες είχε ιδρύσει
  η Νομαρχιακή Αυτοδιοίκηση ή μετείχε σε αυτές, εφόσον ο σκοπός τους αναφέρεται στην
  αντιμετώπιση προβλημάτων, που απορρέουν από τη χρήση εξαρτησιογόνων ουσιών και εφόσον
  η πραγματοποίηση του σκοπού τους ασκείται, κατά διαδοχή, από την περιφέρεια.
