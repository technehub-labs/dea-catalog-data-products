name: LEP Environment 2004 Priority Areas for Open Space Protection Saarland
description: Extensive presentation of the priority areas for open space protection
  in the context of the state development plan for the environment. The priority areas
  for open space protection (VFS) serve the biotope network as well as the protection
  and preservation of contiguous uncut and unconstructed landscape components. The
  use of the VFS for residential, commercial or recreational buildings and the construction
  of wind turbines is not permitted. The data are based on definitions from the landscape
  framework plan, the species and biotope conservation programme and the opinion of
  an integrated open space and use concept for the Saartal.
