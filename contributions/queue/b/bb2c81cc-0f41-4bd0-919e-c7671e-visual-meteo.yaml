name: Visual meteorological observations
description: The information on current weather events is supplemented by visual human observations. The
  atmospheric conditions around the observation site are described in detail. Visual observations provide
  a detailed description of the atmospheric conditions around the observation site. Meteorological observers
  make visual observations and take readings from measurement instruments between three and eight times
  per day every day of the year. This information is then transmitted to MeteoSwiss online. The reports
  are encrypted using internationally valid code and are made available worldwide.
