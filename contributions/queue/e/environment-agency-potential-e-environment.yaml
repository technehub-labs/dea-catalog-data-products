name: Environment Agency Potential Evapotranspiration Dataset
description: 'Potential Evapotranspiration (PET) is the amount of evaporation which would occur if there
  was an unlimited supply of water. This dataset represents Potential Evapotranspiration for well watered
  grass and is available either with an Interception element (PETI) or without one (PET). The dataset
  has been calculated from homogenised climate station data, gridded to a 1km grid. The dataset starts
  in 1961, is available on a water day (09:00 to 09:00 on the following day) timestep and is updated frequently.
  Attribution statement: © Environment Agency copyright and/or database right 2024. All rights reserved.'
