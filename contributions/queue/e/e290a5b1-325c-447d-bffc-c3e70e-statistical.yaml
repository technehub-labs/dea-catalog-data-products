name: Statistical Yearbook Heidelberg _Chapter Climate
description: '<p>The current Statistical Yearbook of the City of Heidelberg contains
  a variety of interesting information on the most diverse areas of Heidelberg''s
  life and development. Particular emphasis was placed on longer time series and time-comparative
  graphs and tables. It consists of 14 chapters and over 150 tables and graphs.</p>
  <p>The chapter Climate shows the long-term development of the climatic annual values
  as well as the monthly data of the respective reporting year in Heidelberg.</p>
  <p>Source:</p><ul> <li> City of Heidelberg</li> <li> German Weather Service</li>
  <li> Meteo Group Deutschland GmbH</li> <li> State Institute for the Environment
  of Baden-Württemberg</li> </ul> <p>Further information can be found on the website
  of the City of Heidelberg: https://www.heidelberg.de/HD/Rathaus/_Statistisches+Jahrbuch.html</p>'
