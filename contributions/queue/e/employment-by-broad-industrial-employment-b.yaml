name: Employment by Broad Industrial Group
description: This data uses a national employer survey to show numbers and percentages of people employed
  in jobs in industries in each broad industrial group. Data is shown for Lincolnshire and Districts,
  and also for smaller areas (such as Wards, and Lower super output areas (LSOAs from the 2011 Census)).
  Some limitations of the dataset are that figures for small areas (Wards and LSOAs) exclude employees
  in farm agriculture (Standard Industrial Classification subclass 01000). The figures include businesses
  registered for PAYE but not for VAT. Values may be rounded and low numbers suppressed (particularly
  at smaller geographies) so numbers may not tally precisely with figures for larger areas. Figures are
  shown for the most recent year available, although these are provisional and may be subject to later
  revision by ONS. This data is based on the ONS Business Register and Employment Survey (BRES, open access)
  sourced from the Office for National Statistics (ONS) Nomis website. More detailed breakouts of Standard
  Industrial Classifications are available from the Source weblink. This dataset is updated annually
