name: DEPRECATED – Statistical Annex to European Economy
description: Statistical annexes published with DG ECFIN's macro-economic forecasts. The statistical annex
  of European Economy contains the main body of macroeconomic data underlying the forecast publications
  of DG ECFIN. Tables are derived from AMECO, the macroeconomic working database of the Directorate General.
  They include long historical series and the DG's forecasts. Countries covered are EU-28, the euro area,
  EU Member States, candidate countries, United States and Japan.
