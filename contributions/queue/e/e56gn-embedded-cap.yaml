name: Embedded Capacity Register
description: <dp-prose> <p>The Embedded Capacity Register (ECR), formerly known as the System Wide Resource
  Register (SWRR), lists all generation, storage and flexible demand resources where the installed generation
  capacity, export capacity or the import capacity is greater than or equal to 1MW.&nbsp;&nbsp;</p> <p>More
  information can be found here:&nbsp;<a href="https://www.ukpowernetworks.co.uk/electricity/distribution-energy-resources/the-embedded-capacity-register"
  target="_blank">https://www.ukpowernetworks.co.uk/electricity/distribution-energy-resources/the-embedded-capacity-register</a>&nbsp;</p>
  </dp-prose>
