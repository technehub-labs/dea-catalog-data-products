name: Closures / Diversions "Skating in Switzerland"
description: 'The dataset contains trail closures and detours on the routes of "Skating
  in Switzerland" of Switzerland and the Principality of Liechtenstein, which have
  been announced to the SwitzerlandMobility. It complements the "Skating in Switzerland"
  geodata (Non-motorised transport – Skatingland Schweiz), and is managed by the Federal
  Roads Office FEDRO, the Federal Office of Topography swisstopo, SwitzerlandMobility
  and the cantons. No liability is accepted for the accuracy, completeness or up-to-dateness
  of the route and trail data, and any liability for the use of this data is excluded.
  Link to the disclaimer: https://schweizmobil.ch/en/closures-detours'
