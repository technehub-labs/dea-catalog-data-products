description: 'This dataset comprises basic details of Environmental Permitting Regulations
  Radioactive Substances Regulation permits that are placed on the public register.
  The Environmental Permitting Regulations 2016 (as amended) regulates the keeping
  and use of radioactive materials, and the disposal and accumulation of radioactive
  waste. Any person who keeps or uses radioactive material must hold a permit or operate
  under a relevant exemption. Attribution statement: © Environment Agency copyright
  and/or database right 2022. All rights reserved.'
