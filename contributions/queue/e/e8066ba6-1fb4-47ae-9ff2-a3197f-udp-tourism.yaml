name: UDP - Tourism diversity
description: 'This indicator measures the diversity of tourism activity within a destination.
  The indicator is calculated as the Shannon diversity index of the distribution of
  tourism accommodation establishments across five geographical zones within a destination:
  cities, coastal areas, rural areas, natural or mountainous areas, and snowy mountains.
  It is assumed that the location of hotels in these different geographical zones
  is associated with different types of tourism offer. For a given country or region,
  a high concentration of tourism supply (no. of tourism accommodation establishments)
  in one or few types of geographical zones yields a low tourism diversity, while
  a balanced distribution of tourism supply across the geographical zones results
  in a higher tourism diversity. A higher tourism diversity is potentially associated
  with a lower susceptibility to shocks and higher resilience. This indicator is part
  of the socio-economic pillar of the EU Tourism Dashboard. UNIT OF MEASURE: Index.
  RESOLUTION: NUTS0. COMPLETENESS: 100%. METHODOLOGY: Shannon Index of the share of
  rooms per geographical zone. DATA SOURCES: TripAdvisor.'
