description: 'This record is for Approval for Access product AfA316. EEE Marketed
  UK Summary contains data reported by Producer Compliance Schemes (PCSs) on the amount
  of EEE(Electrical and Electronic Equipment) their producer members are placing on
  the market. The data is broken down by: Category (1 –13) and Houshold/non-household.
  The report is a UK dataset and contains no information about any specific company.
  Data is reported quarterly, Reports available date back to Q3 2007. Attribution
  statement: © Environment Agency copyright and/or database right 2019. All rights
  reserved.'
