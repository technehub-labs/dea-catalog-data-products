name: 'Education Attainment: Key Stage 2'
description: 'This data shows Education Attainment at Key Stage 2. Numbers and percentages
  of pupils reaching the expected standard in reading, writing, and mathematics are
  shown by gender. Points to be aware of: • Key Stage 2 attainment is based on the
  percentage of pupils achieving the expected standard or above in each of Reading
  and Maths Tests and Writing Teacher Assessment. More Information: see the Primary
  Curriculum, Key Stage 2 website (link to this included as Resource accompanying
  these datasets). Data is included for Wards, Lower Super Output Areas (LSOA), Districts,
  and Lincolnshire. The data has been aggregated based on pupil postcode and only
  includes those pupils living and educated within Lincolnshire. If you want Lincolnshire
  and District aggregations based on those pupils that are educated within Lincolnshire,
  irrespective of where they live; then please see the Department for Education Statistics
  website and School Performance Tables (links to these included as Resources accompanying
  these datasets). Data is suppressed where appropriate 5 persons and below (this
  may be shown by missing data). That and any unmatched postcodes may mean numbers
  for small areas might not add up exactly to figures shown for larger areas. This
  data is updated annually. Data source: Lincolnshire County Council, Performance
  Services – Schools Performance. For any enquiries about this publication please
  contact schoolperformancedata@lincolnshire.gov.uk Please note: National data for
  Key Stage 2 results are published via: https://explore-education-statistics.service.gov.uk/find-statistics/key-stage-2-attainment
  – GOV.UK (explore-education-statistics.service.gov.uk) “These statistics cover the
  attainment of year 6 pupils who took assessments in summer 2024. These pupils experienced
  disruption to their learning during the pandemic, particularly at the end of year
  2 and in year 3.”'
