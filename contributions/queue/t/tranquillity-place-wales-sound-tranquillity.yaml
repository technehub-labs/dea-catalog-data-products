name: Tranquillity & Place Wales Sound Environment Part 1 2023
description: The nationally consistent terrestrial Tranquillity & Place resource identifies the strategic
  and local resource in remote, rural, peri-urban and urban areas for use as an evidence base to inform
  policy intent, practice and provision for well-being benefits. There are 6 themes. Tranquillity is associated
  with the degree to which places and ecosystems deliver a state of quiet, calm, peace and well-being.
  This can be described as a relative abundance, perception or experience of nature, natural landscapes
  and features and/or a relative freedom from unwanted visual disturbance, signs of human influence and
  artificial noise. Tranquillity & Place Sound Environment Part I delivers Theme 4, mapping sound environments
  where natural sounds are more prominent than noise and are appropriate to context. It includes sounds
  other than road and railway noise.
