description: '#### Description Utrecht in Figures is the online database of the municipality of Utrecht.
  Here, the Research & Advice department publishes figures about the city of Utrecht and the Utrecht districts
  and neighbourhoods. With Utrecht in Figures, we want to show all those interested in Utrecht how things
  are actually going with Utrecht. Utrecht in Figures is divided into themes. Within the theme ''Social
  cohesion (Social living environment)'' you will find information about the following 1 ''indicators'':
  - social cohesion score #### Number of indicators Number of indicators under this theme: 1 #### Source
  Research & Advice, Municipality of Utrecht, Population survey #### Related datasets Other datasets that
