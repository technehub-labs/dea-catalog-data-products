name: Foundational Mobility Network
description: Inter-municipal Structural Plan of the Municipalities of Pontassieve,
  Londa, Pelago, Rufina and San Godenzo. Foundational mobility network, road and rail.
  The elements are governed by Article 46 of the current rules of the ‘Inter-municipal
  Structural Plan’, which was approved by Resolution of the Municipal Council of Pontassieve
  No 39 of 24 April 2024, Resolution of the Municipal Council of Londa No 16 of 23
  April 2024, Resolution of the Municipal Council of Pelago No 5 of 23 April 2024,
  Resolution of the Municipal Council of Rufina No 17 of 22 April 2024, Resolution
  of the Municipal Council of San Godenzo No 5 of 22 April 2024 and took effect with
  publication in BURT No 25 of 28 August 2024.
