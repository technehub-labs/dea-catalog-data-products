name: Indicators Early childhood education and care (Education & skills)
description: '#### Description Utrecht in Figures is the online database of the municipality of Utrecht.
  Here, the Research & Advice department publishes figures about the city of Utrecht and the Utrecht districts
  and neighbourhoods. With Utrecht in Figures, we want to show all those interested in Utrecht how things
  are actually going with Utrecht. Utrecht in Figures is divided into themes. Within the theme ''Preschool
  education and childcare (Education & skills)'' you will find information about the following 3 ''indicators'':
  % share of toddlers with pre-school education advice attending pre-school -% of parents who requested
  parenting advice from childcare/preschool/school in the past year -% toddlers between 2.5 and 4 years
  old with early childhood education advice #### Number of indicators Number of indicators under this
  theme: 3 #### Source Public health, municipality of Utrecht; Research & Advice, Municipality of Utrecht,
  Population survey #### Related datasets Other datasets that fall under this theme: - <a href="https://open.utrecht.nl/dataset/oauic-indicators-vocational-and-scientific-education-education-skills-">Indicators
  Vocational and scientific education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic
  indicators-educational skills">Indicators Education & skills</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-primary-education-education-skills-">Indicators
  Primary education (Education & skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-skills-education-skills-">Indicators
  Skills (Education & Skills)</a> - <a href="https://open.utrecht.nl/dataset/oauic-indicators-continuing-education-education-skills-">Indicators
  Secondary education (Education & skills)</a> #### All Utrecht In Figures datasets View <a href="https://open.utrecht.nl/search/query/-/filters/tag%3Autrecht%20in%20digits%3Btype%3Adataset/page/1">here
  all Utrecht In Figures datasets on this website</a>.'
