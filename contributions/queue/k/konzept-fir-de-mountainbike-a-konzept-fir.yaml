name: Konzept fir de Mountainbike- a Graveltourismus zu Lëtzebuerg
description: Im April 2025 präsentierte die Generaldirektion Tourismus das Konzept
  für den Gravel- und Mountainbiketourismus in Luxemburg. Dieses Konzept biet einen
  strategischen Handlungsrahmen für die Entwicklung von Gravel- und Mountainbikeangeboten
  und richtet sich an alle Akteur:innen im Bereich des Mountainbike- und Graveltourismus.
  Es unterstützt die gezielte Umsetzung des Handlungsfeldes „Zeitgemäßes und erlebnisreiches
  Angebot“ aus der nationalen Tourismusstrategie.
