name: Climate and Energy Outlook (KEV) 2020 PBL
description: These files concern the table annex and the data of the figures of the
  Climate and Energy Outlook (KEV) 2020 published on 30 October 2020. For a description
  of the backgrounds of the data in this report, reference is therefore made to the
  main report. The Climate and Energy Outlook (KEV) has been given an explicit role
  in the Climate Act to monitor the progress of climate policy. Once a year, the KEV
  should report in a clear and comprehensive manner on the full breadth of the climate
  and energy policy pursued and its expected effects. The KEV 2020 therefore provides
  insight into the developments of Dutch greenhouse gas emissions in the past and
  up to 2030. The emissions show a decrease, but not enough to reach the target of
  a 49% reduction by 2030 compared to 1990. The KEV also paints an integral picture
  of developments in energy supply and energy consumption, but also of other activities
  that lead to greenhouse gas emissions, such as in agriculture and land use. The
  KEV also makes the connections between autonomous developments, developments abroad
  and the Netherlands.
