name: Producer price indices for services (SPPI); index 2010=100, 2002-2017
description: 'This table shows the price indices, quarterly and yearly changes in
  prices of services that companies provide. The figures are broken down by type of
  services according to the Coordinated European goods and services classification
  (CPA 2008). For some services, a further breakdown has been made on the basis of
  market data that differs from the CPA. This breakdown is simply with a letter after
  the CPA code. The prices of services related to the following sectors of commercial
  services: H Transportation and storage I Accommodation and food serving J Information
  and communication K Financial institutions L Renting, buying and selling real estate
  M Other specialised business services N Renting and other business support The base
  year for all producer price indices is 2010. The year average, quarterly and yearly
  changes are calculated with unrounded figures. Data available from: 4th quarter
  2002 up to and including 2017. Status of the figures: This table has been stopped.
  The most recent figures are from the 4th quarter of 2017. Changes as of May 17 2018:
  None, this table is stopped. When will new figures be published? Not applicable
  anymore. This table was discontinued on May 17, 2018 and continued as Services producer
  price index (SPPI); index 2015=100. See paragraph 3.'
