name: Vantaa, Kerava and Järvenpää cities’ climate survey for businesses
description: 'The data includes data from a business survey carried out jointly by
  the cities of Vantaa, Kerava and Järvenpää in 2021. The data includes responses
  from 91 companies or other organisations. The data was collected using the Webropol
  questionnaire from 1 to 21 November 2021 as part of the joint climate cooperation
  project between the cities of Vantaa, Kerava and Järvenpää. The questionnaire is
  available at [this link](https://www.hel.fi/hel2/datacentre/data/documents/_valinen_climate
  cooperation_query.pdf). The purpose of the survey was to find out companies'' views
  on climate cooperation between the municipality and the business sector. In particular,
  the survey charted the hopes and expectations of companies towards the municipality.
  The aim was to gather information for the cities of Vantaa, Kerava and Järvenpää
  as a basis for developing climate cooperation. Answers that allow the respondents
  to be identified have been removed from the data. Open answers about the organisation,
  the industry, the location of the company and local cooperation have been removed
  from the data, as well as the last question about leaving contact information with
  the answers. The result compilation compiled from the results of the survey is available
  on the City of Vantaa''s website: [link to the results](https://www.vantaa.fi/sites/default/files/document/Company%20climate
  survey%202021.pdf).'
