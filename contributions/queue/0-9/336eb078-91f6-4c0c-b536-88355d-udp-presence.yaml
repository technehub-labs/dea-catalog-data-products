name: UDP - Presence of Blue Flags
description: 'This descriptor shows the number of “blue flag” certifications awarded
  to beaches, marinas and sustainable boating tourism operators. Blue flags are awarded
  annually for their high quality standards in terms of the water quality, environmental
  management and information, safety and accessibility. A high number of blue flags
  is an indication of adherence to such high standards by coastal tourist destinations.
  This descriptor is provided in the EU Tourism Dashboard as complementary information
  to characterize tourism offer. UNIT OF MEASURE: number of blue flags. RESOLUTION:
  NUTS0, NUTS2, NUTS3. COMPLETENESS: 100%. METHODOLOGY: Geographic coordinates of
  blue flags were converted to vector data and aggregated per NUTS level. DATA SOURCES:
  Blue Flag (Foundation for Environmental Education), NUTS 2021 classification.'
