name: ICT use by freelancers; industry and company size, 2022
description: 'This table provides figures on the use of information and communication
  technology (ICT) by companies with one or more employees. The data can be broken
  down by company size and industry. The reporting period covers the year 2022. However,
  a number of topics relate to the year 2021. In such cases, this shall be stated
  in the explanatory memorandum to the subject in question. Data available for 2022.
  Status of figures: The figures in this table are further provisional. Changes as
  of 13 December 2024: Despite the care taken in compiling the figures on ICT use
  by freelancers, it has unfortunately been found that the figures published for the
  reporting period 2022 are not correct due to a technical error. The figures were
  used in the publication Cybersecuritymonitor. This version of this table contains
  the corrected figures. Changes as of 30 November 2023: The figures on "ICT and the
  environment" for freelancers have been adjusted. A technical error has been mistakenly
  detected in this module. That has now been restored. When will there be new figures?
  2023 figures will be available in December 2023. These figures will be published
  in a new table.'
