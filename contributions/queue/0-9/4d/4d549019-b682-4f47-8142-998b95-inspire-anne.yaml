name: INSPIRE - Annex II Theme Land Cover - LandCoverUnit - Land Parcel Identification
  System (LPIS) - 2017 - Reference data of agricultural parcels
description: 'The Land Parcel Identification System (LPIS) is a reference database
  of the agriculture parcels used as a basis for area related payments to farmers
  in relation to the Common Agricultural Policy (CAP). These payments are (co)financed
  by the European Agricultural Guarantee Fund (‘EAGF’) and the European Agricultural
  Fund for Rural Development (‘EAFRD’). To ensure that payments are regular, the CAP
  relies on the Integrated Administration and Control System (IACS), a set of comprehensive
  administrative and on the spot checks on subsidy applications, which is managed
  by the Member States. The Land Parcel Identification System (LPIS) is a key component
  of the IACS. It is an IT system based on ortho imagery (aerial or satellite photographs)
  which records all agricultural parcels in the Member States. It serves two main
  purposes: to clearly locate all eligible agricultural land contained within reference
  parcels and to calculate their maximum eligible area (MEA). The LPIS is used for
  cross checking during the administrative control procedures and as a basis for on
  the spot checks by the paying agency.'
