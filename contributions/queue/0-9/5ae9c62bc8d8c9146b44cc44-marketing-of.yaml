name: Marketing of Hardware and Software and Services
description: Data set referring to "Commercialization of Hardware and Software and
  Services". The map of the Strategic Sectors - "Digital Economy" - of Lisbon does
  not represent an exhaustive census, but rather provides information from several
  strategic actors operating in the city and the region, obeying cluster logics. The
  analysis and selection of the actors represented was carried out by the technicians
  of the Municipal Directorate of Economy and Innovation, based on online research
  on specialized websites, subject to permanent rectifications and updates. Dataset
  of "Services and Hardware and Software Selling". The Strategic Actors - Digital
  Economy - map of Lisbon, doesn't represent an exhaustive inventory. It provides
  data concerning several strategic actors that operate in the city and region, according
  to clusters. Its analysis and selection is performed by Direcção Municipal de Economia
  e Inovação, according to online searches, on specialized sites, and is constantly
  being uptaded and retified.
