name: Guide map of Espoo and Kauniainen
description: 'The guide map of Espoo and Kauniainen is a fairly generalized material that is made to give
  an extensive overview of the entire cities and guide the viewer to a specific address. The optimum operating
  scale is 1:20000. The details of the guide map have been narrowed down and emphasised the importance
  of street network, nomenclature and addresses. The width of the street depicted on the map does not
  correspond to the width of the street in the terrain. The map includes the areas of Espoo and Kauniainen.
  A coloured guide map is available through the interface. The map combination level includes a guide
  map, then an agency map and a master map by the time you reach a more detailed level. The Kauniainen
  area is not included in the deeper levels of the map combination. The statistical background level is
  a background map based on a guide map, which is simplified. NOTE: The data is opened with e.g. QGIS,
  but not with MapInfo. **Addresses for surface services:** - WMS: [https://kartat.espoo.fi/teklaogcweb/wms.ashx](https://kartat.espoo.fi/teklaogcweb/wms.ashx?request=GetCapabilities)
  - Description of the interface service: https://kartat.espoo.fi/Paikkatieto/files/WMS-ja_WFS-rajapintakuvaukset.pdf
  **Published levels:** - Guide map - Map Combination - Statistical background'
