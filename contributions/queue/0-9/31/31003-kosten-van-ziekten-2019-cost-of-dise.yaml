name: Cost of diseases 2019
description: 'The figures in this table come from the Cost of Diseases study 2019
  (KVZ) of the National Institute for Public Health and the Environment (RIVM), carried
  out in collaboration with the Central Bureau of Statistics (CBS). This table was
  created for the RIVM website vzinfo.nl (information on public health and care) and
  contains data on healthcare expenditure in the Netherlands broken down by dimensions
  of care use (gender, age, diagnosis) and care provision (sector, care function and
  form of financing) for the year 2019. Data available from: 2019 Status of figures:
  Definitive. Changes as of 10-08-2022: None, this is a new table When will there
  be new figures? Every two years. The Cost of Diseases study itself comes out every
  four years, but for each intermediate two-year period, an estimated allocation based
  on demographic extrapolation takes place. Figures for a reference year shall become
  available two years after the end of that reference year. The next update will cover
  the year 2021 and will be published in 2023.'
