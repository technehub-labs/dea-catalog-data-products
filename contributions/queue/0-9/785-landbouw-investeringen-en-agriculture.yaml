description: 'This table contains data from the agricultural accounts. Figures refer
  to gross investment and changes in inventories. Data available from 1995 to 2022.
  Status of figures: The years 1995-2021 are final. The status is provisional in the
  most recent reporting year 2021. As this table has been discontinued, the data will
  no longer be made definitive. Changes as of 29 November 2024: None, this table has
  been discontinued. The Central Bureau of Statistics recently revised the national
  accounts. New sources, methods and concepts are implemented in the national accounts,
  so that the picture of the Dutch economy is again optimally aligned with all underlying
  statistics, sources and international guidelines for compiling the national accounts.
  For more information see Section 3. When will there be new figures? No longer applicable.'
