name: UDP - Internet speed at tourism destinations
description: 'This indicator measures the maximum available speed of internet connection at tourism destinations
  (municipality level), considering both fixed and mobile networks. It is based on measurements of internet
  speed at municipal scale, with each municipality weighted by the size of tourism supply (tourism accommodation
  establishments) to obtain the final country/regional average values. The indicator is part of the digital
  pillar of the EU Tourism Dashboard. UNIT OF MEASURE: Mbs. RESOLUTION: NUTS0, NUTS2, NUTS3. COMPLETENESS:
  100%. POLICY CONTEXT: Indicates the average speed of internet connection at municipal tourism destinations.
  METHODOLOGY: Ookla open dataset was at first processed to calculate the average speed for both fixed
  and mobile networks at municipal level. Then each municipality was weighted by the size of tourism supply
  (tourism accommodation establishments) to obtain the country/regional average speed. The final value
  was the maximum country/regional average speed considering both networks. DATA SOURCES: Ookla, Tripadvisor,
  NUTS 2021 classification.'
