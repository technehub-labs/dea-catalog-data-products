name: Climate Change in the Irish Mind (Wave 1)
description: 'The ‘Climate Change in the Irish Mind’ project is a baseline study of the Irish people’s
  beliefs, attitudes, policy preferences and behaviours regarding climate change. This work was undertaken
  in 2021 by the EPA and the Yale Program on Climate Change Communication in support of the National Dialogue
  on Climate Action. The approach to the project is based on the established methodology of the "Climate
  Change in the American Mind” survey conducted by the Yale Program on Climate Change Communication and
  the George Mason University Center for Climate Change Communication, which was tailored to meet Ireland’s
  particular socio-economic context. More details of the project and a link to a form to request the aggregated
  data (in csv and sav formats) are available here: https://www.epa.ie/environment-and-you/climate-change/what-is-epa-doing/national-dialogue-on-climate-action/climate-change-in-the-irish-mind/'
