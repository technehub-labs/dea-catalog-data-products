name: Low Carbon Generators
description: '<dp-prose> <p>Listing of low carbon energy generators installed on GLA group properties
  as requested in <a href="http://mqt.london.gov.uk/mqt/public/question.do?id=32699">question 2816/2010
  to the Mayor</a> during the September 2010 Mayor&apos;s Question Time.</p> <p>To date information has
  been provided by the London Fire and Emergency Planning Authority, the GLA and the Metropolitan Police
  Service (MPS). Transport for London has provided interim data, and further data will follow.</p> <p><em>LFEPA
  Data</em></p> <p>Details of low carbon energy generators located at fire stations in London operated
  by the London Fire Brigade (London Fire and Emergency Planning Authority). The data provides the location
  of the fire stations (including post code) and the type of generators at those premises including photovoltaic
  (PV) array, combined heat and power (CHP), wind turbines (WT) and solar thermal panels (STU). Data correct
  as of June 2016.</p> <p>For further information please contact <a href="mailto:david.wyatt@london-fire.gov.uk">david.wyatt@london-fire.gov.uk</a></p>
  <p><em>GLA Data</em> Details of the photovoltaic (PV) installation at City Hall. Data correct as of
  4th May 2011.</p> <p><em>MPS Data</em> The table provides details of low carbon energy generation installations
  on MPS buildings in London. The data provides the site locations (including post code, grid reference
  and latitude/longitude) and the type of generators at those premises which includes Photovoltaic (PV)
  arrays, Combined Heat and Power (CHP), Ground Source Heat Pumps (GSHP) and Solar Thermal panels (STU).
  This data is correct as at the 20th May 2011.</p> <p><em>TfL Data</em> Details of low carbon energy
  generators located at Transport for London&rsquo;s buildings such as stations, depots, crew accommodation
  and head offices are provided. The data includes the postcode of the buildings and the type of generators
  at those premises including photovoltaic (PV) array, combined heat and power (CHP), wind '
