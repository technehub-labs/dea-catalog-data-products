name: 'OpenStreetMap: Economic activities and services'
description: 'This dataset provides a daily extraction of OpenStreetMap data flows relating to economic
  activity resources and services in the territories of Provence-Alpes-Côte d’Azur, Occitanie, Auvergne-Rhône-Alpes,
  as well as the border regions in Italy: Liguria, Piedmont, Aosta Valley. The data extracted concern
  the map elements associated with economic activities: **amenity, craft, landuse, office, shop and tourism**
  The specifications followed are those described in the OpenStreetMap documentation: [🔗 wiki.openstreetmap.org/wiki/EN:Key:amenity](https://wiki.openstreetmap.org/wiki/EN:Key:amenity)
  [🔗 wiki.openstreetmap.org/wiki/EN:Key:craft](https://wiki.openstreetmap.org/wiki/EN:Key:craft) [🔗 wiki.openstreetmap.org/wiki/EN:Key:landuse](https://wiki.openstreetmap.org/wiki/EN:Key:landuse)
  [🔗 wiki.openstreetmap.org/wiki/EN:Key:office](https://wiki.openstreetmap.org/wiki/FR:Key:office) [🔗
  wiki.openstreetmap.org/wiki/EN:Key:shop](https://wiki.openstreetmap.org/wiki/EN:Key:shop) [🔗 wiki.openstreetmap.org/wiki/EN:Key:tourism](https://wiki.openstreetmap.org/wiki/EN:Key:tourism)
  Data is processed and extracted using the SQL script available in the DataSud GitLab repository: [🗃_activities_economiques.sql](https://gitlab.datasud.fr/projects_publics/openstreetmap4datasud/-/blob/main/sql/activities_economiques.sql?reftype=heads)
  © [OpenStreetMap Contributors](https://www.openstreetmap.org/copyright).'
