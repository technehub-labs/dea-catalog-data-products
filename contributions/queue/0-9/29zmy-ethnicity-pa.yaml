name: Ethnicity Pay Gaps in London
description: <dp-prose> <p>This dataset contains ethnicity pay gap figures for all employees in London.
  The pay gap figures for GLA group organisations can be found on their respective websites.</p> <p>The
  ethnicity pay gap is the difference in the average hourly wage of White employees and employees of other
  ethnic groups across a workforce. If Black, Asian or minority ethnic employees do more of the less well
  paid jobs within an organisation than White employees, the ethnicity pay gap is usually bigger.</p>
  <p><br /></p> <blockquote> <p><a href="/economic-fairness/labour-market/">This dataset is one of the
  Greater London Authority&apos;s measures of Economic Fairness. Click here to find out more.</a></p>
  </blockquote> </dp-prose>
