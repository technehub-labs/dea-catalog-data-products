  2018 None, this table has been discontinued. The Central Bureau of Statistics recently carried out a
  revision of the national accounts. New statistical sources and estimation methods are used. This table
  of data for revision has been replaced by table Agriculture; accrual of income and labour volume, national
  accounts. For additional information see Section 3. When will there be new figures? No longer applicable.'
