description: The new educational centre Fröbelgasse was officially opened with a ceremony
  on Monday, 12 October 2026. The city of Leoben celebrated the completion of its
  third modernized educational center. As part of the festivities, the adjacent park
  was also officially named ‘Gottfried-Heindler-Park’.
