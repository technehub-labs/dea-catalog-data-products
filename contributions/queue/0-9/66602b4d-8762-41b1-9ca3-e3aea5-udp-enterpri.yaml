name: UDP - Enterprises seeking ICT specialists
description: 'This indicator measures the percentage of tourism ecosystem enterprises seeking ICT specialists.
  It is based on data collected by the National Statistical Institutes through questionnaires to enterprises
  with 10 or more employees and self-employed persons (NACE sectors 55, 56, 79). The indicator is part
  of the digital pillar of the EU Tourism Dashboard. UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS:
  Missing FI. POLICY CONTEXT: Higher values indicate a higher share of enterprises that recruited or tried
  to recruit ICT specialists, potentially revealing higher propensity towards digitalisation. METHODOLOGY:
  The indicator is a weighted sum, calculated as follows: (percentage_ESTAT10_I55_56 * weightI55_56) +
  (percentage_ESTAT10_N79 * weightN79). Weight is the share of number of enterprises in the specific NOGA
  sector (I55+I56 or N79), over the total number of enterprises in NOGA sectors I55,I56,N79. Percentage
  is the NOGA specific share of enterprises seeking ICT specialists. DATA SOURCES: isoc_ske_itrcrn2 (10_I55_56,
  10_N79) [ESTAT]; sbs_na_sca_r2 [ESTAT].'
