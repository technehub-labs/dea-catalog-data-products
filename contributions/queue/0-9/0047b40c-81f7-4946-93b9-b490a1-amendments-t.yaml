name: Amendments to the Styrian Child Education and Care Act 2019 and the Styrian
  Childcare Promotion Act 2019 as of autumn 2026 (ABT06-3599/2026)
description: At its meeting on 7 July 2026, the Styrian Parliament adopted an amendment
  to the Styrian Child Education and Care Act 2019 (StKBBG 2019) and the Styrian Childcare
  Promotion Act 2019 (StKBFG 2019), the amendments will enter into force on 14 September
  2026. Publication in the Provincial Law Gazette is still pending. Once this has
  been done, you will find the amendment under the laws on the homepage of the unit.
  Please find enclosed this circular an overview of the most important changes to
  the 2026 StKBBG/StKBFG amendment for information. If necessary, concrete examples
  of the innovations will also be available on the website of the unit https://www.verwaltung.steiermark.at.
