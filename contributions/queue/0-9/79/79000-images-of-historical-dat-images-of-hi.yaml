name: Images of historical datasheets of meteorological observations in the Caribbean
description: 'This dataset contains images from in-situ (sub-)daily meteorological
  datasheets housed in the KNMI archive from the late 19th and early 20th century.
  The images are made following the WMO Guidelines on Best Practices for Data Rescue
  (WMO No. 1182, edition 2024). Images contains data from Suriname (Nickerie, Fort
  Nieuw Amsterdam) and the islands of St. Eustatius, St. Maarten, Curacao and Bonaire
  in the Caribbean. The files are sorted by location and year. Measurements contain,
  among others, temperature, pressure, humidity, wind speed and direction, cloud cover
  and precipitation. Per location images are available for the following years: *
  Bonaire: 1920, 1927-1941 * Curacao: 1909-1946 * Suriname (New Nickerie): 1896-1903,
  1922-1962 * Suriname (Fort New Amsterdam): 1896, 1900-1903 * St. Eustatius: 1909-1940,
  1944-1946 * St. Maarten: 1920-1946'
