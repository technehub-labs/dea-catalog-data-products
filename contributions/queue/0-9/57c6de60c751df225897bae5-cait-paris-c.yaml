name: Cait Paris Contributions Data
description: The structured data from the CAIT Paris Contributions Map enables users
  to explore, compare, and assess the greenhouse gas mitigation plans in each country’s
  Intended Nationally Determined Contribution (INDC). Under the U.N. Framework Convention
  on Climate Change (UNFCCC), countries committed to create a new international climate
  agreement by the conclusion of the Paris climate summit in December 2015. In order
  to help facilitate that goal, countries agreed to release public outlines of actions
  they intend to take. These commitments are known as INDCs. The data is structured
  according to a framework based on the Lima Decision, the Open Book List of Information
  for INDCs, the GHG Protocol Mitigation Goal Standard and GHG Protocol Policy and
  Action Standard. Complete note that this file is in its raw form intended to be
  used for the online tool only. Content might be html formatted._
