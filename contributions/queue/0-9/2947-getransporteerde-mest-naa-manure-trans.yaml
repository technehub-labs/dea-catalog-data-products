name: Manure transported by origin and destination, 1994-2013
description: 'The table gives national figures on the origin (manure supply) and destination (manure disposal)
  of transported manure. Farms producing more livestock manure than can be applied on their own land will
  have to dispose of this surplus. The vast majority of manure transport therefore takes place from farms
  with overproduction to farms with installation space. Furthermore, transports take place to and from
  manure processing companies, abroad and to hobby companies and private individuals. The figures can
  be broken down by a number of different types of manure and by the amount of nitrogen, phosphate and
  potassium in the transported manure. Data available from: 1994 to 2013. Status of figures: The data
  is final. New insights into calculation methods can lead to a recalculation of the time series. Changes
  as of June 2017: None, this table has been discontinued. When will there be new figures? No longer applicable.
  This table is followed by the table "Manure sales outside Dutch agriculture, minerals and manure types".'
