description: 'This table provides figures on safety of situations in the residential environment and conditions
  in the residential environment that can have harmful effects on health. This is the proportion of people
  aged 16 or over who are seriously concerned about different situations in the previous 12 months. The
  figures are based on the Research Experience Living Environment (OBW). CBS conducts this research in
  collaboration with the National Institute for Public Health and the Environment (RIVM). Data available
  from: 2019 Status of figures: The figures in this table are final. Changes as of 14 August 2026: None,
  this is a new table. When will there be new figures? New data are published annually around November
  1st.'
