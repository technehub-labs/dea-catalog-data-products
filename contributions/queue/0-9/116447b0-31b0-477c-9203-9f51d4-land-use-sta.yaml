name: Land use statistics - Forest mixture ratio 1990
description: In 1996, as part of the project "Forest differentiation using digital satellite imagery",
  two datasets covering the whole of Switzerland were created on the basis of Landsat TM satellite images,
  which divide the forests into coniferous, mixed coniferous, mixed deciduous and deciduous categories.
  The aim of this project was, on the one hand, to help to develop reliable experience and knowledge of
  digital remote sensing and of using satellite data for statistical purposes and, on the other hand,
  to add a statistically verified and geographically differentiated distinction between deciduous, mixed
  and coniferous forests to the Swiss land use statistics. After the satellite images used had been geographically
  and radiometrically corrected, the first step involved distinguishing between forest and non-forest
  areas. After this the forest was divided into four mixture ratios.
