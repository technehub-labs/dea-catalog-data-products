name: Labour participation; attachment to the labour market, 2003-2022
description: 'This table contains quarterly and yearly figures on labour participation in the Netherlands.
  The population of 15 to 74 years of age (excluding the institutionalized population) is divided into
  the employed labour force, the unemployed labour force and those not in the labour force. The employed
  labour force is subdivided on the basis of the professional status, and the average working hours. A
  division by sex, age and level of education is available. Due to changes in the survey design and the
  questionnaire of the Labour Force Survey (LFS), a revision of the figures for 2021 was carried out in
  the first quarter of 2022. As a result, the numbers of 2021 and later will not be comparable to the
  years 2003-2020. Data available for 2003-2022 Status of the figures: The figures in this table are final.
  Changes as of August 17, 2022: None, the table has been discontinued. When will new figures be released?
  Not applicable. This table has been replaced, see paragraph 3 for a link to the new table.'
