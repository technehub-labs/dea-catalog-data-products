name: Swiss tourism statistics 2018
description: This publication describes the results of the FSO's Swiss tourism statistics for 2018. The
  first part focuses on tourist accommodation that is partly made up of the hotel sector statistics and
  partly of the supplementary accommodation statistics. The second section of this publication concerns
  the survey on the travel behaviour of the Swiss population in 2018. The tourism satellite account, in
  the third section, gives information on the values measuring the economic influence of tourism in Switzerland.
  The fourth section of the publication presents a series of economic indicators making it possible to
  place the findings from the tourism statistics in a wider context.
