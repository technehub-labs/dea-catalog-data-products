name: Atmosphere stations
description: MeteoSwiss monitors the atmosphere and measures its properties and composition.
  To do so, it uses various instruments and methods, including radio soundings, remote
  sensing devices, aircraft measurements and satellites. This allows for total concentrations
  and profiles to be measured on the basis of various parameters (temperature, humidity,
  wind, aerosols, ozone) and thus also for the vertical dimension to be shown. The
  requirements relating to the collection of meteorological measurement data are derived
  from the Federal Law on Meteorology and Climatology (MetG). MeteoSwiss creates monitoring
  concepts which take account of the requirements of other Federal Offices. These
  concepts define which parameters are measured and for what purpose, as well as where
  the measurements are taken and using what system.
