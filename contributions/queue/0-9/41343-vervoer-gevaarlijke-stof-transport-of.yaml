name: Transport of dangerous goods; Transport flow, ADR class
description: 'This table shows the annual figures for the transport of dangerous goods across the Dutch
  territory. This concerns the domestic transport, transit and supply and disposal of dangerous goods
  broken down by ADR class. The table contains transported cargo weight in tonnes and transport performance
  in cargo tonne-kilometres. Maritime transport does not involve transport over Dutch territory, so that
  the transport performance of this modality is not included in the tonne-kilometres of cargo. Data available
  from: 2012 Status of figures: The figures in this table are provisional. Changes as of 10 July 2026:
  The figures for 2024 have been added. The figures for the years 2015-2023 have also been revised, due
  to improvements in the figures for pipelines, rail and maritime transport. When will there be new figures?
  The new figures shall be submitted within 12 months of the end of the reporting year.'
