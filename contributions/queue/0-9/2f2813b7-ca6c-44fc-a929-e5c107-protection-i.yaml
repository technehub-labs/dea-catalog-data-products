name: Protection interests of the Confederation for ground-mounted photovoltaic installations
  of national importance
description: 'This is a summary of important protection interests under federal law
  and other, partly competing interests, as set out in the document "Freistehende
  Photovoltaikanlagen: Methodische Grundlage des Bundes" (Ground-mounted photovoltaic
  installations: methodological basis of the Confederation; published in german and
  french). The summary is not exhaustive; for example, it makes no statements or incomplete
  statements on species or nature conservation and does not include any cantonal or
  municipal protection interests. The content of the map is therefore not legally
  binding. For the spatial planning designation of suitable areas in accordance with
  Article 10 of the Energy Act, further protection interests not shown on this map
  must be taken into account.'
