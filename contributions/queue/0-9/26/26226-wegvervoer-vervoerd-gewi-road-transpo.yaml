name: Road transport; weight transported by road hauliers from the European Union
description: 'This table provides data on the cargo weight carried by road hauliers
  from the European Union as it has existed since 1 February 2020. The table shows
  the total cargo carried for each EU Member State, both domestic and international.
  This table is the successor of the table: Road transport; weight transported by
  road hauliers from the EU;2005-2019 containing data from the European Union including
  the United Kingdom. For the link to this table, see paragraph 3. Data available
  from: 2020 Status of figures: The figures up to 2022 are final, the 2023 and 2024
  figures are further provisional and the 2025 figures have a provisional status.
  Changes as of 3 September 2026: The figures for 2025 have been added. When will
  there be new figures? The new figures usually become available 10 months after the
  end of the reporting year.'
