name: UDP - Dependence on distant origins
description: 'This indicator measures the dependence of a country’s tourism on distant international markets.
  It is calculated as the share of nights spent at accommodation establishments by foreign tourists arriving
  from distant origins. Within the European continent, the countries of origin are considered distant
  if they are at a distance of 2000 km or more from the destination. Origins outside the European continent
  are always assumed distant. A high indicator value implies a potentially higher environmental footprint
  due to long-distance travelling. The indicator is part of the environmental impacts pillar of the EU
  Tourism Dashboard. UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: The level of completeness is
  100% when EU27, Iceland, Switzerland and Norway are fully covered. Eurostat/tour_occ_ninraw of year
  2019 not available for Norway (2016 considered in its place). POLICY CONTEXT: Indicates the dependence
  on far international tourism markets, increasing environmental footprint due to transport. METHODOLOGY:
  It is derived by the share of nights spent at accommodation establishments by foreign tourists arriving
  from distant origins. Within the European continent, the countries of origin are considered distant
  50% or more of their land is at distance of 2000 km or more from the destination. Origins outside the
  European continent are assumed always distant. DATA SOURCES: tour_occ_ninraw, NUTS 2021 classification.'
