name: School size by type of education and ideological basis
description: 'This table contains figures on schools and educational institutions
  by type of education, ideological basis and school size. It concerns schools and
  educational institutions financed by the government. Figures for the adult education
  are left out of this table, because the number of institutions is not available.
  Data available from: School/academic year 1990/91 Status of the figures: The figures
  up to and including school/academic year 2024/25 are final and the figures of school/academic
  year 2025/26 are provisional. Changes on 21 May 2026: The final figures of school/academic
  year 2024/25 and the provisional figures of school/academic year 2025/26 have been
  added. Change as of school year 2025/26: Due to changes in legislation, schools
  and educational institutions are no longer required to register their ideological
  basis starting from school year 2025/26. Schools and educational institutions that
  opt for this will be categorized as ‘other special’ from this school year onwards.
  When will new figures be published? In the second quarter of 2027 the provisional
  figures of school/academic year 2025/26 will be replaced by final figures and the
  provisional figures of school/academic year 2026/27 will be added in this publication.'
