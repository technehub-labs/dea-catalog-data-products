name: Total transport performance in the Netherlands; modes of travel and regions
description: 'This table contains information regarding the mobility of the residents of the Netherlands
  aged 6 or older in private households, so excluding residents of institutions and homes. The table contains
  the total number of passenger kilometres travelled on Dutch territory including kilometres travelled
  during series of calls trips and domestic holiday mobility. The distance travelled is based on stage
  information. A methodological break has been identified in the 2024 and 2025 ODiN file. When analyzing
  the first results of the Onderweg in Nederland 2024 survey, a break was observed compared to previous
  years. Research has shown that, due to shortened invitation and reminder letters, respondents may have
  received a different impression of what was asked of them regarding their trips, compared with previous
  years. As a result, ODiN 2024 and 2025 collected partially different data than ODiN 2023. Using the
  mobility trend from the mobility survey, the methodological break has been corrected as much as possible.
  More information can be found in the Research Description of the corrected ODiN 2024 and 2025. To inform
  StatLine users that the results of ODiN 2024 and 2025 were generated differently from previous years,
  these results are marked with an asterisk. For the corrected results of ODiN 2024 and 2025, no confidence
  intervals are available, and therefore no lower or upper bounds are provided. Due to a revision of the
  ODiN files, the figures by motive for 2018 have been changed as of February 10, 2022, but the total
  number of motives in 2018 has remained the same. In 2019, the revision sometimes resulted in minor changes
  in travel time. Data available from: 2018 Status of the figures: The figures from 2018 through 2023
  are final. The figures from 2024 onward are provisional. Changes as of October 23, 2026: The figures
  for 2025 have been added. From the 2024 reporting year onward, confidence intervals are not available.
  When will new figures be published? The figures for 20'
