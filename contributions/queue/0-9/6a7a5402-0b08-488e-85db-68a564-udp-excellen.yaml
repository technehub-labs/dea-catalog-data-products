name: UDP - Excellent bathing water
description: 'This indicator measures the quality of bathing waters. It is calculated as the share of
  sampled bathing water sites that are classified as "excellent" within a tourist destination. The measurement
  criterion is based on the presence of significant polluting substances in fresh and coastal waters throughout
  the period May-September. Higher values indicate higher quality of bathing waters in the tourist destination.
  The indicator is part of the environmental impacts pillar of the EU Tourism Dashboard. UNIT OF MEASURE:
  %. RESOLUTION: NUTS0, NUTS2, NUTS3. COMPLETENESS: Iceland and Norway are not available (the level of
  completeness is 100% when EU27, Iceland, Switzerland and Norway are fully covered). POLICY CONTEXT:
  Quality of natural environment in bathing areas. METHODOLOGY: Geographic coordinates of bathing water
  sites were converted to vector data and aggregated per NUTS level. The share of excellent bathing waters
  was calculated by considering only the bathing water sites classified as ''excellent''. DATA SOURCES:
  State of Bathing Water(European Environmental Agency), NUTS 2021 classification.'
