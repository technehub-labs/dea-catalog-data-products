description: 'This table presents information on quarterly turnover developments in
  the transport and storage sector (SIC 2008 section H). The data can be divided by
  a number of branches according to Statistics Netherlands'' Standard Industrial Classification
  of all Economic Activities 2008 (SIC 2008). The results are stated in terms of indices
  with base year 2010. Changes on the same period in the previous year are also published.
  Data available from: 1st quarter 2005 to 4th quarter 2017. Status of the figures
  Figures on 2017 are provisional and the remainder are definite. Changes as of June
  25 2018: None, this table has been discontinued. This table will be continued as;
  Transport; turnover change, index 2015=100''. For more information see section 3
  When will new figures be published? None, this table has been discontinued.'
