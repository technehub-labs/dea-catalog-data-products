name: Climate analysis map night cold air flow
description: 'The climate analysis map Night Cold Air Flow shows the flow field in 10 m above ground and
  the cold air volume flow density. The flow field of the cold air drains represents the streamlines calculated
  from wind speed and direction. The streamlines indicate in flow direction in which an air packet would
  follow in the wind field (unit: directional arrows). The cold air volume density indicates the amount
  of cold air flowing through a 1 m wide strip per second. This determines on the one hand the wind speed
  and on the other hand the vertical width of the flow (unit: m3).'
