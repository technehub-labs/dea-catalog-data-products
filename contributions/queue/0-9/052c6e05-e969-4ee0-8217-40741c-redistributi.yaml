name: Redistribution of public spaces.
description: 'More space for walking, cycling and local public transport is an important component of
  the mobility transition. On the one hand, this short study shows the status quo of the division of urban
  traffic areas in favor of motorized individual transport and its negative consequences. On the other
  hand, the potential of a redistribution is highlighted: The more areas are devoted to environmentally
  friendly modes of transport, the higher their share of traffic will be. Finally, international examples
  show how more and more cities and municipalities are using innovative approaches to redistribute public
  space and contribute to the sustainable mobility transition. This short study was carried out as part
  of the "Sustainable Mobility Transition" project on behalf of the German Federal Environment Agency.'
