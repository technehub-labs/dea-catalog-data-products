name: UDP - Tourism density
description: 'Tourism density is defined as the total number of nights spent over
  a year in a tourist destination (country or region) per square kilometre of land
  of the tourist destination. Very high values may signal possible crowding and/or
  environmental pressures. This descriptor is provided in the EU Tourism Dashboard
  as complementary information to characterize tourism demand. UNIT OF MEASURE: Nights
  spent per km2. RESOLUTION: NUTS0, NUTS2, NUTS3. COMPLETENESS: 100%. METHODOLOGY:
  The indicator is obtained dividing the nights spent by the total area of the tourism
  destination. DATA SOURCES: Nights spent at tourist accommodation establishments
  by NUTS 2 regions (tour_occ_nin2) [ESTAT].'
