name: 'BLOND: Building-Level Office eNvironment Dataset'
description: 'The BLOND dataset: continuous energy measurements of a typical office environment at high
  sampling rates with common appliances and load profiles. We provide voltage and current readings for
  aggregated circuits and matching fully-labelled ground truth data (individual appliance measurements).
  The dataset contains 53 appliances (17 classes) in a 3-phase power grid. BLOND-50 contains 213 days
  of uninterrupted measurements sampled at 50 kSps (aggregate) and 6.4kSps (individual appliances). BLOND-250
  consists of the same setup: 50 days, 250 kSps (aggregates), 50 kSps (individual appliances). These are
  the longest continuous measurements at such high sampling rates and fully-labelled ground truth we are
  aware of. Third-party funding: Alexander von Humboldt Foundation established by the government of the
  Federal Republic of Germany, Federal Ministry for Economic Affairs and Energy on the basis of a decision
  by the German Bundestag'
