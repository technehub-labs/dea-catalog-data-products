name: London's Night Time Economy by Borough and MSOA
description: <dp-prose> <p>Number of workplaces and employees working in industry sectors that operate
  in the evening or night. The &quot;night time economy&quot; is defined as the following Standard Industrial
  Classification 2007 (SIC 2007) industries:</p> <ul> <li> <p>Cultural and leisure activities</p> </li>
  <li> <p>Activities which support night time cultural and leisure activities</p> </li> <li> <p>24-hour
  health and personal social services</p> </li> <li> <p>Activities which support wider social and economic
  activities</p> </li> </ul> <p>This data is provided at Borough and MSOA level.</p> <blockquote> <p><a
  href="/night-time-observatory/">This dataset is included in the Greater London Authority&apos;s Night
  Time Observatory. Click here to find out more.</a></p> </blockquote> </dp-prose>
