name: Regional accounts; Fixed capital formation type of capital good 2008-2011
description: 'Fixed capital formation by type of capital good, groups of provinces, province and COROP
  region. This table concerns regional figures on gross fixed capital formation (on an owner basis) by
  type of capital good. The regional figures are in accordance with the national accounts, figures on
  gross fixed capital formation from production and imports (so, excluding sales of existing assets).
  Data available from: 2008 to 2011 Status of the figures: The data from 2008 onwards are final. The figures
  for the last year are provisional. Because this table is discontinued, figures will not be updated anymore.
  Changes as of February 11th 2015: None, this table is discontinued. When will new figures be published?
  Not applicable anymore. This table is replaced by table Regional accounts; Fixed capital formation by
  type of capital good, region. See paragraph 3.'
