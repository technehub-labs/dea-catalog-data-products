name: KNMI UV polarisation lidar Ascension Island initiative (ASCII) campaign data
description: A ground-based UV polarisation lidar was deployed to infer cloud droplet
  sizes and droplet number concentrations near the cloud base of cumulus clouds over
  Ascension Island. The measurements were part of the 2016 and 2017 ASCII campaigns
  to study aerosol-cloud interactions in the stratocumulus to cumulus transition zone
  of the southeast Atlantic Ocean. Measurements of uncalibrated attenuated backscatter
  were acquired at 30 seconds and 15 meters resolution.
