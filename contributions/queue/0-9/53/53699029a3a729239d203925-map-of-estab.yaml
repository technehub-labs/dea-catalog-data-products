name: Map of establishments labeled “Quality Tourism”
description: 'List and geolocation of Parisian institutions/providers holders of the
  right of use of the mark “Quality Tourism”. The “Quality Tourism” brand aims to
  distinguish between tourist establishments meeting demanding commitments. It thus
  contributes to the support and development of jobs in the sector and a good image
  of the destination France. Professionals who display the brand are committed to
  offering: — a personalised welcome; — clear and precise information; — competent
  and attentive staff; — a comfortable place with impeccable cleanliness; — local
  tourist information adapted to your request. (Source: Atout France — Tourist Development
  Agency of the France; 24/06/13)'
