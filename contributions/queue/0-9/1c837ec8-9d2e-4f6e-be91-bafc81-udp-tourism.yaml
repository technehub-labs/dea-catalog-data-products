name: UDP - Tourism GHG intensity
description: 'This indicator measures the amount of greenhouse gas (GHG) emissions produced by the tourism
  ecosystem per Million Euro of Gross Value Added (GVA) in the tourism sector. This indicator includes
  the following greenhouse gases: CO2, and N2O, CH4, HFC, PFC, SF6, NF3, all in CO2 equivalent. Lower
  values indicate a lower contribution to GHG emission and air pollution per Million Euro of GVA generated
  by the tourism ecosystem at the destination. The indicator is part of the environmental impacts pillar
  of the EU Tourism Dashboard. UNIT OF MEASURE: Kg of CO2 per Million EUR in current prices. RESOLUTION:
  NUTS0. COMPLETENESS: 100%. METHODOLOGY: The indicator is obtained by dividing the amount of greenhouse
  gas (GHG) emissions produced by the tourism ecosystem activities and the Gross Value Added (GVA) in
  the tourism sector. DATA SOURCES: Air emissions accounts by NACE Rev. 2 activity (env_ac_ainah_r2) [ESTAT],
  National accounts aggregates by industry (up to NACE A*64) (nama_10_A64) [ESTAT].'
