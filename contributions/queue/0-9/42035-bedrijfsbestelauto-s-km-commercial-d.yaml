name: Commercial delivery vehicles; kms, industry, size of business
description: 'This table provides data on the number of vans in the name of companies
  (commercial vans), traffic performance (mileage driven) of these vehicles and average
  annual mileage. These figures are broken down by industry (SBI 2008), company size
  and age of the vehicle. The figures in this table refer to all vans with a valid
  Dutch registration number that were admitted to traffic on public roads during (part
  of) the reporting year, including: - Vans that belong to the company stock in (part
  of) the year. - Vans that are only active on the road network for part of the year,
  such as new or imported vehicles and vehicles that have been scrapped or exported
  during the year. The calculated numbers are therefore higher than the number of
  registered (active) vans on the reference date of 1 January. The population of the
  figures in this table is based on the new selection method of the motor vehicle
  fleet. The difference between the old and the new selection method is described
  in a method report, see Section 4. Data available from: 2018 Status of figures:
  The figures for 2023 and 2024 are provisional. The figures for previous years are
  final. Multiple (external) source files are used for this table. Due to changes
  in these files, it is possible that (final) figures in this table are adjusted retroactively.
  Changes as of 15 January 2026: Figures for 2024 have been added and figures for
  2022 and 2023 have been updated. When will there be new figures? The new figures
  generally become available 15 months after the end of the reporting year.'
