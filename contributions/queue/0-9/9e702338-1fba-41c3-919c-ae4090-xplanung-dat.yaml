description: 'The development plan (BPL) contains the legally binding stipulations for the urban development
  order. In principle, the development plan must be developed from the land use plan. The available data
  are the ‘Landwirtschaftshof Burghof (Urschrift)’ development plan of the municipality of Neuhausen on
  the Fildern from XPlanung 5.4. Description: Agrarshof Burghof Original SO.'
