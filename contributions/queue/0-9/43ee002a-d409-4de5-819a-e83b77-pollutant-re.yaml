description: At European level, Regulation (EC) No 166/2006 of the European Parliament and of the Council
  of 18 January 2006 concerning the establishment of a European Pollutant Release and Transfer Register
  and amending Council Directives 91/689/EEC and 96/61/EC (the ‘E-PRTR Regulation’) established a European
  register with comparable data on pollutant emissions to air, water, soil, transfers of hazardous and
  non-hazardous waste, pollutants from off-site waste water.
