description: This dataset contains all the information needed about the incoming international
  students who are enrolled in the exchange program at Šiauliai State University of
  Applied Sciences during the 2024-2025 academic year. The data includes information
  about student demographics, their academic backgrounds, the type and duration of
  their mobility (semester studies, internships, and Blended Intensive Programmes),
  and which departments hosted them at the university.
