name: Road transport; transported weight by type of goods NSTR, 1975-2012
description: 'This table provides data on the weight carried by Dutch commercial vehicles
  with a maximum permissible weight (loading capacity plus unladen weight) of more
  than 3.5 tonnes. The figures are broken down by transport flows and type of goods
  (NSTR). In addition, a distinction is made between professional transport and own
  transport. Data available from 1975 to 2012. Status of figures: The data up to 2011
  are final and the figures for 2012 are provisional. As this table has been discontinued,
  the data are no longer made definitive. Changes as of 21 May 2015 None, this table
  has been discontinued. As of 2013, the sample design of the freight road transport
  statistics has been substantially modified. In addition, a simplified questionnaire
  was introduced in 2013. This has caused a trend break in the time series of the
  transported weight. When will there be new figures? No longer applicable. Is there
  a successor? This table is followed by Road Transport; transported weight to commodity
  type NSTR. See paragraph 3.'
