name: Solenergipotential i huvudstadsregionen
description: 'The data includes the potential yield of solar power calculated by building.
  The revenue potential has been calculated on the assumption that the roof of the
  building is fully covered with solar panels, where applicable. The data includes
  the potential for solar photovoltaic production calculated by building, if the entire
  area suitable for solar panels is covered with solar panels. When calculating the
  potential for annual electricity production, the efficiency of solar panels is assumed
  to be 15% and they are installed parallel to the roof also on flat roofs. The properties
  of the buildings include electricity production (MWh/year) and the surface area
  of the panels in square metres in the map service. In the original downloadable
  material (e.g. the Helsinki Photovoltaic Potential (SHP) folder containing the file
  electricity.shp), the electricity output is in field ELEC and its unit is kWh/year.
  The material was completed in the Decumanus project and produced by the Belgian
  company Eurosense, which is involved in the project and specialises in spatial information
  services. **WFS interface address:** [https://kartta.hsy.fi/geoserver/wfs](https://kartta.hsy.fi/geoserver/wfs?request=getCapabilities),
  level: the \_ Solar Potential of Buildings\_pks **WMS interface address:** [https://kartta.hsy.fi/geoserver/wms](https://kartta.hsy.fi/geoserver/wms?request=getCapabilities),
  level: buildings\_a solar plain potential\_pks, buildings\_a solar plain potential
  **The material can be viewed and downloaded from [HSY''s open map service](https://kartta.hsy.fi/?zoomLevel=5&coord=25496558_6673000&mapLayers=133+100+solar-skin
  potential_pks&markers=2|3|ffde00|25495997_6672199|).**'
