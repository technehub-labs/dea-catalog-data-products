name: Cost of diseases trend 2003-2019
description: 'The figures in this table come from the Cost of Diseases study 2019
  (KVZ) of the National Institute for Public Health and the Environment (RIVM), carried
  out in collaboration with the Central Bureau of Statistics (CBS). This table provides
  data on healthcare expenditure in the Netherlands broken down by dimensions of care
  use (sex, age, diagnosis) and care provision (sector) for the period 2003-2019.
  The Cost of Diseases figures are available in two separate tables. The detailed
  figures for 2019 are presented in another table (see link in paragraph 3). This
  table shows the trend data for the years 2003, 2005, 2007, 2011, 2013, 2015, 2017
  and 2019. Due to major changes in the diagnosis format and in the presentation of
  financing and care function, only the ICD10 main groups are included in this trend
  table in the diagnosis dimension and the dimensions of financing form and care function
  are missing. Data available from: 2003 Status of figures: Final Changes as of 25/06/2024:
  None, this is a new table When will there be new figures? Every two years. The Cost
  of Diseases study itself comes out every four years, but for each intermediate two-year
  period, an estimated allocation based on demographic extrapolation takes place.
  Figures for a reference year shall become available two years after the end of that
  reference year. The next update will cover the year 2021.'
