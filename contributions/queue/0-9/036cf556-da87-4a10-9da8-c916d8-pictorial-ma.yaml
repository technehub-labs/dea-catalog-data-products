name: Pictorial map of the City of Helsinki
description: 'The photographic map is a bird''s-eye view map of Helsinki''s inner city. Buildings and
  other objects are presented in three dimensions. The map covers the southern inner city of Helsinki.
  The scale of the data is 1:6700. The data was last updated in March 2014. The data is currently not
  updated. **Preview of materials in the map.hel.fi service:** - [kartta.hel.fi](https://kartta.hel.fi/link/dAVEmc)
  **Code(s):** - ETRS-GK25 (EPSG:3879). Maintenance coordinate system. The data can also be projected
  to other coordinate systems. Other possible coordinate systems can be found in the GetCapabilities document
  of the interface service. **Border service address:** - WMS interface: [https://kartta.hel.fi/ws/geoserver/opendata/wms](https://kartta.hel.fi/ws/geoserver/opendata/wms?request=getCapabilities)
  **Published levels:** - Photo map'
