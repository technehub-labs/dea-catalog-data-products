name: Database on international public finance for climate change adaptation (2019-2023)
description: 'This original database combines data from TOSSD and the OECD Development
  Assistance Committee (DAC) on climate-related development finance (CCDF) over the
  period 2019-2023. <br /> It covers adaptation flows, expressed in terms of commitments,
  from both international institutions and bilateral donors. It distinguishes the
  three main types of instruments used by donors: grants, concessional loans, non-concessional
  loans. \ \ The data shall identify, for each beneficiary country, reported commitments
  to development projects with an adaptation component. The amounts are expressed
  in constant 2023 dollars.\ \ Based on this database, within the International Development
  Finance Architecture Chair, Ferdi has carried out a statistical study on international
  finance for climate change adaptation to the needs of developing countries: * Hos
  T., Guillaumont Jeanneney S., Pugnet C. (2025) "[International finance for adaptation
  to climate change in response to the needs of developing countries](https://ferdi.fr/dl/df-Up5NmGKbzrpEHZ3kFhWrH2NS/wp362-la-finance-internationale-pour-l-adaptation-au-change-climatique.pdf)",
  *Working paper* Ferdi P362, December . * Hos T., Guillaumont Jeanneney S., Pugnet
  C. (2026) "[Climate finance for adaptation](https://ferdi.fr/dl/df-WzL6JB41v1WGheHg46JJDriv/ferdi-report-climate-finance-for-adaptation.pdf)",
  FERDI Report, 60 p. In addition, as part of a partnership with the French Development
  Agency, Ferdi carried out an econometric study to identify whether vulnerability
  to climate change guided the allocation of adaptation funding, according to the
  different types of donors and the instruments used over the period 2019-2023: Feindouno
  S. "Is vulnerability to climate change guiding the allocation of adaptation finance?
  Empirical analysis of donors and instruments over the period 2019-2023". The original
  database used for these two studies is open access on this page and includes: *
  data in the form of an Excel file * an accompanying technical docum'
