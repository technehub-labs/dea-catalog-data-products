description: 'This table provides data on the number of new and second-hand motor vehicles sold. This
  concerns information on passenger cars, commercial motor vehicles and motorcycles. This table does not
  include data on trailers, semi-trailers and mopeds. Data available from 2007 to 2016. Status of figures:
  Data from January 2015 to December 2016 are provisional. As this table has been discontinued, the data
  will no longer be made definitive. Changes as of 5 April 2018 None, this table has been discontinued.
  Due to the loss of funding, no new data will be available for this statistic from 1 January 2017. For
  more information see the link in section 3. When will there be new figures? No longer applicable.'
