name: Services producer price index (SPPI); index 2021=100
description: 'This table shows the price indices, quarterly and yearly changes in prices of services that
  companies provide. The figures are broken down by type of services according to the Classification of
  Products by Activity (CPA 2015 version 2.1). For some services, a further breakdown has been made on
  the basis of market data that differ from the CPA. This breakdown is indicated with a letter after the
  CPA code. The base year for all Services producer price indices is 2021. The year average, quarterly
  and yearly changes are calculated with unrounded figures. Data available from: 4th quarter 2002. Status
  of the figures: The figures for the most recent quarter are provisional. These figures are made definite
  in the publication for the subsequent quarter. Changes as of November 6 2026: The provisional figures
  of the 3rd quarter 2026 are published for approximately half of the branches and the figures up to the
  2nd quarter of 2026 are made definite. For all other branches, the figures for the 3rd quarter of 2026
  will be available at a later date. When will new figures be published? New figures are available twice
  per quarter. Halfway each quarter, the results of the pricing method Model pricing (around half of the
  branches) are published and the other branches with the Unit value method follow at the end of the quarter.
  This concerns the price development of the previous quarter. The Services producer price index of the
  total commercial services is also calculated and published at the end of each quarter. The Services
  producer price indices publication schedule can be downloaded as an Excel file under section: 3 Relevant
  articles. More information about the pricing method can be found in the video under section: 3 Relevant
  articles.'
