name: Key Indicator Moving-Friendly Environment
description: On the map you can see how much the living environment contributes to
  sports and exercise. The higher the score on a scale from 0 to 100, the more the
  environment is equipped to exercise and move. The scores are calculated per municipality
  and per neighborhood. The average score for the Netherlands is 64. People move in
  their free time, for example when they exercise or walk around. They also move when
  they have to go somewhere, for example when they cycle to work or walk to the supermarket.
  The Core Indicator Moving-Friendly Environment takes both forms of movement into
  account. The score is calculated with a model. The model uses public data, such
  as the presence of sports facilities, sports and play areas, distance from facilities
  and the amount of recreational green and blue.
