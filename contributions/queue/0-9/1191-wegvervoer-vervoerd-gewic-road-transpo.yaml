name: Road transport; transported weight to commodity type NSTR
description: 'This table provides data on the cargo weight carried by Dutch commercial vehicles with a
  maximum permissible weight (loading capacity plus unladen weight) of more than 3.5 tonnes. The figures
  are broken down by transport flows and types of goods (NSTR). In addition, a distinction is made between
  professional transport and own transport. Data available from: Annual figures available from 1975 to
  1997 for part of the types of transport and part of the transport flows. From 1997 all data are available.
  Status of figures: The figures up to 2022 are final, the 2023 and 2024 figures are further provisional
  and the 2025 figures have a provisional status. Changes as of 29 June 2026: The provisional figures
  for the reporting year 2025 have been added and the figures for 2024 have been updated. When will there
  be new figures? New figures will become available 5 months after the end of the reporting year.'
