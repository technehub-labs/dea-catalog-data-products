name: Road transport; key figures, 1997-2012
description: 'This table provides data on the transported weight, tonne-kilometres, number of journeys
  and distances travelled by Dutch commercial vehicles with a maximum authorised weight (loading capacity
  plus unladen weight) of more than 3.5 tonnes. The figures are broken down by transport flows. In addition,
  a distinction is made between professional transport and own transport. Data available from 1997 to
  2012. Status of figures: The data up to 2011 are final and the figures for 2012 are provisional. As
  this table has been discontinued, the data are no longer made definitive. Changes as of 21 May 2015
  None, this table has been discontinued. As of 2013, the sample design of the freight road transport
  statistics has been substantially modified. In addition, a simplified questionnaire was introduced in
  2013. As a result, a trend break has occurred in the time series of the transported weight and transport
  performance (loading tonne-kilometres). When will there be new figures? No longer applicable. Is there
  a successor? This table is followed by Road Transport; key figures. See paragraph 3.'
