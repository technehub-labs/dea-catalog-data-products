name: Fire Weather Index for Hydrological Bavaria from 1980-2099 derived from the 50 member CRCM5-LE
description: 'This dataset contains the Fire Weather Index for Hydrological Bavaria from 1980 - 2099 as
  stated in the paper "Climate change impacts on regional fire weather in heterogeneous landscapes of
  Central Europe" published in Natural Hazards and Earth System Sciens (NHESS) 2023. The dataset contains
  daily Fire Weather Index values for all 50 members (subfolders of the dataset) of the CRCM5-LE (11 km
  spatial resolution) from 1980 to 2099 over the domain of Hydrological Bavaria. Please cite this dataset
  as the publication: Miller, J., Böhnisch, A., Ludwig, R., & Brunner, M. I. (2023). Climate change impacts
  on regional fire weather in heterogeneous landscapes of Central Europe. Natural Hazards and Earth System
  Sciences Discussions, 1-25. doi: 10.5194/nhess-2023-51.'
