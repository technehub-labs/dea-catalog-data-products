name: Cnam Health Directory (deprecated)
description: '## ⚠ **ATTENTION**: This dataset is deprecated. A new version of the
  Améli Health Yearbook has been released online. Please go to the following *repository*
  to access the data in the new directory: <https://www.data.gouv.fr/datasets/ directory-sante-ameli>
  Note that this *repository* will still be available for the first quarter of 2026,
  but will no longer be updated after January 2026 inclusive. *** The health directory
  fulfils the general task of providing information to insured persons with a view,
  in particular, to facilitating access to care, which is entrusted to the Sickness
  Insurance Office pursuant to Article L.162-1-11 of the Social Security Code. It
  makes it possible to find the contact details of health professionals practising
  in a liberal capacity and those of healthcare institutions, as well as the acts
  performed. It also makes it possible to know the conventional sector to which a
  health professional belongs, the tariffs applied, whether or not he accepts the
  vital card, or the tariff data for certain hospital services. This dataset contains
  personal information relating to healthcare professionals. It is published in accordance
  with the provisions of [Article L. 1461-2 of the Public Health Code](https://www.legifrance.gouv.fr/affichCodeArticle.do?cidText=LEGITEXT000006072665
  \&idArticle=LEGIARTI000031923894 \&dateText=\&categorieLink=cid). The re-use of
  this data is subject to compliance with the regulations on the protection of privacy.'
