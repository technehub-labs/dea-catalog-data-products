name: Vanda stads inköpsfakturor
description: 'The data includes the City of Vantaa''s purchases of services, materials,
  supplies and goods since 2012. The data includes the purchase invoice data of all
  the City of Vantaa''s industries, non-financial corporations and funds. The data
  has been extracted from the city''s accounting system at the invoice row level,
  and the data has been supplemented with, for example, the names of organisations
  and account groups, as well as the Y-identities of the suppliers. The dataset contains
  the following column data: company, profit area and cost centre, date of registration,
  receipt number, account group, account name, account number, supplier''s name, business
  ID, invoice total in euros, order and partner company. The data has been classified
  to facilitate the use of the data. The organisation is classified according to companies:
  City of Vantaa, enterprise, fund and by profit area. Accounts are classified by
  account group as follows: purchases of services, personnel services, other expenses,
  acquisitions of fixed assets and materials, supplies and goods. The suppliers are
  classified according to the partnership into joint-stock companies and joint municipal
  authorities belonging to the urban group, as well as external suppliers. With the
  help of classifications, it is also possible to view purchases from the material,
  for example, by supplier and at the account level. The results area and cost location
  data are not complete, as completing the data would require a review of individual
  supporting documents. As of 2024, the data do not include data from private traders
  considered to be personal data within the meaning of the GDPR. The data is updated
  approximately once a month.'
