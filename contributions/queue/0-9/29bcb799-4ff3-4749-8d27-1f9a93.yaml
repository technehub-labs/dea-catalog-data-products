name: Δίκτυο στάσεων - Συγκοινωνίες Αθηνών
description: Το σύνολο δεδομένων περιέχει πληροφορίες για το δίκτυο στάσεων των λεωφορείων και των τρόλεϊ
  στην Αθήνα, δηλαδή το σημείο, το όνομα και τον κωδικό της στάσης, το δήμο στον οποίο ανήκει, καθώς και
  το σύνδεσμο για την εμφάνιση της αντίστοιχης σελίδας πληροφοριών για την εκάστοτε στάση μέσω της εφαρμογής
  της Τηλεματικής. Περιλαμβάνονται όλες οι στάσεις που βρίσκονται εντός των δήμων είτε αφορούν σε βασικές
  γραμμές είτε σε προσωρινές διαδρομές.
