name: Clouds, precipitation and radiation - MSG-CPP products
description: The Cloud Physical Properties (CPP) algorithm is being developed at KNMI
  to derive cloud, precipitation and radiation products from satellite instruments
  such as SEVIRI onboard the Meteosat Second Generation (MSG) satellite. The CPP algorithm
  development is largely done inside EUMETSAT's Satellite Application Facility on
  Climate Monitoring (CM SAF), but also in other research projects. The CPP cloud
  top height is derived from the Nowcasting SAF (NWC SAF) cloud top temperature and
  height (CTTH) product.
