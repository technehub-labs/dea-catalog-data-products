  METHODOLOGY: See https://tourism-dashboard.ec.europa.eu/background-methodology DATA SOURCES: See https://tourism-dashboard.ec.europa.eu/background-methodology?lng=en#section-5
  LEVEL OF AGGREGATION: NUTS0/2/3.'
