name: Certificat énergétique cantonal des bâtiments (CECB)
description: Le Certificat énergétique cantonal des bâtiments (CECB), identique pour toute la Suisse,
  évalue la qualité de l’enveloppe et le bilan énergétique global d’un bâtiment, ainsi que ses émissions
  directes de CO2. Le CECB Plus ajoute à cette évaluation un rapport de conseil en vue d’une rénovation
  énergétique. L’établissement d’un CECB est possible aussi bien pour les immeubles résidentiels que pour
  les bâtiments administratifs ou scolaires, les hôtels, les commerces, les restaurants ou les affectations
  mixtes de ces catégories. Le CECB est basé sur la normalisation du CECB en vigueur. Le CECB est en principe
  facultatif. Le canton du jura l’exige en cas de transfert de propriété ou lors du remplacement d'une
  installation de chauffage par un nouveau chauffage à énergie fossile.
