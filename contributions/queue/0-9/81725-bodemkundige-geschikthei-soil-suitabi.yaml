name: Soil suitability for arable farming
description: The suitability map for arable farming was made by Alterra Wageningen. The suitability of
  parcels for arable farming is determined by a combination of soil properties and groundwater levels.
  Important soil properties are machinability, rideability, chemical soil fertility, rootability and moisture-providing
  capacity. If groundwater levels are too high in the spring, the soil is too wet to perform spring work,
  such as fertilizing, preparing seed and sowing. Too wet conditions slow down the spring growth of the
  crop. In the autumn, high groundwater levels can make harvesting arable crops more difficult. In periods
  of low precipitation, the moisture supply in the soil must be sufficient to provide the plant with sufficient
  moisture. In the event of a shortage, growth slowdown occurs. The suitability card is based in particular
  on reduced yields as a result of moisture shortage and waterlogging.
