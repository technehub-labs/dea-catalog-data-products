name: 'Group layer: Climate analysis - Affected population per municipality in percent'
description: In the climate analysis NRW, the climatic situation is recorded and depicted throughout NRW
  as well as the (thermally) polluted settlement areas (= effective areas) are identified and delineated
  and evaluated from corresponding compensation areas. The climate analysis was carried out in accordance
  with VDI guideline 3787, sheet 1. The map ‘Affected population’ shows the percentage of people per municipality
  living in areas with an ‘unfavourable thermal situation’ or a ‘very unfavourable thermal situation’
  according to the climate analysis as a whole. In addition, the Climate Change Preparedness Map ‘Affected
  Population’ also takes into account the areas that have been identified as climate change preparedness
  in the overall climate analysis. The population figures are based on the population data from the 2011
  CENSUS survey, which are available in a resolution of 100 m × 100 m and were blended with the polluted
  areas.
