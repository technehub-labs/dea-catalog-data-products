name: UDP - Dependence on top3 countries of origin
description: 'This indicator measures the dependence on specific international markets,
  revealing exposure to risks related to specific international travel restrictions
  and other demand shocks. Lower values indicate lower dependence from the three top
  countries of origin and, therefore, signalling a potentially lower susceptibility
  to shocks. This indicator is part of the socio-economic composite index of the EU
  Tourism Dashboard. UNIT OF MEASURE: %. RESOLUTION: NUTS0. COMPLETENESS: 100%. METHODOLOGY:
  This indicator measures the dependence on specific international markets, revealing
  exposure to risks related to specific international travel restrictions and other
  demand shocks. It is calculated as the share of the nights spent from the top three
  countries of origin for each destination country in relation to the total nights
  spent in the destination country. The top 3 origins are specific to each destination
  country. Lower values indicate lower dependence on the three top countries of origin
  and, therefore, signalling high market diversification and thus a potentially lower
  susceptibility to shocks. DATA SOURCES: ESTAT (tour_occ_ninraw).'
