name: National Parks as Tourism Attractions
description: Ensuring visitor satisfaction and at the same time protecting natural
  resources by minimising negative environmental influences by visitors are the main
  tasks of a national park. This paper explores how knowledge about load limit management
  and visitors can be used to ensure that these goals are met. An extensive literature
  review was carried out, existing theories were investigated and contemporary applied
  concepts were identified. Furthermore, expert interviews were conducted in five
  Austrian national parks to learn about their approach as well as about new and innovative
  concepts in national park management. Literature served as the basis for the interpretation
  of the research results. It is shown that although many procedures exist regarding
  the setting of load-bearing capacity limits as well as negative visitor influences,
  there are difficulties in implementing them globally. Correlations and interdependencies
  between management concepts are examined in the course of this thesis and it is
  explained how the knowledge about them can be applied in practice.
