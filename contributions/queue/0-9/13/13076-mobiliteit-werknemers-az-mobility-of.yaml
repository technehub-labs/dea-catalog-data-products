name: Mobility of workers; AZW (wide), inflow, outflow, balance, 2010-2019
description: 'This table provides figures on the inflow and outflow of workers in
  the care and well-being sector broadly; This is an aggregation of all branches in
  healthcare and well-being. The reference date of the figures is the last day of
  each quarter, with the exception of the fourth quarter. In the fourth quarter, the
  last Friday before Christmas is taken as the reference date. To determine inflow
  or outflow, the population in a quarter is compared with the population in the same
  quarter one year earlier. If the employee did not work in care and welfare on one
  of the two reference dates and did on the other, there is mobility. As a result,
  employees who do not work in care and well-being every month, such as employees
  with a flexible employment relationship or employees with a zero-hour contract,
  are more often classified as mobile. The figures are classified according to the
  Standard Business Classification 2008 (SBI 2008) of Statistics Netherlands (CBS).
  The calculations relate to main jobs of employees. In this table, figures on labour
  market flows for the care and welfare sectors are presented broadly. This means
  that figures on labour market flows for the care and welfare sectors are narrowly
  excluded (for a reference to these figures see Section 3). The labour market for
  care and welfare narrow means that the childcare sector is not included. As a result,
  figures on labour market flows of care and well-being narrowly relate to a different
  population than figures on care and well-being are broad. Figures on different populations
  are not published in the same table. The figures on the labour market in care and
  welfare are presented in their own table. This table was developed within the framework
  of the Labour Market, Care and Welfare (AZW) research programme. For more trends
  and developments in the labour market in care and welfare, see azwstatline.cbs.nl
  (see paragraph 3). Data available from Q1 2010 to Q4 2019. Status of figures: All
  figures are provisional. As this'
