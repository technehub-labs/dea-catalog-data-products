name: Caribbean Netherlands; labour participation, young people (15-24 years)
description: 'This table contains yearly figures on labour participation of young
  people living on Bonaire, St. Eustatius and Saba (the Caribbean Netherlands). The
  population of 15 to 24 years of age (excluding the institutionalized population)
  is divided into the employed labour force, the unemployed labour force and those
  not in the labour force. The employed labour force is subdivided on the basis of
  the professional status and the average working hours. A division by sex and whether
  they are in education is available. Data available from: 2012 Status of the figures:
  The figures in this table are final. Changes as of 7 July 2025: The figures of 2024
  are added. When will new figures be published? New figures will be published every
  two years.'
