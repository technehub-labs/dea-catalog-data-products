name: Impact Indicator for Priority Pests (I2P2)
description: In a resource scarce world allocating plant health efforts to pests that really matter is
  key. The I2P2 indicator allows identifying pests that would have the highest economic, social and environmental
  impact if established in the Union’s territory. Using primary and secondary data on production, trade,
  employment and biodiversity together with phytopathology data from the pests we calculate 24 indicators
  which are then aggregated into a single indicator value. The ranking is checked for robustness regarding
  uncertainty on pathology parameters and policy priorities in terms of which kind of impacts are deemed
  more important by risk assessors. This data set is the basis for the calculation of the updated and
  modified version of the Impact Indicator for Priority Pests (I2P2) a composite indicator based on multi-criteria
  analysis. To calculate I2P2 values expert knowledge elicitations were conducted by EFSA for key parameters
  and these combined with a diversity of secondary data sources. The I2P2 model combines economic, social,
  and environmental impact into a single value which is subsequently used to rank pests. We assessed robustness
  of our recommendation with regards to uncertainty on the biological parameters as well as risk managers’
  preference on avoiding impacts in the different domains. In addition we inform on the driving factors
  behind the composite scores.
