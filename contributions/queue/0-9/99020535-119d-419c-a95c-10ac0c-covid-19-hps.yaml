name: COVID-19 - HPSC Detailed Statistics Profile
description: 'This dataset contains COVID-19 Daily Statistics and the Profile of Covid-19 Daily Statistics
  for Ireland as reported by the Health Protection Surveillance Centre. This data includes confirmed cases
  (PCR) only and does not include positive antigen results uploaded to the HSE portal. Time series dataset
  from March 2020 to November 2023. Deaths: From 16th May 2022 to November 2023, reporting of Notified
  Deaths changed from daily to weekly. Data on deaths is based on the date on which a death was notified
  on CIDR, not the date on which the death occurred. Data on deaths by date of death is available on the
  HPSC Respiratory Virus Notification Hub https://respiratoryvirus.hpsc.ie/. Notice: Please be advised
  that on 29th April 2021, the ''Aged65up'' and ''HospitalisedAged65up'' fields were removed from this
  table. The three fields ''Aged65to74'', ''Aged75to84'', and ''Aged85up'' replace the ''Aged65up'' field.
  The three fields ''HospitalisedAged65to74'', ''HospitalisedAged75to84'' and ''HospitalisedAged85up''
  replace the ''HospitalisedAged65up'' field. On the week beginning 1st March 2021, the values in the
  following fields in this table were set to zero: ''CommunityTransmission'', ''CloseContact'', ''TravelAbroad''
  and ‘ClustersNotified’. The primary Date applies to the following fields: ConfirmedCovidCases, TotalConfirmedCovidCases,
  ConfirmedCovidDeaths, TotalCovidDeaths, ConfirmedCovidRecovered, SevenDayAverageCases. The StatisticProfileDate
  applies to the following fields: CovidCasesConfirmed, HospitalisedCovidCases, RequiringICUCovidCases,
  HealthcareWorkersCovidCases, Clusters Notified, HospitalisedAged5, HospitalisedAged5to14, HospitalisedAged15to24,
  HospitalisedAged25to34, HospitalisedAged35to44, HospitalisedAged45to54, HospitalisedAged55to64, HospitalisedAged65to74,
  HospitalisedAged75to84, HospitalisedAged85up, Male, Female, Unknown, Aged1to4, Aged5to14, Aged15to24,
  Aged25to34, Aged35to44, Aged45to54, Aged55to64, Aged65to74, Aged75to84, Aged85up, MedianAge CommunityTransmission,
  CloseContac'
