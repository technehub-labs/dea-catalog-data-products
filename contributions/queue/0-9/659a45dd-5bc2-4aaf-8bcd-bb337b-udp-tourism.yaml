name: UDP - Tourism capacity
description: 'This descriptor measures the number of bed-places at tourism accommodation
  establishments available at a destination (country or region) in a given year. It
  provides an account of the absolute dimension of a tourism destination from the
  supply perspective. Higher values indicate a higher tourism supply. This descriptor
  is provided in the EU Tourism Dashboard as complementary information to characterize
  tourism supply. UNIT OF MEASURE: number of bed-places. RESOLUTION: NUTS0, NUTS2.
  COMPLETENESS: Missing countries for 2020: CH, CZ, DE, DK, HU, IE, LV, PL, SE, SI.
  DATA SOURCES: tour_cap_nuts2 [ESTAT], TripAdvisor.'
