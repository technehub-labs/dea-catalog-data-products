name: Area under organic farming (certified organic or in-conversion)
description: The indicator measures areas under organic farming (certified organic
  and in-conversion). Areas "certified organic" which bring together parcels whose
  conversion period has ended and whose production can be marketed with the designation
  "organic farming" , areas in conversion (the conversion period varies from 2 years
  for annual crops to 3 years for perennial crops).
