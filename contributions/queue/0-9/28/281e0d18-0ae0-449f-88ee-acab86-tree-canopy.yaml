name: Tree Canopy Cover Loss Yearly per District - Germany, 2018-2021
description: The product contains information of tree canopy cover loss in Germany
  per district (Landkreis) between January 2018 and April 2021 at monthly temporal
  resolution. The information is aggregated at from the 10 m spatial resolution Sentinel-2
  and Landsat-based raster product (Tree Canopy Cover Loss Monthly - Landsat-8/Sentinel-2
  - Germany, 2018-2021). The method used to derive this product as well as the mapping
  results are described in detail in Thonfeld et al. (2022). The map depicts areas
  of natural disturbances (windthrow, fire, droughts, insect infestation) as well
  as sanitation and salvage logging, and regular forest harvest without explicitly
  differentiating these drivers. The vector files contain information about tree canopy
  cover loss area per forest type (deciduous, coniferous, both) and per year (2018,
  2019, 2020, January-April 2021, and January 2018-April 2021) in absolute numbers
  and in percentages. In addition, the vector files contain the district area and
  the total forest area per district.
