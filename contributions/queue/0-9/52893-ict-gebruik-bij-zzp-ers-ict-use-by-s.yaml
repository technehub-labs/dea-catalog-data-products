description: 'This table provides figures on the use of information and communication
  technology (ICT) by self-employed persons without staff (self-employed persons).
  The data can be broken down by industry. The reporting period covers the year 2024.
  However, a number of topics relate to the year 2023. In such cases, this shall be
  stated in the explanatory memorandum to the subject in question. Data available
  for 2024. Status of figures: The figures in this table are further provisional.
  Changes as of 12 December 2025: By mistake, variables were included that do not
  belong in the table. This version of the table has been restored. The provisional
  figures for ‘Time work via ICT client’ have also improved. Changes as of 12 December
  2024: None, this is a new table. When will there be new figures? Figures for 2025
  will be available in December 2025. These figures will be published in a new table.'
