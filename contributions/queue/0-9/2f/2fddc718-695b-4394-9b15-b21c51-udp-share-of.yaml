name: UDP - Share of foreign tourists
description: 'This descriptor measures the dependence on international markets for
  tourism demand, revealing exposure to risks related to international travel restrictions
  and other demand shocks. It is expressed as the share of nights spent by foreign
  tourists in relation to the total number of nights spent (domestic and foreign)
  in accommodation establishments. Low values indicate that most of the tourism demand
  is domestic, revealing small dependence but also low capacity to attract demand
  from international markets. Ideal values are possibly not too high and not too low.
  This descriptor is provided in the EU Tourism Dashboard as complementary information
  to characterize tourism demand. UNIT OF MEASURE: %. RESOLUTION: NUTS0, NUTS2, NUTS3.
  COMPLETENESS: Missing NO (2019) and CH (2020). METHODOLOGY: This indicator represents
  the share of nights spent by foreign tourists in relation to the total number of
  nights spent (domestic and foreign) in accommodation establishments. DATA SOURCES:
  ESTAT (tour_occ_ninat).'
