name: Energy Consumption in New York City
description: 'The "Energy Consumption in New York City" dataset provides comprehensive
  information on the energy usage patterns and trends in City over the past five years.
  The dataset includes data on electricity consumption, gas consumption, and water
  consumption in various sectors, such as residential, commercial, and industrial.
  Attributes: 2020: The year for which the data was recorded. August: The month for
  which the data was recorded. Sector: The sector (residential, commercial, industrial)
  of energy consumption. Electricity Consumption (kWh): Total electricity consumption
  200,000 kWh for the specific sector. Gas Consumption (m3): Total gas consumption
  500 m3 for the residential sector. Water Consumption (m3): Total water consumption
  300 m3 for both residential and commercial sector. Data Sources: The data has been
  collected from industry reports, ensuring its reliability and accuracy. Use Cases:
  This dataset is valuable for researchers, urban planners, and policymakers to analyze
  energy consumption patterns, identify trends, and make informed decisions regarding
  energy efficiency and sustainability initiatives in New York City. Update Frequency:
  The dataset is updated annually to include the latest available data. License: The
  dataset is made available under the Creative Commons Attribution License, allowing
  users to share and adapt the data for non-commercial purposes with appropriate attribution.'
