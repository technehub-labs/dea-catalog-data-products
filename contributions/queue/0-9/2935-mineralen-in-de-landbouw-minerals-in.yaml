name: Minerals in agriculture sector balance sheet 1990-2011
description: 'This StatLine table (sector balances) gives a simplified view of the supply, disposal and
  surplus of the minerals nitrogen, phosphorus and potassium in agriculture. Figures on the (return) flows
  within agriculture itself (livestock and agricultural land) are not shown in this table, but can be
  found elsewhere in the simplified flow diagrams of nitrogen and phosphorus in agriculture associated
  with this table (see below at: 4. SOURCES AND METHODS). The supply of minerals to agriculture mainly
  takes place with animal feed and fertilizer. The rest is supplied from the air with other (fertilizer)
  substances and via precipitation (deposition). The removal of minerals from agriculture takes place
  mainly through animal and vegetable products. In addition, an important part leaves agriculture in the
  form of animal manure abroad and other products that have arisen after manure processing. The surplus
  (total loss of minerals to the environment) is calculated by subtracting the discharge points from the
  landing points. These surpluses accumulate mainly in the soil (accumulation). One part flushes out to
  groundwater, while another part evaporates to the air (volatile) as nitrogen compounds (especially as
  ammonia (NH3)). These surpluses contribute significantly to the fertilisation and acidification of the
  environment. Data available from: 1990 to 2011 Status of figures: The figures for all years are final.
  Changes as of 1 July 2016: None, this table has been discontinued. When will there be new figures? No
  longer applicable.'
