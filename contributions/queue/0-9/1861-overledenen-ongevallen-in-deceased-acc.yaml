name: Deceased; accidents, inhabitants of the Netherlands, 1996-2017
description: 'This table provides data on residents of the Netherlands who died as
  a result of an accident (mainly transport accident, accidental fall, accidental
  drowning and accidental poisoning) in the year indicated. The place of the accident
  does not have to be in the Netherlands. The date of the accident may be in the previous
  year. The data are disaggregated by sex and age of the victim. The ICD-10 causes
  of death are V01-W77, W80-X59, Y10-Y19, Y34 and Y85-Y86. Statistics Netherlands
  (CBS) has switched to the use of international software for automatic coding of
  the causes of death in the statistical year 2013. This makes the figures more reproducible
  and internationally comparable. However, there are some significant shifts in the
  causes of death. However, external causes of death have been manually processed
  as before. The persons who died during the MH17 disaster in 2014 are not classified
  as an accident with an aircraft, but as an act of war or rebellion (ICD-10 code
  Y36). These persons are therefore not to be found in this accident table. Data available
  from 1996 to 2017 Status of figures: All figures are final. Changes as of 20 November
  2019: None, this table has been discontinued. All information from the table can
  also be found in table ''Deceased; cause of death (extended list), age, sex'' and
  a large part also in table ''Deceased; major causes of death (short list), age,
  gender''. Because the view is slightly different on two points, this leads to questions
  and confusion every year. Therefore, it was decided to stop this table. The points
  that are different in this discontinued table than in the ''short list table'' are:
  - the short list also includes accidental poisoning, but does not specify the code
  design; - in the short list, choking does include the code on choking in food, while
  it is not included in the discontinued table. Paragraph 3 contains a list of links
  in which the replacement information can be found for each part of the table. When
  will there be new fi'
