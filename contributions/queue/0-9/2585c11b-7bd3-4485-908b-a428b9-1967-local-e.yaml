name: 1967 Local elections- election statistics
description: 'This document sets out the following statistics from the 1967 local elections: i) The number
  of local electors, total poll, valid poll, percentage turnout, total invalid votes and invalid votes
  as percentage of total votes cast in elections in the County and County Boroughs Council elections.
  ii) The number of electors, valid poll and percentage poll for elections in the County Borough and Urban
  District Council elections. iii) The number of electors, valid poll and percentage poll for elections
  in the Town Commissioners elections. iv) The number of candidates and percentage of first-preference
  votes for each political party in County Council elections. v) The number of candidates and percentage
  of first-preference votes for each political party in County Borough Council elections. vi) The number
  of candidates and percentage of first-preference votes for each political party in County Borough and
  Urban District County elections. vii) The number of candidates and percentage of first-preference votes
  for each political party in Town Commissioners elections.'
