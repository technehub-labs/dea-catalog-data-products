name: International trade and transit trade; product group 2007-2017
description: 'This table shows the international commodity flows from, to and through
  the Netherlands. For imports, exports, re-exports and transit trade the table represents
  the value and gross weight of goods broken down by product group (NSTR chapter)
  and continent of origin or destination. This publication is co-financed by the Ministry
  of Infrastructure and Water Management. Data available from 2007 to 2017. Status
  of the figures: The figures in this table are provisional. Since this table has
  been discontinued, the figures will not be made definitive. Changes as of 21 February
  2020: None, this table has been discontinued. When will new figures be published?
  Not applicable.'
