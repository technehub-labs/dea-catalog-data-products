description: 'The figures in this table are based on various data sources edited by
  the National Institute for Public Health and the Environment (RIVM). This table
  was created for the RIVM website Regiobeeld.nl and contains data on care use, care
  provision, health and lifestyle, population development, social environment and
  physical environment. This data is available at municipal level and at different
  regional levels and includes demographic projections up to the year 2040 where possible.
  Data available from: 2015 Status of figures: Definitive. Changes as of 01-03-2023:
  Expansion with many new indicators, including on the topics of DBC, mental health
  care and general practitioner care, labour market care and well-being and serious
  noise nuisance. When will there be new figures? Every quarter. Due to the periodic
  updates of the table, there may be discrepancies with the Regiobeeld.nl website.'
