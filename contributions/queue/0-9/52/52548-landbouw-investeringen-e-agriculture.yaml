name: Agriculture; investments and stocks, national accounts
description: 'This table contains data from the economic accounts for agriculture.
  The figures refer to gross investment and changes in inventories. Data available
  from: 1995 Status of figures: The years in the period 1995-2023 are final. The years
  2024 and 2025 have provisional status. Changes as of 1 October 2026: Data from the
  estimate of provisional figures 2025 have been added to this table. When will there
  be new figures? After the end of the reporting year, the provisional figures will
  be published after approximately 6 months. After 18 months, the final figures are
  published at the same time as the national accounts are published. The very preliminary
  figures for the current year will be available in December. These data are determined
  by the Agricultural Economic Institute in consultation with Statistics Netherlands.
  An update of the very preliminary figures will take place in January.'
