name: Agriculture; accrual of income and labour volume, national accounts
description: 'This table contains data from the economic accounts for agriculture. Figures refer to output,
  intermediate consumption, value added, labour volume and agricultural income. Data available from: 1995
  Status of figures: The years in the period 1995-2023 are final. Data from the years 2024-2025 are provisional.
  Changes as of 1 October 2026: Data from the estimate of provisional figures 2025 have been added to
  this table. When will there be new figures? After the end of the reporting year, the provisional figures
  will be published after approximately 6 months. After 18 months, the final figures are published at
  the same time as the national accounts are published. The very preliminary figures for the current year
  will be available in December. These data are determined by Wageningen Social & Economic Research (WSER)
  in consultation with CBS.'
