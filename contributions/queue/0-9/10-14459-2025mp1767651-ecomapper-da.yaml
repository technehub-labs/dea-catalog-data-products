name: Ecomapper Dataset
description: The EcoMapper dataset comprises over 2.9 million satellite images accompanied by climate
  metadata. It includes both RGB imagery and selected multispectral channels (B6 – Red Edge 2, B8 – NIR,
  B11 – SWIR1) sourced from the Copernicus Sentinel satellite missions. The Dataset Spans Various Land
  Cover Types and Multiple Temporal Points. The training set features 98,930 unique locations, each with
  24 months of data, while the test set includes 5,494 locations covering 96 months. Each timestamp is
  paired with weather-related metadata, including temperature, solar radiation, and precipitation. The
  imagery is derived from the Sentinel-2 mission, supported by the European Space Agency’s (ESA) Network
  of Resources (NoR) program.
