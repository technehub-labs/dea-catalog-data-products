description: The Irish Landmark Trust, since 1992, have been saving some of Ireland’s
  most iconic buildings, and making them accessible to the wider community. We restore
  properties sensitively, with a focus on best practices in conservation, as well
  as comfort for our guests. An Irish Landmark stay means you get all the character
  and historic elegance without sacrifice and modern convenience.
