name: Arable crops; Provisional and final harvest estimate 2010-2022
description: 'This table contains figures on the area cultivated and harvested, the yield per hectare
  and the total yield in a harvest year, per arable crop. Both the results of the provisional harvest
  estimate and the results of the final harvest estimate are shown in this table, as well as the percentage
  difference. In order to arrive at the figure for the yield, a provisional harvest estimate is first
  made. This happens in the months of August to October. After this estimate, the figures of the final
  harvest estimate are made in the months of December to March of the year following the harvest year.
  These figures are still provisional until the end of September in the year following the harvest year.
  Data available from 2010 to 2022. Status of figures The data is final Amendment as of 3 October 2023:
  None, this table has been discontinued. When will there be new figures? No longer applicable. This table
  is followed by Arable crops; preliminary and final harvest estimate. See paragraph 3.'
