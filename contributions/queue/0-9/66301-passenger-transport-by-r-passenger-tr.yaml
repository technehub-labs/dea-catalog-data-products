name: Passenger transport by rail; number of passengers, passenger kilometres
description: 'This table contains data on the number of passengers and the passenger
  kilometers travelled per train on Dutch territory, excluding tourist railway lines.
  It covers all train journeys that use the Dutch railway network. The annual figures
  are split into national and international journeys. Data available from: 2024 Status
  of the figures: Figures for 2024 and 2025 are definitive. Figures for 2026 are of
  a preliminary nature. Changes as of September 30, 2026: The quarterly figures for
  the second quarter of 2026 have been added. The quarterly as well as the anual figures
  for both 2024 and 2025 have been revised due to the addition of a new data source.
  When will new figures be published? New quarterly figures will be available within
  3 months after the end of the reporting period. New annual figures will be available
  within 8 months after the end of the reporting year.'
