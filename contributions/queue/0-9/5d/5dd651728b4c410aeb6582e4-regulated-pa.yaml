name: Regulated parking for people with reduced mobility in the Commune of Lyon
description: The possibility of parking on roads or in car parks, public or private,
  helps to ensure the accessibility of motorized travel for people with disabilities
  and people with reduced mobility (PRM). A comprehensive legal framework exists to
  guarantee this right. On the one hand, there is free parking on all public spaces
  in VOIRIE and the right to use the spaces reserved for holders of a mobility card
  mentioning "parking". On the other hand, there are the obligations of communities
  and managers of institutions receiving the public to create accessible reserved
  spaces. This dataset presents the location of regulated locations for persons holding
  the "Persons with Reduced Mobility" card.
