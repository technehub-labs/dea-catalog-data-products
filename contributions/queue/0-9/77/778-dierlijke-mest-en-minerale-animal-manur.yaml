name: Animal manure and minerals; production, transport and use by region
description: 'The table provides figures on the production, transport and use of livestock
  manure and the minerals nitrogen and phosphate contained therein by farms. The use
  of animal manure in the form of nitrogen and phosphate is compared with the placement
  space for both minerals. In the table, the data can be viewed for different regional
  levels including parts of the country, provinces and concentration areas. Significant
  margins of uncertainty should be taken into account when using both regionally and
  substantively detailed outcomes. With more aggregated use figures such as the mineral
  use per hectare per part of the country or the absolute mineral use per province
  or part of the country, the margins of error are smaller. Data available from:1994
  Status of figures: Figures are definitive at first publication, but new insights
  into calculation methods can give rise to recalculation of the time series. Changes
  as of 25 February 2025: Figures for 2023 have been added. New insights into manure
  transport to and from farms and new insights into gaseous nitrogen losses from stored
  manure led to changes in the figures on manure transport and manure use from 2010.
  When will there be new figures? In the second quarter of 2026, the figures for 2024
  are added.'
