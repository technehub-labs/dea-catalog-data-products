name: The Quarry Directory 2014 Ireland (ROI) ITM
description: The Quarry Directory shows the location of sand and gravel, crushed rock
  and dimension stone quarries in Ireland. A questionnaire was sent to all known active
  quarries and pits (around 1,700). A location map (Ordnance Survey Ireland (OSI)
  1:50,000 Discovery Series) was provided to verify the location. Mines were not included.
  There are currently only two active metal mines in Ireland, the Navan and Lisheen
  zinc-lead mines. Most questionnaires (for 22 counties) were sent out in the latter
  half of 2012 with the remainder being sent out in 2013. Some follow-up phone calls
  were made in late 2013 and mid-2014. Around 360 replies were received, for both
  active and inactive quarries and pits. This map is to the scale 1:50,000. This means
  it should be viewed at that scale. When printed at that scale 1cm on the map relates
  to a distance of 500m. It is a vector dataset. Vector data portray the world using
  points, lines, and polygons (areas). The data is shown as points. Points are coloured
  according to rock type. Each point holds information on the quarry name, address,
  contact details, operational status, operator details, product, output, processing,
  ancillary activities, rock type and market.
