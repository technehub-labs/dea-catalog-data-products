name: CHELSAch-highres-climatologies at high resolution
description: 'CHELSA is a mechanistic downscaling model that links large-scale atmospheric conditions
  with local topographic factors to produce very high-resolution climate data. It includes commonly used
  climate variables for impact modeling, such as air temperature, precipitation, humidity, solar radiation,
  wind speed, and derived variables. CHELSAch-highres-climatologies is a high resolution climate dataset
  generated with the CHELSA downscaling model. It consists of long term - 30 year mean aggregated surface
  variables. Climatological summaries are provided for: Near-Surface Wind Speed, Daily Mean Near-Surface
  Air Temperature, Daily Maximum Near-Surface Air Temperature, Daily Minimum Near-Surface Air Temperature.
  Air Temperature Lapse Rate, Total Cloud Cover Percentage, Precipitation, Surface Downwelling Shortwave
  Flux in Air Files are provided in NetCDF format with standardized metadata.'
