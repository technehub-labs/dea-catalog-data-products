name: REA 2018 - Executive Summary - State of Environment Report Portugal 2018
description: Executive Summary - State of Environment Report Portugal 2018 (REA 2018)
  Being published only five months after the last report, the 2018 edition will be
  predictable, containing only the indicators which data was possible to update since
  the last edition. Thus, 28 of the 51 indicators that are completely available in
  the State of the Environment Portal have been updated. The 2018 edition starts with
  the usual national socioeconomic framework and the main figures for economic and
  social indicators.
