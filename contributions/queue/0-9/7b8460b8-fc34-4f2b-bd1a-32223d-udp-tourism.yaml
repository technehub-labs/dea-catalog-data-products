name: UDP - Tourism intensity
description: 'Tourism intensity is calculated by dividing the number of nights spent at tourist accommodations
  by the resident population. It is an indicator of economic dependence on tourism, potentially revealing
  overtourism and vulnerability to demand shocks when values are very high. Very low values, on the other
  hand, signal low tourism activity, possibly due to low attractiveness of the destination or untapped
  potential to develop tourism. Tourism destinations with indicator values around the EU27 average are
  deemed less vulnerable. This indicator is part of the socio-economic pillar of the EU Tourism Dashboard.
  UNIT OF MEASURE: Nights spent per inhabitants. RESOLUTION: NUTS0, NUTS2, NUTS3. COMPLETENESS: 100%.
  METHODOLOGY: TThe indicator is obtained dividing the nights spent by the inhabitants. DATA SOURCES:
  Nights spent at tourist accommodation establishments by NUTS 2 regions (tour_occ_nin2) [ESTAT], Population
  on 1 January by age group, sex and NUTS 3 region (demo_r_pjangrp3) [ESTAT].'
