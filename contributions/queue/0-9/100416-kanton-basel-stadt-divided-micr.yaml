name: Divided micromobility by district and day
description: 'The dataset shows the distribution of vehicles from different micromobility
  providers in Basel-Stadt, broken down by district and by day. It contains various
  statistical indicators on the number of vehicles per district. The data takes into
  account characteristics such as vehicle type, design, drive type and range of the
  vehicle with a full battery. The calculation of the dataset is based on the data
  on the current availability [https://data.bs.ch/explore/dataset/100415/](https://data.bs.ch/explore/dataset/100415/),
  It is updated every 10 minutes. This means that there is maximum 24 × 6 = 144 Measurements
  per day for the calculation of the average. The following dataset is used for the
  districts: [https://data.bs.ch/explore/dataset/100039/](https://data.bs.ch/explore/dataset/100039/)[](https://data.bs.ch/explore/dataset/100039/)
  An overview of the datasets on shared micromobility can be found at the following
  link: [https://data.bs.ch/explore/?refine.tags=micromobility](https://data.bs.ch/explore/?refine.tags=micromobility)
  Note:The data contain a gap between 2 and 22 April 2025 because there was an interruption
  in the extraction of the data.'
