name: Energy consumption energy sector; energy commodities, 1967-2013 2nd quarter
description: 'This table shows the consumption of energy by companies in the energy sector. The energy
  sector according to the Standard Industrial Classification 2008 is made up of companies in: 06 Extraction
  of crude petroleum and gas, Coke-oven plants, 192 Manufacture of refined petroleum and 35 Electricity
  and gas supply. The consumption of energy is broken down by energy commodity, like for example petroleum
  products, natural gas and electricity. Data available: From 1967 (annual) and from 1999 (annual and
  quarterly) till 2013 second quarter. Status of the figures: All figures up to 2012 are definite. Figures
  of 2013 1st quarter and 2013 2nd quarter are provisional. Since this table has been stopped the figures
  will not made definite anymore. Changes as of 6 February 2014: None, this table has been stopped. When
  will new figures be published? No longer applicable.'
