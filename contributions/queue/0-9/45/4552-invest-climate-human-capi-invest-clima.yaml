name: Invest. climate;human capital, labour supply internat. comparison 1990-2011
description: 'In this table international comparisions are made of the current and
  the potential supply of labour and of the labour costs. The composition of the current
  supply of labour is represented by a breakdown of levels of education of working
  persons (primary, secondary and tertiary education). The level of education of the
  potential supply of labour is explained by the performance of students and the proportion
  of disabled persons. The level of education is an indicator for human capital employed
  to production. Labour costs are reflected in costs per hour and the unit labour
  costs. Note: Comparable definitions are used to compare the figures presented internationally.
  The definitions sometimes differ from definitions used by Statistics Netherlands.
  The figures in this table could differ from Dutch figures presented elsewhere on
  the website of Statistics Netherlands. Data available from 1990 up to 2011. Status
  of the figures: The external sources of these data frequently supply adjusted figures
  on preceding periods. These adjusted data are not considered as such in the table.
  Changes as of 22 December 2017: No, table is stopped. When will new figures be published?
  Not.'
