name: Divided micromobility by district, weekday section and month
description: 'The dataset shows the distribution of micromobility providers'' vehicles in Basel-Stadt,
  broken down by district, daily segments of three hours each weekday and month. The data takes into account
  characteristics such as vehicle type, design, drive type and range of the vehicle with a full battery.
  The calculation of the dataset is based on the data on the current availability [https://data.bs.ch/explore/dataset/100415/](https://data.bs.ch/explore/dataset/100415/),
  It is updated every 10 minutes. The following dataset is used for the districts: [https://data.bs.ch/explore/dataset/100039/](https://data.bs.ch/explore/dataset/100039/)
  An overview of the datasets on shared micromobility can be found at the following link: [https://data.bs.ch/explore/?refine.tags=micromobility](https://data.bs.ch/explore/?refine.tags=micromobility)
  Note:The data contain a gap between 2 and 22 April 2025 because there was an interruption in the extraction
  of the data.'
