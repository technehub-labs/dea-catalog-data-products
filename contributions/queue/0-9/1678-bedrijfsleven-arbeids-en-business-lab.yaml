description: 'This table provides data on the number of jobs of employed persons and number of employees,
  operating result, operating income and expenses, financial result, provisions balance and extraordinary
  result of a large number of industries and branches according to the Standard Statistics Netherlands
  (CBS) Business Classification 1993 (SBI''93). The data are taken from more detailed industry-specific
  tables (see paragraph 3) and make it possible to inter-branch compare. These are the following industries
  and branches. 0141 Hoveniers and agricultural services; 10 - 14 Mining and quarrying; 15 - 37 Industry
  (except 3663.1); 3663.1 Social employment services; 40 Production and distribution of electricity, natural
  gas, steam and hot water water; 41 Water abstraction and distribution; 45 Construction; 50 Trade in
  and repair of motor vehicles and motorcycles; service stations; 51 Wholesale trade and commercial intermediation;
  52 Retail trade and repair for the benefit of individuals; 55 Hospitality; 60 - 64 Transport, storage
  and communication; 71 Rental of transport equipment, machinery and equipment without service personnel
  and other movable property; 72 Computer service and information technology agencies and the like; 73
  Research and development; 74 Other business services; 90 Environmental services; 93 Other services.
