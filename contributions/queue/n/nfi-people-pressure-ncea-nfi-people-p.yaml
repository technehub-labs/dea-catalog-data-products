name: NFI+ People Pressure NCEA
description: 'Point count data were collected from a sub-sample of National Forest
  Inventory (NFI) sample squares to record counts of individuals accessing woodland
  sites. Data were collected from 87 sites across England between April 2024 and March
  2026. Sites were selected to reflect a representative distribution of woodland type
  and proportional woodland cover across English regions. However, as the data form
  part of an ongoing multi‑year survey, site coverage may be uneven where locations
  were relocated or removed due to changes in access permissions or equipment failure
  or loss. Counts were recorded using Pyro‑Evo Eco‑counters, which detect body heat
  via infra‑red sensors. One device per site was installed within line of sight of
  a path or access point within each sample square. Devices were deployed between
  April and July 2024 and recorded hourly counts continuously until 31 March 2026.
  Several limitations should be noted. The counters do not allow individual identification,
  so repeated visits by the same individual cannot be distinguished. Options for validating
  extreme count values are limited, beyond inspection of obvious outliers. Some recorded
  counts may reflect wildlife activity; as this cannot be reliably distinguished within
  the data, nighttime counts (22:00–05:00), when such activity is most likely, have
  been excluded from the dataset. The ''NFI+ People Pressure NCEA’ is a project funded
  by the UK Government through Defra’s Natural Capital and Ecosystem Assessment programme
  (NCEA). Users should ensure they have read the supporting documentation before viewing
  or making use of the data. This includes the NCEA Analysis Ready Data Limitations
  Statement and dataset specific limitations/caveats outlined in the supporting documentation.
  Attribution statement: © Forestry Commission copyright and/or database right 2026.
  All rights reserved.'
