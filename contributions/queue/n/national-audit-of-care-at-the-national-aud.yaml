name: 'National Audit of Care at the End of Life: Mental Health Spotlight Audit 2025'
description: The National Audit of Care at the End of Life is a national comparative
  audit of the quality and outcomes of care experienced by the dying person (18+)
  and those important to them during the last admission leading to death in England,
  Wales and Jersey. The Mental Health Spotlight Audit focusses on care delivered within
  mental health inpatient facilities. The reported data covers the 12-month period
  from January to December 2025.
