name: 'Zurich Overnight Visitor Logs ("Nachtzedel") 1780-1792: Extracted Data'
description: 'This dataset contains structured, machine-readable extractions from the "Zürcher Nachtzedel"
  (Zurich Overnight Visitor Logs) covering the years 1780 to 1792. While the primary dataset ["Zurich
  Overnight Visitor Logs (Nachtzedel) 1780 - 1792: Digitized Copies"](https://opendata.swiss/en/dataset/zurcher-nachtzedel)
  contains scanned raster images of 18th-century hotel guest lists, this secondary dataset reorganizes
  the records from approximately 3,200 documents into a structured format, including key guest attributes
  (e.g., names, origins, professions), high quality transcriptions, and georeferenced coordinates for
  the locations mentioned in the sources. A large language model (LLM) workflow was used to transform
  semi-structured historical prints into a validated JSON/CSV corpus suitable for quantitative historical
  analysis and Digital Humanities research. The primary dataset containing the scanned documents is available
  on Zenodo: [Zurich Overnight Visitor Logs (Nachtzedel) 1780 - 1792: Digitized Copies](https://doi.org/10.5281/zenodo.14132981).'
