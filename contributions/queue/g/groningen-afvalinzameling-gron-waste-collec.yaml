name: Waste collection Groningen and Ten Boer
description: The municipality of Groningen wants to investigate whether and how more
  waste can be separated and reused. Research and Statistics Groningen has prepared
  an online survey for this purpose. In the survey we asked questions about how and
  whether residents of Groningen and Ten Boer currently separate waste and what they
  think of waste collection. We also presented a number of future scenarios to the
  respondents. A number of open questions have been asked, and many opportunities
  have been given to provide explanations.
