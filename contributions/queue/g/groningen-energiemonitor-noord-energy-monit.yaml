name: Energy monitor Northern Netherlands
description: 'The 4th edition of the Energy Monitor Northern Netherlands provides facts & figures from
  2013 about the energy sector in the Energy Valley region: Drenthe, Fryslân, Groningen and Noord-Holland
  Noord. The monitor was commissioned by the Energy Valley Foundation and the northern provinces to make
  the regional energy developments visible. This 4th edition of the Energy Monitor Northern Netherlands
  has been designed in such a way that it can also be used to make the progress of the implementation
  of the Northern Energy Agenda SWITCH transparent.'
