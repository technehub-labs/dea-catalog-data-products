name: Monitor cleaning
description: The annual reports provide an explanation of the results of the Department
  of Cleaning over the years. In doing so, as much as possible is connected to the
  annual accounts, the business plan, the environmental policy plan and the environment!
  and quality management system of the Cleaning. The annual reports can be seen as
  a monitor that pays attention to collected quantities of waste, waste separation,
  the quality of public space, various policies, working conditions and financial
  data.
