name: Specific areas on which to apply water protection measures against pollution
  by plant protection products
description: 'The Legislative Decree 150/2012, which transposes Directive 2009/128/EC
  on the sustainable use of plant protection products, provides, in Article 15, for
  the possibility of identifying specific areas on which to apply protection measures.
  By DCR 258-25537 of 22 December 2022, Regione Piemonte designated the new Specific
  Areas and identified measures for the mitigation of diffuse and punctual pollution
  from plant protection products. The new Specific Areas are identified on the basis
  of the classes of vulneration (representative of the level of contamination by pesticides)
  of the Ground Water Bodies (GWB), defined within the Water Framework Directive.Attributes
  associated with the discharge data (dbf):GWBREGCOD: Regional identification code
  of the groundwater body (Ground Water Bodies, GWB)AREA: Area in m2PERIMETER: Perimeter
  in MIV: Vulneration index of the water body (vulneration classes: HIGH/MEDIUM/LOW)'
