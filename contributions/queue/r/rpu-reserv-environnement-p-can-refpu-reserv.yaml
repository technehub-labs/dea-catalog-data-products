name: REFPU Reservation Environment (point)
description: 'The urban project repository (RefPU) is the digital version of the allocation plans produced
  by the competent planning authority of the canton of Geneva. For now, only localized neighborhood plans
  (PLQ) are published in this repository. In the long term, the zone modifications (MZ) as well as the
  master plans of industrial zones (PDZI), but also the site plans (PS) produced by the heritage and sites
  office, could also be published there. The RefPU theme makes it possible to consult all the geographical
  and alphanumeric data contained in a PLQ and to compare them with other territorial data from other
  public policies or reference data (municipal boundaries, cadastre, level curves, etc.). The QLPs published
  on this subject are the subject of a public consultation, in accordance with the legal requirements
  in force. The data contained therein are made available to the partners of the SITG and can be consulted
  on this counter. Nevertheless, apart from the scope of validity of an adopted plan that has binding
  legal value, the other geographical and alphanumeric data made available, do not create any other right
  or obligation than those arising from texts and documents legally put into procedure, adopted and published.
  In the first place, the RefPU makes it possible to georeference each plan, and by extension, each of
  the constituent elements of the plan. It also offers a standardized graphical representation uniqueness
  for all localized neighborhood plans thanks to a standardized graphical chart and geomatic data model.
  The RefPU theme also offers the possibility to simultaneously represent in a digital map all the digitized
  PLQs throughout the Geneva territory. Great advantage over the paper or pdf format, the digital counter
  allows to query the value of each data contained in a layer of the model. Note: Just like on a plan
  in paper or pdf format, digital QLPs consist of a separate layout plan and equipment plan. The two plans
  can be consulted separately.'
