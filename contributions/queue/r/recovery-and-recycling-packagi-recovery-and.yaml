name: Recovery and Recycling Packaging Summary
description: 'This record is Approved for Access product AfA360. The Recovery and Recycling Packaging
  Summary provides information/data on recycling & recovery by each quarter. Figures in this product are
  for voluntary returns. Although most operators will work within the system owing to the commercial value
  of claiming credits there is no obligation to do so. These figures therefore may legitimately not reflect
  the total amount of wastes processed/treated. Information on non-reporters (by the deadline) is shown.
  Any subsequent updates (quarterly) will contain both late returns and any amendments to other returns
  (which are commonplace). ePRN means electronic packaging waste recovery notes (ePERN for exports). Attribution
  statement: © Environment Agency copyright and/or database right 2019. All rights reserved.'
