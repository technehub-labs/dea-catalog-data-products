name: Protected Areas - Parks and Reserves (areas)
description: The stratum represents the zoning of National and Regional Parks, Regional Nature Reserves
  and State Reserves, when the latter do not fall within already mapped Parks. The National Parks are
  represented only for the area falling within the territory of the Emilia-Romagna Region. The delimitation
  of the protected areas is defined at the time of the establishment of the Parks and Reserves and, for
  the Parks, it can be subsequently perfected or expanded during the drafting of the relevant Territorial
  Plans (TPPs). This information layer represents the zoning of the protected area as defined in the document
  corresponding to the most advanced stage of the territorial planning process of each individual protected
  area. The polygons, depending on the stage of the process, can refer to the maps defined in the Institutional
  Laws, adopted PTPs, approved PTPs, adopted PTP Variants, approved PTP Variants. For this reason, the
  database provides information on the reference planning act and the date of the same.Please note that
  until the planning process has reached a final outcome (= approval), not only the last acts but also
  any more restrictive rules defined in previous acts have value.
