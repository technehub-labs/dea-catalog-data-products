name: Regional interventions for social rental housing (energy improvement - operation aid) - 2010 to
  2014
description: 'Assignments of programme authorisations voted in the Standing Committee in favour of social
  rental housing (investment grant for the operation). This game concerns actions to improve energy performance,
  as part of the fight against energy and social poverty. Attention: geolocation is sometimes imprecise.
  **Details**: * The names of some beneficiaries have changed over time and the entries are not always
  the same even if, in the end, they are the same operator. * The data relate to assignments of PAs (Programme
  Authorisations) and do not presuppose the payment of PAs (Payment Appropriations) which fall under the
  application of the RBF (Budgetary and Financial Regulation) and the data transmitted by each beneficiary.
  * Some appellations are specific to the Region (MORE diversity, renewal, increase, etc.)'
