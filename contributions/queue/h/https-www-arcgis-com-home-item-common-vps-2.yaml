name: Common VPS 2024
description: 'Zoomable map of the perimeters of the priority districts of the 2024
  city policy and the addresses included in these perimeters. The list of these addresses
  can be downloaded in .csv format. The first generation of priority districts in
  force from January 1, 2015 to December 31, 2023 was defined by Decree No. 2014-1750
  of December 30, 2014 for the metropolis. To adapt to the evolution of the territories,
  an update of the priority geography was carried out in the spirit of the programming
  law for the city and urban cohesion of 2014. A new generation of priority neighbourhoods
  entered into force on 1 January 2024 for metropolitan France by Decree No 2023-1314
  of 28 December 2023. For the districts of metropolitan France the work was conducted
  in 2023 by the prefectures of department, with a local consultation, relying on
  the ANCT and the provision of data by INSEE. The new numbering of QP 2024 follows
  the format ‘QNXXXYYZ’ where: * XX = department code, YY = serial number and Z is
  a letter. * N = new PQ, entering priority geography in 2024 * M = pre-existing QP
  in 2015 with modified outline in priority geography in 2024 (possible merger or
  split of QP 2015) * I = pre-existing QP in 2015 with contour very similar to that
  of 2015 Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/a5d910397133444b926d087a1c5589ba/data)
  Additional resources * Sig.ville.gouv website: [https://sig.ville.gouv.fr/Atlas/QP_2024/files/NORM_dept76.zip](https://sig.ville.gouv.fr/Atlas/QP_2024/files/NORM_dept76.zip),
  <https://sig.ville.gouv.fr/> and <https://sig.ville.gouv.fr/territory/2876> This
  site, run by the Ministry for the Ecological Transition and Territorial Cohesion,
  the National Agency for Territorial Cohesion (ANCT), the National Observatory for
  City Policy and the Territorial Observatory, offers a QPV atlas that allows you
  to download all the individual QPV maps of the Seine-Maritime. The same site offers,
  on the homepage, a search engine tha'
