name: Points de Departs itineraires PDESI CD76 december 2023
description: 'Starting points of the routes included in the Departmental Plan of Spaces, Sites and Itineraries
  (PDESI) relating to Nature Sports (see glossary in metadata) of the Seine-Maritime in December 2023.
  At that date, 259 starting points of itineraries were registered in the PDESI of Seine-Maritime, some
  being used for several itineraries, against 144 in 2019. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/f00ac5e5b9104742ad6fb6910d37c3e3/data)
  Additional resources * Site of the National Resource Centre for Nature Sports: <https://www.sportsdenature.gouv.fr//publications/tools-mobilisables-pour-perenniser-acces-places-de-pratique/pdesi>
  This Site of the Ministry of Sports offers information relating to the Departmental Plans of Spaces,
  Sites and Itineraries (PDESI) and the Departmental Commissions of Spaces, Sites and Itineraries (CDESI).
  * seinemaritime.fr website: <https://www.seinemaritime.fr/guide-des-aides/my-cadre-de-vie/aides-aux-communes/guide-des-aides/sport-1/les-loisirs-sportifs-de-nature.html>
  The site of the Department of Seine-Maritime offers a page dedicated to aids to sports recreation of
  nature registered in the PDESI. * Suricate website: <https://sentinelles.sportsdenature.fr/> This site
  makes it possible to report a problem (marking, security, conflicts of use, environment) on a space,
  site or route, accompanied by its geolocation and a photo. * Seine-maritime-tourism site: <https://www.seine-maritime-tourisme.com/en/je-choisis/une-balade/index.php>
  You will find on this site of Seine-Maritime Attractiveness, individual sheets and GPS tracks of hiking
  routes registered in the PDESI.'
