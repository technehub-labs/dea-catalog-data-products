name: Location of the Natural Environments of Ecological Interest (MNIE) in the Pays de Rennes in 2022
description: 'The inventory of Natural Environments of Ecological Interest (MNIE) was launched at the
  instigation of the elected representatives of the District of Rennes in the 1990s. This voluntary approach
  by elected representatives to improve the consideration of biodiversity at the level of their territory
  has made it possible to significantly enrich the knowledge and distribution of the natural environments
  of the territory. The elected representatives of the SCoT decided to extend this inventory to the entire
  territory of the Pays de Rennes. The SCoT has established strict protection of these environments. Since
  its approval, they have become regulatoryly inconstructible. A single document, the ‘Atlas des MNIE
  du Pays de Rennes’, locates all the sites identified on the territory of the Pays de Rennes. The Syndicat
  mixte du SCoT is now the structure that manages the MNIE file. This atlas refers, inter alia, to: \-
  Large natural areas (GEN), areas without regulatory scope; \- Natural habitats of ecological interest
  (MNIE), areas strictly protected by the SCOT, This gives them a regulatory scope. This layer locates
  the Natural Environments of Ecological Interest (MNIE). MNIE stands for ‘Natural Environments of Ecological
  Interest’. These are sites consisting of one or more natural habitats and having a marked interest in
  fauna and/or flora. An MNIE is smaller in area than a GEN, in which it is very often included. It should
  be noted, however, that some MNIEs may be isolated in an unmarked space outside a GEN. These MNIE are
  areas strictly protected by the ScoT, which gives them a regulatory scope. MNIEs are environments to
  be preserved and highlighted as an element contributing to the maintenance of local biodiversity. The
  inventories, carried out regularly on the Pays de Rennes, make it possible to update the knowledge on
  MNIE. The perimeters of the MNIE are based in the Atlas of the MNIE of the Pays de Rennes to which the
  urban planning documents refer to define the regulat'
