name: emi occitanie region sectorise 2012
description: 'Estimated total annual emissions of major air pollutants (SO2, NO2-equivalent NOx, PM10,
  PM2.5, Benzene C6H6, Non-methane Volatile Organic Compounds NMVOC, Ammonia NH3, carbon monoxide CO,
  Arsenic As, Cadmium Cd, Nickel Ni, Lead Pb, Bap, GES, over the Occitania region. Units are indicated
  in the name of the column (_kg for “Kilogram” , _t for “Tonne”, _teqco2 for “Tonne Equivalent CO2”).
  The number of decimal places varies depending on the pollutant. **Genealogy in the Inspire sense**:
  The emission values of air pollutants have been calculated in accordance with the methodological guide
  for the development of territorial air emission inventories carried out by the National Coordination
  Pole on Territorial Emission Inventories (PCIT) and the French OMINEA benchmark developed by CITEPA.
  The industry classification is SECTEN (Economic and Energy Sectorization) level 1. WFS flows: [https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/emi_occitanie_region_sectorise/WFSServer?service=wfs&request=getcapabilities](https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/emi_occitanie_region_sectorise/WFSServer?service=wfs&request=getcapabilities)
  Metadata sheet: [https://www.picto-occitanie.fr/geonetwork/srv/fre/catalog.search#/metadata/e95bffb8-c3f0-4e1a-a267-1b3ed025536a](https://www.picto-occitanie.fr/geonetwork/srv/fre/catalog.search#/metadata/e95bffb8-c3f0-4e1a-a267-1b3ed025536a)'
