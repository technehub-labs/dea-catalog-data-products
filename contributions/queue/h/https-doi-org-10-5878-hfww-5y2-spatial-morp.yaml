name: Spatial Morphology Lab 01. International laboratory for comparative research in urban form. Street
  networks, Sweden - Non-Motorised network of Stockholm
description: 'GIS-datasets for the Street networks of Stockholm, Gothenburg and Eskilstuna produced as
  part of the Spatial Morphology Lab (SMoL). The goal of the SMoL project is to develop a strong theory
  and methodology for urban planning & design research with an analytical approach. Three frequently recurring
  variables of spatial urban form are studied that together quite well capture and describe the central
  characteristics and qualities of the built environment: density, diversity and proximity. The first
  measure describes how intensive a place can be used depending on how much built up area is found there.
  The second measure captures how differentiated the use of a place can be depending on the division in
  smaller units such as plots. The third measure describes how accessible a place is depending on how
  it relates with other places. Empirical studies have shown strong links between these metrics and people''s
  use of cities such as pedestrian movement patterns. To support this goal, a central objective of the
  project is the establishment of an international platform of GIS data models for comparative studies
  in spatial urban form comprising three European capitals: London in the UK, Amsterdam in the Netherlands
  and Stockholm in Sweden, as well as two additional Swedish cities of smaller size than Stockholm: Gothenburg
  and Eskilstuna. The result of the project is a GIS database for the five cities covering the three basic
  layers of urban form: street network (motorised and non-motorised), buildings and plots systems. The
  data is shared via SND to create a research infrastructure that is open to new study initiatives. The
  datasets for Amsterdam will also be uploaded to SND. The datasets of London cannot be uploaded because
  of licensing restrictions. The street network GIS-maps include motorised and non-motorised networks.
  The non-motorized networks include all streets and paths that are accessible for people walking or cycling,
  including those that are shared with vehicles. Al'
