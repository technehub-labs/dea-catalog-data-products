description: 'This file is an extraction of the national address database (BAN), administered
  by the Interministerial Directorate for Digital Affairs (DINUM), a department of
  the Prime Minister under the authority of the Ministry of Transformation and the
  Public Service. It allows you to visualize the streets and numbers of the streets
  of Métropole Rouen Normandie. Metadata [Link to Metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/50bf864be23949c8860d532197d3e93a/data)
  Resources Website of the national address database: <https://address.data.gouv.fr/>
  The national address site refers to all the addresses of the territory and make
  them usable for all. It is possible to download, in .csv format, the addresses of
  the whole of France or each department.'
