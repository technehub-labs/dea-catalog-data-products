name: Interactive scoreboard Municipal bases of the main indicators of crimes and
  offences recorded by the national police and gendarmerie – 01/03/2022
description: 'In order to promote the openness of data on delinquency and insecurity,
  the Ministry of Internal Security Statistics Service (SSMSI, Department of the Ministry
  of the Interior) has made available two annual databases on the main indicators
  of crimes and crimes recorded by the national police and gendarmerie, since 2016
  at the municipal level depending on the place of commission. These databases are
  intended to be enriched as other indicators are trusted (scams, destruction/voluntary
  degradation, infringements of drug legislation, etc.). Two elements must be taken
  into account when interpreting the level of indicators: * the time limit for registration,
  which may create a time lag between the time the infringements occurred and the
  time when they are accounted for; * the complaint filing rate has an impact on the
  level of crime recorded. Environment and Safety Investigations are used to assess
  complaint rates. For example, according to these surveys on average over the period
  2011-2018, only 12 % of victims of sexual violence outside the household file complaints,
  compared with 74 % for victims of burglaries. In addition, it should be noted that
  municipal data are not reported for the low values of recorded delinquency, both
  for reasons of interpretability of these data and respect for statistical confidentiality.
  Thus, when fewer than 6 crimes or offences are committed in a commune (number assessed
  by class of facts), they are published only if the situation persists for 3 years.
  The same applies to the absence of recorded facts (noted 0), which is disseminated
  only when the situation recurs over three successive years. Given the non-distribution
  of these highly volatile and sometimes geographically imprecise data, the share
  of delinquency events disseminated at the municipal level varies, depending on the
  indicator, between 59 % (for theft with arms) and 94 % (for theft without violence
  against persons) in 2021. 11 indicators are published, corresponding to the agg'
