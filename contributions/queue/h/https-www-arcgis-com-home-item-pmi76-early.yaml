name: PMI76 Early Childhood Activity in CMS 2018a2023 dec2024
description: 'This file presents the early childhood activities carried out in CMS
  by the Maternal and Infant Protection (PMI) of the Departmental Council of Seine-Maritime,
  by Territorial Unit of Social Action (UTAS) and by year, from 2018 to 2023. It should
  be noted that activity in 2020 and, to a lesser extent, 2021 was impacted by successive
  COVID lockdowns. In addition, the 2022 data collection was impacted by the IT attack
  on the Department in October 2022 (hence many "undetermined" (ND) mentions). Data
  on early childhood activity in CMS include: 1/2 days of child care consultations,
  child care consultations, the number of children seen at least once by the nurse
  (during child care and/or medical consultations), 1/2 days of parent-child care,
  the number of children seen during parent-child care, 1/2 days of PMI medical consultations
  (infants), PMI medical consultations (infants)*, the number of children seen at
  least once by the doctor during PMI medical consultations), _* Previously titled
  “Children seen in PMI medical consultations” _ The data are visualised by Territorial
  Social Action Units (UTAS). UTAS are areas for the implementation of departmental
  social action. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/0951c8db3e1644a59c01c01885d440e6/data)
  Additional resources * Website of the Ministry of Solidarity and Health: <https://solidarites-sante.gouv.fr/prevention-en-sante/sante-des-populations/children/article/screening-and-prevention-à-l-enfant>
  This page of the Ministry’s official website offers numerous documents, downloadable
  in pdf format, relating to screening and prevention in children. * Professional
  website vaccination info service: [https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale](https://professionals.vaccination-info-service.fr/Aspects-scientifiques/Epidemiologie/Donnees-de-couverture-vaccinale)
