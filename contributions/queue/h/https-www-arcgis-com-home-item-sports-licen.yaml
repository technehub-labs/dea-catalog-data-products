name: Sports licenses by federation and municipality of Seine-Maritime in 2018
description: 'This dashboard allows to dynamically visualise the information relating
  to holders of a sports license in Seine-Maritime: list of federations, number of
  licensees per federation, by municipality and sex, location of licensees by federation,
  number of sports licence holders per municipality and sex. This data, geolocated
  to the municipality, comes from the census of licences and clubs among sports federations
  approved by the Ministry in charge of sports. It is a census at the place of habitation
  of the person and not at the place of practice. Data are not available for all federations.
  A number of them did not have fully geo-localizable data in the municipality allowing
  for exhaustive exploitation.For example, FF data for canoe-kayak (1125 licensed
  in Seine-Maritime in 2019), fencing (970 licensed in Seine-Maritime in 2019), etc.
  Metadata Link to metadata: [first](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/f63aa2fb9dcb4c81bcd0c19218fc4fcf/data)
  and [second](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/82817495e5ae47c0b006cf9565f32761/data)
  source Additional resources * Website of the National Institute of Youth and Popular
  Education: [https://injep.fr/wp-content/uploads/2021/03/licences-par-departement-2019.xlsx](https://injep.fr/wp-content/uploads/2021/03/licences-par-departement-2019.xlsx)
  This INJEP website, which is a nationally competent service of the Ministry of National
  Education, Youth and Sports, offers a lot of data related to sport, including licenses
  by Department in 2019 * Website of the Ministry of Sports: <https://www.sports.gouv.fr/organisation/publications/statistiques/chiffres-cles/>(https://www.sports.gouv.fr/organisation/publications/statistiques/chiffres-cles/)
  The Ministry’s website offers various publications or downloadable data (key figures,
  detailed data since 2000) and information on the methodology of the census of sports
  licences and clubs. * INSEE website: [https://www.insee.fr/fr/statistiques'
