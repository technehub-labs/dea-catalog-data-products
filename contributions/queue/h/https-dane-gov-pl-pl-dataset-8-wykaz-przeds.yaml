name: Wykaz przedsiębiorców wykonujących działalność gospodarczą w zakresie transportowania
  paliw
description: <p>Wykaz przedsiębiorców wykonujących działalność gospodarczą w zakresie
  transportowania paliw - stan na 19 stycznia 2018 r. - zgodnie z art. 12 ust. 2 pkt
  1-3 ustawy z dnia 25 sierpnia 2006 r. o systemie monitorowania i kontrolowania jakości
  paliw (Dz. U. z 2016, poz. 1928) Prezes UOKiK, jako Zarządzający systemem, prowadzi
  wykazy przedsiębiorców wykonujących działalność gospodarczą w zakresie wytwarzania,
  transportowania oraz magazynowania paliw, stacji paliwowych oraz stacji zakładowych,
  hurtowni paliw, przedsiębiorców wykonujących działalność gospodarczą w zakresie
  obrotu paliwami stałymi, właścicieli i użytkowników wybranych flot oraz rolników
  wytwarzających biopaliwa ciekłe na własny użytek.</p>
