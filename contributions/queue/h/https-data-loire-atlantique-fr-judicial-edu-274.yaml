name: Judicial educational aids – Educational action in an open environment in Loire-Atlantique by municipality
description: 'Number of Children’s Welfare Children for whom an Open Educational Action Measure (AEMO)
  has been issued, per municipality since 2008. * * * * Educational assistance in an open environment
  is given by the children’s judge and is intended to entrust to a qualified person or a service the task
  of providing assistance and advice to the family, in order to overcome its difficulties while keeping
  the minor in his current environment. It is aimed at any family facing difficulties in the upbringing
  of its children. Statistical confidentiality shall be applied: not all information between 1 and 4 included
  is disseminated. They correspond to uninformed cells.'
