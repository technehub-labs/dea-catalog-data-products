name: RSA76 Family Comp Homes benef 2016a21
description: 'Composition of households receiving the Active Solidarity Income (RSA all schemes, i.e.
  general scheme + agricultural scheme), by family composition and per year, in Seine-Maritime from 31/12/2016
  to 31/12/2021. This dataset is derived from data from the Caisse d’Allocations Familiales (CAF). Metadata
  [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/aa39d6e7e40047659a7e98439d4fec76/data)
  Additional resources * Data-caf site ([see link in metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/aa39d6e7e40047659a7e98439d4fec76/data))
  The CAF open data site offers a page on RSA data at the national, departmental, inter-communal and municipal
  levels. This data can be downloaded in csv. format. * Website Public Service: [https://www.service-public.fr/particuliers/vosdroits/N19775](https://www.service-public.fr/particuliers/vosdroits/N19775)
  The official website of the French administration offers a page dedicated to Active Solidarity Income
  (RSA), including, in addition to general information on the conditions of access to the RSA, forms to
  be downloaded, simulators and related teleservices * Website Data DREES: _<HTTPS://DATA.DREES.SOLIDARITES-SANTE.GOUV.FR/’_
  DREES (Directorate of Research, Studies, Evaluation and Statistics) is a directorate of the central
  administration of the health and social ministries. Its open data site offers several datasets relating
  to the RSA and in particular departmental data on recipients of the RSA from January 2017 to December
  2021 (“Monthly data on solidarity benefits”), downloadable in xlsx format.'
