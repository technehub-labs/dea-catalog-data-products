name: Meadow and pasture inventories habitat types
description: In the map layer Meadow and pastureland inventory, only the fully inventoried
  soils are included. In this layer, the inventoried soils are decomposed so that
  each habitat type, according to Natura 2000 definitions, has its own area. Sweden's
  meadows and pastures have been surveyed. This means that 300 000 hectares of land
  were surveyed between 2002 and 2004. This is to see where the land is located and
  what special natural values and cultural remains are there, such as special plants
  or old buildings. The inventory showed that there are 270 000 hectares of valuable
  land in Sweden. 7 000 hectares of them are meadows and 229 000 are pastures. The
  rest needs to be restored to preserve its quality. The Rural Development Programme
  (2007-2013) continues to take stock. The inventory is used to make evaluations and
  follow-ups of environmental payments and other measures for the natural and cultural
  environment. The data can be used as a basis for advice, community planning and
  research. The results of the inventory are available in the TUVA database. It is
  also available on the Swedish Board of Agriculture’s website. From the inventory
  there are two map layers. One contains all the land visited during the survey (pastures
  and pastures). The second layer (nature type surfaces) contains the fully inventoried
  soils. In this layer, the inventoried soils are decomposed so that each habitat
  type has its own area, according to the Natura 2000 definition.
