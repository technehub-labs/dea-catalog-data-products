description: <p><strong>API Statystyki NFZ – Świadczenia</strong></p> <p>API Statystyki NFZ – Świadczenia
  to usługa sieciowa świadczona przez Narodowy Fundusz Zdrowia udostępniania zbioru danych z obszaru statystyk
  świadczeń opieki zdrowotnej w wymiarze ogólnym, rozliczeniowym i medycznym, które dotyczą produktów
  z katalogu:</p> <ul> <li>JGP,</li> <li>Świadczenia odrębne,</li> <li>Świadczenia do sumowania,</li>
  <li>Świadczenia radioterapii,</li> <li>Świadczenia wysokospecjalistyczne.</li> </ul> <p>Dane udostępniane
  są poprzez REST-owe API w formacie JSON lub XML.</p> <p>Więcej informacji na stronie <a href="https://api.nfz.gov.pl/app-stat-api-jgp/">NFZ</a>.</p>
