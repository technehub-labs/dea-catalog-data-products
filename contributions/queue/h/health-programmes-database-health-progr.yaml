name: Health Programmes Data Base
description: The European Union funds projects to improve public health, to prevent
  illness, and to eliminate threats to physical and mental health in European countries.
  To date, approximately 820 projects and actions, in conjunction with 7249 organisations
  across Europe, have been funded by its three multiannual health programmes. This
  database provides information on the nature of projects and their results. It is
  managed by the European Commission's Consumers, Health, Agriculture and Food Executive
  Agency (Chafea). Different formats (RSS, XML, XLS) are downloadable from the landing
  page.
