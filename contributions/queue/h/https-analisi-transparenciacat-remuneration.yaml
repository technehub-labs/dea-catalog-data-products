name: Remuneration of veterinary staff in agriculture, animal husbandry, and fisheries
description: Retribucions, des de l’any 2007 fins a l’actualitat, del personal del
  cos de titulació superior, veterinària, en aplicació de l’Acord de Govern d’1 de
  desembre de 1998 i l’Acord de la Mesa Sectorial de Negociació PAT de 7 de juliol
  de 2003. Es presenten les dades de modificacions anuals, categoria, grup, nivell,
  sou base, complement de destinació, complement específic, sou total mensual, sou
  total anual, import del sou d’una paga extraordinària, import mensual d’un trienni
  i import d’un trienni d’una paga extraordinària.
