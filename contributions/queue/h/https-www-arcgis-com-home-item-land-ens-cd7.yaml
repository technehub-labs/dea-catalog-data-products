name: Land ENS CD76 20230101
description: 'Scopes of cadastral plots properties of the Seine-Maritime Department
  under the ENS and related data (associated ENS, cadastral data, date of acquisition)
  as of 1 January 2023. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/7f93516b4d2745fbb8046e7ec28ead89/data)
  Additional resources * Website of the Assembly of Departments of France This site
  offers a brochure, downloadable in pdf format, on the theme "[Sensitive Natural
  Spaces: A Departmental Policy for Nature and Landscapes](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/eb0c6b459bf64f05b142720634820398/data)”.
  This document provides information on the nature and objectives of the ENS as well
  as the tools to support this policy and its articulation with other networks of
  protected areas. * Website of the Seine-Maritime Department: The page “[Sorties
  Nature](https://www.seinemaritime.fr/mes-activites/sorties-nature/visites-ens.html)”
  of the official website of the Department of the Seine-Maritime presents the animations
  of visits of the ENS. The program of visits is downloadable in pdf format and booking
  is possible on this same page. On the same site, it is possible to download the
  [Climate Plan Presentation Brochure](https://www.seinemaritime.fr/docs/Plan%20Climat%2076.pdf).
  This document presents the “road map” adopted by the Seine-Maritime Department to
  address climate change. The SNEs are an integral part of this plan.'
