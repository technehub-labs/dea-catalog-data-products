name: Domarringens school kitchen Uppsala - power and energy readings 2020-2022
description: Measurement data for instantaneous effect and energy use at Tiunda school in Uppsala. The
  measurement takes place on incoming lines in the school's switchgear. The school has about 1000 students
  and a central kitchen which produces about 2200 portions of food a day and also provides other schools
  and preschools and nursing homes with food. The service to the school kitchen is at 250 A (amperes).
