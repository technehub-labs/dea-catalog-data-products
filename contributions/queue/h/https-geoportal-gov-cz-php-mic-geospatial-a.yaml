description: Since 2019 is necessary to declare and draw crops in the Farmer's block. Suma of crops declared
  area must corresponded to area of Farmer's block. Farmers with exception of diversification crops (arable
  land under 10 ha or ecological farming) do not have to declare the crops. This dataset is created in
  accordance with Regulation (EU) 2116/22021 of the European Parliament and of the Council and in accordance
  with Act 252/1997 Coll. on Agriculture.
