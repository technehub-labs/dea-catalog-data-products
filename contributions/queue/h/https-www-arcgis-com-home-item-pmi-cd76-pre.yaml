name: PMI CD76 Prenatal activities 2018a2020 20210830
description: 'This file provides information on prenatal activities within the framework
  of Maternal and Infant Protection of the Seine-Maritime Department, by UTAS, in
  2018, 2019 and 2020: number of prenatal consultations, number of women seen in prenatal
  consultations, number of days of preparation for birth, etc. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/b18cce311f1e4653abebe84907373968/data)
  Additional resources * Website statistics-locales.insee.fr: [https://statistiques-locales.insee.fr/#c=report&chapter=compar&report=r01&selgeo1=dep.76&selgeo2=com_courant.76540](https://statistiques-locales.insee.fr/#c=report&chapter=compar&report=r01&selgeo1=dep.76&selgeo2=com_courant.76540)
  This INSEE website makes it easy to compare national and/or local data. Here, a
  comparison is proposed between births in Seine-Maritime and births in Rouen in 2019,
  but users can choose to display any type of comparison between regions, departments,
  inter-municipalities and/or municipalities. The site also allows visualizations,
  such as births by municipality (at the mother’s home) in 2019 in the Department:
  [https://statistiques-locales.insee.fr/#bbox=-59656,6476252,325699,176130&c=indicator&i=ec_evol.naisdnn&s=2019&view=map1](https://statistiques-locales.insee.fr/#bbox=-59656,6476252,325699,176130&c=indicator&i=ec_evol.naisdnn&s=2019&view=map1).
  The data consulted can be downloaded in xls or csv formats. * Website data.gouv.fr:
  [https://www.data.gouv.fr/en/datasets/la-situation-perinatale-en-france-en-2010-premiers-results-de-l-enquete-nationale-perinat-30378542/](https://www.data.gouv.fr/en/datasets/la-situation-perinatale-en-france-en-2010-premiers-results-de-l-enquete-nationale-perinat-30378542/)
  The open platform of public data of the French State proposes in particular a file
  of the Ministry of Health and Solidarity on the perinatal situation in France in
  2010 which provides (tab 2) elements on the frequency of antenatal visits in 2010
  and dur'
