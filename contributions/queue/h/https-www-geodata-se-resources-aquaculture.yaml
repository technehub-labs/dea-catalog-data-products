name: Aquaculture installations
description: Aquaculture installations The Aquaculture Directive (Council Directive
  2006/88/EC on animal health requirements for aquaculture animals and products thereof,
  and on the prevention and control of certain diseases in aquatic animals) requires
  Sweden to keep a register containing information on each aquaculture holding and
  its establishments. The geographical location of the aquaculture establishments
  shall be indicated by coordinates. Aquaculture, i.e. the cultivation of fish, shellfish
  and algae, is a growing industry with great potential in Sweden. Aquaculture produces
  good and environmentally good food but also environmental services such as nutrient
  uptake through mussel farming. Today, fish are mainly farmed in cages in open water
  but also to some extent in closed systems or ponds on land. Mussels and oysters
  are grown mainly on ropes or in baskets in open water along the west coast. Some
  cultivation of crayfish also takes place in ponds on land. The purpose of the register
  of aquaculture establishments is, inter alia, to make it possible to understand
  the spread of infection by following animals when moving between different places
  in the event of outbreaks of infectious diseases.
