name: Sleep and Health in Men (SHM)
description: 'Sleep and Health in Men (SHM) started in 1984 when participants were
  first investigated with postal questionnaires and a subgroup underwent full whole-night
  polysomnography. At that time this was the first population-based study world-wide
  on the prevalence of obstructive sleep apnea syndrome. Since then the cohort has
  been investigated another two times U1994 and 2007) with postal questionnaires and
  subgroups have been studied with whole-night sleep registrations, blood sampling,
  anthromometric measurements and oral glucose tolerance tests (OGTT). Information
  has also been obtained from national registers on mortality, diseases and on occupational
  accidents. Apart from being the first population-based prevalence study within the
  field, data from this cohort have shown that sleep-disordered breathing is a risk
  factor for cardiovascular morbidity and mortality but also that the risk is age-dependent
  with higher risks at lower ages while there seem to be no increased risk after about
  age 60. Furthermore, published data have shown that obstructive sleep apnea syndrome
  is a progressive disease and that symptoms of sleep-disordered breathing is an independent
  risk factor for occupational accidents. This study was also the first community-based
  cohort study to report an association between breathing disturbances during sleep
  and impaired insulin sensitivity. These data are still cited and this area constitutes
  today a large research area world-wide. We recently published data from this cohort
  showing that weight gain is an independent risk factor for developing sleep disturbances
  and daytime sleepiness. Purpose: The main aim of this population-based cohort study
  is to analyze risk factors for and long term evolution of sleep disturbances with
  main focus on sleep-disordered breathing. Another aim is to study consequences of
  sleep disturbances over time such as accidents and consequences for cardiovascular
  morbidity and mortality as well as effects on glucose metabolism.'
