name: Weekly Pesticide Concentrations in the Occitanie Region
description: 'Pesticides are all chemicals used to control undesirable plant species
  and pests. Used for different uses, the best known pesticides are herbicides (to
  control weeds), fungicides (to fight fungal infections of plants), insecticides
  and various biocides (to fight against animal species considered harmful). In agricultural
  use pesticides are often applied by spraying on plants and soil, some molecules
  can also come to coat seeds. Pesticides are also used outside agriculture, for example
  in veterinary applications (fighting against certain pests), in construction work
  (protection of building materials) etc. Pesticide contamination of the atmosphere
  takes place in three different ways: * by drift at the time of application; * by
  volatilisation after application: chemical reaction with the sun; * by wind erosion:
  under the action of the wind, substances associated with dust are resuspended in
  the air. Air masses can then transport these molecules over very long distances
  depending on the stability of the product and expose so-called ‘non-target’ surfaces
  to the presence of pesticides. Pesticides can be present in the atmosphere in gaseous
  form, associated with particles, or incorporated into fog or rain. Atmo Occitanie
  captures molecules in their gaseous and particulate forms. The coordinates do not
  correspond to the exact location of the site, but to the centroid of the geographic
  area (EPCI/Commune) where the site is located. Values at -999 are invalidated data.
  WFS flows: [https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/mes_occitanie
  _pesticides _hebdo/WFSServer?service=wfs&request=getcapabilities](https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/mes_occitanie
  _pesticides _hebdo/WFSServer?service=wfs&request=getcapabilities)'
