name: Administrative educational aids – Educational support at home in Loire-Atlantique by municipality
description: 'Number of beneficiaries of home-based educational support per municipality since 2009. *
  * * * Home Educational Support (SED), which is an enhanced Home Educational Assistance (AED), aims at
  the well-being and development of the child through the recognition and enhancement of parental skills.
  This assistance is intended for any family facing difficulties in the upbringing of their children.
  Statistical confidentiality shall be applied: not all information between 1 and 4 included is disseminated.
  They correspond to uninformed cells.'
