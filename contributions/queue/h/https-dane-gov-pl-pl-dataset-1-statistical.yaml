name: Statistical Yearbook of Maritime Economy
description: <p>Comprehensive statistical information showing the state of the economy
  maritime economy in 2023, in comparison with the preceding years.</p> <p>Information
  describing maritime economy against the background of national economy, statistical
  data on maritime economy entities, the workforce, employment, remuneration, investment
  expenditures, fixed assets and financial issues, cargo traffic, passenger and vessel
  movements in seaports, maritime and coastal transport fleet as well as sea waterborne
  carriages accomplished by Polish shipping companies, cargo traffic, passenger and
  vessels movements, maritime merchant fleet under Polish flag, marine accidents and
  salvage, shipbuilding, maritime fisheries and fish processing industry, maritime
  education and science, marine environment protection, and maritime tourism.</p>
  <p>In addition the yearbook shall be supplemented with basic information on maritime
  economy at international level.</p>
