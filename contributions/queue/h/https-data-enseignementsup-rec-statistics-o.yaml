name: Statistics on enrolment of students by school and national higher institute of faculty and education
  (ESPE-INSPE)
description: This dataset provides a set of statistics on student enrolments from 2013-14 to 2022-23 per
  school and national higher institute of faculty and education (ESPE-INSPE). The data are taken from
  the Student Monitoring Information System (SISE). Registrations are observed on January 15, except for
  the INSPE of the University of New Caledonia, which has an additional time to take into account the
  Southern calendar. Each line of this dataset provides statistics for an academic component for an academic
  year. This game unitely declines a set of variables on the student (sex, baccalaureate, age at the baccalaureate,
  national attractiveness, international attractiveness) and the training he mainly follows (major discipline,
  discipline). Cross-sectional and more detailed data are available in the dataset "[Students enrolled
  in public institutions under the supervision of the Ministry of Higher Education](https://data.enseignementsup-recherche.gouv.fr/explore/dataset/fr-esr-sise-effectifs-d-etudiants-inscrits-esr-public/)
