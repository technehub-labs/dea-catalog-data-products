name: CORRESPONDENCE JOINT IRIS EPCI CANTONS CMS GCMS UTAS CD76 2022
description: 'This dataset, built from INSEE, IGN and departmental data, describes different administrative
  and social perimeters in the Seine-Maritime Department in 2022. these are four types of administrative
  perimeters: * the IRIS (Iots grouped for Statistical Information). This division, set up by INSEE, is
  the foundation for the dissemination of infra-communal data. An IRIS represents between 1800 and 5000
  inhabitants or more than 1000 employees or a specific sparsely populated right-of-way (port, natural
  park, etc.), * the municipalities, * inter-communalities (Public Establishments of Intercommunal Cooperation
  or EPCI), which are clusters of municipalities around common projects: Communities of Communes, Communities
  of Agglomeration, Metropolises, etc., * cantons, which are the constituencies serving as the framework
  for the election of departmental councillors, as well as three sectorisations corresponding to scales
  of implementation of the Department’s social policies: * the sectors of the Centres Médico-Sociaux (CMS),
  departmental structures that provide medical care for babies and young children but also constitute
  a local entry point for access to rights (occupational integration, support for the elderly, etc.) *
  CMS groupings, which are more technical scopes used by the Department for the implementation of its
  social policies, * and the Territorial Units of Social Action (UTAS), the Department is divided into
  5 UTAS, which are both places of reception, information, orientation and accompaniment of the public
  as well as areas of reflection with sociological and territorial specificities. This information is
  also available on the Opendata76 website in the form of an interactive map allowing the visualisation
  of perimeters. Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/741436c999ae4b1584af2759d4941f37/data)
  Additional resources * INSEE website: <HTTPS://WWW.INSEE.FR/FR/ACCUEIL> The website of the National
  Institute of Stat'
