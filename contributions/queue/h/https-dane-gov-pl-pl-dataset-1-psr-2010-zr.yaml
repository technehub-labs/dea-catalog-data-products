name: PSR 2010 - Zróżnicowanie przestrzenne rolnictwa
description: <p>Zróżnicowanie przestrzenne rolnictwa jest kolejnym tomem analiz wyników Powszechnego Spisu
  Rolnego 2010 r. (PSR 2010). Celem zespołu autorskiego było przedstawienie zróżnicowania przestrzennego
  polskiego rolnictwa nie tylko w świetle wyników PSR 2010, ale także gdy było to możliwe starano się
  uchwycić zmiany, jakie dokonały się w stosunku do PSR 2002. Jest to o tyle ważne, gdyż większość tych
  zmian jest związana z akcesją Polski do Unii Europejskiej. Wsparcie finansowe Unii Europejskiej na różne
  działania pozwoliło na szybką modernizację nie tylko samego rolnictwa, ale także obszarów wiejskich.
  Polska spośród wszystkich krajów, które w 2004 r. przystąpiły do Unii Europejskiej jest największym
  w tym zakresie beneficjentem. Przyznane Polsce środki w ogólnej swej masie zostały dobrze wykorzystane,
  czego wyrazem są zmiany w rolnictwie i na obszarach wiejskich w latach 2002–2010. Dynamika tych zmian
  jest zróżnicowana regionalnie. W dużym stopniu wynika to z uwarunkowań historycznych – zwłaszcza struktury
  agrarnej oraz uwarunkowań przyrodniczych.</p>
