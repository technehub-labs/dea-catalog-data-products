name: exp occitanie zas 2020 pm10 nbrj
description: '**Genealogy within the meaning of Inspire**: Indicators of exceedance
  of limit values (40 µg/m³ as an annual average for NO2 and PM10 and 35 days above
  50 µg/m³ for PM10)). These indicators are the number of inhabitants affected and
  the cumulative area. Data created with a model of atmospheric dispersion at the
  local scale for the AAGs and RAZs of the Occitania region and at the regional scale
  for the RAZ. Use of the emission inventory of the Occitanie region. Modeling carried
  out in accordance with the recommendations of the business reference of the Central
  Air Quality Monitoring Laboratory (LCSQA). Demographic data comes from the Magic
  pop repository. WFS flows: [https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/exp_occitanie
  _zas _2020/WFSServer?service=wfs&request=getcapabilities](https://dservices9.arcgis.com/7Sr9Ek9c1QTKmbwr/arcgis/services/exp_occitanie
  _zas _2020/WFSServer?service=wfs&request=getcapabilities) Metadata sheet: <https://catalogue.picto-occitanie.fr/geonetwork/srv/fre/catalog.search#/metadata/d7df2580-384b-4cab-a680-d3f4898454d8>'
