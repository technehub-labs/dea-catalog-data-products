name: PPBE TV RD Network
description: 'Attention new feed URL carto.ain.fr becomes geodata.ain.fr Last modification of graph nov
  2023: decommissioning of the RD979 from boulevard Charles de Gaulle to the Alagnier roundabout (urban
  part in the township) avenue Amédée Mercier Roads are all represented by a single axis even in the case
  of separate carriageways. At the junctions / intersections, the sections not participating in the main
  road are cut off at the outer edge of the junction (stop / yield the passage). To ensure the topology
  of the road graph pseudo route have been added (category _admin=intersection) but does not participate
  in the linear of the RD. For roundabouts, the calculation of the PR+abs follows the axis of the roundabout
  in the direction of the route (PR sense) and thus travels part of the roundabout ring virtually while
  physically there is a discontinuity (PV_beginning / PV_fin). The field ''_admin category'' allows to
  know its use. rd / intersection / junction _pn / roundabout. The total length of the network joining
  as the sum of the cumulf-cumuld of the rd and giratory. Rule for determining the field: axis the wording
  of the road is in the form Dxx (e.g. D23) For routes with name extensions (letter after the RD number),
  this extension is added next with a minus (drawn from 6) as a separator (e.g.: D23-C). For roundabouts
  an extension ''GIRxxx'' is added afterwards with an underscore (draw of 8) as a separator. ex D72-A_GIR_02_0262.
  PR of the 2-character roundabout entry with 0 prefixes to complete Decrease of the roundabout entry
  over 4 characters with 0 prefixes to complete Rule for determining the field: _cd01 axis Axes of the
  Ain Departmental Roads (e.g. 01 D0117A). Rule for naming roundabouts (in the process of being entered):
  Ex: GIR0117A_09_0611 GIR route type prefix 4-character RD number with 0 prefixes to complete RD letter
  with _ if no letter _ Separator PR of the 2-character roundabout entry with 0 prefixes to complete Decrease
  of the roundabout entry over 4 characters with 0'
