name: Interactive dashboard Social rental housing (RPLS) 2021 in Seine-Maritime
description: 'The aim of the Directory of Rental Housing of Social Donors (RPLS) is
  to establish the overall state of the “ordinary” rental housing stock of social
  donors on 1 January of the year of collection. In particular, the file provides
  information on address, rent level, accessibility and diagnosis of energy performance
  per dwelling in 2021 (see metadata below). Metadata [Link to metadata](https://seine-maritime.maps.arcgis.com/sharing/rest/content/items/6c920c4952c545caa504cf0f6d6cc1b1/data)
  Additional resources * Site of the observatory of the territory: <HTTPS://WWW.OBSERVATOIRE-DES-TERRITOIRES.GOUV.FR/NOMBRE-DE-LOGEMENTS-SOCIAUX-RPLS
  > The website of the Agence Nationale de la Cohésion des Territoires offers for
  download in.xls format data from the RPLS 2014 to 2019 on the number of social rental
  housing. The data can be visualised at all INSEE administrative scales (common,
  EPCI, district, employment area, living area, PETR and country, Department, etc.).
  * Website data.gouv: <HTTPS://WWW.DATA.GOUV.FR/FR/DATASETS/REPERTOIRE-DES-LOGEMENTS-LOCATIFS-DES-BAILLEURS-SOCIAUX/>
  The open platform of French public data offers for download in.zip format the detailed
  files of the RPLS 2016 to 2021\. * Website of the Statistical Data and Studies Service
  (SDES) of the Ministry of Ecological Transition: <https://www.statistiques.developpement-durable.gouv.fr/les-logements-sociaux-0?rubrique=52>
  and [https://www.statistiques.developpement-durable.gouv.fr/sites/default/files/2021-12/datalab_essentiel_265_le_parc_locatif_social_au_1er_janvier_2021_decembre2021_0.pdf
  ] The SDES website offers many statistics on housing, transport, energy, environment
  and cliamtic change. In particular, it offers for download, in addition to the raw
  data of the RPLS and its notices, a summary in.pdf format of the teachings of the
  RPLS 2021.'
