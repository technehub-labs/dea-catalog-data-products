name: Higher Education. Number of staff mobility (since 2000-01) by type of mobility,
  destination country and academic year.
description: The European Educational Programs Statistics, included in the National
  Statistical Program, provides knowledge of the essential aspects of European educational
  programs, which are currently part of the European Union's Erasmus+ program in the
  fields of education and training, managed from Spain to promote transnational cooperation
  between centers in the sectors of School Education, Vocational Training, Higher
  Education and Adult Education, in order to improve the quality of education and
  strengthen the European dimension. Historical series of the former Erasmus Higher
  Education program are also presented. These statistics are carried out jointly by
  the S.G. of Statistics and Studies of the Ministry of Education, Vocational Training
  and Sports and the Spanish Service for the Internalization of Education (SEPIE)
  attached to the Ministry of Science, Innovation and Universities, from the exploitation
  of the administrative data generated by the management of this program by the SEPIE.
