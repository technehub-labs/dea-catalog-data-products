name: Leczenie zabiegowe w poszczególnych nowotworach
description: <p>W lipcu 2018 roku wprowadzono możliwość rozliczania świadczeń zabiegowych (katalog 3c)
  z uwzględnieniem współczynników korygujących dla świadczeniodawców, którzy wykonują określoną liczbę
  świadczeń w ramach pakietu onkologicznego.</p> <p>Progi liczbowe zostały zdefiniowane odrębnie dla grup
  wybranych grup nowotworów złośliwych i wynoszą:</p> <ul> <li>nowotwór złośliwy płuca - 70 zabiegów;</li>
  <li>nowotwór złośliwy pęcherza moczowego - 30 zabiegów;</li> <li>nowotwór złośliwy jajnika - 30 zabiegów;</li>
  <li>nowotwór złośliwy jelita grubego - 75 zabiegów;</li> <li>nowotwór złośliwy macicy - 60 zabiegów;</li>
  <li>nowotwór złośliwy nerki - 50 zabiegów;</li> <li>nowotwór złośliwy piersi - 250 zabiegów;</li> <li>nowotwór
  złośliwy gruczołu krokowego - 75 zabiegów;</li> <li>nowotwór złośliwy trzustki - 30 zabiegów;</li> <li>nowotwór
  złośliwy żołądka - 30 zabiegów;</li> <li>nowotwór złośliwy tarczycy i przytarczyc - 75 zabiegów;</li>
  <li>nowotwór złośliwy OUN - 150 zabiegów;</li> <li>nowotwór złośliwy gardła i krtani - 50 zabiegów.</li>
  </ul> <p>Dodatkowo wprowadzono onkologiczne grupy JGP oraz kompleksową opiekę onkologiczną w leczeniu
  nowotworów jelita grubego oraz nowotworów piersi, które ujęto w raporcie.</p> <p>Celem działań jest
  zwiększenie bezpieczeństwa pacjenta poprzez stopniową centralizację świadczeń chirurgicznych oraz promowanie
  wielodyscyplinarności i kompleksowości leczenia.</p>
