name: Traffic work on national roads since 1990
description: 'The Excel document on national road traffic (motorways, expressways, major roads, regional
  roads) by vehicle type and road type contains data on distances travelled in million vehicles/km since
  1990. Data for the last year (in xlsx and csv format) are provisional and the details may change. The
  length of a road is the sum of the lengths of the sections belonging to it, depending on the type of
  section. The length of roads without connectors shall comprise sections of type A, O and C. Other types
  of sections (P, V, D and R) shall not be included in the length of roads in the calculation. Acronyms:
  IVRC road type identification (AC, HC, G1, G2, R1, R2, R3, RT) National roads: AC motorways (four and
  multi-lane) HC expressways (three-lane and two-lane) G1 1st order main road G2 2nd order main road R1
  1st order regional roads R2 2nd order regional roads R3 3rd order regional roads RT regional tourist
  roads'
