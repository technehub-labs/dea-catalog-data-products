name: Phytophthora ramorum SF Policy Zones
description: 'This dataset shows the policy zones defined in Scottish Forestry''s
  Phytophthora ramorum (P. ramorum) Action Plan and introduced in 2021. There are
  two zones; a priority action zone, and a risk reduction zone. There is also a P.
  ramorum Management Zone which lies within the risk reduction zone, but this can
  be found in a separate dataset. P. ramorum is a fungus-like pathogen which causes
  extensive damage and mortality to a wide range of trees and other plants. It was
  first detected in GB in the nursery trade in 2002 and then in established gardens
  in 2007. It was not until 2009 that ramorum was found to be infecting Japanese larch
  in south west England, and the first confirmed infection on larch in Scotland was
  found in November 2010 on the Craignish peninsula. P. ramorum on larch causes needle
  necrosis, shoot dieback, bleeding cankers and death of trees – which can be rapid
  (one to two seasons). The three main commercial larch species in Britain (Japanese,
  European and hybrid) can be infected. The Priority Action Zone (PAZ) is the area
  where actions will have the greatest impact on controlling spread of P. ramorum.
  Outbreaks to date have been limited in scale and control efforts have been successful
  at eradicating infections on larch. Prioritisation of survey and regulatory efforts
  will ensure Statutory Plant Health Notices (SPHNs) are issued quickly, with felling
  required, wherever possible, before the end of August in the year of detection.
  The Risk Reduction Zone (RRZ) is the area where spread and scale of infection is
  beyond what can be controlled locally with available resources. The principal aim
  is now to reduce the risk of P. ramorum to the sector. Statutory actions in the
  form of SPHNs will continue to be used as the main tool to ensure consistency of
  control efforts across the range of land ownerships. Timescales for felling will
  not be as short as in the PAZ. More information at: https://forestry.gov.scot/sustainable-forestry/tree-health/tree-pests-and-di'
