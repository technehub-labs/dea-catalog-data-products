name: Meteorological data collected at English Short Rotation Coppice (Intensive) sites
description: As a result of high oil prices in the mid-1970s, many European and Scandinavian countries
  initiated research programmes investigating fuel production from energy crops. Initial studies were
  aimed at identifying suitable crop systems. One of the systems tested involved planting coppicing tree
  species at high densities (around 10,000 stools per hectare) and harvesting above ground growth every
  two to five years. This system was termed ‘Short Rotation Coppice’ (SRC). In the UK, numerous coppicing
  tree species were tested using this system (Potter, 1990). Examples include Salix viminalis clones,
  Populus interamericana clones, Eucalyptus archeri, Alnus cordata, and Northofagus procera. Willow and
  poplar clones emerged favourably from these trials, producing high yields without succumbing to disease
  or frost. Other research programmes concentrated on developing harvesting, processing and power generation
  equipment that could cope with biomass produced by a variety of crop systems including SRC. Political
  backing for SRC was shown on 20 December 1994 when the UK minister for Energy announced government support
  for three power generation projects using woodfuel gasification technology. These projects were expected
  to ‘stimulate substantial commitment to coppicing’. Although informative, results from early research
  programmes could not predict the yield of willow or poplar SRC under different environmental conditions.
  Without this information planners could not make informed decisions as to where SRC plantations and
  power generation plants should be sited in order to maximise yield and land use efficiency. Growers
  also needed information on likely yields achievable by different site/clone combinations, in order to
  estimate their financial return from these crops. For these reasons the Department of Trade and Industry
  (DTI), the Ministry of Agriculture, Fisheries and Food (now incorporated into the Department of the
