name: INSPIRE - Annex I Theme Transport Networks - Cable - CablewayLink
description: 'This dataset contains the cableways of the Grand Duchy of Luxembourg. The dataset is structured
  according to the INSPIRE Annex I Theme - Transport networks. The data has been derived from the TRP-VC
  Database and contains cableway links without further information. The data was derived from the BD-L-TC
  Database (2015), enriched and enriched by official data (locality and street names) from the national
  register of localities and streets (CACLR) and the BD-Address. Updates are carried out separately by
  the administration of the cadastre and topography taking into account various sources, including: -
  Information received from the municipal administrations, competent in the naming of streets and the
  definition of addresses - BD-L-ORTHO (orthophotographs) - BD-MO (cadastral surveying) Description copied
  from [catalog.inspire.geoportail.lu](https://catalog.inspire.geoportail.lu/geonetwork/srv/eng/catalog.search#/metadata/89d0dfeb-4988-4ec7-b682-e7ce02417587).'
