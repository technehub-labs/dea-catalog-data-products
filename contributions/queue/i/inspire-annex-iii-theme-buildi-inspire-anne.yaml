name: INSPIRE - Annex III Theme Buildings - Building 3D
description: 'This dataset contains 3D and 2D buildings on the national territory
  of the Grand Duchy of Luxembourg in 2023. The 3D buildings were created on the basis
  of aerial shots taken in the summer of 2023 (flight period: mid to late June, early
  July, late August and early September 2023; flight height: +/- 3700 m above ground)
  by photogrammetric restitution of roofs (RMSE in x, y and z ≤ 20 cm), extended by
  downward extrusion and texturing of the resulting 3D models of buildings with oblique
  shots. Only roofs of buildings with a footprint greater than 20 m² were captured,
  taking into account superstructures (e.g. dormers) whose longest side exceeded 50
  cm and whose volumetry exceeded 1 m³. The 3D buildings correspond to LOD (Level
  of Detail) 2.2 classification. This dataset has been harmonized according to the
  INSPIRE theme "Buildings" data specification. Description copied from [catalog.inspire.geoportail.lu](https://catalog.inspire.geoportail.lu/geonetwork/srv/eng/catalog.search#/metadata/eccb8f68-b099-4dea-a160-d6cd6bf72be5).'
