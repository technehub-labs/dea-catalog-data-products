name: Indicators - Health status - Perceived health
description: This section looks at indicators of **perceived health**. The health
  status of a population reflects the general health of a group of people living in
  a given environment or sharing common characteristics, such as age, gender or other
  socio-demographic factors. Its assessment is based on a variety of indicators. By
  analysing these indicators and understanding the factors that influence them, policymakers,
  health and care institutions, health professionals and other stakeholders can develop
  policies and interventions to improve the health and well-being of the population
  as a whole.
